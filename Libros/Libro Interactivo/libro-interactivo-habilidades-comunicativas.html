el público lo note conscientemente; la inconsistencia, en cambio, sí se nota y distrae.", "b": false}, {"type": "h2", "text": "8.3  Herramientas audiovisuales más allá de las diapositivas"}, {"type": "p", "text": "En presentaciones técnicas, una demostración en vivo del software funcionando suele comunicar más que cualquier diapositiva, aunque conlleva el riesgo de que algo falle en el momento; conviene tener capturas de pantalla o un video grabado como respaldo. Los diagramas de arquitectura o de flujo ayudan a explicar sistemas complejos de un vistazo, algo que sería difícil de transmitir solo con palabras.", "b": false}, {"type": "p", "text": "Cualquier recurso audiovisual, sea una demo, un video o un gráfico, debe probarse antes de la presentación en las condiciones reales en que se va a usar: el mismo computador, la misma conexión, el mismo proyector si es posible. Los problemas técnicos durante una presentación restan más credibilidad que cualquier imperfección en el contenido.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Apoyo visual", "body": "Un recurso en pantalla (imagen, gráfica, diagrama) que refuerza lo que el presentador dice en voz alta, en lugar de repetirlo por escrito. Si el contenido de una diapositiva se puede decir sin que el público necesite leerlo, probablemente sobra."}, {"type": "h2", "text": "8.4  Ejemplo completo"}, {"type": "p", "text": "Un estudiante prepara una diapositiva para explicar cómo mejoró el tiempo de carga de una aplicación. En lugar de escribir un párrafo describiendo la mejora, muestra una gráfica de barras con el tiempo de carga antes y después del cambio, y dice en voz alta el porcentaje de mejora y por qué ocurrió. La audiencia entiende el resultado de un vistazo, y la explicación oral aporta el contexto que la gráfica sola no podría transmitir.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Revisa una presentación que hayas hecho anteriormente y cuenta cuántas palabras tenía, en promedio, cada diapositiva. Rediseña la más cargada aplicando los principios de este capítulo.\n2. Diseña un diagrama simple (a mano o con una herramienta digital) que explique visualmente el flujo de un proceso técnico que domines.\n3. Antes de tu próxima presentación con apoyo audiovisual, haz una prueba técnica completa (mismo equipo, misma conexión) al menos un día antes."}]}, {"id": "cap9", "titulo": "Habilidades de escucha activa", "kind": "cap", "num": 9, "unidad": "UNIDAD 3 · COMUNICACIÓN INTERPERSONAL Y TRABAJO COLABORATIVO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás distinguir la escucha activa de simplemente oír, y aplicar técnicas concretas para escuchar mejor en contextos de trabajo en equipo."}, {"type": "h2", "text": "9.1  Qué es la escucha activa"}, {"type": "p", "text": "Oír es un proceso fisiológico automático; escuchar de forma activa es un esfuerzo deliberado por comprender completamente lo que otra persona comunica, incluyendo lo que no dice con palabras exactas. Rogers y Farson (1957) describieron la escucha activa como una habilidad que exige participación genuina: no basta con guardar silencio mientras la otra persona habla, hace falta procesar el contenido, las emociones detrás de él, y comunicar de vuelta que se está entendiendo.", "b": false}, {"type": "p", "text": "En equipos de desarrollo, la escucha activa suele fallar de una forma particular: alguien empieza a formular su respuesta o su solución técnica mientras la otra persona todavía está explicando el problema, y termina respondiendo a una versión incompleta de lo que se dijo. Escuchar activamente exige, primero, resistir esa tentación de interrumpir mentalmente.", "b": false}, {"type": "img", "caption": "Figura 9.1 · Los componentes de la escucha activa", "data": "data:image/webp;base64,UklGRn5qAABXRUJQVlA4IHJqAAAQzAGdASroA9ICPmEwlUekIqIhIvPpQIAMCWVu+/V9ChQ+TPKL4ED8TI49/M/87+7d47Ifmf9d/ZPxp98y1f7P/D+r/+97Sev/Mh5u/ CPaxpbMgIFcAaA3q+cU9L7AkJIWVhbeKWJoed0HWNd7kDD3VNky4qojyFiLjZuZILT1MbBPnEQmb6EpW2XTcqyPSCvhwqnmd5NlFsNiDpO2JcgdVhLP7s5d3uN+9Jxtr+aC/2YXnHNpfE4a3wmWekqZAGtlIXuR7NNXiHPIul1FkZXCGFNUQPijOR2tAbA19Yb+TW+943DajkIyU+w6AAAAAAAAAAAAAAAAAAAA"}, {"type": "h2", "text": "9.2  Técnicas concretas de escucha activa"}, {"type": "p", "text": "Parafrasear lo que la otra persona dijo, con las propias palabras, antes de responder, confirma que se entendió correctamente y le da a la otra persona la oportunidad de corregir un malentendido antes de que se vuelva costoso. Hacer preguntas de clarificación (\"¿te refieres a que el error ocurre siempre o solo en ciertos casos?\") en lugar de asumir el significado, evita resolver el problema equivocado.", "b": false}, {"type": "p", "text": "Mantener el contacto visual y una postura orientada hacia quien habla, evitar revisar el teléfono o la pantalla mientras alguien explica algo, y dejar pausas de silencio después de que la otra persona termine de hablar, en lugar de responder de inmediato, son señales no verbales de escucha activa que refuerzan las verbales.", "b": false}, {"type": "h2", "text": "9.3  Escucha activa en la revisión de código y el trabajo en equipo"}, {"type": "p", "text": "Cuando un compañero explica una decisión técnica que parece equivocada, la escucha activa exige entender primero el razonamiento completo antes de señalar el problema, porque a menudo la decisión tenía una restricción o un contexto que no era evidente de entrada. Covey (1989) resume esta idea como \"buscar primero comprender, luego ser comprendido\": invertir el orden habitual, en el que se escucha solo para encontrar el momento de responder, cambia por completo la calidad de una conversación de equipo.", "b": false}, {"type": "p", "text": "En revisiones de código, en particular, la escucha activa se traduce en leer completamente la justificación de un cambio antes de comentar, y en formular observaciones como preguntas genuinas (\"¿por qué elegiste este enfoque en lugar de otro?\") en lugar de afirmaciones que ya asumen que el otro se equivocó.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Escucha activa", "body": "Un esfuerzo deliberado por comprender completamente lo que otra persona comunica, no solo sus palabras sino también las emociones e intenciones detrás de ellas. Se diferencia de oír en que exige procesar y confirmar la comprensión, no solo guardar silencio."}, {"type": "h2", "text": "9.4  Ejemplo completo"}, {"type": "p", "text": "Durante una reunión de equipo, un desarrollador explica por qué decidió usar una librería poco común para resolver un problema. Otro miembro del equipo, en lugar de objetar de inmediato, parafrasea: \"Entonces la usaste porque las alternativas más comunes no soportaban el formato que necesitábamos, ¿es así?\" El primero confirma y añade un detalle que no había mencionado. Solo después de esa confirmación, el segundo plantea su inquietud sobre el mantenimiento futuro de esa librería, una objeción que ahora tiene en cuenta información que antes le faltaba.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. En tu próxima conversación de trabajo o estudio en equipo, practica parafrasear lo que la otra persona dijo antes de responder, y registra cómo cambió la conversación.\n2. Identifica una situación reciente en la que hayas empezado a formular una respuesta mientras la otra persona todavía hablaba. Describe qué información podrías haberte perdido.\n3. Durante una revisión de código o de trabajo de un compañero, formula al menos dos observaciones en forma de pregunta genuina en lugar de afirmación."}]}, {"id": "cap10", "titulo": "Comunicación asertiva", "kind": "cap", "num": 10, "unidad": "UNIDAD 3 · COMUNICACIÓN INTERPERSONAL Y TRABAJO COLABORATIVO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás distinguir la comunicación asertiva de la pasiva y la agresiva, y aplicar técnicas para expresar desacuerdo o establecer límites sin dañar la relación de trabajo."}, {"type": "h2", "text": "10.1  Tres estilos frente a un desacuerdo"}, {"type": "p", "text": "Frente a una situación de desacuerdo o conflicto, las personas tienden a responder con uno de tres estilos. El estilo pasivo evita expresar la propia opinión o necesidad para no generar tensión, lo que suele acumular frustración que termina saliendo de otra forma, a veces desproporcionada. El estilo agresivo expresa la propia opinión sin considerar el efecto en la otra persona, lo que suele dañar la relación de trabajo incluso cuando el contenido del reclamo era válido. El estilo asertivo expresa la propia opinión o necesidad con claridad y firmeza, respetando al mismo tiempo a la otra persona. Elegir este último estilo en el momento de la tensión, en lugar de reaccionar por impulso, exige un grado de autoconciencia sobre las propias emociones que Goleman (1995) sitúa en el centro de lo que llamó inteligencia emocional: notar que se está molesto antes de hablar desde ese enojo marca casi siempre la diferencia entre un reclamo asertivo y uno agresivo.", "b": false}, {"type": "p", "text": "La comunicación asertiva no es un punto intermedio entre pasividad y agresividad; es una forma cualitativamente distinta de comunicar que busca defender la propia posición sin necesidad de agredir ni de ceder por evitar el conflicto (Rosenberg, 2003).", "b": false}, {"type": "img", "caption": "Figura 10.1 · Los tres estilos de comunicación frente a un desacuerdo", "data": "data:image/webp;base64,UklGRoQ1AABXRUJQVlA4IHg1AAAQcQGdASroA+sCPmEwlUgkIqIhIPL5OIAMCWdu8p97/uJqZvLJn9Kk7r/T8q70dlL8se0vKu5W/5n9y/J356/5P9fPd1+mPYE/WzzqvVB+4PqC/YH/tf6j3ev9n+2Huc/u/+q9gD+s/4L1tv+n7GX+E/8HsKfsx6aP7lfC7/Xf+F+33tOf//2AP//wYHkP+w/kh5kvzr+7/3z9tfN38U+ZfuP9t/Z7+8+z5kP9E/mvMr+L/bD8l/Zv3D/x/7v/IH+V/LLzf+SP8x+VPwBfj381/xH5sf3z059ivt3+8/Xv2BfWX6b/xP7t+TPodf1/929R/rh/3f7H8AH8i/ov+x8obwTPtP+4/YD4Av5l/b//B/nPdl/qv/X/t/9f6evzz/Mf+7/TfAT/Mf69/2P8X2 econocible: describe el hecho concreto sin juicio (\"la funcionalidad no se entregó en la fecha acordada\"), expresa el efecto o el sentimiento que eso generó (\"eso me preocupa porque afecta la fecha de entrega al cliente\"), y plantea con claridad qué se necesita a continuación (\"necesito saber si hay algún obstáculo que debamos resolver como equipo\"). Esta estructura evita tanto el silencio pasivo como la acusación directa (\"nunca entregas a tiempo\"), que suele generar defensividad en lugar de solución.", "b": false}, {"type": "p", "text": "Rosenberg (2003) formalizó una versión de esta estructura en su modelo de comunicación no violenta: observación sin juicio, sentimiento, necesidad y petición concreta. No hace falta seguir ese modelo palabra por palabra, pero la lógica de fondo, separar el hecho objetivo del juicio sobre la persona, es lo que distingue un reclamo asertivo de uno agresivo.", "b": false}, {"type": "h2", "text": "10.3  Establecer límites en el trabajo en equipo"}, {"type": "p", "text": "La asertividad también se ejerce al decir que no, o al reconocer que una carga de trabajo es excesiva, algo que muchos estudiantes evitan por temor a parecer poco comprometidos. Decir \"no puedo asumir esta tarea adicional esta semana sin afectar el resto de mis entregas\" es una comunicación asertiva legítima, distinta tanto de aceptar en silencio y luego entregar tarde, como de rechazar la tarea sin ninguna explicación.", "b": false}, {"type": "p", "text": "En equipos de programación, donde las estimaciones de tiempo suelen ser optimistas, la capacidad de comunicar asertivamente que un plazo no es realista, respaldada con razones concretas, previene muchos de los conflictos que después se atribuyen erróneamente a falta de compromiso.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Comunicación asertiva", "body": "Un estilo de comunicación que expresa la propia opinión, necesidad o desacuerdo con claridad y firmeza, respetando al mismo tiempo a la otra persona. No es un punto intermedio entre pasividad y agresividad, sino una forma distinta de comunicar."}, {"type": "h2", "text": "10.4  Ejemplo completo"}, {"type": "p", "text": "Un estudiante recibe una tarea adicional de último momento cuando ya tiene una carga de trabajo completa. En lugar de aceptar en silencio (pasivo) o responder con molestia visible (agresivo), dice: \"Ahora mismo tengo comprometidas las próximas dos entregas del proyecto principal. Si asumo esta tarea adicional, alguna de las dos se va a retrasar. ¿Podemos revisar juntos qué prioridad tiene esto frente a lo que ya está en curso?\" El mensaje describe el hecho, expresa la consecuencia y propone una solución conjunta, sin acusar a nadie ni ceder sin más.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Piensa en una situación reciente en la que hayas respondido de forma pasiva o agresiva ante un desacuerdo. Reescribe cómo habría sonado una versión asertiva del mismo mensaje.\n2. Aplica la estructura de tres partes (hecho, efecto, petición) para redactar un mensaje asertivo sobre una situación real de tu entorno académico o laboral.\n3. Identifica una tarea o solicitud que hayas aceptado recientemente sin estar del todo de acuerdo. Describe cómo habrías podido establecer un límite de forma asertiva."}]}, {"id": "cap11", "titulo": "Resolución de conflictos en equipos de trabajo", "kind": "cap", "num": 11, "unidad": "UNIDAD 3 · COMUNICACIÓN INTERPERSONAL Y TRABAJO COLABORATIVO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás identificar distintos estilos de manejo de conflictos y aplicar estrategias de negociación para resolver desacuerdos técnicos o de equipo."}, {"type": "h2", "text": "11.1  El conflicto no es, en sí mismo, el problema"}, {"type": "p", "text": "Un equipo que nunca tiene desacuerdos no es necesariamente un equipo saludable; puede ser un equipo donde nadie se anima a cuestionar decisiones cuestionables. El conflicto, entendido como un desacuerdo legítimo de ideas, es una parte normal y hasta productiva del trabajo en equipo: lo que determina si lo daña o lo fortalece es la forma en que se maneja, mucho más que el simple hecho de que exista.", "b": false}, {"type": "p", "text": "Thomas y Kilmann (1974) identificaron cinco estilos con los que las personas tienden a manejar un conflicto, que combinan en distinto grado dos dimensiones: qué tanto se prioriza la propia posición y qué tanto se prioriza la relación con la otra parte. Conocer estos estilos ayuda a identificar el propio patrón habitual y a elegir conscientemente cuál conviene según la situación, en lugar de reaccionar siempre de la misma forma.", "b": false}, {"type": "img", "caption": "Figura 11.1 · Los cinco estilos de manejo de conflictos", "data": "data:image/webp;base64,UklGRp5DAABXRUJQVlA4IJJDAABQbAGdASroA9ICPmEwlkgkIyKhIbO5GIAMCWdu+AmX9+LBN/droy3OY/dJ03/J/w/pNck+C3w/Sp/fd4PYvlcea/vX6J/LT5of7b1X/pH/w+4H/ZP7/57nqy/t//U9QP9Q/1X7F+7x/xP3F91H+M9Qj+7f6T1zP/F7H/7v+xh+8Pp0fuh8PH9t/6v7l///3tP//7AH//4KTyV/ePyA8zH6R/hP7T+1Hnj+K/N/3z+w/4r/Sf4j9qPhz/m/HT0r5lfx37Yfpv7x+3/sN/p/8L+0X5M+0vxG/x/8J+3vwC/jX81/xv92/v/+4/unC27l/t/+V6gXs39K/3P99/zv7E+jn/of4L1N+vP/g9wD+df03/d+UP+wfk3/iv9d+2/wB/zL+7f/T/R+7T/U/+z/V+gD89/0H/s/2XwJfzj+1/+H/IduD0mBCKC7+Q7z7R82rnE1BQXfyHefaPm1c4moKC7+Q7z7R82rnE1BQXfyHefaPm1c4moKC7+Q7z7R82rnE1BQXfyHefaPm1c4moKC7+Q7z7R82rnE1BQXfyHefaPm1c4moKC7+Q7z7R82rnE1BQXfyHefaPm1c4moKC7+Q7z7R3ti0NTp/gTtkFj1WXD8agPoia6dHsOsdJNp1MYN2Z36Z9+o8S3vOpSeBuDtb2mD423VfTHLdNZ04zIDW0zIaYFSSw7AN4Cp0sCNaeKlolEwdnUKmBEi0ZUunAurOvnXJdarQvD9A+3bimdrVEm+qjPSARXycHf/GgF9ALJ/HBw9NHxR6CXAp/S2nPcHl/+J7VFOdwMdyHAbdJH6Ut+uBFwYcX9o+bVziagoLv5DvPtDppxgFeXCSmefTUsZ0t0RNpL26oTXprJs2o/xVMk4lelMZAlj4A4XQR9pabtBTsfEj5yLyxoXhNAIO2AstwKoON+NVQOj0OBv77OsxTK0NTbH8UB3+NFnazIuyo4ZAef4n2fuaQX5+OV3wWuhMU/JJ3uSFPiNpJ5xvJA2z1jiFe6bKB0cTyNfSP5DvPtHzaucTUFBd/Id7m1jrVc4mojjmoKDpcKMWoKC7+Q7z7R82rnE1BQXfyHefaPm1c4moKC7+Q7z7R82rnE1BQXfyHefaP s de manejo de conflictos"}, {"type": "p", "text": "El estilo competitivo prioriza la propia posición sobre la relación, útil en decisiones urgentes pero costoso si se usa siempre. El estilo complaciente prioriza la relación sobre la propia posición, cediendo para evitar tensión, adecuado cuando el tema realmente importa poco. El estilo evasivo posterga o evita el conflicto por completo, razonable solo cuando el tema no es urgente y hay ventaja en esperar. El estilo de compromiso busca una solución intermedia donde ambas partes ceden algo. Y el estilo colaborativo busca una solución que satisfaga completamente a ambas partes, exigiendo más tiempo e inversión pero generando mejores resultados a largo plazo en decisiones importantes.", "b": false}, {"type": "p", "text": "Ningún estilo es correcto en abstracto; la habilidad está en reconocer qué situación exige rapidez y cuál merece la inversión de tiempo que exige un enfoque colaborativo.", "b": false}, {"type": "h2", "text": "11.3  Negociación basada en intereses, no en posiciones"}, {"type": "p", "text": "Fisher y Ury (1981) propusieron un modelo de negociación que distingue entre las posiciones que las partes declaran (\"quiero usar este framework\") y los intereses reales detrás de esas posiciones (\"necesito que el proyecto se entregue rápido y con poca curva de aprendizaje para el equipo\"). Dos posiciones opuestas pueden compartir intereses compatibles, y encontrar esa coincidencia suele abrir soluciones que ninguna de las dos posiciones originales contemplaba.", "b": false}, {"type": "p", "text": "En un desacuerdo técnico sobre qué herramienta o arquitectura usar, preguntar \"¿qué necesitamos lograr con esto?\" en lugar de defender directamente una postura, suele revelar que ambas partes buscan lo mismo por caminos distintos, y desde ahí resulta más fácil evaluar objetivamente qué camino cumple mejor ese objetivo compartido.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Posiciones vs. intereses", "body": "La posición es lo que una parte dice que quiere (\"usemos esta tecnología\"); el interés es la necesidad real detrás de esa posición (\"necesitamos algo rápido de aprender\"). Negociar sobre intereses, en lugar de posiciones, suele abrir soluciones que ninguna de las partes había considerado."}, {"type": "h2", "text": "11.4  Ejemplo completo"}, {"type": "p", "text": "Dos desarrolladores discrepan sobre qué base de datos usar en un proyecto nuevo. Uno defiende una opción relacional; el otro, una no relacional. En lugar de debatir las posiciones directamente, alguien del equipo pregunta qué necesita realmente el proyecto. Ambos coinciden en que la prioridad es la velocidad de desarrollo inicial y la facilidad de mantenimiento por un equipo pequeño, no el rendimiento a gran escala que ninguna de las dos opciones comprometía de forma relevante para este caso. Con los intereses claros, la decisión se toma en minutos, comparando ambas opciones contra ese criterio compartido en lugar de contra las preferencias personales de cada uno.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Piensa en un conflicto reciente, técnico o personal, e identifica qué estilo de manejo de conflictos (de los cinco descritos) usaste. Evalúa si fue el más adecuado para esa situación.\n2. Elige un desacuerdo técnico hipotético o real y separa por escrito las posiciones declaradas de los intereses reales de cada parte.\n3. Describe una situación en la que el estilo evasivo habría sido apropiado y otra en la que habría sido perjudicial."}]}, {"id": "cap12", "titulo": "Trabajo colaborativo en equipos interdisciplinarios", "kind": "cap", "num": 12, "unidad": "UNIDAD 3 · COMUNICACIÓN INTERPERSONAL Y TRABAJO COLABORATIVO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás reconocer las etapas de desarrollo de un equipo y aplicar estrategias de comunicación para colaborar eficazmente en equipos interdisciplinarios."}, {"type": "h2", "text": "12.1  Las etapas de desarrollo de un equipo"}, {"type": "p", "text": "Ningún equipo funciona a máxima eficiencia desde el primer día. Tuckman (1965) describió cuatro etapas por las que suelen pasar los equipos: formación, donde los integrantes se conocen y evitan el conflicto abierto; tormenta, donde surgen desacuerdos sobre roles, métodos o liderazgo, una etapa incómoda pero necesaria; normalización, donde el equipo establece acuerdos de trabajo y empieza a colaborar con más fluidez; y desempeño, donde el equipo funciona de forma coordinada y productiva.", "b": false}, {"type": "p", "text": "Reconocer en qué etapa está un equipo ayuda a interpretar correctamente lo que ocurre dentro de él: un desacuerdo en la etapa de tormenta no significa que el equipo esté fallando, sino que está atravesando una fase esperable en su desarrollo. Un equipo que se mantiene solo en la etapa de formación, evitando cualquier fricción, probablemente nunca llegue a la etapa de desempeño.", "b": false}, {"type": "img", "caption": "Figura 12.1 · Las etapas de desarrollo de un equipo según Tuckman", "data": "data:image/webp;base64,UklGRtxbAABXRUJQVlA4INBbAACQ3gGdASroA8YDPmEwlkgkIyKhIbPYyIAMCWdu6fC0aQsPJHgnL5T8GSwF/pPo/7n+u9/zIvuj9l/h/x099vj3vJ+efg/Ol3q9heYb5t+9foH2z/6v/meyH9df9/3BP1A/W710P1z90370+oP+of7b9iPeD/3v/i/1nvA/xHqAf1D/menH7GH/c9Srzef+v+33/M+VP+tf8D/4f7j/r///6GP2D///7rfAB/+/a9/gH/562/qv/cf7r+zfmd/Wv8N/e/258/fxL5j+5/3L9p/8P+3HyPZL/Tf7n/x+hX8n+3P5v/Af5j/o/4r5ofvH+d/yH68+a/ya/u/yh+AX8W/kv+D/vf7Yf4n90fWj7aTffMF9mPpH+i/vX7zf4r00P9b/Fep32O/7v+A+AD+h/1//k/4Pzx/B983/Z34A/6N/gP2W923+2/+H+y/OP2+/oH+k/9P+w+Az+Zf2f/of47tj+j5+7Ybc1wEC6Wa/LEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBGMU4d/QMLMLLkNcxiuYxXMYrmMVzCXi/6QKfmvyxICQEgJASAkBICQEgJA unicación claros según el tipo de mensaje (una decisión importante no debería quedar solo en un chat informal); y espacios explícitos para dar y recibir retroalimentación, en lugar de esperar a que surja un problema grave para hablar de lo que no está funcionando.", "b": false}, {"type": "p", "text": "Ninguna herramienta de gestión de proyectos, por sofisticada que sea, sustituye estas prácticas: la tecnología organiza la información, pero la calidad de la colaboración depende de cómo las personas se comunican dentro de ella. Ese es, en el fondo, el argumento que sostiene las tres unidades de este libro: escribir, hablar y relacionarse bien con otros no son habilidades secundarias frente al código, son las que determinan si ese código llega a cumplir su propósito.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Etapas de Tuckman", "body": "Un modelo que describe cuatro etapas por las que atraviesa el desarrollo de un equipo: formación, tormenta, normalización y desempeño. Un conflicto en la etapa de tormenta no indica que el equipo esté fallando, sino que atraviesa una fase esperable de su desarrollo."}, {"type": "h2", "text": "12.4  Ejemplo completo"}, {"type": "p", "text": "Un equipo interdisciplinario de un proyecto universitario (dos programadores, una diseñadora y un gestor de proyecto) atraviesa una etapa de tormenta en su segunda semana: hay desacuerdo sobre quién decide los cambios de última hora en el diseño. En lugar de interpretarlo como una señal de que el equipo no funciona, el gestor reconoce la etapa según el modelo de Tuckman y propone una reunión breve para acordar explícitamente el proceso de decisión. Dos semanas después, el mismo equipo opera con fluidez notable: había atravesado, como se esperaba, la fase incómoda necesaria para llegar a un acuerdo real de trabajo.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Identifica en qué etapa del modelo de Tuckman se encuentra un equipo del que formes parte actualmente, y describe qué evidencia respalda esa evaluación.\n2. Elige un término de uso frecuente en tu equipo o proyecto (por ejemplo \"terminado\" o \"urgente\") y escribe una definición explícita y compartida que evite ambigüedades.\n3. Diseña un acuerdo breve de comunicación de equipo (qué canal usar para qué tipo de mensaje, con qué frecuencia reunirse) para un proyecto en el que estés trabajando."}]}, {"id": "conclusiones", "titulo": "Conclusiones Generales", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "A lo largo de las tres unidades de este libro, el estudiante construyó un recorrido completo por las formas en que un profesional de la programación web se comunica: por escrito, al redactar documentación e informes técnicos con claridad y estructura; de forma oral, al presentar avances y sostener una expresión efectiva frente a una audiencia; y de manera interpersonal, al escuchar, expresar desacuerdo con asertividad y colaborar dentro de un equipo.", "b": false}, {"type": "p", "text": "Ninguna de estas competencias reemplaza al conocimiento técnico; lo completan. Un desarrollador que escribe buen código y además lo documenta con claridad, lo explica con seguridad y lo discute con su equipo sin generar fricciones innecesarias, multiplica el valor de ese código mucho más allá de lo que el código, por sí solo, podría lograr.", "b": false}, {"type": "p", "text": "Si este libro cumplió su propósito, quien lo termina no solo sabe qué es la comunicación efectiva. Sabe, además, aplicarla la próxima vez que tenga que documentar un sistema, defender una decisión técnica o resolver un desacuerdo de equipo.", "b": false}]}, {"id": "referencias", "titulo": "Referencias Bibliográficas", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Cassany, D. (1995). La cocina de la escritura. Anagrama.", "b": false}, {"type": "p", "text": "Cassany, D. (1999). Construir la escritura. Paidós.", "b": false}, {"type": "p", "text": const $ = (s,c)=>(c||document).querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}

/* ═══════ almacenamiento ═══════ */
const CLAVE='hc_libro_v1';
let DATOS={}, guardarOk=true;
try{ DATOS = JSON.parse(localStorage.getItem(CLAVE)||'{}'); }catch(e){ DATOS={}; }
function guarda(){ try{ localStorage.setItem(CLAVE, JSON.stringify(DATOS)); return true; }catch(e){ guardarOk=false; return false; } }
function get(k,d){ return DATOS[k]===undefined?d:DATOS[k]; }
function set(k,v){ DATOS[k]=v; return guarda(); }
function avisoGuardado(t){ const s=el('span','guardado'); t._aviso=s; return s; }
function marcaGuardado(t,txt){
  const s=t._aviso; if(!s) return;
  s.textContent = txt || (guardarOk?'Guardado en este navegador':'No se pudo guardar aquí: descarga tu trabajo');
  s.className='guardado'+(guardarOk?' ok':'');
  clearTimeout(s._t); s._t=setTimeout(()=>{s.textContent='';s.className='guardado';},2600);
}
function descarga(nombre,texto){
  const b=new Blob([texto],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
function toolBase(t,i){
  const d=el('div','tool');
  d.innerHTML='<div class="tool-cab"><b>'+esc(t)+'</b><span>'+esc(i)+'</span></div>';
  const c=el('div','tool-cuerpo'); d.appendChild(c); d._c=c;
  return d;
}
function campoArea(nom, ayuda, valor, ph, filas){
  const l=el('label','campo');
  l.innerHTML='<span>'+esc(nom)+'</span>'+(ayuda?'<i>'+esc(ayuda)+'</i>':'');
  const a=el('textarea'); a.rows=filas||3; a.value=valor||''; if(ph)a.placeholder=ph;
  l.appendChild(a); l._i=a;
  return l;
}
function ejemplosBtn(cont, lista, fn, etiqueta){
  const c=el('div','chips');
  c.appendChild(el('span','','<span style="font-family:var(--sans);font-size:12px;color:var(--tinta-2)">'+(etiqueta||'Ejemplos del libro:')+'</span>'));
  lista.forEach(x=>{ const b=el('button','bt chip', esc(x[0])); b.onclick=()=>fn(x[1]); c.appendChild(b); });
  cont.appendChild(c);
}

function toolAudiencia(){
  const t = toolBase('El mismo mensaje, distintas audiencias',
    'Escribe lo que necesitas comunicar y elige a quién. La guía cambia según quién recibe: mismo hecho, distinto registro.');
  const c = t._c;
  let A = AUDIENCIAS[0];
  const l = campoArea('Qué necesitas comunicar', 'El hecho técnico, tal como lo entiendes tú.',
    get('audMsg',''), 'Ej.: una funcionalidad falla por un problema de concurrencia en la base de datos', 3);
  c.appendChild(l);
  const ops = el('div','opciones');
  AUDIENCIAS.forEach((a,i)=>{
    const b = el('button', i===0?'on':'', esc(a.n));
    b.onclick=()=>{ A=a; [...ops.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); pinta(); };
    ops.appendChild(b);
  });
  c.appendChild(ops);
  const guia = el('div'); c.appendChild(guia);
  const l2 = campoArea('Tu versión para esta audiencia', 'Reescribe el mismo hecho ajustando el registro.', '', 'Escribe aquí tu adaptación', 3);
  c.appendChild(l2);
  const salida = el('div'); c.appendChild(salida);
  function pinta(){
    guia.innerHTML = '<div class="result r-info"><b>Registro: '+esc(A.reg)+'</b>'+
      A.guia.map(g=>'· '+esc(g)).join('<br>')+'</div>';
    const v = get('aud_'+A.k,'');
    l2._i.value = v;
    salida.innerHTML='';
    const m = l2._i.value.trim();
    if(m){
      const r = analiza(m);
      salida.innerHTML = '<div class="result '+(r.metricas.promedio>30?'r-med':'r-ok')+'"><b>'+
        r.metricas.palabras+' palabras · '+r.metricas.promedio+' por oración</b>'+
        (r.metricas.promedio>30 ? 'Oraciones largas para un mensaje dirigido. Considera partirlas.'
          : 'Longitud adecuada para un mensaje de este tipo.')+'</div>';
    }
  }
  l._i.oninput = ()=>{ set('audMsg', l._i.value); marcaGuardado(t); };
  l2._i.oninput = ()=>{ set('aud_'+A.k, l2._i.value); pinta(); marcaGuardado(t); };
  const pie = el('div','tool-pie'); pie.appendChild(avisoGuardado(t)); t.appendChild(pie);
  pinta();
  return t;
}

/* ═══════ 2 · Analizador de redacción (cap. 2) ═══════ */
const TIPOS_M = {
  relleno:{n:'Relleno', c:'#d9a12e'}, nominal:{n:'Verbo enterrado', c:'#8465b8'},
  pasiva:{n:'Voz pasiva', c:'#3d7cb0'}, ambiguo:{n:'Referencia por verificar', c:'#c26a42'},
  mente:{n:'Adverbio en -mente', c:'#8a7f6a'}
};
const EJ_TEXTOS = [
  ['Ejemplo del capítulo 2', 'Es importante mencionar que, en el caso de que el usuario no haya iniciado sesión, el sistema procederá a realizar una redirección hacia la página de inicio de sesión correspondiente.'],
  ['Versión ya corregida', 'Si el usuario no inició sesión, el sistema lo redirige a la página de inicio de sesión.'],
  ['Ambigüedad referencial', 'El servidor envía datos al cliente y este los procesa. Cabe destacar que la petición es rechazada por el servidor cuando el token ha sido invalidado, lo cual ocurre debido al hecho de que la sesión que fue creada anteriormente ya expiró.'],
  ['Informe con subordinadas', 'Se procede a realizar la validación de los datos que son enviados por el formulario que el usuario completa, con el fin de que la información que se almacena en la base de datos sea consistente con lo que se espera.']
];
function toolAnalizador(){
  const t = toolBase('Analizador de redacción técnica',
    'Pega tu texto y se marcan los vicios del capítulo: relleno, verbos enterrados, voz pasiva, referencias ambiguas y oraciones demasiado largas.');
  const c = t._c;
  const l = campoArea('Tu texto', 'Un párrafo de documentación, un informe o cualquier texto técnico propio.',
    get('textoAnalisis', EJ_TEXTOS[0][1]), 'Pega aquí el texto que quieres revisar', 5);
  c.appendChild(l);
  ejemplosBtn(c, EJ_TEXTOS, v=>{ l._i.value=v; set('textoAnalisis',v); calc(); });
  const out = el('div'); c.appendChild(out);

  function calc(){
    out.innerHTML='';
    const txt = l._i.value;
    if(!txt.trim()){ out.innerHTML='<div class="result r-info"><b>Escribe o pega un texto</b>El análisis se actualiza mientras escribes.</div>'; return; }
    const R = analiza(txt);
    const M = R.metricas;
    const p = puntajeClaridad(M);

    /* medidor */
    const color = p>=80?'var(--ok)':p>=55?'var(--oro)':'var(--no)';
    const nivel = p>=80?'Claro':p>=55?'Mejorable':'Requiere reescritura';
    out.innerHTML = '<div class="result '+(p>=80?'r-ok':p>=55?'r-med':'r-no')+'">'+
      '<b>'+nivel+' · '+p+'/100</b>'+
      '<div class="medidor"><i style="width:'+p+'%;background:'+color+'"></i></div>'+
      (p>=80 ? 'El texto no presenta los vicios revisados por esta herramienta. Aun así, la última palabra es tuya: relee pensando en quién lo va a leer.'
             : 'Cada marca de abajo señala un patrón concreto. No todas exigen cambio: revisa una por una y decide.')+'</div>';

    /* métricas */
    const mx = el('div','metrix');
    [[M.palabras,'palabras',false],[M.oraciones,'oraciones',false],
     [M.promedio,'palabras por oración',M.promedio>28],
     [M.relleno,'frases de relleno',M.relleno>0],
     [M.nominal,'verbos enterrados',M.nominal>0],
     [M.pasiva,'voz pasiva',M.pasiva>0],
     [M.largas,'oraciones largas',M.largas>0]].forEach(([v,n,al])=>{
      mx.appendChild(el('div','metrica'+(al?' alerta':''),'<b>'+v+'</b><span>'+n+'</span>'));
    });
    out.appendChild(mx);

    /* texto marcado */
    const inline = R.hallazgos.filter(h=>TIPOS_M[h.tipo]);
    let html='', pos=0;
    inline.forEach(h=>{
      if(h.ini < pos) return;
      html += esc(txt.slice(pos, h.ini));
      html += '<mark class="'+h.tipo+'" title="'+esc(h.msg)+'">'+esc(txt.slice(h.ini,h.fin))+'</mark>';
      pos = h.fin;
    });
    html += esc(txt.slice(pos));
    out.appendChild(el('h3',null,'Tu texto, con las marcas'));
    out.appendChild(el('div','marcado', html));
    const leyenda = el('div','leyenda-m');
    Object.keys(TIPOS_M).forEach(k=>{
      if(!inline.some(h=>h.tipo===k)) return;
      leyenda.appendChild(el('span',null,'<i style="background:'+TIPOS_M[k].c+'"></i>'+TIPOS_M[k].n));
    });
    if(leyenda.children.length) out.appendChild(leyenda);

    /* lista de hallazgos */
    if(R.hallazgos.length){
      out.appendChild(el('h3',null,'Qué revisar ('+R.hallazgos.length+')'));
      R.hallazgos.forEach(h=>{
        const d = el('div','hallazgo '+h.tipo);
        const rec = h.texto.length>110 ? h.texto.slice(0,110)+'…' : h.texto;
        d.innerHTML = '<span class="q">'+esc(rec)+'</span><div class="m">'+esc(h.msg)+'</div>'+
          (h.sug?'<div class="s">→ '+esc(h.sug)+'</div>':'');
        out.appendChild(d);
      });
    }

    /* borrador sugerido */
    const limpio = limpiaTexto(txt);
    if(limpio !== txt.trim()){
      out.appendChild(el('h3',null,'Borrador con los cambios seguros aplicados'));
      out.appendChild(el('div','marcado', esc(limpio)));
      const n2 = palabras(limpio), n1 = M.palabras;
      out.appendChild(el('div','result r-med',
        '<b>'+n1+' → '+n2+' palabras ('+Math.round((1-n2/n1)*100)+'% menos)</b>'+
        'Solo se aplicaron los cambios que no alteran la gramática: borrar relleno y sustituir locuciones. '+
        'Los verbos enterrados, la voz pasiva y las oraciones largas exigen reescribir la frase, y eso te toca a ti.'));
      const b = el('button','bt','Usar este borrador como punto de partida');
      b.onclick = ()=>{ l._i.value = limpio; set('textoAnalisis', limpio); calc(); };
      out.appendChild(b);
    }
  }
  l._i.oninput = ()=>{ set('textoAnalisis', l._i.value); calc(); };
  const pie = el('div','tool-pie');
  const bd = el('button','bt','⤓ Descargar el análisis');
  bd.onclick = ()=>{
    const R = analiza(l._i.value), M = R.metricas;
    let s = '# Análisis de redacción\n\n## Texto\n'+l._i.value+'\n\n## Métricas\n';
    s += '- Claridad: '+puntajeClaridad(M)+'/100\n- Palabras: '+M.palabras+'\n- Oraciones: '+M.oraciones+
         '\n- Promedio por oración: '+M.promedio+'\n- Relleno: '+M.relleno+'\n- Verbos enterrados: '+M.nominal+
         '\n- Voz pasiva: '+M.pasiva+'\n- Oraciones largas: '+M.largas+'\n\n## Hallazgos\n';
    R.hallazgos.forEach(h=> s += '- ['+h.tipo+'] "'+h.texto.slice(0,90)+'" → '+h.msg+'\n');
    descarga('analisis-redaccion.md', s);
  };
  pie.appendChild(bd); pie.appendChild(avisoGuardado(t)); t.appendChild(pie);
  calc();
  return t;
}

function toolEstructura(){
  const t = toolBase('Constructor de estructura de documento',
    'Elige el tipo de documento y verás la estructura que le corresponde. Cada sección tiene su función: llénala y descarga el esquema.');
  const c = t._c;
  let tipo = 'informe';
  const ops = el('div','opciones');
  Object.keys(DOCS).forEach((k,i)=>{
    const b = el('button', k===tipo?'on':'', esc(DOCS[k].n));
    b.onclick=()=>{ tipo=k; [...ops.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); pinta(); };
    ops.appendChild(b);
  });
  c.appendChild(ops);
  const zona = el('div'); c.appendChild(zona);
  function pinta(){
    zona.innerHTML='';
    const D = DOCS[tipo];
    const guardado = get('estr_'+tipo, {});
    D.secs.forEach(([n,d],i)=>{
      const s = el('div','seccion-doc');
      s.innerHTML = '<b>'+esc(n)+'</b><span>'+esc(d)+'</span>';
      const a = el('textarea'); a.rows=2; a.placeholder='Tu contenido para esta sección';
      a.value = guardado['s'+i]||'';
      a.oninput = ()=>{ guardado['s'+i]=a.value; set('estr_'+tipo, guardado); marcaGuardado(t); };
      s.appendChild(a);
      zona.appendChild(s);
    });
    zona.appendChild(el('div','result r-info','<b>Por qué esta estructura</b>'+
      'Guffey y Loewy insisten en que la estructura debe reflejar cómo va a usar el documento el lector, no cómo lo pensó quien escribe. '+
      (tipo==='api'||tipo==='manual' ? 'Este formato privilegia la consulta rápida sobre la lectura lineal.'
        : 'Este formato está pensado para una lectura de principio a fin.')));
  }
  const pie = el('div','tool-pie');
  const b = el('button','bt','⤓ Descargar el esquema');
  b.onclick = ()=>{

function toolEnsayo(){
  const t = toolBase('Ensayo cronometrado de una intervención',
    'Prepara apertura, desarrollo y cierre, fija el tiempo objetivo y ensaya en voz alta. El capítulo insiste: en voz alta, no mentalmente.');
  const c = t._c;
  let R = get('ensayo', {min:1});
  const partes = [['ap','Apertura','Capta la atención y anuncia de qué vas a hablar.'],
                  ['de','Desarrollo','El contenido principal, en pocos puntos memorables.'],
                  ['ci','Cierre','Recoge la idea central. Es lo último que la audiencia recuerda.']];
  const crono = el('div','crono');
  crono.innerHTML = '<div><div class="t" id="cronoT">0:00</div><div class="obj" id="cronoO"></div></div>';
  const bts = el('div','bts');
  const bIni = el('button',null,'▶ Iniciar');
  const bPar = el('button',null,'⏸ Pausar');
  const bRes = el('button',null,'↺ Reiniciar');
  bts.appendChild(bIni); bts.appendChild(bPar); bts.appendChild(bRes);
  crono.appendChild(bts);
  c.appendChild(crono);

  const lm = el('label','campo');
  lm.innerHTML='<span>Tiempo objetivo (minutos)</span>';
  const im = el('input'); im.type='number'; im.min='1'; im.max='60'; im.value=R.min||1;
  im.oninput = ()=>{ R.min=+im.value; set('ensayo',R); tick(); };
  lm.appendChild(im); c.appendChild(lm);

  partes.forEach(([k,n,h])=>{
    const l = campoArea(n, h, R[k]||'', '', 2);
    l._i.oninput = ()=>{ R[k]=l._i.value; set('ensayo',R); marcaGuardado(t); };
    c.appendChild(l);
  });
  const out = el('div'); c.appendChild(out);

  let seg = 0, id = null;
  function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  function tick(){
    const obj = (+im.value||1)*60;
    $('#cronoT',crono).textContent = fmt(seg);
    $('#cronoO',crono).textContent = 'objetivo: '+fmt(obj)+(seg>obj?' · te pasaste por '+fmt(seg-obj):'');
    crono.classList.toggle('pasado', seg>obj);
  }
  bIni.onclick = ()=>{ if(id) return; id = setInterval(()=>{ seg++; tick(); }, 1000); };
  bPar.onclick = ()=>{ clearInterval(id); id=null; evalua(); };
  bRes.onclick = ()=>{ clearInterval(id); id=null; seg=0; tick(); out.innerHTML=''; };
  function evalua(){
    const obj = (+im.value||1)*60;
    if(seg===0) return;
    const dif = seg-obj, pct = Math.abs(dif)/obj;
    out.innerHTML = pct<=0.1
      ? '<div class="result r-ok"><b>Dentro del tiempo</b>Terminaste en '+fmt(seg)+' con un objetivo de '+fmt(obj)+'. Ese margen es el que permite ajustar sobre la marcha sin sacrificar el cierre.</div>'
      : dif>0
      ? '<div class="result r-no"><b>Te pasaste '+fmt(dif)+'</b>Recorta contenido antes de acelerar el habla: hablar más rápido reduce la comprensión y aumenta el nerviosismo. Empieza por lo que no cambia la idea central.</div>'
      : '<div class="result r-med"><b>Te faltaron '+fmt(-dif)+'</b>Quedó corto respecto al objetivo. Revisa si el desarrollo necesita un ejemplo o un dato de apoyo; no rellenes con repetición.</div>';
  }
  const pie = el('div','tool-pie'); pie.appendChild(avisoGuardado(t)); t.appendChild(pie);
  tick();
  return t;
}

/* ═══════ quiz ═══════ */
/* ── barajado determinista de las opciones ────────────────────────────
   Sin esto la respuesta correcta caía casi siempre en la segunda casilla,
   y bastaba marcar la misma letra para aprobar. El orden depende del
   capítulo, del número de pregunta y del intento: es igual al recargar
   la página y cambia cuando el estudiante vuelve a intentarlo. ── */
function semillaTxt(t){ let h=2166136261; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function barajaOpts(p, clave, pos){
  let s = semillaTxt(clave) || 1;
  const rnd = ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  const n = p.opts.length;
  const destino = ((pos % n) + n) % n;          /* la correcta rota de posición pregunta a pregunta */
  const otras = p.opts.map((_,i)=>i).filter(i=>i!==p.ok);
  for(let i=otras.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=otras[i]; otras[i]=otras[j]; otras[j]=t; }
  const idx = []; let k = 0;
  for(let i=0;i<n;i++) idx.push(i===destino ? p.ok : otras[k++]);
  return { opts: idx.map(i=>p.opts[i]), ok: destino };
}

  P.forEach((p,i)=>{

    d.appendChild(el('div','q','<i>'+String(i+1).padStart(2,'0')+'</i><span>'+esc(p.q)+'</span>'));
    const exp = el('div','exp oculto', esc(p.exp));
    const mez = barajaOpts(p, id+'·'+i+'·'+intento, i + intento + semillaTxt(id));
    const bs = mez.opts.map((o,j)=>{
      const b = el('button','op', esc(o));
      b.onclick = ()=>{
        bs.forEach(x=>x.disabled=true);
        b.classList.add(j===mez.ok?'bien':'mal');
        if(j!==mez.ok) bs[mez.ok].classList.add('bien');
        exp.classList.remove('oculto');
        n++; if(j===mez.ok) ac++;
        marcador.textContent = ac+' de '+n+' correctas';
        if(n===P.length){
          marcador.textContent = 'Resultado: '+ac+' de '+P.length+' correctas'+
            (ac===P.length?' — impecable.':ac>=P.length-1?' — muy bien.':' — vale la pena releer el capítulo.');
          marcaHecho(id, ac, P.length);
        }
      };
      d.appendChild(b);
      return b;
    });
    d.appendChild(exp);
    c.appendChild(d);
  });
  c.appendChild(marcador);
  const reintentar = el('button','bt ghost','↺ Volver a intentar');
  reintentar.style.marginTop = '14px';
  reintentar.onclick = ()=>{ const nuevo = quiz(id, intento+1); q.replaceWith(nuevo); nuevo.scrollIntoView({block:'start'}); };
  c.appendChild(reintentar);
  q.appendChild(c);
  return q;
}

/* ═══════ herramientas por capítulo ═══════ */
function herramientas(cap){
  switch(cap.id){
    case 'cap1': return [toolAudiencia()];
    case 'cap2': return [toolAnalizador()];
    case 'cap3': return [toolEstructura(), toolResumenEjecutivo()];
    case 'cap4': return [toolPasadas()];
    case 'cap5': return [toolEnsayo()];
    case 'cap6': return [toolNoVerbal()];
    case 'cap7': return [toolPresentacion()];
    case 'cap8': return [toolDiapositiva()];
    case 'cap9': return [toolParafraseo()];
    case 'cap10': return [toolAsertivo()];
    case 'cap11': return [toolConflicto()];
    case 'cap12': return [toolTuckman()];
    case 'anexo-a': return [toolPasadas()];
    case 'anexo-b': return [toolAnexoB()];
    case 'anexo-c': return [toolAsertivo()];
    default: return [];
  }
}

/* ═══════ atajos ═══════ */
const ATAJOS = [
  {re:/explicar algo técnico a alguien sin conocimientos|comunicación escrita, oral e interpersonal/i, t:'Adaptar el mensaje', id:'cap1'},
  {re:/reescríbelo aplicando|ambigüedad referencial|dos versiones de la misma instrucción|concisión/i, t:'Analizar el texto', id:'cap2'},
  {re:/resumen ejecutivo/i, t:'Redactar el resumen ejecutivo', id:'cap3'},
  {re:/esquema de estructura|estructura corresponde al uso/i, t:'Construir la estructura', id:'cap3'},
  {re:/tres pasadas|lee en voz alta un párrafo/i, t:'Aplicar las tres pasadas', id:'cap4'},
  {re:/cronómetro en mano|explicación de un minuto|nerviosismo/i, t:'Ensayar cronometrado', id:'cap5'},
  {re:/grábate|lenguaje corporal|tono de voz/i, t:'Autorrevisar lo no verbal', id:'cap6'},
  {re:/análisis de audiencia|idea central clara por sección/i, t:'Preparar la presentación', id:'cap7'},
  {re:/cuántas palabras tenía|diapositiva|diagrama simple/i, t:'Evaluar la diapositiva', id:'cap8'},
  {re:/parafrasear|escucha activa|formular una respuesta mientras/i, t:'Practicar el parafraseo', id:'cap9'},
  {re:/asertiv|hecho, efecto, petición|pasiva o agresiva/i, t:'Construir el mensaje asertivo', id:'cap10'},
  {re:/estilo de manejo de conflictos|posiciones|intereses/i, t:'Traducir posiciones a intereses', id:'cap11'},
  {re:/tuckman|etapa del|término de uso frecuente en tu equipo/i, t:'Diagnosticar la etapa del equipo', id:'cap12'}
];
function atajo(txt){
  const a = ATAJOS.find(x=>x.re.test(txt));
  if(!a) return null;
  const aqui = LIBRO[actual] && LIBRO[actual].id === a.id;
  return {t: a.t + (aqui?' (más abajo en esta página)':' →'), f:()=>{
    if(aqui){ const e=$('.tool'); if(e) e.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    const i = LIBRO.findIndex(c=>c.id===a.id);
    if(i>=0){ ve(i); setTimeout(()=>{ const e=$('.tool'); if(e) e.scrollIntoView({block:'start'}); },60); }
  }};
}

/* ═══════ render ═══════ */
function bloque(b){
  switch(b.type){
    case 'p': return el('p',null,esc(b.text));
    case 'h2': return el('h2',null,esc(b.text));
    case 'objetivos': case 'concepto': {
      const d = el('div','caja '+b.type);
      d.appendChild(el('div','t','<span>'+(b.type==='concepto'?'◈':'◎')+'</span>'+esc(b.title)));
      d.appendChild(el('p',null,esc(b.body)));
      return d;
    }
    case 'ejercicios': {
      const d = el('div','ejs');
      d.appendChild(el('h3',null,'Ponlo a prueba'));
      b.body.split(/\n(?=\d+\.\s)/).forEach((t,i)=>{
        const txt = t.replace(/^\d+\.\s*/,'').trim();
        if(!txt) return;
        const e = el('div','ej');
        e.appendChild(el('div','n',String(i+1)));
        const col = el('div'); col.style.flex='1';
        col.appendChild(el('p',null,esc(txt)));
        const at = atajo(txt);
        if(at){ const b2 = el('button','link',at.t); b2.onclick=at.f; col.appendChild(b2); }
        e.appendChild(col);
        d.appendChild(e);
      });
      return d;
    }
    case 'img': {
      const f = el('figure');
      const i = el('img'); i.src=b.data; i.alt=b.caption||'Figura del libro'; i.loading='lazy';
      f.appendChild(i);
      if(b.caption) f.appendChild(el('figcaption',null,esc(b.caption)));
      return f;
    }
    case 'grid': {
      const w = el('div','tabla-wrap');
      const t = el('table','datos');
      const [cab,...fs] = b.rows;
      t.innerHTML = '<thead><tr>'+cab.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
        fs.map(f=>'<tr>'+f.map(x=>'<td>'+esc(x).replace(/\n/g,'<br>')+'</td>').join('')+'</tr>').join('')+'</tbody>';
      w.appendChild(t); return w;
    }
    default: return el('div');
  }
}

let actual = 0;
function dibujaNav(){
  const nav = $('#nav'); nav.innerHTML='';
  let grupo=null;
  LIBRO.forEach((c,i)=>{
    const g = c.unidad || (c.kind==='anexo'?'Instrumentos de apoyo':c.kind==='cap'?'Capítulos':'Apertura y cierre');
    if(g!==grupo){ grupo=g; nav.appendChild(el('div','grupo',esc(g))); }
    const b = el('button','nav-i'+(i===actual?' on':''));
    const e = ESTADO[c.id];
    b.innerHTML = '<span class="num">'+(c.num||'')+'</span><span>'+esc(c.titulo)+'</span>'+(e?'<span class="ck">'+e.a+'/'+e.t+'</span>':'');
    b.onclick = ()=>{ ve(i); cierra(); };
    nav.appendChild(b);
  });
  const caps = LIBRO.filter(c=>c.kind==='cap');
  const hechos = caps.filter(c=>ESTADO[c.id]).length;
  $('#avanceTxt').textContent = hechos+' de '+caps.length+' capítulos';
  $('#aroFg').setAttribute('stroke-dasharray',(hechos/caps.length*100.5)+' 100.5');
}
function cierra(){ $('#rail').classList.remove('abierto'); $('#velo').classList.remove('on'); }

function ve(i){
  actual = Math.max(0, Math.min(LIBRO.length-1, i));
  const c = LIBRO[actual];
  const h = $('#hoja'); h.innerHTML='';
  $('#barraTit').textContent = c.titulo;
  document.title = c.titulo+' · Habilidades Comunicativas I';
  if(c.id==='portada'){ h.appendChild(portada(c)); }
  else {
    const tapa = el('div','tapa');
    if(c.kind==='cap') tapa.appendChild(el('div','eyebrow','Capítulo '+c.num+' · '+esc((c.unidad||'').split('·')[0].trim())));
    else if(c.kind==='anexo') tapa.appendChild(el('div','eyebrow','Instrumento de apoyo'));
    tapa.appendChild(el('h1',null,esc(c.titulo)));
    h.appendChild(tapa);
    if(c.kind==='anexo' && c.id!=='rubrica'){
      const intro = c.blocks.find(b=>b.type==='p');
      if(intro) h.appendChild(bloque(intro));
    } else {
      const w = el('div', c.id==='referencias'?'refs':'');
      c.blocks.forEach(b=> w.appendChild(bloque(b)));
      h.appendChild(w);
    }
    herramientas(c).forEach(x=>h.appendChild(x));
    if(c.kind==='cap'){ const q=quiz(c.id); if(q) h.appendChild(q); }
  }
  h.appendChild(pie());
  dibujaNav();
  if(location.hash.slice(1) !== c.id) location.hash = c.id;
  window.scrollTo({top:0,behavior:'instant'});
}

function portada(c){
  const d = el('div','portada');
  const im = c.blocks.find(b=>b.type==='img');
  const img = el('img'); img.src=im.data; img.alt='Portada del libro';
  const der = el('div');
  der.innerHTML = '<div class="eyebrow">Edición interactiva</div>'+
    '<h1>Habilidades Comunicativas I</h1>'+
    '<p class="claim">Comunicación escrita, oral e interpersonal para equipos de desarrollo. Esta edición convierte cada técnica del libro en una herramienta que puedes usar sobre tus propios textos y presentaciones.</p>'+
    '<div class="autores">Katherine Yesid Seña Giraldo · Adriana María Rojas Morales · Johana Milena Meza Fernandez<br>'+
    '<span>Habilidades Comunicativas I (FDOC-088) · Técnico Profesional en Programación Web · Universidad de Córdoba · Montería, 2026</span></div>';
  const t = el('div','tarjetas');
  [['✎','Analiza tu redacción: relleno, voz pasiva, verbos enterrados y ambigüedades.'],
   ['▤','Arma la estructura del documento que necesitas escribir, sección por sección.'],
   ['⏱','Ensaya una intervención con cronómetro y comprueba si cabe en el tiempo.'],
   ['◐','Evalúa si una diapositiva tiene demasiado texto para acompañar lo que dices.'],
   ['⇄','Construye mensajes asertivos y traduce posiciones a intereses reales.']].forEach(([i,x])=>{
    t.appendChild(el('div','tarj','<i>'+i+'</i><span>'+x+'</span>'));
  });
  der.appendChild(t);
  const b = el('button','bt-nav sig','Empezar por el prólogo →');
  b.onclick = ()=>ve(LIBRO.findIndex(x=>x.id==='prologo'));
  der.appendChild(b);
  der.appendChild(el('div','aviso','Todo se procesa dentro de tu navegador: funciona sin conexión y tus textos no salen de este dispositivo.'));
  d.appendChild(img); d.appendChild(der);
  return d;
}
function pie(){
  const p = el('div','pie');
  const a = el('button','bt-nav','← '+(actual>0?LIBRO[actual-1].titulo.slice(0,32):'Inicio'));
  a.onclick=()=>ve(actual-1); a.disabled = actual<=0;
  const b = el('button','bt-nav sig',(actual<LIBRO.length-1&&actual>=0?LIBRO[actual+1].titulo.slice(0,32):'Fin')+' →');
  b.onclick=()=>ve(actual+1); b.disabled = actual<0||actual===LIBRO.length-1;
  p.appendChild(a); p.appendChild(b);
  return p;
}

$('#ham').onclick = ()=>{ $('#rail').classList.toggle('abierto'); $('#velo').classList.toggle('on'); };
$('#velo').onclick = cierra;
$('#btPort').onclick = ()=>{ vistaPortafolio(); cierra(); };
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='ArrowRight' && actual>=0) ve(actual+1);
  if(e.key==='ArrowLeft' && actual>0) ve(actual-1);
});
/* ── enlace directo: la dirección refleja la sección abierta, así el
   botón Atrás funciona y se puede compartir un capítulo concreto ── */
window.addEventListener('hashchange', ()=>{
  const id = decodeURIComponent((location.hash||'').slice(1));
  const i = LIBRO.findIndex(c=>c.id===id);
  if(i>=0 && i!==actual) ve(i);
});
ve(Math.max(0, LIBRO.findIndex(c=>c.id===decodeURIComponent((location.hash||'').slice(1)))));
</script>
