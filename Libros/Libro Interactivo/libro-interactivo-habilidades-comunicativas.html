<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habilidades Comunicativas I · Edición interactiva</title>
<meta name="description" content="Edición interactiva del libro Habilidades Comunicativas I para Programación Web. Universidad de Córdoba.">
<style>
:root{
  --bosque:#1b3b30; --bosque-2:#255045; --verde-cl:#e6f0ea; --verde-borde:#bcd7c9;
  --oro:#9a7526; --oro-cl:#fbf3e2; --oro-borde:#e8d5a8;
  --terra:#c26a42; --terra-cl:#fceee6; --terra-borde:#efcdb8;
  --papel:#fbfaf7; --papel-2:#f1efe9; --linea:#dcd7cc;
  --tinta:#1a2320; --tinta-2:#576460;
  --ok:#22694c; --ok-cl:#e4f1ea; --no:#a8442a; --no-cl:#fbeae4;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:"Charter","Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:288px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--serif);font-size:17.5px;line-height:1.64;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:var(--sans)}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--oro);outline-offset:2px;border-radius:2px}

#rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--bosque);color:#d6e4dc;display:flex;flex-direction:column;z-index:40;transition:transform .25s ease}
.rail-top{padding:18px 20px 15px;border-bottom:1px solid rgba(255,255,255,.12)}
.marca{font-family:var(--sans);font-weight:800;font-size:15px;color:#fff;line-height:1.2;letter-spacing:-.2px}
.marca em{font-style:normal;color:#e0be74}
.sub{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8ba79b;margin-top:8px}
.avance{display:flex;align-items:center;gap:10px;margin-top:15px}
.aro{width:34px;height:34px;flex:0 0 34px}
.aro circle{fill:none;stroke-width:4}
.aro .bg{stroke:rgba(255,255,255,.16)}
.aro .fg{stroke:#e0be74;stroke-linecap:round;transition:stroke-dasharray .4s}
.avance b{font-family:var(--sans);font-size:12px;font-weight:600;color:#b3c9be}
nav{overflow-y:auto;padding:10px 12px 30px;flex:1}
.grupo{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7b978c;padding:16px 10px 6px;border-top:1px solid rgba(255,255,255,.1);margin-top:8px;line-height:1.4}
.grupo:first-child{border-top:0;margin-top:0}
.nav-i{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;color:#d6e4dc;font-size:13.5px;line-height:1.35;font-family:var(--sans)}
.nav-i:hover{background:rgba(255,255,255,.09)}
.nav-i.on{background:#e0be74;color:var(--bosque);font-weight:600}
.nav-i.on .num{color:var(--bosque)}
.nav-i .num{font-weight:700;font-size:11px;color:#e0be74;min-width:16px;font-variant-numeric:tabular-nums}
.nav-i .ck{margin-left:auto;font-size:11px;opacity:.9}
.rail-pie{padding:12px;border-top:1px solid rgba(255,255,255,.12)}
.bt-rail{width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:10px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.bt-rail:hover{background:rgba(224,190,116,.22);border-color:#e0be74}

main{margin-left:var(--rail);padding:0 0 90px}
.hoja{max-width:770px;margin:0 auto;padding:0 30px}
.tapa{padding:40px 0 18px}
.eyebrow{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);margin-bottom:11px}
h1{font-family:var(--sans);font-weight:800;font-size:clamp(28px,4vw,38px);line-height:1.1;letter-spacing:-.022em;color:var(--bosque);margin:0 0 12px}
h2{font-family:var(--sans);font-weight:700;font-size:19.5px;letter-spacing:-.01em;color:var(--bosque);margin:42px 0 12px;padding-left:13px;border-left:4px solid var(--oro)}
h3{font-family:var(--sans);font-weight:650;font-size:16px;color:var(--tinta);margin:26px 0 8px}
p{margin:0 0 15px}
figure{margin:26px 0;text-align:center}
figure img{max-width:100%;border-radius:9px;border:1px solid var(--linea);background:#fff}
figcaption{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);margin-top:9px}
.refs p{font-size:15px;padding-left:26px;text-indent:-26px;margin-bottom:9px;line-height:1.5}

.caja{border-radius:11px;padding:16px 18px;margin:22px 0;font-size:16px;border:1px solid}
.caja .t{font-family:var(--sans);font-weight:700;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px;display:flex;gap:8px;align-items:center}
.caja p{margin:0}
.caja.objetivos{background:var(--verde-cl);border-color:var(--verde-borde)}
.caja.objetivos .t{color:var(--bosque)}
.caja.concepto{background:var(--oro-cl);border-color:var(--oro-borde)}
.caja.concepto .t{color:var(--oro)}

.ejs{margin:34px 0 10px}
.ej{display:flex;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:14px 16px;margin-bottom:10px;align-items:flex-start}
.ej .n{font-family:var(--sans);font-weight:800;font-size:12px;color:#fff;background:var(--bosque);min-width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
.ej p{margin:0;font-size:16px}
.ej .link{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--oro);background:none;border:0;padding:4px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}

.tool{background:#fff;border:1px solid var(--linea);border-radius:13px;margin:30px 0;overflow:hidden;box-shadow:0 1px 3px rgba(27,59,48,.07)}
.tool-cab{padding:15px 20px;background:var(--bosque);color:#fff}
.tool-cab b{font-family:var(--sans);font-size:15.5px;display:block;letter-spacing:-.01em}
.tool-cab span{font-family:var(--sans);font-size:12.5px;color:#a8c2b6;display:block;margin-top:3px;line-height:1.45}
.tool-cuerpo{padding:18px 20px}
.tool-pie{padding:12px 20px;background:var(--papel-2);border-top:1px solid var(--linea);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.guardado{font-family:var(--sans);font-size:12px;color:var(--tinta-2);margin-left:auto}
.guardado.ok{color:var(--ok);font-weight:600}
.bt{font-family:var(--sans);font-size:13px;font-weight:600;border:1px solid var(--linea);background:#fff;color:var(--bosque);padding:8px 15px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
.bt:hover{border-color:var(--oro);background:var(--oro-cl)}
.bt.pri{background:var(--bosque);border-color:var(--bosque);color:#fff}
.bt.pri:hover{background:var(--bosque-2);border-color:var(--bosque-2)}
.bt.ghost{background:none;border-color:transparent;color:var(--tinta-2)}
.bt.ghost:hover{background:#fff;border-color:var(--linea)}
.bt.chip{font-size:12px;padding:5px 11px;border-radius:20px;background:var(--papel-2);color:var(--tinta-2)}
.bt.chip:hover{background:var(--oro-cl);color:var(--oro);border-color:var(--oro-borde)}
label.campo{display:block;margin-bottom:14px}
label.campo>span{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--bosque);display:block;margin-bottom:5px}
label.campo>i{font-family:var(--sans);font-size:12px;color:var(--tinta-2);font-style:normal;display:block;margin-bottom:6px;line-height:1.45}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--linea);border-radius:8px;padding:10px 12px;font-size:15px;background:var(--papel);color:var(--tinta);outline:0;line-height:1.55;font-family:var(--sans)}
textarea{resize:vertical;min-height:80px}
input:focus,textarea:focus,select:focus{border-color:var(--bosque);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;align-items:center}

/* analizador */
.metrix{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:14px 0}
.metrica{background:var(--papel);border:1px solid var(--linea);border-radius:9px;padding:10px 11px;text-align:center}
.metrica b{font-family:var(--sans);font-size:20px;color:var(--bosque);display:block;line-height:1.15}
.metrica span{font-family:var(--sans);font-size:11px;color:var(--tinta-2);display:block;margin-top:3px;line-height:1.3}
.metrica.alerta{background:var(--terra-cl);border-color:var(--terra-borde)}
.metrica.alerta b{color:var(--terra)}
.marcado{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:14px 16px;font-size:16px;line-height:1.85;white-space:pre-wrap}
mark{border-radius:3px;padding:1px 2px;cursor:help;border-bottom:2px solid}
mark.relleno{background:#fdeacd;border-color:#d9a12e}
mark.nominal{background:#e7dcf5;border-color:#8465b8}
mark.pasiva{background:#d9e9f7;border-color:#3d7cb0}
mark.ambiguo{background:#fbe0d6;border-color:var(--terra)}
mark.mente{background:#e9e5dc;border-color:#8a7f6a}
.leyenda-m{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:12px;color:var(--tinta-2);margin:10px 0 4px}
.leyenda-m i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hallazgo{border-left:3px solid var(--linea);padding:9px 0 9px 13px;margin-bottom:9px}
.hallazgo .q{font-family:var(--mono);font-size:13.5px;background:var(--papel-2);padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:5px}
.hallazgo .m{font-family:var(--sans);font-size:13.5px;color:var(--tinta-2);line-height:1.5}
.hallazgo .s{font-family:var(--sans);font-size:12.5px;color:var(--ok);font-weight:600;margin-top:3px}
.hallazgo.relleno{border-color:#d9a12e}
.hallazgo.nominal{border-color:#8465b8}
.hallazgo.pasiva{border-color:#3d7cb0}
.hallazgo.ambiguo{border-color:var(--terra)}
.hallazgo.larga,.hallazgo.anidada{border-color:var(--tinta-2)}
.hallazgo.mente{border-color:#8a7f6a}
.medidor{height:10px;background:var(--papel-2);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.medidor i{display:block;height:100%;border-radius:6px;transition:width .5s}

.result{border-radius:10px;padding:14px 16px;font-family:var(--sans);margin-top:14px;border:1px solid;font-size:14px;line-height:1.5}
.result b{font-size:15px;display:block;margin-bottom:4px}
.result .big{font-size:22px;display:block;margin:6px 0 3px;font-weight:700}
.r-ok{background:var(--ok-cl);border-color:#a9d0bb;color:#155338}
.r-med{background:var(--oro-cl);border-color:var(--oro-borde);color:#7b5c1c}
.r-no{background:var(--no-cl);border-color:#e6bcae;color:#8a3520}
.r-info{background:var(--verde-cl);border-color:var(--verde-borde);color:#194f3c}

.tabla-wrap{overflow-x:auto;margin:18px 0}
table.datos{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13.5px}
table.datos th{background:var(--bosque);color:#fff;text-align:left;padding:9px 11px;font-weight:600;font-size:12px;vertical-align:top}
table.datos td{padding:8px 11px;border-bottom:1px solid var(--linea);vertical-align:top}
table.datos tr:nth-child(even) td{background:var(--papel)}

/* selector de opciones */
.opciones{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.opciones button{font-family:var(--sans);font-size:12.5px;font-weight:600;border:1px solid var(--linea);background:var(--papel);color:var(--tinta-2);border-radius:8px;padding:8px 13px}
.opciones button.on{background:var(--bosque);border-color:var(--bosque);color:#fff}
.opciones button:hover:not(.on){border-color:var(--oro)}

/* checklist */
.chk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--papel-2)}
.chk:first-child{border-top:0}
.chk input{width:19px;height:19px;flex:0 0 auto;margin-top:2px;accent-color:var(--bosque)}
.chk label{font-size:15.5px;flex:1;cursor:pointer}
.chk .grupo-t{font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--oro);text-transform:uppercase;letter-spacing:.07em;margin-top:16px;margin-bottom:2px}

/* estructura de documento */
.seccion-doc{background:var(--papel);border:1px solid var(--linea);border-left:4px solid var(--oro);border-radius:0 10px 10px 0;padding:12px 15px;margin-bottom:10px}
.seccion-doc b{font-family:var(--sans);font-size:14px;color:var(--bosque);display:block}
.seccion-doc span{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);display:block;margin:2px 0 7px;line-height:1.45}

/* contadores */
.contador{font-family:var(--sans);font-size:12px;color:var(--tinta-2);text-align:right;margin-top:4px}
.contador.excede{color:var(--no);font-weight:600}

/* etapas / estilos */
.estilo{border:1px solid var(--linea);border-radius:10px;padding:12px 15px;margin-bottom:9px;background:var(--papel);cursor:pointer}
.estilo:hover{border-color:var(--oro)}
.estilo.on{border-color:var(--bosque);background:var(--verde-cl);box-shadow:inset 3px 0 0 var(--bosque)}
.estilo b{font-family:var(--sans);font-size:14.5px;color:var(--bosque);display:block}
.estilo span{font-family:var(--sans);font-size:13px;color:var(--tinta-2);display:block;margin-top:3px;line-height:1.45}

/* cronómetro */
.crono{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--bosque);color:#fff;border-radius:11px;padding:16px 20px;margin-bottom:14px}
.crono .t{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1}
.crono .obj{font-family:var(--sans);font-size:12.5px;color:#a8c2b6;margin-top:3px}
.crono .bts{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
.crono button{font-family:var(--sans);font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:8px 15px}
.crono button:hover{background:rgba(224,190,116,.3);border-color:#e0be74}
.crono.pasado .t{color:#f0b8a0}

/* quiz */
.preg{padding:16px 0;border-top:1px solid var(--papel-2)}
.preg:first-of-type{border-top:0}
.preg .q{font-family:var(--sans);font-size:15.5px;font-weight:600;margin-bottom:11px;display:flex;gap:9px}
.preg .q i{color:var(--oro);font-style:normal;font-weight:800;font-size:12px;padding-top:3px}
.op{display:block;width:100%;text-align:left;font-size:14.5px;padding:9px 13px;margin-bottom:6px;border-radius:8px;border:1px solid var(--linea);background:var(--papel);color:var(--tinta);line-height:1.4}
.op:hover:not([disabled]){border-color:var(--oro);background:#fff}
.op.bien{background:var(--ok-cl);border-color:#a9d0bb;font-weight:600}
.op.mal{background:var(--no-cl);border-color:#e6bcae}
.op[disabled]{cursor:default}
.exp{font-family:var(--sans);font-size:13.5px;background:var(--papel-2);border-left:3px solid var(--oro);padding:9px 13px;border-radius:0 7px 7px 0;margin-top:8px;color:var(--tinta-2);line-height:1.5}
.marcador{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--bosque);margin-top:16px;padding-top:14px;border-top:1px solid var(--papel-2)}

.portada{display:grid;grid-template-columns:minmax(190px,.66fr) 1.34fr;gap:40px;align-items:center;padding:44px 0 16px}
.portada img{width:100%;border-radius:11px;box-shadow:0 16px 44px rgba(27,59,48,.3)}
.portada h1{font-size:clamp(25px,2.9vw,33px)}
.claim{font-size:17px;color:var(--tinta-2);margin-bottom:18px}
.autores{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--bosque);border-left:3px solid var(--oro);padding-left:12px;margin-bottom:20px;line-height:1.5}
.autores span{display:block;font-weight:400;font-size:11.5px;color:var(--tinta-2);margin-top:3px}
.tarjetas{display:grid;gap:9px;margin:18px 0 22px}
.tarj{display:flex;gap:11px;align-items:flex-start;font-family:var(--sans);font-size:14px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:12px 14px}
.tarj i{font-style:normal;font-size:15px;color:var(--oro)}
.aviso{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);background:var(--papel-2);border-radius:9px;padding:11px 14px;margin-top:14px;line-height:1.5}

.tarj-lista{display:grid;gap:9px;margin:18px 0}
.tarj-h{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:13px 16px}
.tarj-h .est{font-size:17px;line-height:1;margin-top:2px}
.tarj-h b{font-family:var(--sans);font-size:14.5px;color:var(--bosque);display:block}
.tarj-h span{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);display:block;margin-top:2px;line-height:1.45}
.tarj-h .bt{margin-left:auto;flex:0 0 auto}

.pie{display:flex;gap:12px;justify-content:space-between;margin-top:50px;padding-top:20px;border-top:1px solid var(--linea);flex-wrap:wrap}
.bt-nav{font-family:var(--sans);font-size:14px;font-weight:600;border:1px solid var(--linea);background:#fff;color:var(--bosque);padding:10px 16px;border-radius:9px}
.bt-nav:hover{border-color:var(--oro);background:var(--oro-cl)}
.bt-nav.sig{background:var(--bosque);color:#fff;border-color:var(--bosque)}
.bt-nav[disabled]{opacity:.4;cursor:not-allowed}

#barra{display:none;position:sticky;top:0;z-index:30;background:rgba(251,250,247,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea);padding:9px 14px;align-items:center;gap:11px}
#barra b{font-family:var(--sans);font-size:13.5px;color:var(--bosque);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ham{border:1px solid var(--linea);background:#fff;border-radius:8px;width:36px;height:34px;font-size:15px;color:var(--bosque)}
#velo{display:none;position:fixed;inset:0;background:rgba(27,59,48,.45);z-index:35}
.oculto{display:none}

@media(max-width:900px){
  #rail{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  #rail.abierto{transform:none}
  main{margin-left:0}
  #barra{display:flex}
  #velo.on{display:block}
  .hoja{padding:0 18px}
  .portada{grid-template-columns:1fr;gap:22px;padding-top:24px}
  .portada img{max-width:240px;margin:0 auto;display:block}
}
@media(max-width:640px){
  .g2,.g3{grid-template-columns:1fr}
  .tool-cuerpo,.tool-pie{padding:15px}
  .crono{flex-direction:column;align-items:flex-start;gap:10px}
  .crono .bts{margin-left:0;width:100%}
  .crono button{flex:1}
  .tarj-h{flex-wrap:wrap}
  .tarj-h .bt{margin-left:0;width:100%;justify-content:center}
  .guardado{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{#rail,#barra,.tool-pie,.pie{display:none}main{margin:0}}
</style>
</head>
<body>

<div id="velo"></div>

<aside id="rail">
  <div class="rail-top">
    <div class="marca">Habilidades<br><em>Comunicativas I</em></div>
    <div class="sub">Edición interactiva</div>
    <div class="avance">
      <svg class="aro" viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/>
        <circle class="fg" id="aroFg" cx="20" cy="20" r="16" stroke-dasharray="0 100.5" transform="rotate(-90 20 20)"/></svg>
      <b id="avanceTxt">0 de 12 capítulos</b>
    </div>
  </div>
  <nav id="nav"></nav>

<script>
/* ═══════════════════════════════════════════════════════════
   ANALIZADOR DE REDACCIÓN TÉCNICA (español)
   Reglas derivadas del Capítulo 2 del libro.
   No corrige automáticamente: señala y explica, el estudiante decide.
   ═══════════════════════════════════════════════════════════ */

/* ── 1 · frases de relleno: se pueden borrar sin perder información ── */
const RELLENO = [
  {re:/\bcabe (destacar|mencionar|señalar|resaltar|anotar) que\b/gi, s:'(borrar)'},
  {re:/\bes importante (mencionar|destacar|señalar|resaltar|tener en cuenta) que\b/gi, s:'(borrar)'},
  {re:/\bes (necesario|preciso) (mencionar|señalar) que\b/gi, s:'(borrar)'},
  {re:/\bvale la pena (mencionar|destacar|señalar) que\b/gi, s:'(borrar)'},
  {re:/\bcomo (ya )?se (ha )?(mencionado|indicado|señalado) (anteriormente|previamente)\b/gi, s:'(borrar)'},
  {re:/\ben el caso de que\b/gi, s:'si', modo:true},
  {re:/\ben caso de que\b/gi, s:'si', modo:true},
  {re:/\bcon el (fin|objetivo|propósito) de\b/gi, s:'para'},
  {re:/\ba fin de que\b/gi, s:'para que', modo:true},
  {re:/\bdebido al hecho de que\b/gi, s:'porque'},
  {re:/\bdado el hecho de que\b/gi, s:'porque'},
  {re:/\ben virtud de que\b/gi, s:'porque'},
  {re:/\bde igual (manera|forma)\b/gi, s:'también'},
  {re:/\ben relación con lo anterior\b/gi, s:'(borrar)'},
  {re:/\bpor (otra parte|otro lado), (cabe|es importante)\b/gi, s:'(simplificar)'},
  {re:/\ba nivel de\b/gi, s:'en'},
  {re:/\ben lo que respecta a\b/gi, s:'sobre'},
  {re:/\ben lo referente a\b/gi, s:'sobre'},
  {re:/\bcon respecto a lo que\b/gi, s:'sobre'},
  {re:/\bel mismo que\b/gi, s:'que'},
  {re:/\bla totalidad de (los|las)\b/gi, s:'todos los / todas las'},
  {re:/\bun gran número de\b/gi, s:'muchos'},
  {re:/\ben la actualidad\b/gi, s:'hoy'},
  {re:/\ben el momento actual\b/gi, s:'ahora'},
  {re:/\bde manera (previa|posterior) a\b/gi, s:'antes de / después de'},
  {re:/\bde forma tal que\b/gi, s:'para que', modo:true},
  {re:/\bcorrespondiente(s)?\b/gi, s:'(suele sobrar)'},
  {re:/\brespectivo(s|a|as)?\b/gi, s:'(suele sobrar)'}
];

/* ── 2 · nominalizaciones: verbo enterrado en un sustantivo ── */
const NOMINAL = [
  {re:/\bprocede(r|rá|remos)? a (realizar|efectuar|ejecutar|hacer)\b/gi, s:'usa el verbo directo'},
  {re:/\bproced(e|erá|emos|ió) a\b/gi, s:'usa el verbo directo'},
  {re:/\brealiza(r|rá|mos|n)? (una|el|la|un) (revisión|validación|verificación|comprobación|actualización|modificación|eliminación|redirección|configuración|instalación|implementación)\b/gi, s:'revisar, validar, verificar…'},
  {re:/\bllevar? a cabo\b/gi, s:'hacer'},
  {re:/\bse (tomó|toma|tomará) la decisión de\b/gi, s:'decidimos / se decide'},
  {re:/\bhacer uso de\b/gi, s:'usar'},
  {re:/\bdar (inicio|comienzo) a\b/gi, s:'empezar'},
  {re:/\btener conocimiento de\b/gi, s:'saber'},
  {re:/\bponer? en (funcionamiento|marcha)\b/gi, s:'poner a funcionar / iniciar'},
  {re:/\befectua(r|rá|mos)\b/gi, s:'hacer'},
  {re:/\bdar cumplimiento a\b/gi, s:'cumplir'},
  {re:/\bhacer entrega de\b/gi, s:'entregar'}
];

/* ── 3 · voz pasiva perifrástica ── */
const PART = '(?:[a-záéíóúñ]+(?:ado|ada|ados|adas|ido|ida|idos|idas))';
const RE_PASIVA = new RegExp('\\b(?:es|son|fue|fueron|será|serán|ha sido|han sido|había sido|habían sido|está siendo|están siendo|era|eran)\\s+' + PART + '\\b', 'gi');
/* ── 4 · pasiva refleja impersonal (se + verbo), común en informes ── */
const RE_SE = /\bse\s+(?:realiza|realizan|efectúa|efectúan|procede|procederá|lleva|llevan|ejecuta|ejecutan|observa|observan|evidencia|evidencian)\b/gi;

/* ── 5 · pronombres de referencia ambigua ── */
const RE_AMBIGUO = /\b(este|esta|estos|estas|esto|ese|esa|esos|esas|aquel|aquella|dicho|dicha|dichos|dichas|el mismo|la misma|los mismos|las mismas)\b/gi;

/* ── 6 · adverbios en -mente ── */
const RE_MENTE = /\b[a-záéíóúñ]{4,}mente\b/gi;

function palabras(t){ return (t.match(/[\wáéíóúüñÁÉÍÓÚÜÑ]+/g) || []).length; }

function oraciones(txt){
  const out = [];
  const re = /[^.!?…]+[.!?…]+|[^.!?…]+$/g;
  let m;
  while((m = re.exec(txt)) !== null){
    const t = m[0].trim();
    if(t) out.push({t, ini: m.index, fin: m.index + m[0].length});
  }
  return out;
}

/* cuenta subordinadas encadenadas dentro de una oración */
function subordinadas(o){
  return (o.match(/\b(que|cual|cuales|quien|quienes|donde|cuyo|cuya)\b/gi) || []).length;
}

function analiza(txt){
  const hallazgos = [];
  function marca(tipo, ini, fin, texto, msg, sug){
    hallazgos.push({tipo, ini, fin, texto, msg, sug});
  }
  const busca = (lista, tipo, msg) => lista.forEach(r=>{
    r.re.lastIndex = 0;
    let m;
    while((m = r.re.exec(txt)) !== null){
      marca(tipo, m.index, m.index + m[0].length, m[0], msg, r.s);
      if(m[0].length === 0) r.re.lastIndex++;
    }
  });

  busca(RELLENO, 'relleno', 'Frase de relleno: se puede borrar o acortar sin perder información.');
  busca(NOMINAL, 'nominal', 'Verbo enterrado en un sustantivo. La forma verbal directa es más corta y más clara.');

  let m;
  RE_PASIVA.lastIndex = 0;
  while((m = RE_PASIVA.exec(txt)) !== null){
    marca('pasiva', m.index, m.index+m[0].length, m[0],
      'Voz pasiva. En documentación técnica la voz activa suele leerse más rápido, salvo que quien ejecuta la acción sea irrelevante.', 'voz activa');
  }
  RE_SE.lastIndex = 0;
  while((m = RE_SE.exec(txt)) !== null){
    marca('pasiva', m.index, m.index+m[0].length, m[0],
      'Construcción impersonal: oculta quién ejecuta la acción. Si el agente importa, nómbralo.', 'nombra al agente');
  }
  RE_MENTE.lastIndex = 0;
  const mentes = [];
  while((m = RE_MENTE.exec(txt)) !== null) mentes.push(m);
  if(mentes.length >= 3) mentes.forEach(x=>{
    marca('mente', x.index, x.index+x[0].length, x[0],
      'Hay '+mentes.length+' adverbios en -mente en este texto. En exceso alargan las frases sin aportar precisión.', 'suprimir o reemplazar');
  });

  /* por oración: longitud, subordinadas, referencia ambigua */
  const ors = oraciones(txt);
  const largas = [], anidadas = [], ambiguas = [];
  ors.forEach(o=>{
    const n = palabras(o.t);
    if(n > 30) largas.push({o, n});
    if(subordinadas(o.t) >= 3) anidadas.push(o);
    RE_AMBIGUO.lastIndex = 0;
    let a;
    while((a = RE_AMBIGUO.exec(o.t)) !== null){
      /* solo se advierte si la oración anterior tiene 2+ sustantivos candidatos */
      ambiguas.push({o, pos: o.ini + a.index, txt: a[0], len: a[0].length});
    }
  });
  largas.forEach(x=> marca('larga', x.o.ini, x.o.fin, x.o.t,
    'Oración de '+x.n+' palabras. Por encima de unas 30 el lector suele perder el hilo; conviene partirla en dos.', 'dividir'));
  anidadas.forEach(o=> marca('anidada', o.ini, o.fin, o.t,
    'Esta oración encadena varias subordinadas. El lector tiene que sostener demasiadas ideas en suspenso antes de llegar al final.', 'separar ideas'));
  ambiguas.forEach(x=> marca('ambiguo', x.pos, x.pos + x.len, x.txt,
    'Referencia por verificar: comprueba que quede claro a qué sustantivo remite. Si hay más de un candidato antes, repite el sustantivo.', 'nombrar el referente'));

  /* métricas */
  const nPal = palabras(txt);
  const nOr = ors.length || 1;
  const prom = nPal / nOr;
  const cuenta = t => limpios.filter(h=>h.tipo===t).length;

  /* si dos marcas del mismo tipo se solapan, se conserva la más larga */
  const ordenados = hallazgos.slice().sort((a,b)=> a.ini-b.ini || (b.fin-b.ini)-(a.fin-a.ini));
  const limpios = [];
  ordenados.forEach(h=>{
    const choca = limpios.some(x=> x.tipo===h.tipo && h.ini < x.fin && x.ini < h.fin);
    if(!choca) limpios.push(h);
  });

  return {
    hallazgos: limpios.sort((a,b)=>a.ini-b.ini),
    metricas: {
      palabras: nPal, oraciones: nOr,
      promedio: Math.round(prom*10)/10,
      largas: largas.length,
      relleno: cuenta('relleno'), nominal: cuenta('nominal'), pasiva: cuenta('pasiva'),
      ambiguo: cuenta('ambiguo'), anidadas: cuenta('anidada'), mente: cuenta('mente')
    }
  };
}

/* aplica solo los reemplazos seguros: elimina relleno puro */
/* Borrador sugerido: aplica SOLO los cambios que no alteran la gramática de la frase
   (borra relleno puro y sustituye locuciones por su equivalente léxico).
   Los cambios que exigen reescribir el verbo se dejan al estudiante. */
const SEGUROS = ['usar','hacer','cumplir','entregar','saber','empezar','decidimos / se decide'];
function limpiaTexto(txt){
  let t = txt;
  RELLENO.forEach(r=>{
    if(r.modo) return;                       // cambiaría el modo verbal
    if(r.s === '(borrar)') t = t.replace(r.re, '');
    else if(!r.s.startsWith('(')) t = t.replace(r.re, r.s);
  });
  NOMINAL.forEach(r=>{
    if(SEGUROS.includes(r.s) && r.s.indexOf('/')<0) t = t.replace(r.re, r.s);
  });
  /* limpieza de espacios y mayúscula inicial */
  t = t.replace(/\s{2,}/g,' ').replace(/\s+([,.;:])/g,'$1').replace(/^\s*,\s*/,'').trim();
  t = t.replace(/(^|[.!?…]\s+)([a-záéíóúñ])/g, (m,a,b)=> a + b.toUpperCase());
  return t;
}

/* nivel global de claridad, de 0 a 100 */
function puntajeClaridad(M){
  let p = 100;
  p -= M.relleno * 7;
  p -= M.nominal * 6;
  p -= M.pasiva * 4;
  p -= M.largas * 8;
  p -= M.anidadas * 6;
  p -= Math.max(0, (M.promedio - 22)) * 1.5;
  return Math.max(0, Math.min(100, Math.round(p)));
}

</script>

roducción parcial con fines educativos citando la fuente. Queda prohibida la reproducción comercial sin autorización expresa de las autoras.", "b": false}, {"type": "p", "text": "ISBN: [por asignar]", "b": true}, {"type": "p", "text": "Hecho el depósito de ley.", "b": false}, {"type": "p", "text": "Impreso en Colombia / Printed in Colombia.", "b": false}, {"type": "p", "text": "A los estudiantes de Programación Web de la Universidad de Córdoba,", "b": false}, {"type": "p", "text": "en Montería, Lorica, Sahagún, Berástegui y Montelíbano,", "b": false}, {"type": "p", "text": "que están aprendiendo que un buen código también necesita explicarse bien.", "b": false}, {"type": "p", "text": "A quienes ya saben escuchar antes de responder,", "b": false}, {"type": "p", "text": "y a quienes todavía están aprendiendo a hacerlo.", "b": false}]}, {"id": "agradecimientos", "titulo": "Agradecimientos", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Este material nació de las clases de Habilidades Comunicativas I dictadas en el primer semestre de Técnico Profesional en Programación Web, y le debe buena parte de su forma a una pregunta que se repite entre docentes de programación: por qué a estudiantes que resuelven problemas lógicos complejos les cuesta tanto explicarlos con claridad.", "b": false}, {"type": "p", "text": "La Facultad de Ingenierías de la Universidad de Córdoba puso el marco institucional que hizo posible este libro, un material que hoy circula por igual entre las sedes de Montería, Lorica, Sahagún, Berástegui y Montelíbano.", "b": false}, {"type": "p", "text": "Un agradecimiento aparte merece la literatura clásica y contemporánea sobre comunicación que sostiene cada capítulo: los trabajos de Cassany sobre escritura, de Tuckman sobre dinámica de equipos, de Fisher y Ury sobre negociación, y de tantos otros autores citados a lo largo del texto, sin cuyos hallazgos este libro se quedaría en consejos sueltos.", "b": false}]}, {"id": "prologo", "titulo": "Prólogo", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Hay una idea que este libro repite de distintas formas porque es, en el fondo, su tesis central: escribir código correcto es solo la mitad del trabajo de un desarrollador. La otra mitad es explicar ese código, defenderlo frente a un cliente, documentarlo para quien lo va a mantener dentro de dos años, y coordinarse con un equipo que no siempre piensa igual. Ninguna de esas tareas se resuelve con un mejor algoritmo.", "b": false}, {"type": "p", "text": "El recorrido de este libro sigue tres momentos de esa competencia comunicativa. La Unidad 1 se ocupa de la palabra escrita: cómo redactar con claridad, cómo estructurar un informe técnico, cómo revisar un texto antes de entregarlo. La Unidad 2 se ocupa de la palabra hablada: cómo hablar en público sin que los nervios ganen, cómo el cuerpo y la voz comunican tanto como las palabras, cómo diseñar una presentación que no aburra a la audiencia. La Unidad 3 cierra con la comunicación que ocurre entre personas: escuchar de verdad, decir lo que se piensa sin agredir a nadie, resolver un conflicto de equipo antes de que descarrile un proyecto.", "b": false}, {"type": "p", "text": "Cada capítulo parte de una situación que cualquier estudiante de programación reconoce, ya sea explicar un error en una reunión de equipo, redactar la documentación de una API o defender una propuesta técnica frente a un cliente que no sabe de tecnología. De ahí baja al concepto con el rigor que exige la educación superior, y cierra integrando todo en un ejemplo aplicado antes de proponer actividades para practicarlo.", "b": false}, {"type": "p", "text": "De las autoras.", "b": false}, {"type": "p", "text": "Universidad de Córdoba, Montería, 2026.", "b": false}]}, {"id": "introduccion", "titulo": "Introducción", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "h2", "text": "Contextualización"}, {"type": "p", "text": "El curso Habilidades Comunicativas I acompaña a los estudiantes de Técnico Profesional en Programación Web en un terreno que suele tratarse como secundario frente a las asignaturas técnicas, pese a que determina buena parte del éxito profesional: saber exponer una propuesta, un avance o un resultado de forma convincente y sin ambigüedad. Un desarrollador que domina un lenguaje de programación pero no logra documentar su trabajo, explicar una decisión técnica o coordinarse con su equipo, termina limitando el impacto de todo lo demás que sabe hacer.", "b": false}, {"type": "h2", "text": "Justificación"}, {"type": "p", "text": "La justificación de este curso parte de una idea simple: en proyectos de programación web, un error de comunicación puede costar tanto como un error de código. Documentar mal una API, redactar un informe confuso o no coordinarse con el resto del equipo genera retrabajo, malentendidos con el cliente y decisiones tomadas sobre información incompleta. Este material tributa al Resultado de Aprendizaje 3 del programa (RA3), centrado en que el estudiante participe con soltura en un equipo de desarrollo, y sostiene que esa participación depende, en buena parte, de qué tan bien se comunique.", "b": false}, {"type": "h2", "text": "Objetivo general"}, {"type": "p", "text": "Que el estudiante llegue a expresar sus ideas con claridad, tanto por escrito como de forma oral, y sepa interactuar con soltura en entornos profesionales y académicos ligados a la programación web, apoyado en un repertorio de recursos comunicativos que le permitan trabajar en equipo con soltura y producir documentos técnicos que cualquiera pueda entender.", "b": false}, {"type": "h2", "text": "Objetivos específicos"}, {"type": "p", "text": "Este recorrido persigue tres metas concretas, una por unidad. En la primera, que el estudiante redacte documentos técnicos con estructura clara y un lenguaje adecuado a quien los va a leer. En la segunda, que sepa exponer ideas, técnicas o no, frente a audiencias distintas sin perder claridad en el camino. Y en la tercera, que colabore con soltura dentro de equipos donde conviven perfiles muy distintos entre sí, algo habitual en cualquier proyecto real de desarrollo web.", "b": false}, {"type": "h2", "text": "Metodología"}, {"type": "p", "text": "Cada capítulo sigue el mismo recorrido: arranca con una situación concreta que el estudiante de programación ya reconoce, desarrolla el concepto con el rigor que exige la educación superior, y cierra integrando todo en un ejemplo aplicado a proyectos de software antes de proponer actividades que llevan la teoría a la práctica.", "b": false}]}, {"id": "cap1", "titulo": "Fundamentos de la comunicación efectiva en contextos técnicos", "kind": "cap", "num": 1, "unidad": "UNIDAD 1 · COMUNICACIÓN ESCRITA EN CONTEXTOS ACADÉMICOS Y LABORALES", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás explicar qué hace efectiva a una comunicación, distinguir los tipos de comunicación que un desarrollador usa a diario, y reconocer por qué esta competencia es tan decisiva como cualquier habilidad técnica."}, {"type": "h2", "text": "1.1  Qué es la comunicación efectiva"}, {"type": "p", "text": "Comunicar de forma efectiva no es simplemente transmitir información; es lograr que el receptor entienda el mensaje tal como el emisor lo pensó, sin ambigüedad y en el tiempo que la situación exige. Para alguien que programa, esa distinción importa más de lo que parece: puede tener toda la razón en su diagnóstico técnico y aun así perder una discusión si no logra explicarlo de forma que su equipo o su cliente lo comprendan (Guffey & Loewy, 2018).", "b": false}, {"type": "p", "text": "La comunicación efectiva descansa sobre tres componentes que se repiten en cualquier intercambio: claridad, que evita interpretaciones múltiples; precisión, que asegura que el contenido sea correcto y suficiente; y adecuación al contexto, que ajusta el mensaje según quién lo recibe. Un correo a un cliente sin conocimientos técnicos no debería sonar igual que un comentario en un pull request dirigido a otro desarrollador, aunque ambos hablen del mismo problema.", "b": false}, {"type": "img", "caption": "Figura 1.1 · Los tres componentes de la comunicación efectiva", "data": "data:image/webp;base64,UklGRkJUAABXRUJQVlA4IDZUAADwrgGdASroA+UCPmEwlUgkIyIhIhKZQIAMCWVu+FI1gdKAl/S4PcQmef+L/c/AO9Z5v/G/vN/kvfq457Z/eOTf9bvIfsfy9POv27/x/478w/nN/ev/D/p/8P8I/1L/5vcD/VL9d/Wt/UP3PfvD6gv6l/qf/V/xvd5/237n+6z/Ef739k/8P8gH9h/33/h7C/0EP3B9Nn9zfhM/qX+x/br/lfI3+v//69gD/9+oB/9/UA9V/qL/ef7l4m/2j/Aflj/dPUn8W+hfwX5R/3r9qfkbyH9qP0r6ofyv7nfkf7t+4fs//yP8t+3nmv8wf7j8w/8p8gX4r/LP7z/Zf3L/wf7weab3+O4/jH7Avsf9L/3H93/z/7Y/BL8L/t/7x6p/Zf/gf4b4Af53/Wv95/d/O7/XDyi/Yf2L+AL+bf3r/2/6z8yPpv/vP/X/sPy29vX6N/p//b/sfgM/mf9q/6v+L7aXpHCakyQVGbailUZtqKVRm2opVGbailUZtqKVRm2opVGbailUZtqKVRm2opVGbailUZtqKVRm2opVGbailUZtqKVRm2opVGbailUZtqKVRm2opVGbailUZtqKVRm2opVGbailUZs7B8yrFl1dfEZJJIO5WAnzuMwFtrNAkkHcqhz0p//G+n/2kpzvG2opVGbailUZtqKVRm2opVF7foMpGLxIKjNtRSqNIvPK/6rxtqKVRm2opVGbailUZtqKVRm0TXrCSHcdaVRm2oo/eBQedaCozbUUqjNtRSqM21FKozbUUqqYcA74ha7YCX5HqopXC0pwM/TYKnl6GAiLpU3xnUurKjHk780heyQHvcvtvIRlUl7mo0WgJ5kizDWu90baV3LI0I7BO6HdcdaVRm2opVGbailUZtqKVRm2qkwFUiJVRiJPXs5Grl3lKAIrHHApZjgV9Lb7c5XYlKIfOHOqtbNl8R6tinlW1A+m8CmYpzsCDq/mnT5MGPjFvB/UPSTVjZxhgZRiB4MN7r4/K2gMcCP2gmi3dPJsd33glko6bjoqjNtRSqM21FKozbUUqjNtRSqNAnSkD8SyJm8DzeHiQkCyBvCq6Vg42Tzopy856tPe78bNkGOAKHY2o5EL5/tebsH+bjCnreGtCa6gdwjqozbUUqjNtRSqM21FKozbUUqjvBmklMRT4tSMgrUqTAR26wNCvLBhdC/SGipVBuNNLxKWcB4KLkGsNE+DgfwZV+ACe9NljqkFISSBtS4AOd421FKozbUUqjNtRSqM21GSdFUBRNx156r10M0NEzP3EzoMxvGJJkgqM21FKozbUUqjNtRSqM21UmFBUZtqKVRm2ny6sKADneNtRSqM21FKozbUUqjNtPV8pkuCAc7xtqKVRmNhbircEkyQVGbailUZtqKVRm2opVGbZnazVRRxWmkyQVGbailN4unSc7oJHqkyQVGbailUZtqKVRm2opVGbZslnIzBfqsROSSO9CY4myClokeOPKbKdDt+oqycIQ4zAW2s0CHvGYaSOpIKjNtRSqM21FKozbUUqjNtRSqM21Eg3LzBgTKgAJSOAe+OSAi5s02CuTgTdNuZDMeYJLlaKKVRm2opVGbailUZtqKVRm2opVGbZpmVCNgO6ezRhL+Pg3XZf1SWQo ias distintas que conviene desarrollar por separado antes de integrarlas. Quien redacta bien no necesariamente presenta bien en público, y quien presenta bien no necesariamente sabe escuchar durante una discusión de equipo.", "b": false}, {"type": "h2", "text": "1.3  Por qué esta competencia es tan importante como el código"}, {"type": "p", "text": "Las empresas de tecnología no solo buscan a quien resuelve problemas técnicos, sino a quien puede explicar esa solución a un equipo multidisciplinario, documentarla para quien la mantenga después, y defenderla frente a quien la esté pagando. Un sistema perfectamente construido pierde buena parte de su valor si nadie más que su autor puede entenderlo o mantenerlo (Knight, 2020).", "b": false}, {"type": "p", "text": "Documentar un desarrollo, atender a un cliente, coordinarse con un equipo que mezcla distintas disciplinas, o dejar clara una solución técnica frente a alguien que no la va a entender igual que un colega: ninguna de esas tareas figura en el temario de una asignatura de programación, y sin embargo determinan si el trabajo técnico llega a cumplir su propósito o se queda encerrado en la cabeza de quien lo hizo.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Comunicación efectiva", "body": "Lograr que el receptor entienda el mensaje tal como el emisor lo pensó, con claridad, precisión y ajustado al contexto de quien lo recibe. No es transmitir información; es asegurarse de que esa información realmente llegó."}, {"type": "h2", "text": "1.4  Ejemplo completo"}, {"type": "p", "text": "Un desarrollador detecta que una funcionalidad falla por un problema de concurrencia en la base de datos. Al explicárselo a otro desarrollador, usa términos técnicos precisos: race condition, bloqueo optimista, transacción. Al explicárselo al cliente que reportó el error, cambia por completo el registro: describe qué pasó, en qué afecta su negocio y cuándo estará resuelto, sin mencionar una sola vez la causa técnica exacta. El diagnóstico es el mismo; la comunicación, deliberadamente distinta.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Describe una situación reciente en la que hayas tenido que explicar algo técnico a alguien sin conocimientos técnicos. Evalúa si tu explicación fue clara, precisa y adecuada al contexto.\n2. Identifica, en un día típico de estudio o trabajo, tres momentos en los que usaste comunicación escrita, oral e interpersonal respectivamente.\n3. Elige un mensaje de texto, correo o comentario de código que hayas escrito recientemente y reescríbelo pensando en una audiencia completamente distinta (por ejemplo, de un colega técnico a un cliente sin conocimientos de programación)."}]}, {"id": "cap2", "titulo": "Técnicas de redacción clara y concisa", "kind": "cap", "num": 2, "unidad": "UNIDAD 1 · COMUNICACIÓN ESCRITA EN CONTEXTOS ACADÉMICOS Y LABORALES", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás aplicar técnicas concretas para redactar con claridad y concisión, y reconocer los vicios de redacción más comunes en textos técnicos."}, {"type": "h2", "text": "2.1  Qué significa escribir con claridad"}, {"type": "p", "text": "Escribir con claridad no es escribir de forma simple ni infantil; es organizar las ideas de modo que el lector entienda el mensaje en una sola lectura, sin tener que volver atrás para descifrar qué se quiso decir. Cassany (1995) describe la escritura como una cocina: un proceso con ingredientes, técnica y tiempos, no un talento innato que algunas personas tienen y otras no. Redactar bien se aprende y se practica, igual que depurar código.", "b": false}, {"type": "p", "text": "Un texto claro suele compartir algunas características: frases de longitud moderada, una idea principal por párrafo, y un orden que refleja la lógica del contenido, no el orden en que las ideas se le ocurrieron a quien escribe. En documentación técnica, además, la claridad importa más que la elegancia: un lector que necesita configurar una API no está buscando prosa bonita, está buscando instrucciones que funcionen a la primera.", "b": false}, {"type": "img", "caption": "Figura 2.1 · El ciclo de redacción clara: planear, escribir, revisar", "data": "data:image/webp;base64,UklGRnZZAABXRUJQVlA4IGpZAABQ3wGdASroA8YDPmEwlkgkIyKhIZPI0IAMCWdu8p97cuAGZf1u8qZfKesiDw31f9x/b/Alj/4Z+x/yX40fARx34EfLcpHhV2L5p3Nv549tX+5/4vs+/Xf/e9wL9Mf1h/2Htmftj7sv3e9Qf9N/2n7Pe8T/zf1695n+W9QD+nf8f/r9hz/4fUk/cn1eP+j+4//X+Uv+n/7X/4/7X/u/I3+vH///d/4AP//7XH8A///Wv9VP7l/b/2Y8zP6t/dv7v+2f7w+vf4r82/aP7h/jP9L/g/+t/uPkG/yfCx1//zPQ3+Q/Z78r/fP8x/wv8f81f5P/X/4b9w/Nv5Wf2f5sf2j9mfsC/Hf5Z/gP71+1/+N/cL7Bnu3TSgH84/oH+b/u/7xf4z4B/iP89/afUj7Ef9P3AP6N/W/+B/ffPM8G/8f/tvYD/m39r/7n+h/Nv6bv67/0/63/ZfuN7ev0P/T/+r/X/Ab/NP7N/0P8L+WHhG9IsNknSYcSAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAkBICQEgJASAjFu78bwT5eU1suMVC8prZcYqF5TWthhCYIrxRCMdY6x1jrHWOsdY6x1jrHWOsdWTcTMx9entIZhD2H5arsdFmCTpWS26DkgYbGi0yMtoQjHWOsdY6x1jrHWOsdY6srnDHtGW0IRjrHfpa4/2h+Nsw4kBICQEgJASAkBICQEgJASAj8+jgLfPVFu9EzedQtpWZT0k8Lr/I1Nhr1NBBR7EZtsQeRZgNyEvJ/gDlc6fyY8UpUReNPOoQjHWOsdY6x1jrHWOsdY6x1jrF2qq1ipFuOvJ/w/JSxkBeiPVAh2pfYHglDs7v1IQuMCyf4bMY5BqQAclVaQeNUQLpMOJASAkBICQEgJASAkBICPz6Ng525Qv0AFDq6E0yeaYXqSaijjBx3EVdAmxOY0yeuUlR+2w2O5VMWpPsUCFFDy99mcYnQynHPwOd9VEgP0DC2OVFpBSLtzCouBn/Gf+lFB7vMlKADIy2hCMdY6x1jrHWOsdY6x1jrHOvdhNc+xjYL7S5DxMMbW2r7OOWbo65XZWMHAyGzJ/357FsJJh/0SqoecGIjLaEIx1jrHWOsdY6x1jrHWOsdWQO7CC0v7IrkWolsR7La6Pp6EY6x1jrHWOsdY6x1jrHWOsdY6sNdWKQjDEpjLTIy2hCMc1hSyHdAdCOAkBICQEgJASAkBICQEgJASAkBGN+NoeWa9FGcb2MMGj2e+blaDonkphnf3K42T4+TwL/Sd5PODyzZcYqFxJEWj37F2a2cxY8tO+WJASAkBICQEgJASAkBICQEgJARi2xY9dri+4mQoC07ABmpz/Sv+8lhP2HBD5/CExvZi+FZo/QuYHWOsdY6x1jrHWOsdY6x1jrHWObtpGWmj2lz7IpnGkxYtpDGX/vzeEwdVLJYkCbF5JRnHGQmn4 0oYIM+V1itScgMazGRGJLIVtY+JtbWoqG1C+2g6zg/ULcATAvcLWfWqGtOjiAw94v3Qej7jsu+vWEKw+GijhgVCV0QSqiqKZ8RqtBRX1KhOc0f3LS8Q5Gf8lBoMW50GJAr3rciXB5TmPqLTmQ+CGrlBMJ5Bz2HNelmyRvNyRkIjE34wn/oseyks0mrdtvNuKa1WeingEt8bI6kZQuLGDZD9UQMt5r+J7i0n1u2zT95B+inDhhwZE0WmDxPow7rhvSaH0CuAAXlNvZPMzwFqpUpONnjzTzFgBUdC9ZIywAAAM7ZkxBqBtq3ROLFCXWs97Q9QXFxoV16SFmfE3DWPsACkgsREy6u+MqdFbuTSajxrSOTICQM9AG06hqw9+ykdUlPrHF0EPOu2w71eeFQVc0/3CuOPjO9Dtlcv+RBLAn9dxl9esiqujNsPxpLPEkcQ+7Q7FOZ9GANe4FyzFHTzEuBG2EgLfJtOPTpQoltWJ+OJjXIDotuIvxZS5axZYJGuJQDVaAgd5nMrBfo9tpj38HZyWir3ebss6CTe7pAk7vWTKa/a9iarO27vwAAMASYiHcsG5+dJ5NGEtK1USMFCR7OeBWbUNFo7OErpa+ieyyBSZ7WiI6HvFYWx7jHYPkSv4co0uJ/ABj5PRi8mR6jtaCtXGbPizs7MdaMF+sffNa7wShWCfOjY8GPoDbUJjqEx1VjdNE8i9Ay7svBcNiGhTVh4NW4YdxsXQnGxa+6L2yYyB38guUICDh6GRQw6XoOv/unIiurSpWn8MEdNAI2WvonDo+4Rv3z8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}, {"type": "h2", "text": "2.2  Técnicas concretas para redactar con concisión"}, {"type": "p", "text": "La concisión no significa escribir poco, significa no escribir de más. Eliminar palabras que no aportan información (\"cabe destacar que\", \"es importante mencionar\") suele acortar un texto sin perder nada de sustancia. Preferir el verbo sobre el sustantivo abstracto (\"decidimos\" en lugar de \"se tomó la decisión de\") también ayuda, porque activa la frase y reduce palabras innecesarias.", "b": false}, {"type": "p", "text": "Otra técnica útil consiste en revisar cada oración preguntándose qué pasaría si se eliminara: si el sentido del párrafo no cambia, probablemente sobraba. Guffey y Loewy (2018) recomiendan además evitar la voz pasiva en documentos técnicos salvo que el agente de la acción sea irrelevante, porque la voz activa suele ser más directa y más fácil de seguir: \"el servidor rechaza la petición\" comunica más rápido que \"la petición es rechazada por el servidor\".", "b": false}, {"type": "h2", "text": "2.3  Vicios de redacción comunes en textos técnicos"}, {"type": "p", "text": "Algunos errores de redacción aparecen con tanta frecuencia en documentación técnica que merecen atención aparte. La ambigüedad referencial ocurre cuando un pronombre puede referirse a más de un sustantivo anterior (\"el servidor envía datos al cliente y este los procesa\": ¿quién procesa, el servidor o el cliente?). El exceso de subordinadas anidadas obliga al lector a sostener demasiadas ideas en suspenso antes de llegar al verbo principal. Y la jerga innecesaria, usar un término técnico rebuscado cuando uno simple comunica lo mismo, aleja al lector sin sumar precisión real.", "b": false}, {"type": "p", "text": "Revisar un texto pensando específicamente en estos tres vicios, en lugar de releerlo de forma general, suele detectar más errores que una lectura corrida, porque dirige la atención a patrones concretos en lugar de una impresión difusa de si el texto \"suena bien\".", "b": false}, {"type": "concepto", "title": "CONCEPTO · Concisión", "body": "No escribir poco, sino no escribir de más. Un texto conciso dice exactamente lo necesario, sin palabras de relleno ni rodeos, pero sin sacrificar la información que el lector realmente necesita."}, {"type": "h2", "text": "2.4  Ejemplo completo"}, {"type": "p", "text": "Una primera versión de un párrafo de documentación dice: \"Es importante mencionar que, en el caso de que el usuario no haya iniciado sesión, el sistema procederá a realizar una redirección hacia la página de inicio de sesión correspondiente.\" Aplicando las técnicas de este capítulo, el párrafo se reduce a: \"Si el usuario no inició sesión, el sistema lo redirige a la página de inicio de sesión.\" Misma información, la mitad de palabras, cero pérdida de precisión.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Toma un párrafo de documentación técnica que hayas escrito (o encuentres en línea) y reescríbelo aplicando al menos tres técnicas de concisión de este capítulo.\n2. Identifica en un texto propio reciente al menos un ejemplo de ambigüedad referencial y corrígelo.\n3. Escribe dos versiones de la misma instrucción técnica: una en voz pasiva y otra en voz activa. Compara cuál comunica con mayor rapidez."}]}, {"id": "cap3", "titulo": "Estructura de informes y documentos técnicos", "kind": "cap", "num": 3, "unidad": "UNIDAD 1 · COMUNICACIÓN ESCRITA EN CONTEXTOS ACADÉMICOS Y LABORALES", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás organizar un informe o documento técnico con una estructura clara, y adaptar esa estructura según el tipo de documento y su audiencia."}, {"type": "h2", "text": "3.1  Por qué la estructura importa tanto como el contenido"}, {"type": "p", "text": "Un documento técnico bien escrito pero mal estructurado obliga al lector a buscar la información en lugar de encontrarla. La estructura cumple una función distinta a la redacción de cada frase: organiza el contenido en bloques predecibles para que el lector sepa, incluso antes de leer, dónde va a encontrar cada tipo de información. Esa previsibilidad ahorra tiempo, algo especialmente valioso en documentación que se consulta bajo presión, como durante un incidente en producción.", "b": false}, {"type": "p", "text": "Guffey y Loewy (2018) insisten en que la estructura de un documento profesional debe reflejar cómo lo va a usar el lector, no cómo lo pensó quien escribe. Un informe que alguien lee de principio a fin exige una estructura distinta a una guía de referencia que se consulta por secciones sueltas.", "b": false}, {"type": "img", "caption": "Figura 3.1 · Estructura estándar de un informe técnico", "data": "data:image/webp;base64,UklGRlxXAABXRUJQVlA4IFBXAAAQ5AGdASroAzUDPmEulUekIiShIbHJ2JAMCWVu+F8wwtAp/yTJeKsDxv5td3q5P/Nf3z+3f87/Be+jyH2bef/tn9r+A/Jr6z5q/5n+D/K35w/63/Z/5b3P/or/i/n/9AH6sfr11yv7V/yPUH+wv/p/yfu0f6H9jfcf/d/9j+1vwAf0L++f//2wPU+/dT2FP289Nj9yfhh/rf/V/c32mv/HrTvjL+zf0n9kPMt+qf3D++/sp/evS38Z+hfu39z/a3+5/tj8emYP1P+Z/2Xob/Jft5+G/uX+U/5n999rf7p9pPpb8Ov5f83f8b8gv5B/Lv8P/Zf77/1/7x6luyZ1n/ conclusiones resumen los hallazgos o resultados sin introducir información nueva. Y los anexos reúnen material de apoyo (código, capturas, datos) que respalda el cuerpo del documento sin interrumpir su lectura.", "b": false}, {"type": "p", "text": "Esta misma lógica se adapta a documentos más específicos: un informe de bug incluye pasos para reproducir el error, comportamiento esperado y comportamiento observado; una propuesta técnica incluye el problema, las alternativas consideradas y la recomendación justificada.", "b": false}, {"type": "h2", "text": "3.3  Adaptar la estructura según el tipo de documento"}, {"type": "p", "text": "Documentar una API pide una estructura distinta a la de un informe narrativo: suele organizarse por endpoints, cada uno con su método, parámetros, respuesta esperada y ejemplos de uso, en un formato que privilegia la consulta rápida sobre la lectura lineal. Un manual de usuario, en cambio, suele seguir el flujo de tareas que la persona realmente va a hacer, no la arquitectura interna del sistema.", "b": false}, {"type": "p", "text": "Antes de estructurar cualquier documento técnico conviene preguntarse quién lo va a leer y cómo lo va a usar: ¿de principio a fin, una sola vez, para entender el sistema completo? ¿o por fragmentos, repetidas veces, para resolver dudas puntuales? La respuesta determina si conviene una estructura narrativa o una estructura de referencia.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Resumen ejecutivo", "body": "La sección inicial de un informe que condensa el problema, la solución y el resultado en unas pocas líneas, pensada para el lector que solo tiene tiempo de leer eso. No es una introducción; ya contiene las conclusiones."}, {"type": "h2", "text": "3.4  Ejemplo completo"}, {"type": "p", "text": "Un equipo entrega un informe de auditoría de seguridad a un cliente. En lugar de empezar por el detalle técnico de cada vulnerabilidad, abre con un resumen ejecutivo de tres líneas: cuántas vulnerabilidades críticas se encontraron, cuál es el riesgo principal para el negocio, y qué se recomienda hacer primero. El cliente, que no va a leer las cuarenta páginas de detalle técnico, entiende lo esencial en treinta segundos; el equipo técnico que sí necesita el detalle lo encuentra después, organizado por severidad.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Elige un documento técnico que hayas escrito o leído recientemente y evalúa si su estructura corresponde al uso real que se le da.\n2. Escribe el resumen ejecutivo de un proyecto de programación en el que estés trabajando, en no más de cuatro líneas.\n3. Diseña el esquema de estructura (solo los títulos de sección, sin desarrollar el contenido) para la documentación de una API pequeña de tu elección."}]}, {"id": "cap4", "titulo": "Revisión y corrección de textos", "kind": "cap", "num": 4, "unidad": "UNIDAD 1 · COMUNICACIÓN ESCRITA EN CONTEXTOS ACADÉMICOS Y LABORALES", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás aplicar un proceso sistemático de revisión de textos, distinguiendo entre revisar el contenido, la estructura y la forma."}, {"type": "h2", "text": "4.1  Por qué revisar es una etapa distinta de escribir"}, {"type": "p", "text": "Escribir y revisar son actividades cognitivas distintas, y mezclarlas suele producir textos peores que hacerlas por separado. Mientras se escribe una primera versión, conviene concentrarse en sacar las ideas al papel sin detenerse a pulir cada frase; revisar antes de tener el contenido completo suele ralentizar el proceso sin mejorar el resultado. Cassany (1999) describe la revisión como una relectura crítica que exige distancia: es más fácil detectar los propios errores después de un descanso que inmediatamente después de escribir.", "b": false}, {"type": "p", "text": "Tratar la revisión como una etapa aparte, con su propio tiempo dedicado, es lo que distingue a un texto pulido de uno que simplemente se entregó tal como salió en el primer intento.", "b": false}, {"type": "img", "caption": "Figura 4.1 · El proceso de revisión en tres pasadas", "data": "data:image/webp;base64,UklGRhJKAABXRUJQVlA4IAZKAAAwagGdASroA3ACPmEwlUgkIyIhIhH48IAMCWdu/E5/3L9xShQ7zi4/w8tG+rm/+b/j/xw9/m3/6Tycdz3ZfmYcp/+H17/6b/qf4D3ffeR7gH9V/qvnb+rXzCfuD+2fu/f7f9lfdx/ZP+D7AH8v/y//i9dj2RvQg/cD02P3t+Ff+sf7f91PaX//f/V9wD/7eoB1S/Tf+dfk571fjX67/ef8H+039/9JfxH5n+7f2j9vP8T/8P8j8U2R/0j+m/6vof/Hvth+S/uv7o/3v5sfuf+P/tH9j/2H45ezPw6/vvUF/I/5v/j/7N+5H97/c3jeNv/1f/D/yHsC+yvzv/P/2z/P/+7/Nej5/U/4T1E/Sf6//q/u4+wD+c/1L/g/4DzjvCZ/Hf7v9kPgB/mv93/8P96/zfwy/1H/1/2Hno/Qv8j/7/9T8Bv8y/t3/Y/xHbG9JwQfw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj0ssBIAe5/MIY+rTyuIa0B88ojpuzHjJ+BkhkjRUaCMIzO1IReV6qQ8MXu8ZN5Ha8J+zAZIXrg/LuCsOSELTmZL5NIn/tGCAsXh/R/vaFWYtNhBuZfkQcEiwb2y9fNfi3mCqxo0FvAtQVLaRsEf9WsWRbYbfjNBeLino6RApE0YQ1nhZP6flW3nrngfNvDdYx7yHS5t4brGPeQ4yriOUnwnHp3l/UMbuGWKn2VNfX5Spy02/acxW86oWXsnr061X+dG+9AWrgg03m3kjXuNxcFEeAtAuwKgdOUvHXOafy131nTJ8ScJMg/I/GheEcGOCR/4Cc4Fv2+DGrHAbh9iqNhpH7y4XFbWj8oXNhc7NdHXS8DChPyMXFQmYU6MO7GPeQ6XNvDdYx7yHS5t4brGPfi96BAy7w3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6xj3kOlzbw3WMe8h0ubeG6v7B2hZ81Zrp695Dpc28NsRCYUbk7pSppO8h0ubd7nQpUV3voxj3kOlzbw3WMe6guqGRz80pFsb09jrGPeQ6XNgR5gR415sm3+oj+L7sY95Dpc28ma7Q0HUnqRFGJaYId2Me8h0ubeG2so8dPi9lBWz17CYtGMe8h0ubeTYlovzQINfoW/LTxBNJ3kOlzbcv6Y+edTwCXoBdQdsxd4h3Yx7yHS5t4X84M4gaK3qWD8MsUEalYh0ubeG6c7Av6xIF5An3jGIVkgmk7yHS5ui6eGFuTgrI226IW72hIh3Yx7yHS5t3u8/eIcbeJkJgTLvMvFc28N1jHxL1Fw8f2UdhFD+Ku588bkO7GPeQ4j7UaHmXRov4fDZufT0zA+beG6xj3kIzHS68B4Oo3WCeYzn+8h0ubeGDhT4BPKOQaOiAAN5u08Q6XNvDdca5LtSokV+vU3vpbY3g7sY95DpBj2mjWshCw58mkXi3+VitgaK8afzC+BSnOkXOdySD3t3EAnVUtJ/w5NtpeEekoGVmq7tBLwBZ1f/d62uQdtRCim9l+7GIgo8q9TchXfRm54lOqpYk5QsqMxwjL5bmot9CjP/qJODQL0CFtJ3PBRhYeEC7Kn secciones tiene sentido?, ¿cada párrafo desarrolla una sola idea? La tercera pasada revisa la forma: ortografía, puntuación, consistencia terminológica y errores de redacción como los vistos en el Capítulo 2.", "b": false}, {"type": "p", "text": "Hacer las tres pasadas en ese orden evita el error común de pulir la redacción de un párrafo que, en la siguiente revisión de contenido, termina eliminado por completo.", "b": false}, {"type": "h2", "text": "4.3  Estrategias prácticas para revisar mejor"}, {"type": "p", "text": "Leer el texto en voz alta obliga a procesarlo más despacio y suele revelar frases torpes que pasan inadvertidas en una lectura silenciosa. Cambiar el formato visual, por ejemplo pasar de pantalla a papel o cambiar la fuente, engaña ligeramente al cerebro y ayuda a ver el texto con ojos más frescos. Y pedir a otra persona que lo lea, cuando es posible, detecta ambigüedades que quien escribió el texto ya no puede ver, porque conoce demasiado bien lo que quiso decir.", "b": false}, {"type": "p", "text": "En equipos de desarrollo, la revisión de documentación suele beneficiarse de las mismas prácticas que ya existen para revisar código: un segundo par de ojos, antes de publicar, casi siempre encuentra algo que el autor original no vio.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Revisión en pasadas", "body": "Separar la corrección de un texto en etapas con un foco distinto cada una (contenido, estructura, forma) en lugar de intentar corregirlo todo a la vez. Reduce la posibilidad de pulir una frase que después se elimina por completo."}, {"type": "h2", "text": "4.4  Ejemplo completo"}, {"type": "p", "text": "Antes de entregar un README de un proyecto, un estudiante hace tres pasadas: en la primera revisa si las instrucciones de instalación realmente funcionan (contenido); en la segunda revisa si el orden de las secciones ayuda a alguien nuevo a entender el proyecto (estructura); en la tercera corrige errores ortográficos y uniformiza cómo se escriben los nombres técnicos a lo largo del documento (forma). El resultado final es notablemente más claro que si hubiera intentado corregir todo junto en una sola lectura.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Aplica las tres pasadas de revisión descritas en este capítulo a un texto propio (documentación, informe o ensayo) y anota qué tipo de error encontraste en cada pasada.\n2. Lee en voz alta un párrafo técnico que hayas escrito y registra si notas alguna frase que suena distinto de como la habías imaginado al escribirla.\n3. Intercambia un texto breve con un compañero y da retroalimentación específica sobre contenido, estructura y forma, por separado."}]}, {"id": "cap5", "titulo": "Técnicas de oratoria y expresión oral", "kind": "cap", "num": 5, "unidad": "UNIDAD 2 · COMUNICACIÓN ORAL Y PRESENTACIONES", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás aplicar técnicas básicas de oratoria, y reconocer y manejar el nerviosismo que suele acompañar el hablar en público."}, {"type": "h2", "text": "5.1  Qué distingue a una buena expresión oral"}, {"type": "p", "text": "Hablar en público no es leer en voz alta un texto que se escribiría igual si fuera para lectura silenciosa. La expresión oral efectiva tiene su propia lógica: frases más cortas que las que se usarían por escrito, repetición deliberada de las ideas clave porque el oyente no puede volver atrás como sí puede hacerlo un lector, y pausas que dan tiempo a procesar cada idea antes de introducir la siguiente (Knight, 2020).", "b": false}, {"type": "p", "text": "Tres elementos sostienen una buena expresión oral: la claridad del contenido, que exige tener las ideas ordenadas antes de abrir la boca; el control de la voz, que incluye volumen, ritmo y entonación; y la conexión con la audiencia, que se logra mirando a las personas, no a las diapositivas, y ajustando el registro según quién está escuchando.", "b": false}, {"type": "img", "caption": "Figura 5.1 · Los tres pilares de la expresión oral efectiva", "data": "data:image/webp;base64,UklGRpxbAABXRUJQVlA4IJBbAAAwvAGdASroA+UCPmEwlUgkIyIhIjHpMIAMCWVu6eV0rwsPL3pqr5UWxj+u/4veScc9V/c/yM98Lj3sa9+/evOJ2z9q+Y55v+5fMB83/8/6l/1P/5/cA/VP9k/XW/aT3Pfu36gf24/cH3df+H+3Puw/w/+79gT+x/73/69hD6D/7ff//2ev/D+7P/x+VT+sf73/5/7X/gfIt+wP/x9gD/ye2d/AP/D1q/UP/A+oLw6/H/4T9uf8J6e/ivzr92/tP+T/z396/9H+w54nXv/B9Df5Z9v/y392/cL/F+8P+a/wn7Xea/zN/rPzN/s/yEfjv8t/wP93/dP/A+eL23W0/kb7AXrj9L/23+D/zv7LfBp8R/yv8f6ofYL/j/4T8qfsA/n39W/3nlReDf+W/7PsB/zX++/+7/L+7f/jf+3/a/lV7gP0D/Pf+//U/AX/Mv7d/2P8l2z/SVE0FRbLymzqkko3NsvKbOqSSjc2y8ps6pJKNzbLymzqkko3NsvKbOqSSjc2y8ps6pJKNzbLymzqkko3NsvKbOqSSjc2y8ps6pJKNzbLymzqkko3NsvKbOqSSjc2y8ps6pJKNzai6c71+og4E5lkZgz1cjTXyvSp/LIzBm7AANtkfiobEWy8ps6pJKNzbLymzqkko3NsuT2si2qqLZeU2dUknLQnBkjHxGm2XlNnVJJRubZeU2dUklG5tl5Q9Tdz2XlNnVJJRuMIDFpsRbLymzqkko3NsvKbOqSSjc2ySVs0NekX5VvDaoWXOJZ0Cp8Ep1OSKTTRhFlaYpf9C20Z6JlD9ij/LRk/A+T/QVFsvKbOqSSjc2y8ps6pJKNdWfrO08mYwGJNg/0LH64EL0qZB8IxbirZP4vXTC2Qe24Sy58XCIn8Ttv3gFg1M/BCLC/wjdpULzmcqM7Vaa7+ozqDSCUxX2RU6uHbGfLe5/oKi2XlNnVJJRubZeU2dUklG45uZl1j2DA/0SIq2Re0CBaZa+fCw9BdoEt6wlED2qItR5Lf9BJH22bWjnTZv1pSToQX76l83pP23MNPmLsq2aZHsfE8sj1+BUYYdzqkko3NsvKbOqSSjc2y8ps6ohamqatdvE2jgDtucgBixj4L6THLOIB9bGBQXrU54HGRlkvMFpnwRUaWbcTcUlgSovTDcm2b8Ztqd4R/HmncfRI6nGSRn1L+It8QGAKv55iXMyRFW0EaNIbBxt4CRGWSdVW9NiLZeU2dUklG5tl5TZ1SSUbm2XMeJEcoEvhWgIEPJgCbSEGy8ps6pJKNzbLymzqkko3NsvKZ8rZpJKNzbLymyJ7g/oKi2XlNnVJJRubZeU2dUklG5pCMXtvYi2XlNnVJJIGLb2qu3+gqLZeU2dUklG5tl5TZ1SSURZIb3Uoucs3NsvKbOqSOOq6VJePZeU2dUklG5tl5TZ1SSUbm2XlNnE/aHHE3IRK9KlsFJ9kHop1jFJX2vYXbKHoJG5UJ/LIzBm+vkPG3AKbOqSSjc2y8ps6pJKNzbLymzqkko1js6FsM+NERDrxspi1iGylosI7kXQk+1MSQHAfT1SSUbm2XlNnVJJRubZeU2dUklG5tl4y6WmHwAZ6XA38w9jCvM3w8B8r7TvLM73eHc6pJKNzbLymzqkko3NsvKbOqSSjc2y8ZdHNe9GX+peHP1JoErRvyHDX82tCmVMPnyk/SlpS/eNs6pJKNzbLymzqkko3NsvKbOqSSjc1AYvwg9aVEK6oRkLpHyY58pxIM8c7B2AGjZW7BJJRubZeU2dUklG5tl5TZ1SSUbm2XlM6A2UB6Sv2GRn0NDSLGT6/sCd7fslfEcGB3eNs6pJKNzbLymzqkko3NsvKbOqS icas ayudan a manejarlo: ensayar en voz alta y no solo mentalmente, porque el cuerpo necesita practicar la acción física de hablar, no solo el contenido; llegar temprano al lugar de la presentación para familiarizarse con el espacio; y reencuadrar la ansiedad como energía disponible para transmitir entusiasmo, en lugar de intentar eliminarla por completo, algo que rara vez funciona.", "b": false}, {"type": "h2", "text": "5.3  Estructura básica de una intervención oral"}, {"type": "p", "text": "Toda intervención oral, sea una presentación formal o una explicación breve en una reunión, se beneficia de una estructura simple de tres partes. La apertura capta la atención y anuncia de qué se va a hablar, sin extenderse demasiado antes de entrar en materia. El desarrollo presenta el contenido principal, organizado en pocos puntos memorables en lugar de una lista extensa que nadie retiene. Y el cierre resume la idea central y deja claro qué se espera del oyente a continuación, ya sea una decisión, una acción o simplemente haber entendido algo nuevo.", "b": false}, {"type": "p", "text": "Esta estructura funciona igual de bien para una presentación de diez minutos que para una explicación de treinta segundos en una reunión diaria de equipo: lo que cambia es la extensión de cada parte, no su presencia.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Glosofobia", "body": "El miedo o ansiedad ante hablar en público, una de las formas de ansiedad social más comunes. No es una señal de incapacidad; es una respuesta fisiológica esperable que se puede manejar con práctica y preparación, no eliminar por completo."}, {"type": "h2", "text": "5.4  Ejemplo completo"}, {"type": "p", "text": "Antes de presentar el avance de un proyecto ante el equipo, un estudiante nota que le tiemblan las manos. En lugar de intentar suprimir esa sensación, la reencuadra como energía y la canaliza en el tono de voz, hablando con más énfasis en las partes clave. Había ensayado la presentación en voz alta dos veces el día anterior, así que el contenido fluye aunque los nervios sigan presentes; nota, además, que después del primer minuto la ansiedad baja considerablemente, algo que también había anticipado por experiencias previas.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Practica en voz alta, cronómetro en mano, una explicación de un minuto sobre un proyecto de programación en el que hayas trabajado. Ajusta el contenido hasta que quepa en el tiempo sin acelerar el habla.\n2. Identifica dos situaciones en las que sueles sentir nerviosismo al hablar en público y describe una estrategia concreta de este capítulo que podrías aplicar en cada una.\n3. Estructura en tres partes (apertura, desarrollo, cierre) una explicación breve de un concepto técnico que domines bien."}]}, {"id": "cap6", "titulo": "Comunicación no verbal: lenguaje corporal y tono de voz", "kind": "cap", "num": 6, "unidad": "UNIDAD 2 · COMUNICACIÓN ORAL Y PRESENTACIONES", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás reconocer los componentes principales de la comunicación no verbal y ajustar tu lenguaje corporal y tono de voz para reforzar, en lugar de contradecir, tu mensaje."}, {"type": "h2", "text": "6.1  Qué es la comunicación no verbal"}, {"type": "p", "text": "La comunicación no verbal incluye todo lo que se transmite sin usar palabras: postura, gestos, contacto visual, expresión facial y las cualidades de la voz que no dependen de qué se dice sino de cómo se dice (volumen, ritmo, entonación). Mehrabian (1971) estudió específicamente cómo las personas interpretan mensajes sobre sentimientos y actitudes cuando el contenido verbal y el no verbal se contradicen, y encontró que en esos casos concretos el componente no verbal pesa más que las palabras. Ese hallazgo, limitado a mensajes sobre actitudes y sentimientos, se popularizó después de forma exagerada como una regla general aplicable a toda comunicación, algo que el propio Mehrabian nunca sostuvo.", "b": false}, {"type": "p", "text": "Lo que sí es razonable extraer de esa investigación, y de trabajos posteriores en el campo, es que cuando el lenguaje corporal contradice lo que se dice, la audiencia tiende a confiar más en la señal no verbal. Un presentador que dice estar seguro de su propuesta mientras evita el contacto visual y cruza los brazos transmite, pese a sus palabras, inseguridad.", "b": false}, {"type": "img", "caption": "Figura 6.1 · Componentes de la comunicación no verbal", "data": "data:image/webp;base64,UklGRnhfAABXRUJQVlA4IGxfAADwtQGdASroA9ICPmEwlUgkIqchIjKJQOAMCWVu/ExUDSn7DeXL/4H4mRxr+f/63+E76GM/M/7D+3/j978Fqfzv9883Pdv2X5jnmX6p/4/8r7d/8T/3P717mf13/4fcD/Uz9ovXL/2n+A9yf7tfkB8Av2m/8n+993T/bfsF7tf7f/xvYB/q/+c/+HrxexV+5H//9wX9v///7QH/Q/cz/yfKb/WP91+3v/Q+SP9iP/5/s/+v8AH/29rX+Af/Lrf+qv9t/qH7M+/DxD/Mf4X9vf7x6g/ivzz99/Kz98P9n8jH+Z4HPR/7T/u/5z1P/kf3F/Of4r9zv8R+8P3s/pv9V4I/NP/M+2T5Bfx3+cf4v+5/tl/i/3R9b7teJvv8p7AvuF9S/0391/eP/MfDX8T/1/77/fvYj7T/9H3AP6D/U/+X/ffOf8G/81/0P19+AP+e/3z/5/5/3df73/5f7n8pvbp+i/6f/1/6T97f9X9hn86/s3/R/xX5V+Fn0kBPUQDoFJRAOgUlEA6BSUQDoFJRAOgUlEA6BSUQDoFJRAOgUlEA6BSUQDoFJRAOgUlEA6BSUQDoFJRAOgUlEA6BSUQDoFJRAOgUlEA6BSUQDoFJRAOgUlEA6BSUQDoFJRAOgUlCUIlUIOWxV7tVYoElhDmYCfO41AWKrhbSKVTG2opVMbailUxtqKVTG2opVL3xKIL9q6vtyVoSLoteIk9OYjtr5PgEiq4m2opVMbailUxtqKVTG2opVMbaiT6Y8wt/i4AOgUlEA3h/jWwAdApKIB0CkogHQKSiAdApKIBzrALwyhFKpjbUUql9D5MYM4uADoFJRAOgUlEA6BSUQDoFIPWDva9494uek+k3P7r4Z/PbtVjH5dzVcfxjtChamCkAnktlyOpYT2kHYrjn167LxCXr+Qw+QvS1BTZjrSqY21FKpjbUUqmNtRSqY21FIVqov1uzLnee1Z74V0S/hcb6v6VzBCQFB2/uqxJ+hKP5pcIpUs7+ItR2ucHbUjXnuMbXbz6WABZY1xIWoXMsYr5Y+jPolnWryzUNKj0J0CyLDeOwNQ9HOASuyqc/tpTYOl9xSUQDoFJRAOgUlEA6BSUQDoFJQqAjuieDpzsnhzj6rq/VTHs6iJg+qMFR31ZMR0ByipbLT426TspM8Z+51mMdCU+idtSrnpz8trwOU6PtNldsgVnwSiAdApKIB0CkogHQKSiAdApB6wr9Qst3LzRWVRUQDBUsmsgc9s7wrXVea/yl/YnQ4c50sOlMY1COcFFo/1N9QUBdvF+lk2Hq96JB6wsCgA6BSUQDoFJRAOgUlEA6BSUPpTsAUljiiAe4BjMgVnwSiAdApKIB0CkogHQKSiAdApB6wsCgA6BSUQDfIduuOtKpjb e está diciendo, no memorizar una postura ideal como si fuera un guion.", "b": false}, {"type": "h2", "text": "6.3  El tono de voz como herramienta comunicativa"}, {"type": "p", "text": "La voz comunica independientemente del contenido de las palabras: un volumen demasiado bajo obliga a la audiencia a esforzarse por escuchar y termina por perder su atención; un ritmo demasiado rápido no da tiempo a procesar la información. Variar el ritmo y el volumen de forma deliberada, bajando la voz en un momento clave o haciendo una pausa antes de una idea importante, mantiene el interés mejor que un tono uniforme del principio al fin.", "b": false}, {"type": "p", "text": "Grabarse a uno mismo practicando una presentación, aunque resulte incómodo al principio, es una de las formas más efectivas de detectar muletillas, ritmo acelerado o un tono monótono que de otro modo pasarían inadvertidos.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Congruencia entre lo verbal y lo no verbal", "body": "Cuando lo que se dice con palabras coincide con lo que transmite el cuerpo y la voz. Ante una contradicción entre ambos, la audiencia tiende a confiar más en la señal no verbal, según los hallazgos de Mehrabian sobre mensajes de actitud."}, {"type": "h2", "text": "6.4  Ejemplo completo"}, {"type": "p", "text": "Dos estudiantes presentan el mismo proyecto con el mismo contenido escrito. El primero lee sus diapositivas sin levantar la vista, con voz uniforme y sin variar el volumen. El segundo mira alternadamente a distintas personas de la audiencia, baja el volumen antes de mencionar el hallazgo más importante y usa las manos para señalar la parte relevante de un diagrama en pantalla. El contenido técnico es idéntico; la audiencia recuerda con más claridad la presentación del segundo, porque el lenguaje no verbal reforzó, en lugar de competir con, el mensaje.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Grábate explicando un tema técnico durante dos minutos y revisa la grabación prestando atención solo al lenguaje corporal y al tono de voz, sin evaluar el contenido.\n2. Observa una presentación (en clase, en video o en una charla técnica) e identifica un momento en el que el lenguaje corporal reforzó el mensaje y otro en el que lo contradijo.\n3. Practica variar deliberadamente el volumen y el ritmo de tu voz al leer un párrafo técnico en voz alta, marcando dónde harías una pausa para dar énfasis."}]}, {"id": "cap7", "titulo": "Presentaciones efectivas en público", "kind": "cap", "num": 7, "unidad": "UNIDAD 2 · COMUNICACIÓN ORAL Y PRESENTACIONES", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás planificar y estructurar una presentación efectiva, adaptada a la audiencia y al tiempo disponible."}, {"type": "h2", "text": "7.1  Conocer a la audiencia antes de preparar el contenido"}, {"type": "p", "text": "El error más común al preparar una presentación es empezar por el contenido antes de pensar en quién lo va a recibir. Duarte (2010) plantea que toda presentación efectiva parte de entender qué sabe ya la audiencia, qué necesita saber, y qué se espera que haga con esa información. Presentar el mismo avance técnico a un equipo de desarrollo o a un cliente sin conocimientos de programación exige decisiones distintas sobre qué incluir, qué omitir y con qué nivel de detalle explicar cada parte.", "b": false}, {"type": "p", "text": "Antes de abrir cualquier herramienta de diapositivas conviene responder tres preguntas: quién va a escuchar, qué necesita saber esa audiencia específica, y qué acción o decisión se espera de ella al terminar. Esas respuestas determinan la estructura de todo lo que sigue.", "b": false}, {"type": "img", "caption": "Figura 7.1 · Etapas de preparación de una presentación efectiva", "data": "data:image/webp;base64,UklGRlZaAABXRUJQVlA4IEpaAADQ3AGdASroA8YDPmEwlkgkIyKhIbMowIAMCWdu4XaeTvBv5XJ8V6Zmtu+sP4n9y74uQ/Vn7n/Cf4r9f/eu457wvnP3Tzd9u3XX 6C235vCYLiAn4+HPRZMXmpEDENNer5saMfTqZgnS1Ime67JhmIMjDfw40Da/7sSQo4jgr+VRlvREXQIT9KmyDr97vAK4cvQ+nZavFnyL9ETHbCDORQto3kBi3AT/6pQpAMoZvjqFij2IfFwedy4zArRIJj3bXyZmspDOiTiqAu0nokdgs5WhrXG4jaI+7y4J4CrNCy76FeLxVMP4ob73UAvAAY6dKifT6T+8az8zKEOzRxaK7wTOfRRGN/q9DEWpWpn2T/QEUMLgAA07MTk7idIpVYTuR55FXTrcsI8ubLYXHUwHGEWw975fAo83YaXyvyBkp8fHGiek4dkXX+Dzz8ZWvAzUt0X5FRDhWVpSfDVxJ30gC1UHAXTt9FWHszt3kC1dhIS9KFikYn7LHPQZGweavviJq/pDHA8WFIgj7M07Rm2u+4VzQGvvRjc1b7/xegj7z0s6ZEpOcMNIAAE8CHqZR7QLxmB8TfIK90WF7+Q+2/qHTGa8MC06/fYAqiDkGAUK8M8GDA8nzDEgMcj7ekWHy+hGmzclSY7iukPLNxfJIIXytuRoPf+xCfv4gM/r+v6/r+v6/sKdTsGmmuQ+XZrGJUo5grQflpmnpablnmU2XcKpvNvAJ0pwnxzIsC09fFYJxDOWXyOjCA5Yon7yATFM5ogyDYiRZmNFwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=="}, {"type": "h2", "text": "7.2  Estructurar el contenido para retener la atención"}, {"type": "p", "text": "La atención de una audiencia no se mantiene constante durante toda una presentación; tiende a decaer si el contenido no ofrece variación o puntos de anclaje. Organizar la presentación en pocos mensajes centrales, en lugar de intentar cubrir todo lo que se sabe sobre el tema, ayuda a que la audiencia retenga lo esencial. Reynolds (2011) recomienda limitar cada presentación a una idea principal por sección, reforzada con ejemplos concretos, en lugar de acumular datos sin jerarquía.", "b": false}, {"type": "p", "text": "Abrir con una pregunta, un dato sorprendente o un problema real capta la atención mejor que una introducción genérica sobre la agenda del día. Y cerrar con una síntesis clara de la idea central, en lugar de simplemente agradecer y abrir turno de preguntas, ayuda a que ese mensaje sea lo último que la audiencia recuerde.", "b": false}, {"type": "h2", "text": "7.3  Ensayo y gestión del tiempo"}, {"type": "p", "text": "Una presentación que se prepara pero no se ensaya en voz alta suele quedarse corta o larga respecto al tiempo disponible, porque leer mentalmente un contenido siempre toma menos tiempo que decirlo en voz alta con pausas y énfasis naturales. Ensayar con cronómetro, al menos una vez completa y otra por secciones, revela qué partes hay que recortar y cuáles necesitan más desarrollo.", "b": false}, {"type": "p", "text": "Gestionar el tiempo durante la presentación misma, no solo en el ensayo, también importa: tener puntos de control mentales (\"a la mitad del tiempo debería estar terminando esta sección\") permite ajustar el ritmo sobre la marcha en lugar de descubrir al final que faltó tiempo para el cierre, que suele ser la parte más importante.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Análisis de audiencia", "body": "El ejercicio previo de identificar quién va a escuchar una presentación, qué sabe ya sobre el tema, y qué se espera que haga con la información recibida. Determina qué incluir, qué omitir y con qué nivel de detalle explicar cada parte."}, {"type": "h2", "text": "7.4  Ejemplo completo"}, {"type": "p", "text": "Un equipo debe presentar el mismo proyecto de software dos veces en la misma semana: una vez ante el cliente que lo encargó, y otra ante un comité técnico de la universidad. Antes de preparar las diapositivas, responden las tres preguntas de análisis de audiencia para cada caso. Para el cliente, priorizan el impacto en su negocio, con lenguaje sin jerga y ejemplos visuales del producto funcionando. Para el comité técnico, priorizan las decisiones de arquitectura y las alternativas descartadas, con el vocabulario técnico que esa audiencia sí domina. El contenido de fondo es el mismo proyecto; la presentación, deliberadamente distinta.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Antes de tu próxima presentación (de este curso o de cualquier otro), responde por escrito las tres preguntas de análisis de audiencia descritas en este capítulo.\n2. Toma una presentación que hayas preparado anteriormente y evalúa si tenía una idea central clara por sección o si intentaba cubrir demasiado contenido sin jerarquía.\n3. Ensaya en voz alta una presentación de tres minutos, cronómetro en mano, y ajusta el contenido según lo que descubras sobre el tiempo real que toma decirlo."}]}, {"id": "cap8", "titulo": "Uso de medios audiovisuales en presentaciones", "kind": "cap", "num": 8, "unidad": "UNIDAD 2 · COMUNICACIÓN ORAL Y PRESENTACIONES", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás diseñar apoyos visuales que refuercen una presentación en lugar de distraer de ella, y usar herramientas audiovisuales de forma efectiva."}, {"type": "h2", "text": "8.1  El rol de los apoyos visuales"}, {"type": "p", "text": "Una diapositiva no debería ser un resumen escrito de lo que el presentador va a decir; debería ser un apoyo visual que refuerce el mensaje hablado con algo que las palabras solas no comunican tan bien: una gráfica, un diagrama, una captura de pantalla. Cuando el público tiene que elegir entre leer un texto denso en pantalla o escuchar al presentador, generalmente elige leer, y el presentador pierde su atención (Duarte, 2010).", "b": false}, {"type": "p", "text": "La regla práctica más citada en diseño de presentaciones es simple: si el contenido de una diapositiva se puede decir en voz alta sin que el público necesite leerlo, probablemente sobra en pantalla. Las diapositivas apoyan lo que se dice; no lo reemplazan ni lo repiten palabra por palabra.", "b": false}, {"type": "img", "caption": "Figura 8.1 · Criterios para usar recursos visuales de apoyo", "data": "data:image/webp;base64,UklGRo5FAABXRUJQVlA4IIJFAAAQuAGdASroA+EDPmEwlUgkIqIhIRNo4IAMCWdu+DTUwJMxKerSOf4r/L72eU/gH6Tm/fM/W33wf3nhVG87QP7X+N/vXv9/13/X9n/6u/3fuC/rz54fqy/c71B/0z/Q/tJ7uH/H/a/3T/3T/V+wP/WP9l6bPss/ul7Ff7eemv+43wwf1z/oftz7Sv/4/7/uAf//24+mX6ef23+0/sZ5lv0r+5f3/9r/Ov8T+Yfr/9i/aL/Cf+v/U/F3/ceGzzb+k/5n+K9R/5B9mPxv+A/wX/D/wH7y/Hv+s/tX7aeavyC/w/UF/GP5X/ff7N/fP9p/d/3X44Pbv9r/rfUC9j/nP+j/uH+b/8n+X9L7/T/uvqL9hf9h7gH8y/qv+z/vHuD/ffDY8o9gT+c/3n/4f5X3ZP6T/5f6j80Pbp+d/53/1/5z4DP5Z/Z/+h
