ando i lo supera, la flecha del No lleva directo a mostrar el resultado. La segunda decisión\"¿i % 2 == 0?\" filtra: si i es par, se suma; si es impar, se salta esa suma y se va directo al incremento. En ambos casos, i sube en 1 y el control regresa al primer rombo."}, {"type": "p", "text": "La flecha que vuelve hacia arriba desde el incremento es lo que hace que esto sea un ciclo y no una secuencia. Sin esa flecha, cada instrucción se ejecutaría una sola vez."}, {"type": "h", "level": 2, "text": "9.3 La tabla de traza"}, {"type": "p", "text": "Trazar este algoritmo a mano consiste en seguir cada flecha del diagrama o cada línea del código equivalente y anotar qué valor tiene cada variable después de cada instrucción. El resultado es una tabla que muestra, fila por fila, la historia completa de la ejecución."}, {"type": "p", "text": "El código Python que corresponde al diagrama anterior:"}, {"type": "code", "code": "n    = int(input(\"N: \"))\nacum = 0\ni    = 1\nwhile i <= n:\n    if i % 2 == 0:\n        acum = acum + i\n    i = i + 1\nprint(acum)", "lang": "py", "prompts": ["N: "]}, {"type": "p", "text": "Traza completa con N = 6. La suma esperada es 2 + 4 + 6 = 12:"}, {"type": "grid", "rows": [["Instrucción ejecutada", "n", "acum", "i", "¿Condición?"], ["n = int(input())", "6", "—", "—", "—"], ["acum = 0", "6", "0", "—", "—"], ["i = 1", "6", "0", "1", "—"], ["while: ¿1 ≤ 6?", "6", "0", "1", "True → entrar"], ["if: ¿1%2==0?", "6", "0", "1", "False → saltar suma"], ["i = 1+1", "6", "0", "2", "—"], ["while: ¿2 ≤ 6?", "6", "0", "2", "True → entrar"], ["if: ¿2%2==0?", "6", "0", "2", "True → sumar"], ["acum = 0+2", "6", "2", "2", "—"], ["i = 2+1", "6", "2", "3", "—"], ["while: ¿3 ≤ 6?", "6", "2", "3", "True → entrar"], ["if: ¿3%2==0?", "6", "2", "3", "False → saltar suma"], ["i = 3+1", "6", "2", "4", "—"], ["while: ¿4 ≤ 6?", "6", "2", "4", "True → entrar"], ["if: ¿4%2==0?", "6", "2", "4", "True → sumar"], ["acum = 2+4", "6", "6", "4", "—"], ["i = 4+1", "6", "6", "5", "—"], ["while: ¿5 ≤ 6?", "6", "6", "5", "True → entrar"], ["if: ¿5%2==0?", "6", "6", "5", "False → saltar suma"], ["i = 5+1", "6", "6", "6", "—"], ["while: ¿6 ≤ 6?", "6", "6", "6", "True → entrar"], ["if: ¿6%2==0?", "6", "6", "6", "True → sumar"], ["acum = 6+6", "6", "12", "6", "—"], ["i = 6+1", "6", "12", "7", "—"], ["while: ¿7 ≤ 6?", "6", "12", "7", "False → salir"], ["print(12)", "—", "—", "—", "Salida: 12 ✓"]]}, {"type": "p", "text": "Fila por fila se puede verificar que el algoritmo hace exactamente lo que el diagrama prometía: i recorre 1, 2, 3, 4, 5, 6; solo suma cuando i es par; para cuando i supera a N. El resultado 12 es correcto."}, {"type": "h", "level": 2, "text": "9.4 Tres tipos de casos que hay que probar"}, {"type": "grid", "rows": [["Tipo de caso", "Descripción", "Ejemplo (suma de N números)"], ["Normal", "Datos típicos dentro del rango esperado.", "n=5, valores entre 1 y 100"], ["Borde", "Valores en los límites del rango válido.", "n=1 (un solo número), n=0"], ["Error", "Datos inválidos que el programa debería rechazar.", "n=-3, texto en vez de número"]]}, {"type": "h", "level": 2, "text": "9.4 Detectar y corregir errores con la traza"}, {"type": "p", "text": "Si la traza revela que el resultado no es el esperado, el error está en alguna instrucción del algoritmo. Los más frecuentes son estos cuatro: acumuladores inicializados con valor incorrecto, condiciones del if o del while escritas al revés, contadores que se actualizan en el lugar equivocado del ciclo, y ciclos que terminan una iteración antes o después de lo que deberían."}, {"type": "callout", "kind": "error", "title": "Error frecuente", "body": "El error off-by-one el ciclo hace una iteración de más o de menos es uno de los más frecuentes en programación. La tabla de traza lo detecta de inmediato porque se ve exactamente en qué fila el comportamiento difiere del esperado."}, {"type": "h", "level": 2, "text": "9.5 Ejercicios"}, {"type": "ej", "items": ["Realiza la prueba de escritorio del factorial de n=5. Construye la tabla de traza completa.", "El siguiente algoritmo tiene un error lógico. Encuéntralo con la traza usando n=3 y notas 4, 2, 5:  suma = 0 / para i=1 hasta n: / suma = nota / leer nota / promedio = suma/n", "Prueba el algoritmo del mayor de tres números (cap. 4) con tres casos: normal (5,3,8), borde (7,7,7) y negativo (-1,0,-5).", "Usando el diagrama de la Figura 9.1 como guía, realiza la prueba de escritorio con N = 8. ¿Cuántas veces entra al bloque de suma? ¿Cuántas veces lo salta?", "Toma cualquier ejercicio del capítulo 7 que hayas resuelto y realiza la prueba de escritorio con tus propios datos de prueba antes de ejecutarlo."]}]}, {"id": "cap10", "titulo": "Modularidad y funciones", "kind": "cap", "num": 10, "unidad": "UNIDAD 3 · Representación y Validación de Algoritmos", "blocks": [{"type": "p", "text": "Un programa de 5 líneas es fácil de leer y mantener. Uno de 200 líneas sin ninguna organización es una tarea de arqueología. La modularidad divide una solución compleja en partes más pequeñas, cada una con una responsabilidad clara."}, {"type": "h", "level": 2, "text": "10.1 Qué es la modularidad"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Modularidad", "body": "Principio de diseño que divide un programa en funciones independientes, cada una con una tarea específica. Las funciones pueden reutilizarse en distintos puntos del programa sin repetir el código."}, {"type": "p", "text": "Las ventajas son concretas: el código es más fácil de leer porque los nombres de las funciones describen lo que hacen; es más fácil de mantener porque si hay que cambiar un cálculo, solo se modifica la función correspondiente; y evita la duplicación, que es la causa de muchos errores difíciles de encontrar."}, {"type": "h", "level": 2, "text": "10.2 Funciones en Python"}, {"type": "code", "code": "def nombre_funcion(param1, param2):\n    # instrucciones\n    return resultado    # opcional\n# Llamar a la función:\nvalor = nombre_funcion(arg1, arg2)", "lang": "sintaxis", "prompts": []}, {"type": "code", "code": "# Función que calcula el área de un triángulo\ndef area_triangulo(base, altura):\n    return (base * altura) / 2\n \n# Usarla en distintos puntos sin repetir el cálculo\nprint(area_triangulo(8, 5))   # 20.0\nprint(area_triangulo(3, 7))   # 10.5", "lang": "py", "prompts": []}, {"type": "h", "level": 2, "text": "10.3 Patrones de uso frecuente"}, {"type": "h", "level": 3, "text": "Acumulador y contador"}, {"type": "code", "code": "def estadisticas_grupo(n):\n    suma  = 0\n    aprob = 0\n    for i in range(1, n + 1):\n        nota = float(input(f\"Nota {i}: \"))\n        suma += nota\n        if nota >= 3.0:\n            aprob += 1\n    return suma / n, aprob\n \nn = int(input(\"Estudiantes: \"))\nprom, aprobados = estadisticas_grupo(n)\nprint(f\"Promedio: {prom:.2f} | Aprobados: {aprobados}\")", "lang": "py", "prompts": ["Estudiantes: "]}, {"type": "h", "level": 3, "text": "Máximo y mínimo"}, {"type": "code", "code": "def extremos(lista):\n    if not lista:\n        return None, None\n    mx = mn = lista[0]\n    for x in lista[1:]:\n        if x > mx: mx = x\n        if x < mn: mn = x\n    return mx, mn", "lang": "py", "prompts": []}, {"type": "h", "level": 3, "text": "Menú modular"}, {"type": "code", "code": "def mostrar_menu():\n    print(\"\\n=== SISTEMA DE NOTAS ===\")\n    print(\"1. Registrar nota\")\n    print(\"2. Ver promedio\")\n    print(\"3. Salir\")\n    return input(\"Opción: \").strip()\n \ndef pedir_nota():\n    while True:\n        n = float(input(\"Nota (0-5): \"))\n        if 0 <= n <= 5:\n            return n\n        print(\"Fuera de rango.\")\n \nnotas = []\nwhile True:\n    op = mostrar_menu()\n    if op == \"1\":\n        notas.append(pedir_nota())\n    elif op == \"2\":\n        if notas:\n            print(f\"Promedio: {sum(notas)/len(notas):.2f}\")\n        else:\n            print(\"Sin notas registradas.\")\n    elif op == \"3\":\n        break", "lang": "py", "prompts": ["Opción: ", "Nota (0-5): "]}, {"type": "h", "level": 2, "text": "10.4 Ejercicios"}, {"type": "ej", "items": ["Modulariza el programa de ventas del capítulo 7 usando al menos tres funciones: una para leer datos, una para calcular estadísticas y una para mostrar resultados.", "Escribe una función que reciba un número y devuelva True si es primo, False si no. Úsala para listar todos los primos entre 1 y 200.", "Crea un módulo de conversión de notas: una función que convierta nota numérica a concepto, otra que valide el rango. Úsalas en un programa de registro.", "Diseña un programa modular para una tienda: funciones para calcular descuento, calcular IVA, calcular total y generar factura.", "Refactoriza el juego de adivinanza del capítulo 6 separando la lógica en funciones: una que genere el número secreto, una que procese el intento, una que muestre el resultado."]}]}, {"id": "anexo0", "titulo": "Anexo A — Tabla de operadores en Python", "kind": "anexo", "num": null, "unidad": null, "blocks": [{"type": "grid", "rows": [["Operador", "Descripción", "Ejemplo"], ["+ - * / // % **", "Aritméticos", "2 ** 8 → 256 | 15 % 4 → 3"], ["== != > < >= <=", "Comparación", "5 == 5 → True | 3 != 3 → False"], ["and or not", "Lógicos", "True and False → False"], ["= += -= *= /=", "Asignación simple y compuesta", "x += 5 equivale a x = x + 5"], ["in not in", "Pertenencia", "3 in [1,2,3] → True"]]}]}, {"id": "anexo1", "titulo": "Anexo B — Plantilla para prueba de escritorio", "kind": "anexo", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Fotocopia esta plantilla y úsala para trazar algoritmos a mano antes de ejecutarlos:"}, {"type": "grid", "rows": [["Instrucción", "Variable 1", "Variable 2", "Variable 3", "Condición"], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "], [" ", " ", " ", " ", " "]]}]}, {"id": "anexo2", "titulo": "Anexo C — Glosario", "kind": "anexo", "num": null, "unidad": null, "blocks": [{"type": "grid", "rows": [["Término", "Definición"], ["Acumulador", "Variable que suma o multiplica valores a lo largo de un ciclo."], ["Algoritmo", "Secuencia ordenada, finita y precisa de instrucciones para resolver un problema."], ["Asignación", "Operación que guarda un valor en una variable (operador = en Python)."], ["Centinela", "Valor especial que señala el fin de un conjunto de datos ingresados por el usuario."], ["Ciclo", "Estructura que repite un bloque de instrucciones. También llamado bucle o iteración."], ["Contador", "Variable que cuenta cuántas veces ocurre una condición."], ["Diagrama de flujo", "Representación gráfica de un algoritmo usando símbolos estándar conectados por flechas."], ["Función", "Bloque de código con nombre propio que realiza una tarea y puede reutilizarse."], ["Indentación", "Sangría que indica el nivel jerárquico en Python. Define los bloques de código."], ["IPO", "Modelo de análisis: Entrada, Proceso, Salida."], ["Módulo", "Función con una responsabilidad bien definida dentro de un programa más grande."], ["Prueba de escritorio", "Verificación manual de un algoritmo anotando valores de variables paso a paso."], ["Pseudocódigo", "Descripción de un algoritmo usando lenguaje natural y estructuras de programación."], ["Variable", "Espacio en memoria con nombre que guarda un valor que puede cambiar."]]}]}, {"id": "bibliograf-a", "titulo": "Bibliografía", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Association for Computing Machinery, IEEE Computer Society, & Association for the Advancement of Artificial Intelligence. (2024). Computer science curricula 2023. Association for Computing Machinery. https://doi.org/10.1145/3664191"}, {"type": "p", "text": "Bhargava, A. Y. (2024). Grokking algorithms (2nd ed.). Manning Publications."}, {"type": "p", "text": "Cormen, T. H., Lei /* ══════════ utilidades ══════════ */
const $ = (s,c)=> (c||document).querySelector(s);
const esc = t => t.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

/* ── coloreado de Python ── */
const RE_PY = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(False|None|True|and|as|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|not|or|pass|raise|return|try|while|with)\b|\b(print|input|int|float|str|len|range|abs|round|sum|max|min|list|dict|set|bool|type|sorted|enumerate|append)\b|\b(\d+\.?\d*)\b/g;
function pinta(src){
  let out='', last=0, m;
  RE_PY.lastIndex=0;
  while((m=RE_PY.exec(src))!==null){
    out += esc(src.slice(last,m.index));
    const t = m[0];
    const cls = m[1]?'tc':m[2]?'ts':m[3]?'tk':m[4]?'tb':'tn';
    out += '<span class="'+cls+'">'+esc(t)+'</span>';
    last = m.index + t.length;
  }
  return out + esc(src.slice(last));
}
/* pseudocódigo: resalta las palabras clave del estándar del libro */
const RE_PS = /\b(INICIO|FIN|LEER|ESCRIBIR|SI|ENTONCES|SINO|FIN_SI|PARA|HASTA|HACER|FIN_PARA|MIENTRAS|FIN_MIENTRAS|REPETIR|SEGUN)\b|(\u2190)|(\d+\.?\d*)/g;
function pintaPseudo(src){
  let out='', last=0, m;
  RE_PS.lastIndex=0;
  while((m=RE_PS.exec(src))!==null){
    out += esc(src.slice(last,m.index));
    out += '<span class="'+(m[3]?'tn':'tk')+'">'+esc(m[0])+'</span>';
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

/* ══════════ motor Python ══════════ */
const CDNS = ["https://cdn.jsdelivr.net/pyodide/v0.28.3/full/",
              "https://cdnjs.cloudflare.com/ajax/libs/pyodide/0.28.3/"];
let PY = null, cargando = null;
function script(url){
  return new Promise((ok,fail)=>{ const s=document.createElement('script'); s.src=url;
    s.onload=ok; s.onerror=()=>fail(new Error(url)); document.head.appendChild(s); });
}
function motor(aviso){
  if(PY) return Promise.resolve(PY);
  if(cargando) return cargando;
  cargando = (async ()=>{
    let ultimo;
    for(const base of CDNS){
      try{
        aviso && aviso("Preparando Python en tu navegador… (solo la primera vez)");
        await script(base+"pyodide.js");
        PY = await loadPyodide({indexURL: base});
        PY.runPython($('#motor').textContent);
        return PY;
      }catch(e){ ultimo = e; }
    }
    cargando = null;
    throw new Error("No se pudo cargar Python. Revisa tu conexión a internet: la primera ejecución necesita descargar el motor (unos 10 MB). Después de eso queda en caché.");
  })();
  return cargando;
}
async function correr(src, entradas, trazar, aviso){
  const py = await motor(aviso);
  const f = py.globals.get("ejecutar");
  const r = f(src, entradas || "", !!trazar);
  f.destroy();
  return JSON.parse(r);
}

/* ══════════ celda de código ══════════ */
function celdaCodigo(src, lang, prompts, titulo){
  const c = el('div','celda');
  const editable = lang === 'py';
  const etiqueta = lang==='pseudo' ? 'Pseudocódigo' : lang==='sintaxis' ? 'Forma general' : 'Python';

  const top = el('div','celda-top');
  top.appendChild(el('span','etiqueta', titulo || etiqueta));
  top.appendChild(el('span','sp'));
  c.appendChild(top);

  const ed = el('div','ed');
  const marca = el('div','marca-linea');
  const pre = el('pre'); const code = el('code');
  pre.appendChild(code); ed.appendChild(marca); ed.appendChild(pre);
  c.appendChild(ed);

  let ta = null;
  const repinta = txt => { code.innerHTML = (lang==='pseudo'?pintaPseudo:pinta)(txt) + '\n'; };
  repinta(src);

  if(editable){
    ta = el('textarea'); ta.spellcheck=false;
    const claveCod = 'cod'+semillaTxt(src);   /* el código editado sobrevive al recargar */
    ta.value = get(claveCod, src);
    repinta(ta.value);
    ta.setAttribute('aria-label','Editor de código Python');
    ed.appendChild(ta);
    const ajusta = ()=>{ ta.style.height='auto'; ta.style.height = pre.scrollHeight+'px'; ed.style.height = pre.scrollHeight+'px'; };
    ta.addEventListener('input', ()=>{ repinta(ta.value); ajusta(); set(claveCod, ta.value); });
    ta.addEventListener('keydown', e=>{
      if(e.key==='Tab'){ e.preventDefault();
        const s=ta.selectionStart, t=ta.selectionEnd;
        ta.value = ta.value.slice(0,s) + '    ' + ta.value.slice(t);
        ta.selectionStart = ta.selectionEnd = s+4;
        repinta(ta.value); ajusta(); set(claveCod, ta.value);
      }
    });
    requestAnimationFrame(ajusta);
    window.addEventListener('resize', ajusta);
  }
  const codigo = ()=> ta ? ta.value : src;

  if(!editable){
    if(lang==='sintaxis'){
      const n = el('div','pnl'); n.innerHTML = '<div class="pnl-t">Referencia <span class="hint">forma general: reemplaza las palabras genéricas por tus propios nombres</span></div>';
      c.appendChild(n);
    }
    return c;
  }

  /* datos de entrada */
  const pEnt = el('div','pnl oculto');
  const hint = prompts.length ? 'el programa pedirá: ' + prompts.map(p=>'«'+p.trim()+'»').join(', ') : 'un dato por línea';
  pEnt.innerHTML = '<div class="pnl-t">Datos de entrada <span class="hint">'+esc(hint)+'</span></div>';
  const taEnt = el('textarea','entradas');
  taEnt.placeholder = prompts.length ? prompts.map((p,i)=>'valor '+(i+1)).join('\n') : 'un valor por línea';
  taEnt.rows = Math.min(4, Math.max(2, prompts.length));
  pEnt.appendChild(taEnt);
  c.appendChild(pEnt);

  /* salida */
  const pSal = el('div','pnl oculto');
  pSal.innerHTML = '<div class="pnl-t">Salida</div>';
  const salida = el('pre','salida'); pSal.appendChild(salida);
  c.appendChild(pSal);

  /* traza */
  const pTra = el('div','pnl oculto');
  pTra.innerHTML = '<div class="pnl-t">Traza de ejecución <span class="hint">cada fila es una instrucción ya ejecutada; en verde, el valor que acaba de cambiar</span></div>';
  const traza = el('div','traza-wrap'); pTra.appendChild(traza);
  c.appendChild(pTra);

  const bEnt = el('button','bt','⌨ Datos'+(prompts.length?' · '+prompts.length:''));
  const bRun = el('button','bt pri','▶ Ejecutar');
  const bTra = el('button','bt','⊞ Trazar');
  const bRes = el('button','bt','↺');
  bRes.title = 'Restaurar el código del libro';
  top.appendChild(bEnt); top.appendChild(bTra); top.appendChild(bRun); top.appendChild(bRes);

  bEnt.onclick = ()=> pEnt.classList.toggle('oculto');
  bRes.onclick = ()=>{ ta.value = src; repinta(src); ta.dispatchEvent(new Event('input')); marca.style.display='none'; };

  function pintaLinea(n){
    if(!n){ marca.style.display='none'; return; }
    const alto = parseFloat(getComputedStyle(pre).lineHeight);
    marca.style.display='block';
    marca.style.height = alto+'px';
    marca.style.top = (14 + (n-1)*alto) + 'px';
  }

  async function lanza(trazar){
    pSal.classList.remove('oculto');
    salida.innerHTML = '<span class="corriendo">Ejecutando…</span>';
    pTra.classList.toggle('oculto', !trazar);
    bRun.disabled = bTra.disabled = true;
    try{
      const r = await correr(codigo(), taEnt.value, trazar, m=>{ salida.innerHTML='<span class="corriendo">'+m+'</span>'; });
      salida.innerHTML = esc(r.salida || '') + (r.error ? '<span class="err">'+esc(r.error)+'</span>' : '');
      if(r.error && r.error.indexOf('no hay más entradas')>=0){ pEnt.classList.remove('oculto'); taEnt.focus(); }
      if(!r.salida && !r.error) salida.innerHTML = '<span class="corriendo">Sin salida: el programa no imprimió nada.</span>';
      pintaLinea(r.error ? r.linea : 0);
      if(trazar) dibujaTraza(r);
    }catch(e){
      salida.innerHTML = '<span class="err">'+esc(e.message)+'</span>';
    }
    bRun.disabled = bTra.disabled = false;
  }
  bRun.onclick = ()=>lanza(false);
  bTra.onclick = ()=>lanza(true);

  function dibujaTraza(r){
    traza.innerHTML='';
    if(!r.pasos.length){ traza.innerHTML='<div class="corriendo">Sin pasos que mostrar.</div>'; return; }
    const cols=[];
    r.pasos.forEach(p=>Object.keys(p.vars).forEach(k=>{ if(!cols.includes(k)) cols.push(k); }));
    const t = el('table','traza');
    t.innerHTML = '<thead><tr><th>#</th><th>Instrucción ejecutada</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead>';
    const tb = el('tbody');
    let prev = {};
    r.pasos.forEach((p,i)=>{
      const tr = el('tr');
      tr.innerHTML = '<td class="paso">'+(i+1)+'</td><td class="cod">'+esc(p.cod)+'</td>' +
        cols.map(c=>{
          const v = p.vars[c];
          if(v===undefined) return '<td>—</td>';
          return '<td class="'+(prev[c]!==v?'cambio':'')+'">'+esc(v)+'</td>';
        }).join('');
      tr.onclick = ()=>{ pintaLinea(p.n); [...tb.children].forEach(x=>x.classList.remove('sel')); tr.classList.add('sel'); };
      tb.appendChild(tr);
      prev = Object.assign({}, prev, p.vars);
    });
    t.appendChild(tb);
    traza.appendChild(t);
    if(r.trunc) traza.appendChild(el('div','corriendo','Traza recortada en 500 pasos.'));
  }
  return c;
}

    'border:1px solid var(--linea);border-radius:6px;font-size:13px"></label>';
  const vars = el('div','vars');
  const txt = el('div','paso-txt','Elige un valor de N y pulsa «Ejecutar paso a paso»: verás iluminarse el símbolo que se está ejecutando, el estado de las variables y la fila que le corresponde en la tabla de traza.');
  const ctrl = el('div','sim-ctrl');
  const bIni = el('button','bt-c pri','Ejecutar paso a paso');
  const bAnt = el('button','bt-c','◀ Anterior');
  const bSig = el('button','bt-c','Siguiente ▶');
  const bTodo= el('button','bt-c','Hasta el final ⏭');
  const num = el('span','sim-num','');
  ctrl.append(bIni,bAnt,bSig,bTodo,num);
  der.append(vars, txt, ctrl);
  const tablaW = el('div','tabla-wrap'); der.appendChild(tablaW);

  let pasos=[], k=-1;
  const marcaNodo = id=>{ izq.querySelectorAll('.nodo').forEach(g=>g.classList.remove('act'));
    if(id) izq.querySelector('#'+id)?.classList.add('act'); };

  function pinta(){
    if(k<0 || !pasos.length){ marcaNodo(null); vars.innerHTML=''; txt.textContent=''; num.textContent=''; return; }
    const p = pasos[k], ant = k>0?pasos[k-1].vars:{};
    marcaNodo(SIM_NODOS[p.n]);
    vars.innerHTML = Object.keys(p.vars).map(kk=>
      '<span class="var'+(ant[kk]!==p.vars[kk]?' cambia':'')+'"><b>'+kk+'</b> = '+esc(p.vars[kk])+'</span>').join('');
    txt.textContent = SIM_TXT[p.n] || p.cod;
    num.textContent = 'paso '+(k+1)+' de '+pasos.length;
    const t = el('table','datos');
    const cols = ['n','acum','i'];
    t.innerHTML = '<thead><tr><th>#</th><th>Instrucción</th>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead>';
    const tb = el('tbody');
    pasos.slice(0,k+1).forEach((q,i)=>{
      const tr=el('tr');
      tr.innerHTML = '<td>'+(i+1)+'</td><td style="font-family:var(--mono);font-size:12.5px">'+esc(q.cod)+'</td>'+
        cols.map(c=>'<td>'+(q.vars[c]!==undefined?esc(q.vars[c]):'—')+'</td>').join('');
      if(i===k) tr.style.background='var(--verde-claro)';
      tb.appendChild(tr);
    });
    t.appendChild(tb); tablaW.innerHTML=''; tablaW.appendChild(t);
  }
  bIni.onclick = async ()=>{
    bIni.textContent='Ejecutando…'; bIni.disabled=true;
    try{
      const r = await correr(SIM_SRC, $('#simN',der).value, true, m=>{ txt.textContent=m; });
      pasos = r.pasos; k = 0; pinta();
      bIni.textContent='Reiniciar';
    }catch(e){ txt.textContent = e.message; }
    bIni.disabled=false;
  };
  bSig.onclick = ()=>{ if(k<pasos.length-1){k++;pinta();} };
  bAnt.onclick = ()=>{ if(k>0){k--;pinta();} };
  bTodo.onclick= ()=>{ if(pasos.length){k=pasos.length-1;pinta();} };
  return s;
}

/* ── barajado determinista de las opciones ────────────────────────────
   Sin esto la respuesta correcta caía casi siempre en la segunda casilla,
   y bastaba marcar la misma letra para aprobar. El orden depende del
   capítulo, del número de pregunta y del intento: es igual al recargar
   la página y cambia cuando el estudiante vuelve a intentarlo. ── */
function semillaTxt(t){ let h=2166136261; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function barajaOpts(p, clave, pos){
  let s = semillaTxt(clave) || 1;
  const rnd = ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  const n = p.opts.length;
  const destino = ((pos % n) + n) % n;          /* la correcta rota de posición pregunta a pregunta */
  const otras = p.opts.map((_,i)=>i).filter(i=>i!==p.ok);
  for(let i=otras.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=otras[i]; otras[i]=otras[j]; otras[j]=t; }
  const idx = []; let k = 0;
  for(let i=0;i<n;i++) idx.push(i===destino ? p.ok : otras[k++]);
  return { opts: idx.map(i=>p.opts[i]), ok: destino };
}

function quiz(id, intento){
  intento = intento || 0;
  const preguntas = QUIZ[id];
  if(!preguntas) return null;
  const q = el('div','quiz');
  q.innerHTML = '<div class="enc">Comprueba tu comprensión</div><p>Responde sin devolverte al texto. Cada respuesta explica el porqué.</p>';
  let aciertos=0, contestadas=0;
  const marcador = el('div','marcador','0 de '+preguntas.length+' respondidas');
  preguntas.forEach((p,i)=>{
    const d = el('div','preg');
    d.appendChild(el('div','q','<i>'+String(i+1).padStart(2,'0')+'</i><span>'+esc(p.q)+'</span>'));
    const exp = el('div','exp oculto', esc(p.exp));
    const mez = barajaOpts(p, id+'·'+i+'·'+intento, i + intento + semillaTxt(id));
    const btns = mez.opts.map((o,j)=>{
      const b = el('button','op', esc(o));
      b.onclick = ()=>{
        btns.forEach(x=>x.disabled=true);
        b.classList.add(j===mez.ok?'bien':'mal');
        if(j!==mez.ok) btns[mez.ok].classList.add('bien');
        exp.classList.remove('oculto');
        contestadas++; if(j===mez.ok) aciertos++;
        marcador.textContent = aciertos+' de '+contestadas+' correctas';
        if(contestadas===preguntas.length){
          marcador.textContent = 'Resultado: '+aciertos+' de '+preguntas.length+' correctas'+
            (aciertos===preguntas.length?' — impecable.':aciertos>=preguntas.length-1?' — muy bien.':' — vale la pena releer el capítulo.');
          marcaHecho(id, aciertos, preguntas.length);
        }
      };
      d.appendChild(b);
      return b;
    });
    d.appendChild(exp);
    q.appendChild(d);
  });
  q.appendChild(marcador);
  const reintentar = el('button','bt','↺ Volver a intentar');
  reintentar.style.marginTop = '14px';
  reintentar.onclick = ()=>{ const nuevo = quiz(id, intento+1); q.replaceWith(nuevo); nuevo.scrollIntoView({block:'start'}); };
  q.appendChild(reintentar);
  return q;
}

/* ══════════ progreso ══════════ */
/* ── memoria del libro: el progreso sobrevive al recargar la página ──
   Mismo esquema que los demás libros de la serie. Todo queda en este
   navegador; nada se envía a ningún servidor. ── */
const CLAVE = 'lp_libro_v1';
let DATOS = {};
try{ DATOS = JSON.parse(localStorage.getItem(CLAVE) || '{}'); }catch(e){ DATOS = {}; }
function guarda(){ try{ localStorage.setItem(CLAVE, JSON.stringify(DATOS)); return true; }catch(e){ return false; } }
function get(k, def){ return DATOS[k]===undefined ? def : DATOS[k]; }
function set(k, v){ DATOS[k]=v; return guarda(); }

const ESTADO = get('quiz', {});
function marcaHecho(id, a, t){ const p = ESTADO[id]; if(!p || a>=p.a){ ESTADO[id]={a,t}; set('quiz',ESTADO); } dibujaNav(); }
function actualizaProgreso(){
  const caps = LIBRO.filter(c=>c.kind==='cap');
  const hechos = caps.filter(c=>ESTADO[c.id]).length;
  $('#progTxt').textContent = hechos+' de '+caps.length+' capítulos';
  $('#aroFg').setAttribute('stroke-dasharray', (hechos/caps.length*100.5)+' 100.5');
}

/* ══════════ navegación ══════════ */
let actual = 0;
function dibujaNav(){
  const nav = $('#nav'); nav.innerHTML='';
  let grupo = null;
  LIBRO.forEach((c,i)=>{
    let g = c.kind==='cap' ? (c.unidad||'Capítulos') : c.kind==='anexo' ? 'Anexos' : 'Apertura';
    if(g!==grupo){ grupo=g; nav.appendChild(el('div','grupo', esc(g))); }
    const b = el('button','nav-i'+(i===actual?' on':''));
    const e = ESTADO[c.id];
    b.innerHTML = (c.num?'<span class="num">'+c.num+'</span>':'<span class="num"></span>')+
      '<span>'+esc(c.titulo)+'</span>'+(e?'<span class="ck">'+e.a+'/'+e.t+'</span>':'');
    b.onclick = ()=>{ ve(i); cierraRail(); };
    nav.appendChild(b);
  });
  actualizaProgreso();
}
function cierraRail(){ $('#rail').classList.remove('abierto'); $('#velo').classList.remove('on'); }

function ve(i){
  actual = Math.max(0, Math.min(LIBRO.length-1, i));
  const c = LIBRO[actual];
  const h = $('#hoja'); h.innerHTML='';
  $('#barraTit').textContent = c.titulo;
  document.title = c.titulo + ' · Lógica de programación con Python';

  if(c.kind==='front' && c.id==='portada'){ h.appendChild(portada(c)); }
  else {
    const tapa = el('div','tapa');
    tapa.appendChild(el('div','vueltiao'));
    if(c.kind==='cap'){
      tapa.appendChild(el('div','eyebrow','Capítulo '+c.num+(c.unidad?' · '+c.unidad.split('·')[0].trim():'')));
    } else if(c.kind==='anexo'){ tapa.appendChild(el('div','eyebrow','Material de consulta')); }
    tapa.appendChild(el('h1', null, esc(c.titulo)));
    h.appendChild(tapa);
    c.blocks.forEach(b=> h.appendChild(bloque(b, c)));
    if(c.id==='c-mo-usar-este-lib') h.appendChild(guia());
    if(c.kind==='cap'){ const q = quiz(c.id); if(q) h.appendChild(q); }
  }
  h.appendChild(pie());
  dibujaNav();
  if(location.hash.slice(1) !== c.id) location.hash = c.id;
  window.scrollTo({top:0,behavior:'instant'});
}

function bloque(b, cap){
  switch(b.type){
    case 'p':  return el('p', null, esc(b.text));
    case 'h':  return el(b.level===2?'h2':'h3', null, esc(b.text));
    case 'li': {
      const u = el('ul','lista');
      b.items.forEach(t=>u.appendChild(el('li',null,esc(t))));
      return u;
    }
    case 'ej': return ejercicios(b.items);
    case 'callout': {
      const k = b.kind, ico = k==='concepto'?'◈':k==='error'?'▲':'●';
      const d = el('div','caja '+k);
      d.appendChild(el('div','t','<span>'+ico+'</span>'+esc(b.title)));
      d.appendChild(el('p',null,esc(b.body)));
      return d;
    }
    case 'code': {
      const c = celdaCodigo(b.code, b.lang, b.prompts||[]);
      if(cap.id==='cap9' && b.lang==='py'){
        const cont = el('div');
        cont.appendChild(c); cont.appendChild(simulador());
        return cont;
      }
      return c;
    }
    case 'image': {
      const f = el('figure');
      const i = el('img'); i.src=b.data; i.alt=b.caption||'Figura del libro'; i.loading='lazy';
      f.appendChild(i);
      if(b.caption) f.appendChild(el('figcaption', null, esc(b.caption)));
      return f;
    }
    case 'grid': {
      const w = el('div','tabla-wrap');
      const t = el('table','datos');
      const [cab, ...filas] = b.rows;
      t.innerHTML = '<thead><tr>'+cab.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
        filas.map(f=>'<tr>'+f.map(x=>'<td>'+esc(x).replace(/\n/g,'<br>')+'</td>').join('')+'</tr>').join('')+'</tbody>';
      w.appendChild(t); return w;
    }
    default: return el('div');
  }
}

function ejercicios(items){
  const d = el('div','ejs');
  d.appendChild(el('h3',null,'Ponlo a prueba'));
  items.forEach(t=>{
    const e = el('div','ej');
    const cab = el('div','ej-cab');
    cab.appendChild(el('div','n'));
    cab.appendChild(el('p',null,esc(t)));
    const b = el('button','bt','Resolver aquí');
    cab.appendChild(b);
    e.appendChild(cab);
    let abierto=false, celda=null;
    b.onclick=()=>{
      if(!celda){
        const inicio = '# '+t.replace(/\s+/g,' ').slice(0,70)+'…\n# Escribe tu solución y pulsa Ejecutar.\n\n';
        celda = celdaCodigo(inicio, 'py', [], 'Tu solución');
        celda.style.margin='0';
        celda.style.borderRadius='0';
        e.appendChild(celda);
      }
      abierto = !abierto;
      celda.style.display = abierto?'block':'none';
      b.textContent = abierto?'Ocultar editor':'Resolver aquí';
    };
    d.appendChild(e);
  });
  return d;
}

function guia(){
  const g = el('div','quiz');
  g.innerHTML = '<div class="enc">Qué agrega esta edición</div>'+
    '<p>Los bloques de código de este libro no son imágenes: son programas de verdad y corren aquí mismo.</p>';
  const u = el('ul','lista');
  [['▶ Ejecutar','corre el programa y muestra lo que imprime.'],
   ['⌨ Datos','ahí escribes lo que el programa pide con input(): un valor por línea, en el mismo orden.'],
   ['⊞ Trazar','construye la tabla de traza del capítulo 9: una fila por instrucción ejecutada y el valor de cada variable, con el cambio resaltado.'],
   ['↺','devuelve el código tal como aparece en el libro, por si lo modificaste.']].forEach(([a,b])=>{
    u.appendChild(el('li',null,'<b style="font-family:var(--sans);font-size:13.5px">'+a+'</b> — '+b));
  });
  g.appendChild(u);
  g.appendChild(el('p',null,'Pruébalo con este ejemplo: cambia el 6 por otro número, ejecútalo y después pulsa <b>Trazar</b>.'));
  g.appendChild(celdaCodigo('# Suma los números del 1 al 5\ntotal = 0\nfor i in range(1, 6):\n    total = total + i\nprint("La suma es", total)','py',[],'Prueba libre'));
  g.appendChild(el('p','',
    'Equivocarse aquí no rompe nada: si el programa falla, el mensaje de error señala la línea y explica en español qué revisar.'));
  return g;
}

function portada(c){
  const d = el('div','portada');
  const img = el('img'); img.src = c.blocks[0].data; img.alt='Portada del libro';
  const der = el('div');
  der.innerHTML = '<div class="eyebrow">Edición interactiva</div>'+
    '<h1>Introducción práctica a la lógica de programación con Python</h1>'+
    '<p class="claim">El libro completo, con Python funcionando dentro de la página: edita cualquier ejemplo, ejecútalo y mira cómo cambian las variables paso a paso.</p>'+
    '<div class="autores">Mario Macea Anaya · Cristian Revueltas Correa · Kevin Anaya Correa<br>'+
    '<span>Fundamentos de Programación · Técnico Profesional en Programación Web · Universidad de Córdoba · Montería, 2026</span></div>';
  const t = el('div','tarjetas');
  [['▶','Ejecuta y edita cada ejemplo sin instalar nada en el computador.'],
   ['⊞','Genera la tabla de traza de cualquier programa, como en el capítulo 9.'],
   ['◈','Recorre el diagrama de flujo símbolo por símbolo mientras corre el algoritmo.'],
   ['✓','Autoevaluación al final de cada capítulo, con explicación de cada respuesta.']].forEach(([i,x])=>{
    t.appendChild(el('div','tarj','<i>'+i+'</i><span>'+x+'</span>'));
  });
  der.appendChild(t);
  const b = el('button','bt-nav list','Empezar por la presentación →');
  b.onclick = ()=>ve(1);
  der.appendChild(b);
  der.appendChild(el('div','aviso','La primera vez que pulses «Ejecutar» se descarga el motor de Python (unos 10 MB, una sola vez por navegador). Lo demás funciona sin conexión.'));
  d.appendChild(img); d.appendChild(der);
  return d;
}

function pie(){
  const p = el('div','pie');
  const a = el('button','bt-nav','← '+(actual>0?LIBRO[actual-1].titulo.slice(0,34):'Inicio'));
  a.onclick=()=>ve(actual-1); a.disabled = actual===0;
  const b = el('button','bt-nav list', (actual<LIBRO.length-1?LIBRO[actual+1].titulo.slice(0,34):'Fin')+' →');
  b.onclick=()=>ve(actual+1); b.disabled = actual===LIBRO.length-1;
  p.appendChild(a); p.appendChild(b);
  return p;
}

/* ══════════ arranque ══════════ */
$('#ham').onclick = ()=>{ $('#rail').classList.toggle('abierto'); $('#velo').classList.toggle('on'); };
$('#velo').onclick = cierraRail;
document.addEventListener('keydown', e=>{
  if(e.target.matches('textarea,input')) return;
  if(e.key==='ArrowRight') ve(actual+1);
  if(e.key==='ArrowLeft') ve(actual-1);
});
/* ── enlace directo: la dirección refleja la sección abierta, así el
   botón Atrás funciona y se puede compartir un capítulo concreto ── */
window.addEventListener('hashchange', ()=>{
  const id = decodeURIComponent((location.hash||'').slice(1));
  const i = LIBRO.findIndex(c=>c.id===id);
  if(i>=0 && i!==actual) ve(i);
});
ve(Math.max(0, LIBRO.findIndex(c=>c.id===decodeURIComponent((location.hash||'').slice(1)))));
</script>
