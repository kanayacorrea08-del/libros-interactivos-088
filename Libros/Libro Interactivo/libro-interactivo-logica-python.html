<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Introducción práctica a la lógica de programación con Python · Edición interactiva</title>
<meta name="description" content="Edición interactiva del libro Introducción práctica a la lógica de programación con Python. Universidad de Córdoba.">
<style>
:root{
  --tinta:#13231a; --tinta-2:#3d5245; --verde-hondo:#1d4a2b; --verde:#3c9a38; --verde-claro:#e8f2e2;
  --papel:#f7f8f3; --papel-2:#eef1e8; --linea:#d7ddcd; --ocre:#a06a12; --ocre-suave:#fdf4e2;
  --consola:#0e1f16; --consola-2:#16301f; --consola-linea:#24452f;
  --k:#8ad47f; --s:#e8c07d; --c:#6f8f7c; --n:#9ad7e8; --b:#cfe98a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:"Charter","Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --rail:284px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--serif);font-size:17.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
:focus-visible{outline:2.5px solid var(--verde);outline-offset:2px;border-radius:2px}

/* ── franja vueltiao: motivo del sombrero de la portada ── */
.vueltiao{height:7px;background:
  repeating-linear-gradient(115deg,var(--verde-hondo) 0 7px,transparent 7px 14px),
  linear-gradient(var(--verde-claro),var(--verde-claro));
  border-radius:1px}

/* ── rail ── */
#rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--papel-2);border-right:1px solid var(--linea);
  display:flex;flex-direction:column;z-index:40;transition:transform .25s ease}
.rail-top{padding:18px 20px 14px;border-bottom:1px solid var(--linea)}
.marca{font-family:var(--sans);font-weight:800;font-size:13.5px;line-height:1.25;letter-spacing:-.2px;color:var(--verde-hondo);text-transform:uppercase}
.marca span{color:var(--verde)}
.sub{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-2);margin-top:7px}
.progreso{display:flex;align-items:center;gap:10px;margin-top:14px}
.aro{width:34px;height:34px;flex:0 0 34px}
.aro circle{fill:none;stroke-width:4}
.aro .bg{stroke:var(--linea)}
.aro .fg{stroke:var(--verde);stroke-linecap:round;transition:stroke-dasharray .4s}
.progreso b{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--tinta-2)}
nav{overflow-y:auto;padding:10px 12px 30px;flex:1}
.grupo{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tinta-2);padding:16px 10px 6px;border-top:1px solid var(--linea);margin-top:8px}
.grupo:first-child{border-top:0;margin-top:0}
.nav-i{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  padding:7px 10px;border-radius:7px;color:var(--tinta);font-size:13.5px;line-height:1.35;font-family:var(--sans)}
.nav-i:hover{background:#e2e8da}
.nav-i.on{background:var(--verde-hondo);color:#fff}
.nav-i.on .num{color:var(--k)}
.nav-i .num{font-weight:700;font-size:11px;color:var(--verde);min-width:15px;font-variant-numeric:tabular-nums}
.nav-i .ck{margin-left:auto;font-size:11px;opacity:.85}

/* ── contenido ── */
main{margin-left:var(--rail);padding:0 0 90px}
.hoja{max-width:760px;margin:0 auto;padding:0 30px}
.tapa{margin-bottom:26px;padding:38px 0 22px}
.eyebrow{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--verde);margin-bottom:12px}
h1{font-family:var(--sans);font-weight:800;font-size:clamp(30px,4.4vw,42px);line-height:1.08;letter-spacing:-.022em;
  color:var(--verde-hondo);margin:0 0 14px}
h2{font-family:var(--sans);font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--verde-hondo);
  margin:44px 0 12px;padding-top:14px;border-top:1px solid var(--linea)}
h3{font-family:var(--sans);font-weight:650;font-size:16px;color:var(--tinta);margin:28px 0 8px}
p{margin:0 0 15px}
ul.lista{margin:0 0 18px;padding-left:20px}
ul.lista li{margin-bottom:7px}
figure{margin:26px 0;text-align:center}
figure img{max-width:100%;border-radius:9px;border:1px solid var(--linea);background:#fff}
figcaption{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);margin-top:9px;line-height:1.4}

/* ── cajas ── */
.caja{border-radius:10px;padding:15px 17px;margin:20px 0;font-size:16px;border:1px solid}
.caja .t{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:flex;gap:7px;align-items:center}
.caja p{margin:0}
.caja.concepto{background:var(--verde-claro);border-color:#c3ddb7}
.caja.concepto .t{color:var(--verde-hondo)}
.caja.nota{background:#eef4f7;border-color:#c6d9e2}
.caja.nota .t{color:#215c78}
.caja.error{background:var(--ocre-suave);border-color:#ecd7a5}
.caja.error .t{color:var(--ocre)}

/* ── tablas de datos ── */
.tabla-wrap{overflow-x:auto;margin:22px 0}
table.datos{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px}
table.datos th{background:var(--verde-hondo);color:#fff;text-align:left;padding:9px 11px;font-weight:600;font-size:12.5px}
table.datos td{padding:8px 11px;border-bottom:1px solid var(--linea);vertical-align:top}
table.datos tr:nth-child(even) td{background:#fff}

/* ── celda de código ── */
.celda{margin:24px 0;border-radius:12px;overflow:hidden;background:var(--consola);box-shadow:0 1px 2px rgba(19,35,26,.16)}
.celda-top{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:var(--consola-2);border-bottom:1px solid var(--consola-linea);flex-wrap:wrap}
.etiqueta{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7fa78d}
.celda-top .sp{flex:1}
.bt{font-size:12px;font-weight:600;border:1px solid #2f5b3d;background:#1d3d29;color:#d8ecdc;padding:5px 11px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.bt:hover{background:#275034;border-color:#3f7350}
.bt.pri{background:var(--verde);border-color:var(--verde);color:#08170e}
.bt.pri:hover{background:#4bb046;border-color:#4bb046}
.bt[disabled]{opacity:.5;cursor:not-allowed}
.ed{position:relative;font-family:var(--mono);font-size:13.5px;line-height:1.62}
.ed pre,.ed textarea{margin:0;padding:14px 16px;font:inherit;letter-spacing:0;white-space:pre;word-wrap:normal;
  border:0;overflow:hidden;tab-size:4}
.ed pre{color:#dcefe1;min-height:100%;pointer-events:none}
.ed textarea{position:absolute;inset:0;width:100%;height:100%;color:transparent;background:transparent;
  caret-color:var(--k);resize:none;outline:0;display:block}
.marca-linea{position:absolute;left:0;right:0;background:rgba(140,212,127,.15);border-left:3px solid var(--k);pointer-events:none;display:none}
.tk{color:var(--k)} .ts{color:var(--s)} .tc{color:var(--c);font-style:italic} .tn{color:var(--n)} .tb{color:var(--b)}
.pnl{border-top:1px solid var(--consola-linea);padding:11px 14px;font-family:var(--mono);font-size:13px;color:#cfe5d5}
.pnl-t{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7fa78d;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.hint{font-family:var(--sans);font-size:11px;color:#8fb69c;font-weight:400;letter-spacing:0;text-transform:none}
textarea.entradas{width:100%;background:#0a1811;border:1px solid var(--consola-linea);border-radius:7px;color:#e2f1e6;
  font-family:var(--mono);font-size:13px;padding:8px 10px;resize:vertical;min-height:56px;outline:0;line-height:1.55}
textarea.entradas:focus{border-color:var(--verde)}
.salida{white-space:pre-wrap;word-break:break-word;margin:0;min-height:20px}
.salida .err{color:#ff9a8a}
.oculto{display:none}
.corriendo{color:#8fb69c;font-family:var(--sans);font-size:12.5px}

/* ── traza ── */
.traza-wrap{overflow-x:auto}
table.traza{border-collapse:collapse;font-family:var(--mono);font-size:12px;color:#dcefe1;width:100%}
table.traza th{background:#1b3a26;padding:6px 9px;text-align:left;font-family:var(--sans);font-size:11px;
  font-weight:600;white-space:nowrap;position:sticky;top:0}
table.traza td{padding:5px 9px;border-bottom:1px solid #1c3a27;white-space:nowrap}
table.traza td.cod{color:#a9cdb5;max-width:290px;overflow:hidden;text-overflow:ellipsis}
table.traza td.cambio{color:#0e1f16;background:var(--k);border-radius:3px;font-weight:700}
table.traza tr:hover td{background:#183123}
table.traza tr.sel td{background:#20452e}
table.traza td.paso{color:#7fa78d}

/* ── quiz ── */
.quiz{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:22px 24px;margin:40px 0 26px}
.quiz>.enc{font-family:var(--sans);font-weight:800;font-size:17px;color:var(--verde-hondo);margin-bottom:3px}
.quiz>.enc+p{font-family:var(--sans);font-size:13.5px;color:var(--tinta-2);margin-bottom:16px}
.preg{padding:16px 0;border-top:1px solid var(--papel-2)}
.preg .q{font-family:var(--sans);font-size:15.5px;font-weight:600;margin-bottom:11px;display:flex;gap:9px}
.preg .q i{color:var(--verde);font-style:normal;font-weight:800;font-size:12px;padding-top:3px}
.op{display:block;width:100%;text-align:left;font-size:14.5px;padding:9px 13px;margin-bottom:6px;border-radius:8px;
  border:1px solid var(--linea);background:var(--papel);color:var(--tinta);line-height:1.4}
.op:hover:not([disabled]){border-color:var(--verde);background:#fff}
.op.bien{background:var(--verde-claro);border-color:var(--verde);font-weight:600}
.op.mal{background:#fdeceb;border-color:#e6a49b}
.op[disabled]{cursor:default}
.exp{font-family:var(--sans);font-size:13.5px;background:var(--papel-2);border-left:3px solid var(--verde);
  padding:9px 13px;border-radius:0 7px 7px 0;margin-top:8px;color:var(--tinta-2)}
.marcador{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--verde-hondo);margin-top:16px;padding-top:14px;border-top:1px solid var(--papel-2)}

/* ── ejercicios ── */
.ejs{counter-reset:ej}
.ej{border:1px solid var(--linea);border-radius:10px;margin:12px 0;background:#fff;overflow:hidden}
.ej-cab{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.ej-cab .n{counter-increment:ej;font-family:var(--sans);font-weight:800;font-size:12px;color:#fff;background:var(--verde-hondo);
  min-width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
.ej-cab .n::before{content:counter(ej)}
.ej-cab p{margin:0;font-size:16px}
.ej-cab .bt{background:var(--papel-2);border-color:var(--linea);color:var(--verde-hondo);margin-left:auto;flex:0 0 auto}
.ej-cab .bt:hover{background:var(--verde-claro);border-color:var(--verde)}

/* ── simulador cap. 9 ── */
.sim{background:#fff;border:1px solid var(--linea);border-radius:12px;margin:26px 0;overflow:hidden}
.sim-cab{padding:14px 18px;background:var(--verde-hondo);color:#fff;font-family:var(--sans)}
.sim-cab b{font-size:15px;display:block}
.sim-cab span{font-size:12.5px;opacity:.82}
.sim-cuerpo{display:grid;grid-template-columns:minmax(230px,1fr) 1.1fr}
.sim-svg{padding:14px;border-right:1px solid var(--linea);background:var(--papel)}
.sim-svg svg{width:100%;height:auto;display:block}
.nodo rect,.nodo path,.nodo ellipse{fill:#fff;stroke:var(--verde-hondo);stroke-width:1.6;transition:fill .18s,stroke .18s}
.nodo text{font-family:var(--sans);font-size:10.5px;fill:var(--tinta)}
.nodo.act rect,.nodo.act path,.nodo.act ellipse{fill:var(--verde);stroke:var(--verde-hondo)}
.nodo.act text{fill:#08170e;font-weight:700}
.flecha{stroke:var(--tinta-2);stroke-width:1.3;fill:none;marker-end:url(#pf)}
.et{font-family:var(--sans);font-size:9.5px;fill:var(--tinta-2)}
.sim-panel{padding:14px 18px;font-family:var(--sans)}
.vars{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.var{background:var(--papel-2);border:1px solid var(--linea);border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:13px}
.var b{color:var(--verde-hondo)}
.var.cambia{background:var(--verde);border-color:var(--verde-hondo);color:#08170e}
.sim-ctrl{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.bt-c{font-size:12.5px;font-weight:600;border:1px solid var(--linea);background:var(--papel-2);color:var(--verde-hondo);padding:6px 13px;border-radius:7px}
.bt-c:hover{background:var(--verde-claro);border-color:var(--verde)}
.bt-c.pri{background:var(--verde-hondo);border-color:var(--verde-hondo);color:#fff}
.paso-txt{font-size:13px;color:var(--tinta-2);min-height:38px;margin-top:10px;line-height:1.45}
.sim-num{font-family:var(--mono);font-size:12px;color:var(--tinta-2)}

/* ── pie de capítulo ── */
.pie{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:52px;padding-top:20px;border-top:1px solid var(--linea);flex-wrap:wrap}
.bt-nav{font-family:var(--sans);font-size:14px;font-weight:600;border:1px solid var(--linea);background:#fff;color:var(--verde-hondo);padding:10px 16px;border-radius:9px}
.bt-nav:hover{border-color:var(--verde);background:var(--verde-claro)}
.bt-nav.list{background:var(--verde-hondo);color:#fff;border-color:var(--verde-hondo)}

/* ── portada ── */
.portada{display:grid;grid-template-columns:minmax(210px,.78fr) 1.22fr;gap:40px;align-items:center;padding:44px 0 20px}
.portada img{width:100%;border-radius:10px;box-shadow:0 14px 40px rgba(19,35,26,.2)}
.portada h1{font-size:clamp(25px,2.9vw,33px);margin-bottom:12px}
.claim{font-size:17px;color:var(--tinta-2);margin-bottom:16px}
.autores{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--verde-hondo);
  border-left:3px solid var(--verde);padding-left:12px;margin-bottom:6px;line-height:1.5}
.autores span{display:block;font-weight:400;font-size:11.5px;color:var(--tinta-2);margin-top:3px}
.tarjetas{display:grid;gap:10px;margin:22px 0 26px}
.tarj{display:flex;gap:11px;align-items:flex-start;font-family:var(--sans);font-size:14px;background:#fff;
  border:1px solid var(--linea);border-radius:10px;padding:12px 14px}
.tarj i{font-style:normal;font-size:15px}
.aviso{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);background:var(--papel-2);border-radius:9px;padding:11px 14px;margin-top:16px}

/* ── barra móvil ── */
#barra{display:none;position:sticky;top:0;z-index:30;background:rgba(247,248,243,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linea);padding:9px 14px;align-items:center;gap:11px}
#barra b{font-family:var(--sans);font-size:13.5px;color:var(--verde-hondo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ham{border:1px solid var(--linea);background:#fff;border-radius:8px;width:36px;height:34px;font-size:15px;color:var(--verde-hondo)}
#velo{display:none;position:fixed;inset:0;background:rgba(19,35,26,.42);z-index:35}

@media(max-width:900px){
  body{font-size:17px}
  #rail{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.25)}
  #rail.abierto{transform:none}
  main{margin-left:0}
  #barra{display:flex}
  #velo.on{display:block}
  .hoja{padding:0 18px}
  .portada{grid-template-columns:1fr;gap:24px;padding-top:26px}
  .portada img{max-width:290px;margin:0 auto;display:block}
  .sim-cuerpo{grid-template-columns:1fr}
  .sim-svg{border-right:0;border-bottom:1px solid var(--linea)}
}
@media(max-width:640px){
  .celda-top{padding:8px 10px}
  .celda-top .etiqueta{width:100%}
  .celda-top .sp{display:none}
  .celda-top .bt{flex:1 1 auto;justify-content:center;padding:7px 8px;font-size:11.5px}
  .ed{overflow-x:auto}
  .ed pre,.ed textarea{font-size:12.5px;padding:12px 13px}
  .ed textarea{white-space:pre;overflow-x:hidden}
  .ej-cab{flex-wrap:wrap}
  .ej-cab .bt{width:100%;justify-content:center;background:var(--verde-hondo);color:#fff;border-color:var(--verde-hondo)}
  .quiz{padding:18px 15px}
  .sim-panel{padding:14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#rail,#barra,.celda-top,.pie{display:none}main{margin:0}}
</style>
</head>

<script type="text/x-python" id="motor">
import sys, io, json
from contextlib import redirect_stdout

LIM_PASOS = 500
LIM_EVENTOS = 200000

def _pista(e):
    t = type(e).__name__
    m = str(e)
    if t == "NameError":
        return "\n\u2192 Ese nombre no existe todav\u00eda. Rev\u00edsalo: puede estar escrito distinto o usarse antes de asignarle un valor."
    if t == "TypeError" and ("str" in m and "int" in m or "str" in m and "float" in m):
        return "\n\u2192 Est\u00e1s mezclando texto y n\u00fameros. Recuerda que input() entrega texto: convi\u00e9rtelo con int() o float() antes de calcular."
    if t == "ValueError" and "invalid literal" in m:
        return "\n\u2192 Lo que se escribi\u00f3 no es un n\u00famero v\u00e1lido para int(). Si el dato tiene decimales, usa float()."
    if t == "IndentationError" or t == "TabError":
        return "\n\u2192 Revisa la sangr\u00eda: todo lo que va dentro de un if, for o while lleva 4 espacios."
    if t == "ZeroDivisionError":
        return "\n\u2192 No se puede dividir entre cero. Valida el divisor antes de dividir."
    if t == "IndexError":
        return "\n\u2192 La posici\u00f3n que pediste no existe en la lista. Recuerda que el primer elemento es el 0."
    if t == "AttributeError":
        return "\n\u2192 Ese dato no tiene ese m\u00e9todo. Verifica de qu\u00e9 tipo es la variable."
    return ""

def _simple(v):
    return isinstance(v, (int, float, str, bool, list, tuple, dict, set, type(None)))

def _fmt(v):
    if isinstance(v, bool) or v is None:
        return repr(v)
    if isinstance(v, float):
        return repr(round(v, 6))
    if isinstance(v, str):
        s = v if len(v) <= 22 else v[:20] + "\u2026"
        return '"' + s + '"'
    r = repr(v)
    return r if len(r) <= 34 else r[:32] + "\u2026"

def ejecutar(src, entradas, trazar):
    salida = io.StringIO()
    cola = entradas.split("\n") if entradas.strip() != "" else []
    pos = [0]

    def _input(prompt=""):
        salida.write(str(prompt))
        if pos[0] >= len(cola):
            raise EOFError("El programa pidi\u00f3 un dato y no hay m\u00e1s entradas. Agrega una l\u00ednea en \u00abDatos de entrada\u00bb.")
        v = cola[pos[0]]
        pos[0] += 1
        salida.write(v + "\n")
        return v

    lineas = src.split("\n")
    pasos = []
    est = {"linea": None, "ev": 0, "trunc": False}

    def trazador(frame, evento, arg):
        if frame.f_code.co_filename != "<libro>":
            return None
        est["ev"] += 1
        if est["ev"] > LIM_EVENTOS:
            raise TimeoutError("El programa ejecut\u00f3 demasiadas instrucciones. \u00bfHay un ciclo que nunca termina?")
        if evento == "line" or evento == "return":
            if est["linea"] is not None and trazar:
                if len(pasos) < LIM_PASOS:
                    vs = {}
                    for k, v in frame.f_locals.items():
                        if not k.startswith("_") and _simple(v):
                            vs[k] = _fmt(v)
                    pasos.append({"n": est["linea"], "cod": lineas[est["linea"]-1].strip(),
                                  "vars": vs, "fn": frame.f_code.co_name})
                else:
                    est["trunc"] = True
            est["linea"] = frame.f_lineno if evento == "line" else None
        return trazador

    try:
        codigo = compile(src, "<libro>", "exec")
    except SyntaxError as e:
        return json.dumps({"salida": "", "error": "Error de sintaxis, l\u00ednea %s: %s" % (e.lineno, e.msg),
                           "pasos": [], "trunc": False, "linea": e.lineno})

    err = None
    nlin = None
    g = {"__name__": "__main__", "input": _input}
    try:
        sys.settrace(trazador)
        with redirect_stdout(salida):
            exec(codigo, g)
    except BaseException as e:
        if isinstance(e, (EOFError, TimeoutError)):
            err = str(e)
        else:
            err = type(e).__name__ + ": " + str(e) + _pista(e)
        tb = sys.exc_info()[2]
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == "<libro>":
                nlin = tb.tb_lineno
            tb = tb.tb_next
    finally:
        sys.settrace(None)

    return json.dumps({"salida": salida.getvalue(), "error": err, "pasos": pasos,
                       "trunc": est["trunc"], "linea": nlin})
</script>

: "p", "text": "Este libro parte de una perspectiva distinta debido a que su punto de partida no es el código, sino el problema. Antes de escribir una sola línea en Python, el estudiante aprende a describir lo que desea resolver, organizar sus ideas y comprobar, con lápiz y papel, que su razonamiento tiene sentido. Solo después aparece el código, y para entonces su comprensión resulta mucho más natural."}, {"type": "p", "text": "La obra se presenta como un producto académico e investigativo derivado de la estrategia Educación Superior en tu Colegio, desarrollada por la Universidad de Córdoba en el marco del Plan Integral de Cobertura con Enfoque Territorial PIC-ET 2025. Esta estrategia busca articular la educación media con la educación superior, ampliar las oportunidades de acceso para jóvenes de municipios y subregiones del departamento de Córdoba, y fortalecer procesos formativos pertinentes para las necesidades del territorio."}, {"type": "p", "text": "En este contexto, el libro se articula con el programa Técnico Profesional en Programación Web de la Universidad de Córdoba y responde a los contenidos establecidos en el plan de curso FDOC-088 para el primer semestre. De manera particular, aborda los fundamentos de algoritmos y lógica secuencial en la Unidad 1, los ciclos y estructuras repetitivas en la Unidad 2, y la representación visual y validación de algoritmos en la Unidad 3. En conjunto, estas unidades orientan el trabajo del semestre hacia un propósito claro: fortalecer el pensamiento lógico, la resolución de problemas y la construcción ordenada de soluciones computacionales."}, {"type": "p", "text": "Los ejemplos están escritos en Python, no porque sea el único lenguaje válido, sino porque su sintaxis guarda una cercanía importante con el pseudocódigo utilizado para pensar las soluciones. Esto reduce la distancia entre el algoritmo diseñado y el código escrito. Quien comprenda con solidez los conceptos desarrollados aquí podrá trasladarlos con mayor facilidad a PHP, Java o a cualquier otro lenguaje que aparezca más adelante en su formación."}, {"type": "p", "text": "Conviene advertirlo desde el comienzo: este libro no produce resultados sin práctica. Leerlo de manera pasiva aporta poco. En cambio, resolver ejercicios, equivocarse, identificar errores y corregirlos es lo que realmente permite desarrollar la habilidad. La programación se aprende pensando, probando y ajustando; por eso, cada actividad propuesta busca que el estudiante avance paso a paso, desde la comprensión del problema hasta la construcción de una solución funcional."}, {"type": "p", "text": "Los autores, Montería 2026."}]}, {"id": "c-mo-usar-este-lib", "titulo": "Cómo usar este libro", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Cada capítulo de este libro está organizado en cuatro partes que se complementan entre sí. La primera presenta el concepto a partir de un ejemplo concreto, tomado de situaciones cercanas y comprensibles para el estudiante. La segunda muestra cómo ese concepto puede expresarse en pseudocódigo estándar, con el fin de fortalecer la lógica antes de pasar al lenguaje de programación. La tercera lo traduce a código Python y ofrece una explicación paso a paso de su estructura y funcionamiento. La cuarta propone ejercicios organizados de menor a mayor nivel de dificultad, de modo que el aprendizaje avance de forma gradual y consistente."}, {"type": "p", "text": "Los bloques de código aparecen resaltados con fondo de color para diferenciarlos con claridad del resto del contenido y facilitar su identificación dentro del capítulo."}, {"type": "code", "code": "# Ejemplo de bloque de código\nnombre = input(\"¿Cómo te llamas? \")\nprint(\"Hola,\", nombre)", "lang": "py", "prompts": ["¿Cómo te llamas? "]}, {"type": "p", "text": "Las cajas de color tienen propósitos distintos:"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Concepto", "body": "Introduce un término técnico con su definición precisa. Úsalas como referencia cuando releas el capítulo."}, {"type": "callout", "kind": "nota", "title": "Para tener en cuenta", "body": "Aparece cuando hay una forma más clara o eficiente de hacer algo. No es obligatorio seguirla, pero sí conveniente."}, {"type": "callout", "kind": "error", "title": "Error frecuente", "body": "Señala un error que los estudiantes cometen con frecuencia. Vale leerlo antes de hacer los ejercicios."}, {"type": "p", "text": "Los ejercicios están numerados de acuerdo con su nivel de complejidad. Los primeros permiten aplicar de manera directa lo explicado en el capítulo, mientras que los últimos exigen mayor análisis, autonomía y capacidad de resolución. Por esa razón, se recomienda abordarlos en el orden propuesto, ya que cada uno prepara el camino para el siguiente."}]}, {"id": "cap1", "titulo": "Qué es un algoritmo y para qué sirve", "kind": "cap", "num": 1, "unidad": "UNIDAD 1 · Fundamentos de la Lógica de Programación", "blocks": [{"type": "p", "text": "Existe una idea equivocada bastante extendida: pensar que aprender a programar consiste, ante todo, en aprender a escribir código. No es así. Escribir código sin tener claro qué se quiere resolver se parece a teclear palabras en un idioma que no se domina y esperar que, aun así, salga un texto coherente. Un programa puede ejecutarse sin errores de sintaxis y, sin embargo, producir resultados equivocados, porque la falla no siempre está en el código, sino en el razonamiento previo con el que se construyó."}, {"type": "p", "text": "Por esa razón, este capítulo se sitúa antes del código. Aquí no se empieza programando, sino pensando. El propósito es comprender primero cómo se organiza una solución, cómo se expresan sus pasos y cómo se verifica su sentido antes de traducirla a un lenguaje de programación."}, {"type": "h", "level": 2, "text": "1.1 La definición que importa"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Algoritmo", "body": "Secuencia ordenada y finita de instrucciones que, partiendo de un estado inicial, produce un resultado en un número determinado de pasos. Cada instrucción debe ser lo suficientemente precisa para ejecutarse sin adivinar nada."}, {"type": "p", "text": "Hay tres palabras en esa definición que vale la pena sostener un momento: ordenada, finita y precisa."}, {"type": "p", "text": "Ordenada significa que el orden importa. No es lo mismo mezclar primero y calentar después que calentar primero y mezclar después. En programación, el orden de las instrucciones determina el resultado, sin excepción. Finita significa que el proceso debe terminar. Un algoritmo que sigue para siempre no resuelve nada por muy correcto que sea en cada paso individual. Y precisa significa que cada instrucción debe poder ejecutarse sin interpretar, sin adivinar, sin decidir qué quiso decir quien la escribió."}, {"type": "p", "text": "Esas tres características no son caprichosas. Son exactamente lo que diferencia un algoritmo de una vaga descripción de intenciones."}, {"type": "h", "level": 2, "text": "1.2 El mismo proceso, dos versiones"}, {"type": "p", "text": "La diferencia entre un algoritmo válido y una explicación deficiente no está en el tema que aborda, sino en el nivel de precisión con que se formulan sus instrucciones. Esto puede apreciarse en la Figura 1, donde se comparan dos maneras de describir un mismo procedimiento cotidiano: la preparación de un pan de yuca. En la versión vaga apenas se indica “haz la masa, métela al horno y ya”; en la versión precisa, en cambio, se señalan con claridad los ingredientes, las cantidades, el tiempo de amasado y la temperatura de cocción. Solo esta segunda formulación puede considerarse un algoritmo, porque presenta una secuencia ordenada, concreta y suficientemente detallada como para ejecutarse sin ambigüedades."}, {"type": "image", "data": "data:image/webp;base64,UklGRh5tAABXRUJQVlA4IBJtAACw2gGdASpMBEcCPmEsk0ekIiIhIrJrcIAMCWdu/Bz54Ml4AwqXygyzQ0vHPkX7N7Jd/9u+OB5H/T+M17l/K+b3/Zfs primeros semestres consiste en confundir el algoritmo con el código. El algoritmo es la solución pensada para resolver un problema y puede expresarse con palabras, en papel o mediante pseudocódigo. El código, en cambio, es la traducción de esa solución a un lenguaje que el computador puede interpretar y ejecutar. Por eso, antes de programar, es necesario haber definido con claridad el algoritmo."}, {"type": "h", "level": 2, "text": "1.3 Algoritmos en la vida cotidiana"}, {"type": "p", "text": "Los algoritmos no surgieron con los computadores. En realidad, están presentes desde hace mucho tiempo en numerosas actividades cotidianas que implican seguir una secuencia de pasos para alcanzar un resultado. Lo que cambia en programación es el tipo de ejecutor: ya no se trata de una persona, sino de una máquina que carece de sentido común y que, por tanto, ejecuta exactamente las instrucciones que recibe, ni más ni menos."}, {"type": "p", "text": "Un ejemplo cercano es la preparación de un tinto. Como se observa en la Figura 2, este proceso puede describirse a partir del modelo IPO, es decir, Entrada, Proceso y Salida. En este caso, las entradas son el agua, el café, la taza y la fuente de calor; el proceso comprende acciones como calentar el agua, agregar el café, filtrar y servir; y la salida es el tinto listo para el consumo. Este modelo será fundamental a lo largo del curso, porque permite analizar los problemas de forma ordenada y comprender que todo algoritmo parte de unos datos, realiza una transformación y produce un resultado."}, {"type": "image", "data": "data:image/webp;base64,UklGRiBZAABXRUJQVlA4IBRZAACQoAGdASpMBHkCPmEulEgkIiIhIhGp4IAMCWdu/Cjv/ODKDtIFQFhkFP9g8uflem/33+L/tXhoqad6P2niWfC90f1b+YL/mei5/T/QT/QP8r6r3/S9TX9q9MD0oP+v7Gn+J/4n//9yD9pOtR/x2/zdNP02/wP9r9aXxL9N/rP90/aT+q+lv4d8n/ZP6//if9j/ZP/l7j/9h5L/Qf27/h+g38c+zH4/+2/ur/h/3d+LP8X/ZP6n+z/oP+Qfov+V/Xj9bfkF/G/47/f/7P/iv/N/ofiO9g/1PabZx/qP+9/hPYC9U/m3+9/uv+Y/bT2zPTf8f/fP3Z/f/5E/JP6Z/ff75+9X+F+wD+Ofzn/Hf3D93/8J// ku4g+aVDuVPSujR8OlOYkFVqdYlQAAAAAAAAAA", "caption": "Figura 2  — El algoritmo del tinto como modelo IPO"}, {"type": "p", "text": "Nota. Las entradas, el proceso y la salida son los tres componentes de cualquier algoritmo."}, {"type": "p", "text": "Otro ejemplo cotidiano es el cajero automático. Cuando una persona introduce la tarjeta y digita su PIN, el sistema pone en marcha una secuencia de instrucciones: verifica que la clave coincida con la registrada, consulta el saldo disponible, compara ese saldo con el monto solicitado y decide si puede entregar el dinero o si, por el contrario, debe mostrar un mensaje de error. Cada una de esas acciones responde a reglas definidas de antemano. No hay intuición, improvisación ni interpretación personal: solo ejecución de instrucciones."}, {"type": "p", "text": "Lo interesante de este ejemplo es que el cajero no “entiende” el dinero como lo haría una persona. No razona sobre su valor ni toma decisiones por criterio propio. Simplemente sigue un conjunto de pasos diseñados con anticipación. Eso es, precisamente, lo que hace cualquier programa informático: ejecutar instrucciones previamente organizadas para resolver una tarea específica."}, {"type": "callout", "kind": "nota", "title": "Para tener en cuenta", "body": "Antes de abrir el editor de código, conviene describir en español el proceso que se desea programar. Si una solución no puede explicarse con palabras claras y ordenadas, difícilmente podrá traducirse de manera correcta a un lenguaje de programación. La claridad al expresar una idea suele ser el primer indicio de claridad lógica."}, {"type": "h", "level": 2, "text": "1.4 Del problema a la solución: cuatro momentos"}, {"type": "p", "text": "Resolver un problema mediante programación implica recorrer cuatro momentos fundamentales, aunque en la práctica a veces se superpongan o parezcan ocurrir al mismo tiempo. Distinguirlos con claridad ayuda a comprender mejor cómo se construye una solución y por qué algunos errores aparecen incluso antes de escribir código."}, {"type": "p", "text": "El primer momento es entender el problema. Esto implica identificar qué datos están disponibles, qué restricciones deben considerarse y cuál es el resultado que se espera obtener. Aunque suele pasar desapercibido, este es uno de los pasos más importantes, porque una comprensión incompleta del problema conduce, casi siempre, a soluciones incorrectas."}, {"type": "p", "text": "El segundo momento es diseñar el algoritmo. En esta etapa se organizan los pasos que permitirán pasar de los datos iniciales al resultado esperado. También se comprueba, mediante ejemplos concretos, si esa secuencia realmente funciona, y se realizan los ajustes necesarios antes de llevarla al código."}, {"type": "p", "text": "El tercer momento consiste en traducir el algoritmo al lenguaje de programación elegido. Aquí la lógica diseñada previamente se convierte en instrucciones que el computador puede interpretar y ejecutar. Cuando este paso se hace sin haber trabajado bien los anteriores, el código suele volverse confuso, difícil de corregir y propenso a errores."}, {"type": "p", "text": "El cuarto momento es probar la solución. No basta con que el programa funcione en un caso favorable o con los datos del ejemplo. También debe verificarse su comportamiento en distintas situaciones, incluidos los casos límite o poco frecuentes. Esta comprobación permite identificar fallos lógicos y confirmar si la solución es realmente válida."}, {"type": "p", "text": "En este curso, la Unidad 1 se centra principalmente en los dos primeros momentos: comprender el problema y diseñar la solución. La Unidad 3, por su parte, pone especial atención en la validación. El código aparece a lo largo de las unidades, pero siempre como resultado de un proceso de pensamiento previo, no como punto de partida."}, {"type": "h", "level": 2, "text": "1.5 Ejercicios"}, {"type": "ej", "items": ["Describe en tus propias palabras los pasos para calcular el promedio de tres calificaciones. Identifica claramente las entradas, el proceso y el resultado esperado usando el modelo IPO.", "El siguiente \"algoritmo\" no cumple la definición: \"Mientras no termines, sigue intentando\". Explica cuál de las tres características (ordenada, finita, precisa) viola y por qué.", "Un compañero describe cómo cambiar una bombilla así: \"Quitar la vieja, poner la nueva\". Escribe la versión precisa del mismo algoritmo con al menos cinco pasos que un robot pudiera ejecutar sin pedir aclaraciones.", "Elige un proceso de tu vida diaria preparar el desayuno, llegar al salón de clase, pagar en la tienda y escríbelo como un algoritmo con al menos seis pasos ordenados. Verifica que cada paso sea preciso.", "Busca en el cajero automático de tu banco o en una aplicación de pagos la secuencia de pasos que realiza. Escríbela en forma de algoritmo e identifica en cuáles pasos hay decisiones (condiciones que pueden ser verdaderas o falsas)."]}]}, {"id": "cap2", "titulo": "Analizar el problema antes de resolverlo", "kind": "cap", "num": 2, "unidad": "UNIDAD 1 · Fundamentos de la Lógica de Programación", "blocks": [{"type": "p", "text": "La mayoría de los errores en programación no se originan al momento de escribir el código. En muchos casos aparecen antes, cuando el programador cree haber comprendido el problema, pero en realidad no lo ha analizado con suficiente detenimiento. Por esa razón, antes de pensar en instrucciones o estructuras, es necesario aprender a descomponer el enunciado en sus elementos esenciales. Ese es el propósito de este capítulo."}, {"type": "h", "level": 2, "text": "2.1 Tres preguntas que siempre van primero"}, {"type": "p", "text": "Antes de escribir una sola línea de pseudocódigo, conviene responder tres preguntas básicas sobre el problema planteado: ¿qué datos están disponibles?, ¿qué transformación debe aplicarse a esos datos? y ¿qué resultado se espera obtener? Estas tres preguntas corresponden al modelo IPO (Input, Process, Output), es decir, Entrada, Proceso y Salida."}, {"type": "p", "text": "Este modelo permite organizar el análisis de cualquier enunciado de forma clara y lógica. Su utilidad radica en que obliga a distinguir entre lo que se recibe, lo que se hace con esa información y lo que finalmente debe producirse como resultado. Un ejemplo concreto es el siguiente: “Dado el precio de un artículo y la cantidad comprada, calcular el total. Si el total supera $500.000, aplicar un descuento del 10 %.”"}, {"type": "grid", "rows": [["Componente", "Descripción"], ["Entradas", "precio unitario (número real), cantidad (entero positivo)"], ["Proceso", "total = precio × cantidad; si total > 500000 → descontar 10%"], ["Salida", "total a pagar (con o sin descuento aplicado)"]]}, {"type": "h", "level": 2, "text": "2.2 Variables: nombres para guardar datos"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Variable", "body": "Espacio en memoria identificado con un nombre, en el que se almacena un valor que puede cambiar durante la ejecución del programa. Toda variable tiene un nombre, un tipo de dato y un valor en un momento determinado."}, {"type": "p", "text": "En Python no es necesario declarar el tipo de una variable antes de utilizarla. El lenguaje lo determina automáticamente a partir del valor que se le asigne. Esta característica facilita la escritura del código, aunque exige mayor atención por parte del programador al momento de usar cada dato correctamente:"}, {"type": "code", "code": "# Python infiere el tipo según el valor\nnombre    = \"Valentina\"        # str  → texto\nedad      = 19                 # int  → entero\npromedio  = 4.3                # float → decimal\nactivo    = True               # bool → verdadero/falso", "lang": "py", "prompts": []}, {"type": "p", "text": "Al nombrar variables, conviene seguir algunas prácticas que mejoran la legibilidad del programa. Es recomendable usar nombres descriptivos, de modo que precio_unitario resulte más claro que pu; separar palabras con guion bajo, como en total_a_pagar; y evitar nombres que empiecen con números o contengan espacios. Un nombre bien elegido facilita la comprensión del algoritmo y reduce la posibilidad de cometer errores."}, {"type": "h", "level": 2, "text": "2.3 Tipos de datos básicos"}, {"type": "p", "text": "Los programas trabajan con distintos tipos de datos, según la naturaleza de la información que necesiten procesar. Entre los más básicos se encuentran los siguientes:"}, {"type": "grid", "rows": [["Tipo", "Descripción", "Ejemplo en Python"], ["int", "Número entero, sin decimales", "edad = 20"], ["float", "Número con parte decimal", "nota = 3.8"], ["str", "Texto (cadena de caracteres)", "ciudad = \"Montería\""], ["bool", "Valor lógico: verdadero o falso", "aprobado = True"]]}, {"type": "p", "text": "Conocer el tipo de dato adecuado para cada caso es fundamental, ya que de ello depende la forma en que el programa interpreta, almacena y procesa la información."}, {"type": "h", "level": 2, "text": "2.4 Operadores: las herramientas del cálculo"}, {"type": "p", "text": "Los operadores son símbolos que permiten realizar operaciones con los datos. Algunos sirven para efectuar cálculos matemáticos; otros, para comparar valores o evaluar condiciones lógicas."}, {"type": "h", "level": 3, "text": "Aritméticos"}, {"type": "grid", "rows": [["Operador", "Operación", "Ejemplo", "Resultado"], ["+", "Suma", "5 + 3", "8"], ["-", "Resta", "10 - 4", "6"], ["*", "Multiplicación", "3 * 7", "21"], ["/", "División real", "15 / 4", "3.75"], ["//", "División entera", "15 // 4", "3"], ["%", "Módulo (residuo)", "15 % 4", "3"], ["**", "Potencia", "2 ** 8", "256"]]}, {"type": "h", "level": 3, "text": "Comparación y lógicos"}, {"type": "grid", "rows": [["Operador", "Significado", "Ejemplo", "Resultado"], ["==", "Igual a", "5 == 5", "True"], ["!=", "Distinto de", "5 != 3", "True"], [">", "Mayor que", "8 > 6", "True"], ["<", "Menor que", "3 < 1", "False"], [">=", "Mayor o igual", "4 >= 4", "True"], ["<=", "Menor o igual", "2 <= 5", "True"], ["and", "Ambas condiciones verdaderas", "True and False", "False"], ["or", "Al menos una verdadera", "True or False", "True"], ["not", "Negación lógica", "not True", "False"]]}, {"type": "callout", "kind": "error", "title": "Error frecuente", "body": "El operador de comparación es == y el de asignación es =. Confundirlos produce uno de los errores más comunes entre quienes comienzan a programar. Por ejemplo, escribir if x = 5: genera un error de sintaxis en Python, porque dentro de una estructura condicional la expresión debe evaluarse, no asignarse."}, {"type": "h", "level": 2, "text": "2.5 Ejercicios"}, {"type": "ej", "items": ["Para este enunciado, construye la tabla IPO: \"Un estudiante quiere saber cuántos días faltan para el examen final, dado que conoce la fecha de hoy y la fecha del examen.\"", "¿Qué tipo de dato usarías para: el número de estudiantes en un salón, el promedio de notas del grupo, el nombre del docente, si un estudiante aprobó o no?", "Calcula sin computador: (15 // 4) + (15 % 4) * 2 ** 2. Muestra el orden de precedencia paso a paso.", "Escribe una expresión lógica en Python que sea verdadera cuando una temperatura esté entre 15 y 30 grados Celsius.", "Declara las variables necesarias para un programa que calcule el área y el perímetro de un triángulo rectángulo. Asigna valores de prueba."]}]}, {"id": "cap3", "titulo": "Estructura secuencial", "kind": "cap", "num": 3, "unidad": "UNIDAD 1 · Fundamentos de la Lógica de Programación", "blocks": [{"type": "p", "text": "En un programa secuencial, las instrucciones se ejecutan de arriba hacia abajo, en el mismo orden en que fueron escritas, sin bifurcaciones ni repeticiones. Se trata de la forma más sencilla de construir un programa y, precisamente por eso, suele subestimarse. Sin embargo, comprender bien esta estructura es fundamental, porque sobre ella se apoyan después las decisiones, los ciclos y las demás construcciones de la programación."}, {"type": "h", "level": 2, "text": "3.1 Leer, calcular, mostrar"}, {"type": "p", "text": "La mayoría de los programas secuenciales responden a una lógica básica: recibir datos, procesarlos y mostrar un resultado. Esta secuencia aparece en numerosos problemas simples y constituye una de las primeras estructuras que todo estudiante debe reconocer y dominar. En Python, las funciones input() y print() cumplen un papel central en ese proceso, ya que permiten interactuar con el usuario de manera directa."}, {"type": "code", "code": "# Entrada: pedir un dato al usuario\nnombre = input(\"¿Cómo te llamas? \")\n \n# Salida: mostrar un resultado\nprint(\"Hola,\", nombre)\n \n# input() SIEMPRE devuelve texto (str)\n# Para trabajar con números, hay que convertir:\nedad = int(input(\"¿Cuántos años tienes? \"))\nnota = float(input(\"¿Cuál fue tu nota? \"))", "lang": "py", "prompts": ["¿Cómo te llamas? ", "¿Cuántos años tienes? ", "¿Cuál fue tu nota? "]}, {"type": "callout", "kind": "nota", "title": "Para tener en cuenta", "body": "La función input() devuelve texto, sin importar lo que el usuario escriba. Por eso, cuando se necesita trabajar con valores numéricos, es indispensable convertir el dato recibido al tipo correspondiente: int() para enteros y float() para decimales."}, {"type": "h", "level": 2, "text": "3.2 Asignación y actualización de variables"}, {"type": "code", "code": "# Asignación simple\ntemperatura = 35\n \n# Asignación con cálculo\ntemperatura_f = (temperatura * 9 / 5) + 32\n \n# Actualizar el valor de una variable\ncontador = 0\ncontador = contador + 1   # ahora vale 1\ncontador += 1             # forma abreviada: ahora vale 2", "lang": "py", "prompts": []}, {"type": "callout", "kind": "error", "title": "Error frecuente", "body": "La asignación no es una ecuación matemática. La instrucción contador = contador + 1 no tiene solución en álgebra, pero en programación significa: toma el valor actual de contador, súmale 1 y guarda el resultado de nuevo en esa variable."}, {"type": "h", "level": 2, "text": "3.3 Ejemplos completos"}, {"type": "h", "level": 3, "text": "Ejemplo 1 — Área de un triángulo"}, {"type": "code", "code": "# Entradas\nbase   = float(input(\"Base del triángulo (cm): \"))\naltura = float(input(\"Altura del triángulo (cm): \"))\n \n# Proceso\narea = (base * altura) / 2\n \n# Salida\nprint(f\"Área del triángulo: {area:.2f} cm²\")", "lang": "py", "prompts": ["Base del triángulo (cm): ", "Altura del triángulo (cm): "]}, {"type": "h", "level": 3, "text": "Ejemplo 2 — Conversión de temperatura"}, {"type": "code", "code": "celsius     = float(input(\"Temperatura en Celsius: \"))\nfahrenheit  = (celsius * 9 / 5) + 32\nkelvin      = celsius + 273.15\nprint(f\"Fahrenheit: {fahrenheit:.1f}°\")\nprint(f\"Kelvin:     {kelvin:.2f} K\")", "lang": "py", "prompts": ["Temperatura en Celsius: "]}, {"type": "h", "level": 3, "text": "Ejemplo 3 — Liquidación de jornal agrícola"}, {"type": "p", "text": "Un trabajador agrícola de la región trabaja una cantidad variable de días. Gana $55.000 por día, con descuento del 4% a salud y 4% a pensión sobre el total bruto."}, {"type": "code", "code": "dias        = int(float(input(\"Días trabajados: \")))\nsalario_dia = 55_000\nbruto       = dias * salario_dia\nsalud       = bruto * 0.04\npension     = bruto * 0.04\nneto        = bruto - salud - pension\nprint(f\"Salario bruto:    ${bruto:,.0f}\")\nprint(f\"Descuento salud:  ${salud:,.0f}\")\nprint(f\"Descuento pensión:${pension:,.0f}\")\nprint(f\"Pago neto:        ${neto:,.0f}\")", "lang": "py", "prompts": ["Días trabajados: "]}, {"type": "h", "level": 2, "text": "3.4 Ejercicios"}, {"type": "ej", "items": ["Escribe un programa que pida el radio de una circunferencia y calcule su área y su longitud. Usa π = 3.14159.", "Un estudiante tiene cuatro parciales con pesos 20%, 20%, 25% y 35%. Escribe el programa que calcule la nota definitiva.", "Un taxi en Montería cobra $4.500 de bajada de bandera y $950 por kilómetro. Calcula la tarifa total para una distancia dada por el usuario.", "Escribe un programa que convierta una cantidad de segundos en horas, minutos y segundos. Por ejemplo: 3725 → 1 hora, 2 minutos, 5 segundos.", "Un comerciante aplica IVA del 19%. Dado el precio con IVA incluido, calcula el precio base y el valor del IVA por separado."]}]}, {"id": "cap4", "titulo": "Estructuras condicionales", "kind": "cap", "num": 4, "unidad": "UNIDAD 1 · Fundamentos de la Lógica de Programación", "blocks": [{"type": "p", "text": "Los programas secuenciales hacen lo mismo sin importar los datos que reciben. Pero casi cualquier problema real tiene caminos distintos según las circunstancias: si la nota es mayor de 3.0 el estudiante aprueba, si no, reprueba. Si el total supera cierto valor, aplica descuento. Si la contraseña es correcta, permite el acceso. Las estructuras condicionales son el mecanismo que permite que un programa tome ese tipo de decisiones."}, {"type": "h", "level": 2, "text": "4.1 La sentencia if"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Estructura condicional", "body": "Mecanismo que evalúa una expresión lógica (verdadera o falsa) y ejecuta uno u otro bloque de instrucciones según el resultado."}, {"type": "code", "code": "if condicion:\n    # bloque que se ejecuta solo si condicion es True\n    instruccion", "lang": "sintaxis", "prompts": []}, {"type": "p", "text": "Ejemplo directo:"}, {"type": "code", "code": "nota = float(input(\"Ingresa tu nota: \"))\n \nif nota >= 3.0:\n    print(\"Aprobaste el examen.\")", "lang": "py", "prompts": ["Ingresa tu nota: "]}, {"type": "callout", "kind": "error", "title": "Error frecuente", "body": "La indentación en Python no es un detalle estético: es parte de la sintaxis. Todo lo que esté dentro del if debe tener exactamente 4 espacios de sangría. Sin esa sangría el programa falla."}, {"type": "h", "level": 2, "text": "4.2 La cláusula else"}, {"type": "p", "text": "La cláusula else se ejecuta cuando la condición del if es falsa. Los dos bloques son mutuamente excluyentes: siempre se ejecuta uno, nunca los dos."}, {"type": "code", "code": "nota = float(input(\"Ingresa tu nota: \"))\n \nif nota >= 3.0:\n    print(\"Aprobaste el examen.\")\nelse:\n    print(\"Reprobaste. Necesitas presentar habilitación.\")", "lang": "py", "prompts": ["Ingresa tu nota: "]}, {"type": "h", "level": 2, "text": "4.3 Encadenamiento con elif"}, {"type": "p", "text": "Cuando hay más de dos posibilidades, se encadenan condiciones con elif. Python evalúa cada condición en orden y entra en el bloque de la primera que resulte verdadera:"}, {"type": "code", "code": "nota = float(input(\"Nota (0.0 a 5.0): \"))\n \nif nota >= 4.5:\n    categoria = \"Excelente\"\nelif nota >= 4.0:\n    categoria = \"Sobresaliente\"\nelif nota >= 3.5:\n    categoria = \"Aceptable\"\nelif nota >= 3.0:\n    categoria = \"Aprobado\"\nelse:\n    categoria = \"Reprobado\"\n \nprint(f\"Resultado: {categoria}\")", "lang": "py", "prompts": ["Nota (0.0 a 5.0): "]}, {"type": "callout", "kind": "nota", "title": "Para tener en cuenta", "body": "El orden de las condiciones importa. Poner primero if nota >= 3.0 haría que todos los estudiantes con nota mayor de 3.0 entraran ahí y los elif nunca se evaluarían. Siempre empieza por la condición más restrictiva."}, {"type": "h", "level": 2, "text": "4.4 Condicionales anidados"}, {"type": "p", "text": "Un if puede contener otro if dentro. Útil cuando una decisión depende de otra condición que solo tiene sentido evaluar después de la primera:"}, {"type": "code", "code": "edad         = int(input(\"Edad: \"))\ntiene_cedula = input(\"¿Tiene cédula? (si/no): \").lower().strip()\n \nif edad >= 18:\n    if tiene_cedula == \"si\":\n        print(\"Puede votar.\")\n    else:\n        print(\"Tiene la edad pero necesita cédula.\")\nelse:\n    print(\"Menor de edad. No puede votar aún.\")", "lang": "py", "prompts": ["Edad: ", "¿Tiene cédula? (si/no): "]}, {"type": "h", "level": 2, "text": "4.5 Errores frecuentes"}, {"type": "grid", "rows": [["Error", "Corrección"], ["if x = 5: (asignación en vez de comparación)", "if x == 5: (usar doble igual)"], ["Olvidar los dos puntos al final del if", "if condicion: (los dos puntos son obligatorios)"], ["Mezclar espacios e indentación inconsistente", "Configurar el editor para usar siempre 4 espacios"], ["Comparar strings sin convertir a minúsculas", "Usar .lower().strip() antes de comparar"]]}, {"type": "h", "level": 2, "text": "4.6 Ejemplos completos"}, {"type": "h", "level": 3, "text": "Clasificador de números"}, {"type": "code", "code": "n = float(input(\"Ingresa un número: \"))\n \nif n > 0:\n    print(\"El número es positivo.\")\nelif n < 0:\n    print(\"El número es negativo.\")\nelse:\n    print(\"El número es cero.\")", "lang": "py", "prompts": ["Ingresa un número: "]}, {"type": "h", "level": 3, "text": "Calculadora con validación de división"}, {"type": "code", "code": "a  = float(input(\"Primer número: \"))\nop = input(\"Operación (+, -, *, /): \").strip()\nb  = float(input(\"Segundo número: \"))\n \nif op == \"+\":\n    print(a + b)\nelif op == \"-\":\n    print(a - b)\nelif op == \"*\":\n    print(a * b)\nelif op == \"/\":\n    if b != 0:\n        print(a / b)\n    else:\n        print(\"Error: no se puede dividir entre cero.\")\nelse:\n    print(\"Operación no reconocida.\")", "lang": "py", "prompts": ["Primer número: ", "Operación (+, -, *, /): ", "Segundo número: "]}, {"type": "h", "level": 2, "text": "4.7 Ejercicios"}, {"type": "ej", "items": ["Escribe un programa que lea la temperatura ambiente y clasifique el clima: menos de 10°C es frío, de 10 a 25°C es templado, más de 25°C es caluroso.", "Un banco aprueba créditos si el solicitante tiene ingresos mayores de $2.000.000 Y lleva más de dos años en el mismo trabajo. Escribe el programa de validación.", "Escribe un programa que determine si un año es bisiesto (divisible entre 4, excepto centenarios que solo lo son si son divisibles entre 400).", "Un supermercado aplica descuentos: compras entre $50.000 y $100.000 → 5%; entre $100.001 y $200.000 → 10%; más de $200.000 → 15%. Escribe el programa.", "Diseña el pseudocódigo y el código Python para un programa de acceso con PIN. El PIN correcto es 1234. El usuario tiene tres intentos; al tercer fallo, el programa bloquea el acceso."]}]}, {"id": "cap5", "titulo": "El ciclo for", "kind": "cap", "num": 5, "unidad": "UNIDAD 2 · Estructuras de Control Iterativas", "blocks": [{"type": "p", "text": "Calcular el promedio de 30 estudiantes exige sumar 30 notas. Hacerlo con 30 instrucciones suma distintas es posible pero absurdo. Las estructuras iterativas permiten repetir un bloque de instrucciones un número determinado de veces, con un código que no crece aunque los datos sean muchos."}, {"type": "h", "level": 2, "text": "5.1 Estructura y sintaxis"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Ciclo for", "body": "Estructura que recorre una secuencia de valores y ejecuta su bloque una vez por cada elemento. Se usa cuando el número de iteraciones se conoce antes de comenzar el ciclo."}, {"type": "code", "code": "for variable in secuencia:\n    # instrucciones que se repiten\n    # variable toma el siguiente valor en cada vuelta", "lang": "sintaxis", "prompts": []}, {"type": "h", "level": 2, "text": "5.2 La función range()"}, {"type": "p", "text": "range() genera secuencias de enteros. Tiene tres parámetros: inicio (por defecto 0), fin (obligatorio, excluido del resultado) y paso (por defecto 1):"}, {"type": "code", "code": "range(5)          # 0, 1, 2, 3, 4\nrange(1, 6)       # 1, 2, 3, 4, 5\nrange(0, 10, 2)   # 0, 2, 4, 6, 8\nrange(10, 0, -1)  # 10, 9, 8, ..., 1", "lang": "py", "prompts": []}, {"type": "callout", "kind": "error", "title": "Error frecuente", "body": "range(n) genera valores desde 0 hasta n-1. Para incluir el valor n hay que escribir range(n+1). Este olvido produce el error más frecuente en ciclos for: el programa hace una iteración de menos."}, {"type": "h", "level": 2, "text": "5.3 Contadores y acumuladores"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Contador", "body": "Variable que lleva la cuenta de cuántas veces ocurre algo. Se inicializa en 0 y se incrementa en 1 en cada iteración relevante."}, {"type": "callout", "kind": "concepto", "title": "Concepto — Acumulador", "body": "Variable que va sumando (o multiplicando) valores a lo largo de las iteraciones. Para sumas se inicializa en 0; para productos, en 1."}, {"type": "code", "code": "# Contador: cuántos números pares hay entre 1 y 20\ncontador_pares = 0\nfor numero in range(1, 21):\n    if numero % 2 == 0:\n        contador_pares += 1\nprint(\"Pares:\", contador_pares)\n \n# Acumulador: suma de 1 a 10\nsuma = 0\nfor i in range(1, 11):\n    suma += i\nprint(\"Suma:\", suma)   # 55", "lang": "py", "prompts": []}, {"type": "h", "level": 2, "text": "5.4 Ejemplos completos"}, {"type": "h", "level": 3, "text": "Factorial"}, {"type": "code", "code": "n         = int(input(\"Número: \"))\nfactorial = 1\nfor i in range(1, n + 1):\n    factorial *= i\nprint(f\"{n}! = {factorial}\")", "lang": "py", "prompts": ["Número: "]}, {"type": "h", "level": 3, "text": "Promedio y conteo de aprobados"}, {"type": "code", "code": "n      = int(input(\"Cantidad de estudiantes: \"))\nsuma   = 0\naprob  = 0\nfor i in range(1, n + 1):\n    nota   = float(input(f\"Nota estudiante {i}: \"))\n    suma  += nota\n    if nota >= 3.0:\n        aprob += 1\npromedio = suma / n\nprint(f\"Promedio: {promedio:.2f}\")\nprint(f\"Aprobados: {aprob} de {n}\")", "lang": "py", "prompts": ["Cantidad de estudiantes: "]}, {"type": "h", "level": 2, "text": "5.5 Ejercicios"}, {"type": "ej", "items": ["Usa un ciclo for para imprimir todos los múltiplos de 7 entre 7 y 100.", "Calcula la suma de los cuadrados de los primeros N números naturales.", "Un vendedor recibe el 8% de comisión por cada venta. Dado el número de ventas del mes y el monto de cada una, calcula la comisión total y el promedio por venta.", "Genera e imprime la tabla de multiplicar completa (del 1 al 10) usando ciclos for anidados.", "Escribe un programa que encuentre todos los divisores de un número entero positivo dado por el usuario."]}]}, {"id": "cap6", "titulo": "El ciclo while", "kind": "cap", "num": 6, "unidad": "UNIDAD 2 · Estructuras de Control Iterativas", "blocks": [{"type": "p", "text": "El ciclo for es ideal cuando el número de iteraciones está definido antes de comenzar. Pero hay situaciones donde no se sabe cuántas vueltas serán necesarias: depende de lo que el usuario ingrese, de cuándo se cumpla una condición, o de cuándo lleguen ciertos datos. Para esos casos existe el while."}, {"type": "h", "level": 2, "text": "6.1 Estructura y sintaxis"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Ciclo while", "body": "Estructura que repite un bloque de instrucciones mientras una condición sea verdadera. La condición se evalúa antes de cada iteración."}, {"type": "code", "code": "while condicion:\n    # instrucciones que se repiten\n    # algo dentro del ciclo debe eventualmente hacer la condicion False", "lang": "sintaxis", "prompts": []}, {"type": "grid", "rows": [["Situación", "Ciclo recomendado"], ["Imprimir los números del 1 al 100", "for (número fijo de iteraciones)"], ["Leer notas hasta que el usuario ingrese -1", "while (cantidad desconocida)"], ["Recorrer una lista de 50 productos", "for (tamaño definido)"], ["Pedir contraseña hasta que sea correcta", "while (no sé cuántos intentos)"]]}, {"type": "h", "level": 2, "text": "6.2 Ciclos con centinela"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Valor centinela", "body": "Valor especial que el usuario ingresa para indicar que desea terminar el ciclo de entrada de datos. No es un dato válido del problema: es solo una señal de parada."}, {"type": "code", "code": "suma   = 0\ncount  = 0\nnumero = float(input(\"Número (0 para terminar): \"))\n \nwhile numero != 0:\n    suma  += numero\n    count += 1\n    numero = float(input(\"Número (0 para terminar): \"))\n \nif count > 0:\n    print(f\"Promedio: {suma / count:.2f}\")\nelse:\n    print(\"No ingresaste ningún número.\")", "lang": "py", "prompts": ["Número (0 para terminar): ", "Número (0 para terminar): "]}, {"type": "callout", "kind": "error", "title": "Error frecuente", "body": "Un ciclo while cuya condición nunca llega a ser False se ejecuta para siempre y bloquea el programa. Siempre verifica que alguna instrucción dentro del ciclo modifique las variables que aparecen en la condición."}, {"type": "h", "level": 2, "text": "6.3 Patrón do-while en Python"}, {"type": "p", "text": "Python no tiene un ciclo do-while nativo, pero puede simularse con while True y la instrucción break. La diferencia con un while normal es que el cuerpo siempre se ejecuta al menos una vez, antes de verificar la condición:"}, {"type": "code", "code": "# Pedir un número entre 1 y 10 hasta que sea válido\nwhile True:\n    n = int(input(\"Ingresa un número entre 1 y 10: \"))\n    if 1 <= n <= 10:\n        break\n    print(\"Número fuera de rango. Intenta de nuevo.\")\n \nprint(f\"Ingresaste: {n}\")", "lang": "py", "prompts": ["Ingresa un número entre 1 y 10: "]}, {"type": "h", "level": 2, "text": "6.4 Ejemplos completos"}, {"type": "h", "level": 3, "text": "Menú de opciones"}, {"type": "code", "code": "while True:\n    print(\"\\n--- MENÚ ---\")\n    print(\"1. Sumar\")\n    print(\"2. Restar\")\n    print(\"3. Salir\")\n    op = input(\"Opción: \").strip()\n    if op == \"1\":\n        a = float(input(\"a = \"))\n        b = float(input(\"b = \"))\n        print(\"Resultado:\", a + b)\n    elif op == \"2\":\n        a = float(input(\"a = \"))\n        b = float(input(\"b = \"))\n        print(\"Resultado:\", a - b)\n    elif op == \"3\":\n        print(\"Hasta luego.\")\n        break\n    else:\n        print(\"Opción no válida.\")", "lang": "py", "prompts": ["Opción: ", "a = ", "b = ", "a = ", "b = "]}, {"type": "h", "level": 2, "text": "6.5 Ejercicios"}, {"type": "ej", "items": ["Escribe un programa que pida números positivos hasta que el usuario ingrese uno negativo. Al final muestra el mayor y el menor de los ingresados.", "Simula el lanzamiento de un dado (random.randint(1,6)) hasta que salga un 6. Cuenta cuántos lanzamientos se necesitaron.", "Implementa un sistema de login: el usuario tiene tres intentos para ingresar la contraseña \"Cordoba2025\". Si falla los tres, bloquea el acceso.", "Escribe un programa de caja registradora: ingresa el precio de cada producto hasta escribir 0, luego muestra el total, el número de artículos y el promedio por artículo.", "Escribe un programa que calcule la suma de la serie 1 + 1/2 + 1/3 + … + 1/n, donde n es ingresado por el usuario."]}]}, {"id": "cap7", "titulo": "Problemas reales con ciclos", "kind": "cap", "num": 7, "unidad": "UNIDAD 2 · Estructuras de Control Iterativas", "blocks": [{"type": "p", "text": "Con los dos tipos de ciclos ya en mano, se pueden resolver problemas bastante más elaborados. Este capítulo trabaja cuatro patrones que aparecen con frecuencia en la programación real: máximo y mínimo, validación de entradas, ciclos anidados y estadísticas básicas."}, {"type": "h", "level": 2, "text": "7.1 Búsqueda de máximo y mínimo"}, {"type": "p", "text": "El patrón es siempre el mismo: se asume que el primer valor es el extremo buscado, y se compara con cada valor siguiente. Si alguno supera al actual, se actualiza la referencia."}, {"type": "code", "code": "n      = int(input(\"¿Cuántos números? \"))\nprimer = float(input(\"Número 1: \"))\nmaximo = primer\nminimo = primer\n \nfor i in range(2, n + 1):\n    numero = float(input(f\"Número {i}: \"))\n    if numero > maximo:\n        maximo = numero\n    if numero < minimo:\n        minimo = numero\n \nprint(f\"Mayor: {maximo}  |  Menor: {minimo}\")", "lang": "py", "prompts": ["¿Cuántos números? ", "Número 1: "]}, {"type": "callout", "kind": "nota", "title": "Para tener en cuenta", "body": "Inicializar el máximo con el primer valor real es mejor que usar 0 o un número arbitrario. Con 0, el algoritmo fallaría si todos los números son negativos."}, {"type": "h", "level": 2, "text": "7.2 Ciclos anidados"}, {"type": "p", "text": "Un ciclo puede contener otro en su interior. El ciclo interno se ejecuta completo en cada vuelta del externo. El total de iteraciones es el producto de las de cada ciclo:"}, {"type": "code", "code": "# Tabla de multiplicar del 1 al 5\nfor fila in range(1, 6):\n    for col in range(1, 11):\n        print(f\"{fila} x {col:2} = {fila*col:3}\", end=\"   \")\n    print()", "lang": "py", "prompts": []}, {"type": "h", "level": 2, "text": "7.3 Ejemplo completo — Estadísticas de ventas mensuales"}, {"type": "code", "code": "meses   = [\"Enero\",\"Febrero\",\"Marzo\",\"Abril\",\"Mayo\",\"Junio\",\n           \"Julio\",\"Agosto\",\"Septiembre\",\"Octubre\",\"Noviembre\",\"Diciembre\"]\ntotal   = 0\nmayor   = -1\nmenor   = float(\"inf\")\nmejor   = \"\"\npeor    = \"\"\n \nfor mes in meses:\n    ventas = float(input(f\"Ventas de {mes}: $\"))\n    total += ventas\n    if ventas > mayor:\n        mayor = ventas; mejor = mes\n    if ventas < menor:\n        menor = ventas; peor  = mes\n \npromedio = total / 12\nprint(f\"Total anual:   ${total:,.0f}\")\nprint(f\"Promedio/mes:  ${promedio:,.0f}\")\nprint(f\"Mejor mes:     {mejor} (${mayor:,.0f})\")\nprint(f\"Peor mes:      {peor} (${menor:,.0f})\")", "lang": "py", "prompts": []}, {"type": "h", "level": 2, "text": "7.4 Ejercicios"}, {"type": "ej", "items": ["Lee las notas de 5 materias para cada uno de N estudiantes. Calcula el promedio de cada estudiante y el promedio general del grupo.", "Genera un triángulo de asteriscos de N filas usando ciclos anidados. La fila 1 tiene 1 asterisco, la 2 tiene 2, y así sucesivamente.", "Cuenta cuántos números entre 1 y 1000 son divisibles entre 3, cuántos entre 7 y cuántos entre ambos.", "Simula el lanzamiento de dos dados 1000 veces. Cuenta cuántas veces la suma es 7 y muestra la frecuencia relativa.", "Escribe un programa que reciba precios de productos (el ingreso termina con -1) y calcule total, promedio, precio más alto y precio más bajo."]}]}, {"id": "cap8", "titulo": "Estándares de representación", "kind": "cap", "num": 8, "unidad": "UNIDAD 3 · Representación y Validación de Algoritmos", "blocks": [{"type": "p", "text": "Saber cómo funciona un algoritmo en la cabeza es una cosa. Comunicárselo a otra persona —o a uno mismo tres semanas después— es otra. Sin una forma acordada de escribirlo, dos programadores pueden leer el mismo enunciado y diseñar dos algoritmos completamente distintos, ninguno necesariamente incorrecto, pero incompatibles entre sí."}, {"type": "p", "text": "Para eso existen los estándares de representación."}, {"type": "h", "level": 2, "text": "8.1 Pseudocódigo y su jerarquía"}, {"type": "p", "text": "El pseudocódigo es un lenguaje intermedio entre el español cotidiano y el código de programación. No tiene una sintaxis fija universal, pero sí convenciones que la mayoría de textos académicos comparten. Su objetivo es escribir la lógica con suficiente precisión para que pueda traducirse a cualquier lenguaje sin necesidad de rediseñar el algoritmo."}, {"type": "image", "data": "data:image/webp;base64,UklGRohgAABXRUJQVlA4IHxgAAAwxgGdASpMBK0CPmEulEekIqIhorH5yIAMCWdu+Dh6FRZ7LhNXKAzhkwO+Tmn4x/a/y3qEc0+Q0mbFt7Wyp/gP4vz1/6z9n/ch/VvUD/t3oZ9FvmP/nP+X/dT3iP97+7Xuk/vf+89g39mfWj/9nsbf5b/e///3Hv2a9Zv/5+zb/jf/Z+53treoB///bk6bfpV/RPx398Pxr9O/sn9o/Zb+4+l/4f8s/Vv73+1f9u9h/+w8mnm371/mv7t6jfxf7K/gP7P/lP+L/hPav/M/3v92P8L6G/j36X/mf7Z+5H+A+QX8a/lP96/tX7wf3T1L/8DtYsq/03+x/ynsC+pvzD/X/3n/Q/93/Te1T65/nv77+4P7////6D/Lv6//lf7l+9H9z+wD+Pfz7/Jf3H97/8T/////9uf4HwMPr3+b/6X+a/Gj7Av5T/Xv95/f/9b+030i/xn/b/zH+y/cD2j/mP+S/7H+b/1f7ZfYL/Kv6x/zf75/qf2z8EX7u///3XP3X//41Q2VQWgSodTKgtAlQ6mVBaBKh1MqC0CVDqZUFoEqHUyoLQJUOplQWgSodTKgtAlQ6mVBaBKh1MqC0CVDqZUFoEqHUyoLQJUOplQWgSobdW9ZzTR6SEld5HsvZ8ieILS2Z8z+xyDcykAPIyTt++GH6ZJgUPaVFY+U5jy8BQcizEOMG/8Sgf6jI8x8MDM7Dfrf6uWxiZP gCHIFQ8gSkFJxRgjCuBUHrxwEAe1TCJ9uUR/39Wdc3KZTMgaetwM4i0u3zecZgU/nhkOSHGUQr6iXW5FOYZKR9WCdruqksNoMPRhm6sLlw0dFq+VUPkaLSSbUuB46KuXJmEgkdXgIZK2AAAAAhmKvviM9RQuanTHC89IPk8u2qvgcGH97CHpbultojYoAsDGwk+B8SznYEF4395AAAAAAAAAAAAAA", "caption": "Figura 3  — Jerarquía de estándares: del lenguaje natural a la descripción estructurada"}, {"type": "p", "text": "Nota. Cada nivel agrega más precisión y menos ambigüedad."}, {"type": "p", "text": "La jerarquía tiene tres niveles. El primero es el lenguaje natural: describe lo que hace el algoritmo en palabras de todos los días, sin estructuras específicas. Es útil para empezar, pero demasiado ambiguo para ser definitivo. El segundo nivel incorpora estructuras de programación: SI, MIENTRAS, PARA, con una sintaxis acordada. El tercero es la descripción estructurada, donde cada elemento del algoritmo tiene un formato preciso y directamente traducible a código."}, {"type": "p", "text": "Un pseudocódigo bien escrito para calcular el promedio de un grupo:"}, {"type": "code", "code": "INICIO\n  LEER n\n  suma ← 0\n  PARA i ← 1 HASTA n HACER\n    LEER nota\n    suma ← suma + nota\n  FIN_PARA\n  promedio ← suma / n\n  ESCRIBIR \"Promedio:\", promedio\nFIN", "lang": "pseudo", "prompts": []}, {"type": "h", "level": 2, "text": "8.2 Diagramas de flujo: símbolos y reglas"}, {"type": "p", "text": "Un diagrama de flujo es la forma más directa de comunicar un algoritmo visualmente. Hay equipos de desarrollo que nunca escriben pseudocódigo: diseñan el diagrama primero, lo revisan con colegas y solo después pasan al código. Funciona porque el diagrama muestra algo que el código no muestra a primera vista: los caminos. Se ve de un vistazo cuántas rutas posibles tiene el programa, dónde se toman decisiones y cuáles instrucciones se repiten."}, {"type": "p", "text": "El conjunto de símbolos que se usa en este curso sigue el estándar ISO 5807. Son seis, y cada uno tiene exactamente un propósito:"}, {"type": "image", "data": "data:image/webp;base64,UklGRnxT l código: de un vistazo se ven los dos caminos de error, el único camino de éxito y el punto donde ambos errores confluyen al final."}, {"type": "h", "level": 3, "text": "Cuatro reglas que no admiten excepción"}, {"type": "p", "text": "Primera: todo diagrama empieza con un terminal de INICIO y termina con uno de FIN, sin excepción, aunque el problema parezca simple. Segunda: cada línea de flujo lleva flecha; sin flecha no se sabe hacia dónde va el control. Tercera: el rombo de decisión tiene exactamente dos salidas, una marcada Sí y otra marcada No, no tres, no una. Cuarta: si dos líneas de flujo necesitan cruzarse sin conectarse, se usa el símbolo de conector para evitar la ambigüedad visual."}, {"type": "callout", "kind": "error", "title": "Error frecuente", "body": "El error más frecuente al dibujar diagramas es omitir una de las dos salidas del rombo. Un rombo con una sola salida indica que la condición siempre es verdadera lo cual casi nunca es lo que se quiere decir. Revisa cada rombo antes de dar el diagrama por terminado."}, {"type": "h", "level": 2, "text": "8.3 Del pensamiento al algoritmo estandarizado"}, {"type": "p", "text": "No se pasa directamente del problema al diagrama. Hay un proceso intermedio que vale la pena seguir:"}, {"type": "image", "data": "data:image/webp;base64,UklGRiw9AABXRUJQVlA4ICA9AAAwRAGdASpMBFMCPmEwlEgkIyIhIPdJIIAMCWdu/FNZxBDnKcWkp+2f6fnj8k+LkiS9R6XyN+qbO3/tfUL+uPYA/X3zvvU3/a/+d6hf6V/v/Vp/33qU/w3qAf2v/Uesr6mP+P/8XsG+cp/8PZa/w3/u/dL2wv/p7AH//9vzpl+lv9q/Gn3dfFfzz+z/3L9lPN/8T+W/t35O/4j2ecafm/7t/u/79/ffYb+Ofa38D/dv8X/xf7T7O/43+2+LP5f+k/6X+6fuz/l/kC/Hv5P/hf65+5X+D9O/Y26T/qvQF9UPm/+u/v372f5r25fbv9R/bP7z7Cfnn9q/0f9//a3/J//////oD/H/6H/rv8H+9H+d/////+0P8l4N/3z/V/sR8AP8x/rv/G/w35OfSp/M/+z/UfmR7TfzP/L/+X/L/6n5B/5d/Xf+h/gv9B3QfSQ/eEOOdDTPhl8gqc6GmfDL5BU50NM+GXyCpzoaZ8MvkFTnQ0z4ZfIKnOhpnwy+QVOdDTPhl8gqc6GmfDL5BU50NM+GXyCpzoaZ8Mt1ER5XiccSj9RA8hNZRMAPIYxhRggGFKOOkD8DaZzhXSk50NM+GXyCpzoaZ8MvkFTnQplk7wzrDn9+fZ4h62V32bXOrfwolxI9UmDJxMjS0uD0DsBkv5USq Wy/V0kd5uOlVM3r9rgWzzO7P5C5blhMCiHpqnI+/WrFaZRL93kFmCRpDmU3024/NXxXUBcJaXOOzzSiQxferjmzvpHEMDyNwyZ2jB0rR6E2hk6X8Ld7BICpRMxA70oSoLJ1WgUrLTCG6zsjHa/fhcwD8V1B7FZdbX0JOjGgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=", "caption": "Figura 6  — Proceso de representación algorítmica"}, {"type": "p", "text": "Nota. Cinco etapas que convierten el pensamiento del programador en un algoritmo preciso y comunicable."}, {"type": "p", "text": "El proceso tiene cinco etapas. En la abstracción se identifica qué parte del problema tiene solución algorítmica. En el modelado formal se eligen las estructuras de control apropiadas. En la comunicación se escribe el pseudocódigo o se dibuja el diagrama. En la documentación técnica se verifica la coherencia entre el diagrama y el código. En el pensamiento computacional se evalúa si la solución es eficiente y generalizable."}, {"type": "h", "level": 2, "text": "8.4 Herramientas para diagramar"}, {"type": "grid", "rows": [["Herramienta", "Descripción"], ["draw.io (diagrams.net)", "Gratuita, en línea, sin instalación. Exporta a PNG, PDF y SVG. Muy recomendada."], ["PSeInt", "Programa gratuito para Windows, Linux y Mac. Escribe pseudocódigo y genera el diagrama automáticamente. Ideal para este curso."], ["Lucidchart", "En línea, más funciones. Tiene versión gratuita limitada."]]}, {"type": "callout", "kind": "nota", "title": "Para tener en cuenta", "body": "PSeInt permite escribir el pseudocódigo y genera el diagrama de flujo automáticamente. También ejecuta el pseudocódigo para verificar que funciona. Descárgalo en sourceforge.net/projects/pseint/"}, {"type": "h", "level": 2, "text": "8.5 Ejercicios"}, {"type": "ej", "items": ["Dibuja el diagrama de flujo para un algoritmo que determine si un número es par o impar.", "Escribe el pseudocódigo para el mayor de tres números. Luego dibuja su diagrama de flujo.", "Convierte este pseudocódigo a Python y verifica que funciona: INICIO / LEER base, altura / area ← (base * altura) / 2 / ESCRIBIR area / FIN", "Diseña el diagrama de flujo para un cajero automático que valide el PIN (3 intentos máximo) y permita retirar efectivo si hay saldo suficiente.", "Dibuja el diagrama de flujo de un ciclo que calcule la suma de los números del 1 al N ingresado por el usuario."]}]}, {"id": "cap9", "titulo": "Pruebas de escritorio", "kind": "cap", "num": 9, "unidad": "UNIDAD 3 · Representación y Validación de Algoritmos", "blocks": [{"type": "p", "text": "Un algoritmo que parece correcto en papel no siempre funciona bien con todos los datos posibles. Las pruebas de escritorio son la técnica más básica para verificar que la lógica es sólida antes de ejecutar el código y a veces, en vez de ejecutarlo."}, {"type": "h", "level": 2, "text": "9.1 Qué es una prueba de escritorio"}, {"type": "callout", "kind": "concepto", "title": "Concepto — Prueba de escritorio", "body": "Técnica de verificación manual de un algoritmo: el programador simula su ejecución paso a paso, anotando el valor de cada variable en cada instrucción."}, {"type": "p", "text": "Las pruebas de escritorio detectan errores lógicos, los que no producen mensajes de error pero sí producen resultados incorrectos. Son especialmente útiles cuando el algoritmo todavía está en pseudocódigo o diagrama de flujo, antes de escribir código."}, {"type": "h", "level": 2, "text": "9.2 Cómo trazar un algoritmo: del diagrama a la tabla"}, {"type": "p", "text": "El primer paso es tener el algoritmo en alguna forma que pueda seguirse instrucción por instrucción. Puede ser código Python, pseudocódigo o un diagrama de flujo. Los tres sirven igual para la traza; la diferencia es que el diagrama de flujo hace visible algo que el código esconde: los caminos. Se ven claramente cuáles instrucciones se ejecutan y cuáles se saltan, porque cada flecha dice exactamente hacia dónde va el control del programa."}, {"type": "p", "text": "Mira el siguiente diagrama. Representa un algoritmo que calcula la suma de todos los números pares desde 1 hasta N. Antes de l
