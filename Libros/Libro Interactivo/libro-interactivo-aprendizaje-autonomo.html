documentación, comportamientos observables como la participación en un foro, o reflexiones personales como un diario de aprendizaje. Los instrumentos de autoevaluación (rúbricas, listas de cotejo, cuestionarios) guían ese juicio para que no dependa solo de la intuición. Y ninguna autoevaluación se completa sin una retroalimentación personal que identifique áreas de mejora y proponga pasos concretos, porque emitir un juicio sin consecuencias prácticas no cambia nada.", "b": false}, {"type": "h2", "text": "8.3  Qué es la mejora continua: su ciclo y estrategias"}, {"type": "p", "text": "La mejora continua es un enfoque sistemático para optimizar procesos y resultados de forma progresiva. Proviene originalmente de la ingeniería de calidad, en particular del ciclo PDCA (planear, hacer, verificar, actuar), pero se aplica igual de bien al aprendizaje: planear implica definir metas y estrategias basadas en un análisis previo; hacer, poner en práctica esas estrategias; verificar, comparar los resultados contra las metas para identificar brechas; y actuar, ajustar lo que no funcionó antes de repetir el ciclo.", "b": false}, {"type": "p", "text": "Traducir la autoevaluación en mejora concreta exige pasos deliberados. Establecer metas de mejora en formato SMART a partir de lo que arrojó la autoevaluación evita que las buenas intenciones se queden en eso. Ajustar las estrategias de aprendizaje cuando una técnica o recurso no está dando resultado, en lugar de insistir por costumbre, es el corazón del ciclo. Con el tiempo, este proceso deja de sentirse como una tarea adicional y se convierte en parte normal de cómo el estudiante aprende.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Ciclo PDCA aplicado al aprendizaje", "body": "Planear, hacer, verificar y actuar. Un modelo tomado de la gestión de calidad que, aplicado al estudio, convierte la autoevaluación en un proceso repetible: cada vuelta del ciclo usa lo aprendido en la anterior para ajustar la siguiente."}, {"type": "h2", "text": "8.4  Ejemplo completo"}, {"type": "p", "text": "Al cerrar un proyecto de curso, un estudiante se autoevalúa con una rúbrica sencilla que él mismo diseñó, cubriendo calidad de código, cumplimiento de requisitos y documentación. Nota que su documentación quedó débil en las tres entregas del semestre. En lugar de aceptarlo como una debilidad permanente, define una meta SMART para el siguiente proyecto: documentar cada función a medida que la escribe, no al final, y medir cuántas funciones cumplió esa regla. Es el ciclo PDCA funcionando en la práctica, sin necesitar ese nombre para funcionar.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Diseña una lista de cotejo con al menos cinco criterios para autoevaluar tu último trabajo o proyecto académico.\n2. Aplica el ciclo PDCA a una meta de aprendizaje que tengas pendiente: escribe qué planeas, qué harás, cómo verificarás el resultado y qué ajustarás según lo que encuentres.\n3. Organiza una sesión de coevaluación con un compañero: intercambien un trabajo reciente y den retroalimentación estructurada usando los mismos criterios."}]}, {"id": "cap9", "titulo": "Fuentes de información para la actualización tecnológica", "kind": "cap", "num": 9, "unidad": "UNIDAD 3 · BÚSQUEDA DE INFORMACIÓN Y ACTUALIZACIÓN CONTINUA", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás clasificar las fuentes de información según su origen, aplicar criterios para evaluar su calidad, y seleccionar fuentes pertinentes para mantenerte actualizado en tecnología."}, {"type": "h2", "text": "9.1  Clasificación de las fuentes de información"}, {"type": "p", "text": "Las fuentes de información son los medios a través de los cuales se adquiere, amplía o actualiza conocimiento, y en tecnología cumplen una función particular: mantienen al profesional al tanto de herramientas, lenguajes y prácticas que cambian todo el tiempo. Se clasifican en cuatro grandes categorías. Las fuentes primarias ofrecen información original generada directamente por sus autores: artículos científicos, especificaciones técnicas oficiales, repositorios de código y documentación mantenida por los propios equipos de una tecnología. Son valiosas porque no tienen intermediarios, aunque suelen exigir mayor competencia técnica para interpretarlas.", "b": false}, {"type": "p", "text": "Las fuentes secundarias interpretan o sintetizan información de fuentes primarias: libros técnicos, artículos de revisión, blogs especializados y comparativas de herramientas, que sirven de puente entre la información cruda y su aplicación práctica. Las fuentes terciarias compilan o indexan información secundaria, como enciclopedias técnicas, bases de datos bibliográficas o portales educativos agregadores, y ofrecen una visión general rápida aunque con menos profundidad. Y las fuentes no estructuradas o emergentes, como foros técnicos, canales de video o redes profesionales, no siempre pasan por procesos formales de revisión, pero su dinamismo las vuelve valiosas para detectar tendencias antes de que lleguen a un libro de texto.", "b": false}, {"type": "img", "caption": "Figura 9.1 · Clasificación de las fuentes de información", "data": "data:image/webp;base64,UklGRrRbAABXRUJQVlA4IKhbAADQ7QGdASroA00DPmEulEekIiIhIbGaOIAMCWdu/FoX4L5j/fO9NQOz+JIP8w/P76PjVHW/leb3a/k+dA+gD/O/sj7rf7N6gv978sD1Rfu36g/5//iv2093X/nfuL7uf7X00vq++hV0vX93yaT4L/P/8N/aP2R+AXxT9B/uH91/Yf+8f+v1Z/EPkv7H/e/2R/t3/y93P/A8CXof9R/0/Qz+Q/Zj8N/av23/y3s7/kf7t+4f5me0P5Z+tf5j+7/tV/k/kF/Hv5N/gf7h+3v+K9U3/A7XjQf+V6Avpx87/zn+A/0//l/xfodf13+R9Rvz/+1/6f7UfsA/k/9X/2H+E/KT6F/2vgfekewH/L/7b/0v8X+bv0mf0v/l/1f5x+3T8y/0f/j/1PwEfy7+2f9f/Cf6nuyeiwNnd3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3dOY83m/Ov/SE/df+kJ+6/9IT91/6Qn7r/0hP3X/pCfuv/SE/df+kJ+6/9IT91/6Qn7r/0hP3X/pCfuv/SE/df+kJ+6/9IT91/6Qn7r/0hP3X/pCfuv/SE/df+kJ+6/9IT91/6Qn7r/0hP3X/pCfuv/SE/df8gzS9A04UBYNEJ39shMTExMTExMTExMTExMTEx 84miUYCs8M5/JkUGuBd0YmFCcAdNTmN+vIS3jemQWs0M4A7+dm4k/ufOleFRdKOpgpL47YyJaYjwmf3Ts801zttqK1qP+M1nKCUmlC5u/bL8nEWwIQYD04veAMTTmQBcbY2jGJ4JbRb10MoIFDYBe41Dj92FIvOU7lr2tMwmod81yTh2rOOg6jYYYob0weY8jwo1XCXeTJMCIgoKGi8iojJbkuKgETt3Poykn/tMx63ZiXT8ZurSwvnpzPS+i8CU26boeRSoCsqXbEPzlBJBCiJssraOOPvsgKIatL0o4s5q/4MHdV5PIHsix/W1R0yfXRwnkxif28b7C9gNxSyb//OY9+SXzBePFqjwL4ObkgtIyPFAIPXoX5Yw7gPc23NUgCB3QiTD7BjJSuJUy1lwlIvJDBjNabIBomA50fzHKGu6cwMySaBBwyHTnYkD86gWL2UtlMKYwGwcDrzcdYogL+7xUrysxyDkt/WkEVu3zBiDoAvei3LHO8G7HAe6FSDSEpU7SEm5lQwMJ4pWmWNc4Tat2ROj0BK9FmcOxDhu7jHEvdok6Go1VVeP+0jXIFtP70DxZbpkAAAAAAAAAAA"}, {"type": "h2", "text": "9.2  Criterios para evaluar la calidad de una fuente"}, {"type": "p", "text": "No todas las fuentes disponibles merecen la misma confianza, así que conviene aplicar criterios antes de usarlas (UNESCO, 2020). La autoridad pregunta quién es el autor o la institución detrás de la fuente y si tiene experiencia reconocida en el área; entre un manual oficial mantenido por los creadores de un lenguaje y un blog personal sin referencias, el primero parte con más autoridad. La actualidad importa especialmente en tecnología, donde una fuente sin actualizar en varios años puede describir prácticas ya obsoletas. Y la relevancia mide si el contenido responde de verdad a la necesidad concreta que se tiene, más allá de que la fuente sea, en abstracto, confiable.", "b": false}, {"type": "h2", "text": "9.3  Fuentes de información aplicadas a la actualización tecnológica"}, {"type": "p", "text": "Mantenerse actualizado como profesional del software no depende de leer más, sino de leer con criterio y de forma sostenida (Solís Maldonado & Velázquez Concepción, 2025). Combinar tipos de fuentes suele funcionar mejor que depender de una sola: la documentación oficial para entender con precisión cómo funciona una herramienta, blogs y artículos de revisión para contextualizar su uso en la práctica, y comunidades técnicas para detectar problemas comunes y soluciones que todavía no llegan a la documentación. Este proceso se inscribe de lleno en el aprendizaje autónomo, porque el profesional debe decidir por sí mismo qué información necesita, dónde buscarla y cómo evaluarla antes de incorporarla a su trabajo.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Fuentes primarias vs. secundarias", "body": "Una fuente primaria ofrece información original y sin intermediarios, como la documentación oficial de un framework. Una fuente secundaria interpreta esa información para hacerla más accesible, como un tutorial o un blog que explica cómo usarla. Ninguna reemplaza a la otra: se complementan."}, {"type": "h2", "text": "9.4  Ejemplo completo"}, {"type": "p", "text": "Antes de adoptar una librería nueva para su proyecto, un estudiante revisa primero su documentación oficial (fuente primaria) para entender qué problema resuelve realmente. Luego busca dos o tres artículos de comparación (fuentes secundarias) que la contrasten con alternativas similares. Finalmente consulta un foro técnico para ver si otros desarrolladores reportan problemas comunes que la documentación no menciona. Solo después de esa combinación decide si la librería encaja con su proyecto.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Elabora un mapa de fuentes de información sobre una tecnología que estés aprendiendo, clasificando al menos seis fuentes según sean primarias, secundarias, terciarias o emergentes.\n2. Elige una fuente que uses con frecuencia y evalúala aplicando los criterios de autoridad, actualidad y relevancia descritos en este capítulo.\n3. Redacta un informe breve comparando dos fuentes distintas sobre un mismo tema técnico, señalando cuál te parece más confiable y por qué."}]}, {"id": "cap10", "titulo": "Herramientas digitales para la autoformación", "kind": "cap", "num": 10, "unidad": "UNIDAD 3 · BÚSQUEDA DE INFORMACIÓN Y ACTUALIZACIÓN CONTINUA", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás identificar distintos tipos de herramientas digitales para la autoformación y aplicar criterios para seleccionar las más adecuadas a tus necesidades de aprendizaje."}, {"type": "h2", "text": "10.1  Plataformas de aprendizaje estructurado y repositorios de conocimiento"}, {"type": "p", "text": "Las plataformas de aprendizaje estructurado ofrecen cursos y rutas organizadas por niveles de dificultad (Calderón, 2024). Los cursos masivos abiertos en línea, conocidos como MOOCs, permiten formarse a ritmo propio: plataformas como Coursera y edX ofrecen cursos diseñados por universidades, mientras que Platzi o Udemy suelen enfocarse en contenidos más prácticos y orientados a proyectos. Estas plataformas no solo enseñan contenidos, también ayudan a estructurar objetivos de aprendizaje mediante ejercicios y evaluaciones (UNESCO, 2019).", "b": false}, {"type": "p", "text": "Los repositorios de conocimiento resultan igual de importantes para mantenerse actualizado (UNED, 2024). La documentación oficial, como MDN Web Docs para tecnologías web o la documentación propia de lenguajes como Python o frameworks como React, ofrece la referencia más precisa sobre sintaxis y buenas prácticas. Los repositorios de código, encabezados por GitHub, permiten estudiar implementaciones reales y entender decisiones técnicas que un tutorial no siempre explica.", "b": false}, {"type": "img", "caption": "Figura 10.1 · Categorías de herramientas digitales para la autoformación", "data": "data:image/webp;base64,UklGRkBZAABXRUJQVlA4IDRZAAAwpwGdASroA34CPmEwlEekIqIhIbRKIIAMCWdu6dBYYsy6QwOHUW0/2fboqWeQsaHusz2f8H1ef6T1Df8v0V/MB+wf7ge67/4PVf5wH9m66f0F+mbyLnwz/Jfxc98PxH9A/sP9p/XT+8/9H1j/EPl/7L/Zf2d/wP/W/4HxC/w/it8//iv87/SvUr+NfXH7b/Yv8l/of79+2/xF/lv77+33+K9Hfg5/Ofm78Av4t/J/7H/bP2f/vH7de7X/Qduho/+j/1v999gX1Q+af47+4f5f/n/4r0WP6L+3fjv8Dflf9j/1v96/KL7AP45/Qf81/bv8X+wvyn/jf168nb7x/o/2H+AH+Uf2r/uf3z/PfuT9Kf8l/3/81/uf2m9sX5n/kP+5/k/9h+2v2E/yn+s/8b/A/6X/5f6n/////77///7v/3u9mIaK4o0VwZCB AAAAAAA="}, {"type": "h2", "text": "10.2  Herramientas de práctica, comunidades, gestión del conocimiento y portafolios"}, {"type": "p", "text": "El aprendizaje técnico no se completa solo con lectura (Agustín et al., 2022). Entornos como Replit, CodePen o JSFiddle permiten escribir y ejecutar código directamente desde el navegador, mientras que plataformas como LeetCode o HackerRank ofrecen ejercicios algorítmicos con evaluación automática. Las comunidades colaborativas, entre ellas Stack Overflow, subreddits técnicos o servidores de Discord organizados por tecnología, aceleran el aprendizaje porque exponen al estudiante a distintos enfoques frente a un mismo problema (Romo Padilla et al., 2023).", "b": false}, {"type": "p", "text": "Organizar todo ese material exige, además, sistemas de gestión del conocimiento personal, como gestores de notas o mapas mentales, que ayudan a conectar ideas dispersas (Vélez-De La Cruz, 2023). Y los medios para crear proyectos y portafolios, ya sea un repositorio público en GitHub o un sitio personal, permiten mostrar evidencia concreta de lo aprendido, algo que en el sector tecnológico suele pesar tanto como cualquier certificado.", "b": false}, {"type": "h2", "text": "10.3  Estrategias para seleccionar y utilizar herramientas digitales"}, {"type": "p", "text": "Con tantas opciones disponibles, la tentación es acumular herramientas sin usarlas a fondo. Conviene elegir pocas y dominarlas: una plataforma de cursos, un entorno de práctica y una comunidad técnica suelen bastar para sostener un plan de estudio completo. También ayuda revisar periódicamente si una herramienta sigue siendo útil o si se convirtió en costumbre sin aportar nada nuevo, y estar dispuesto a cambiarla cuando el propio nivel de aprendizaje avanzó más allá de lo que esa herramienta ofrece.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Documentación oficial", "body": "El material de referencia que mantiene el propio equipo responsable de un lenguaje, framework o herramienta. Suele ser la fuente más precisa y actualizada disponible, aunque no siempre la más fácil de leer para quien recién empieza; combinarla con tutoriales ayuda a suavizar esa curva."}, {"type": "h2", "text": "10.4  Ejemplo completo"}, {"type": "p", "text": "Un estudiante que quiere aprender Docker empieza por un curso corto en una plataforma como freeCodeCamp para entender los conceptos básicos, practica comandos en un entorno propio en su computador, y cuando se atasca con un error específico busca en Stack Overflow si alguien más lo reportó antes. Al final del proceso documenta lo aprendido en un repositorio personal con notas y ejemplos, que le sirve tanto de portafolio como de referencia futura para cuando necesite recordar cómo resolvió un problema similar.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Explora dos plataformas de aprendizaje estructurado distintas y elabora un breve informe comparando su enfoque, costo y nivel de profundidad.\n2. Actualiza tu portafolio digital con al menos un proyecto o ejercicio reciente, incluyendo notas sobre qué aprendiste al hacerlo.\n3. Identifica una herramienta digital que uses actualmente por costumbre y evalúa si todavía te aporta algo o si conviene reemplazarla."}]}, {"id": "cap11", "titulo": "Evaluación de la fiabilidad de las fuentes de información", "kind": "cap", "num": 11, "unidad": "UNIDAD 3 · BÚSQUEDA DE INFORMACIÓN Y ACTUALIZACIÓN CONTINUA", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás aplicar un método sistemático para juzgar la fiabilidad de una fuente, separando la información con buen respaldo de la que no alcanza los estándares mínimos de calidad."}, {"type": "h2", "text": "11.1  Criterios fundamentales para evaluar la fiabilidad"}, {"type": "p", "text": "Evaluar la fiabilidad de una fuente implica algo más que encontrarla: exige revisarla críticamente antes de incorporarla a una decisión, un trabajo académico o un proyecto profesional. Usar fuentes poco confiables puede llevar a conclusiones erróneas o a decisiones basadas en información sesgada, algo especialmente costoso en contextos tecnológicos donde una mala decisión técnica puede afectar todo un proyecto.", "b": false}, {"type": "p", "text": "Hay cuatro criterios que ayudan a separar lo confiable de lo que no lo es. Uno es la autoridad: quién firma la fuente, y si esa persona o institución tiene trayectoria verificable en el tema. Otro es la actualidad, que en tecnología pesa más que en casi cualquier otro campo, porque las prácticas cambian rápido y una fuente vieja puede describir algo ya superado. La evidencia exige que lo que se afirma esté respaldado por datos o referencias comprobables, no por opiniones sueltas. Y la objetividad se fija en si la fuente informa de manera imparcial o si tiene un interés comercial o ideológico que tuerce lo que cuenta.", "b": false}, {"type": "img", "caption": "Figura 11.1 · Criterios para evaluar la fiabilidad de una fuente", "data": "data:image/webp;base64,UklGRpAzAABXRUJQVlA4IIQzAADwjAGdASroA+EDPmEwlkgkIyUhINNY2KAMCWlu4XdBT/cfRJAp94Zz3FNt1emn+8eoT/kuit5h/OC/I732f3HfmPQz6aLIevIX9j/IbwM/r/5O/vB68/iXzf9n/Jn94f9l8RGZvqg+jPU3+N/X371/aP2o/wn7k/Jf+h/Lvzf+JP9L+Xn+A+QX8d/kf98/uv7Y/3v90OPF0vzAvZL6J/nv8D+9/9v9Hz+L9BPs37AH8a/pP+m8rjwffxH+j/aD4A/5l/c//d/eP838Mf9L/7P8357vzr/J/+H/T/Ad/L/7N/y/8P+Vfg09IwLM0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8RpIx4jSRjxGkjHWF75ZxXUMOzZFLK2e0srZ7SytntLKoz+aEorUyhmETSRjxGkjHiNJGPEaSMeI0kY8RpHgGa6GpaeCVQQF+vN0kY8RpIx4jSRjxGkjHiNJGPEaOQyZrGPEaOQQF+vN0kY8RpIx4jSRjxGkjHiNJGPEaOQ2jv0n6eEH3jF0KZbO+0vVUvGs/NA50Lb7Qydmw8Y5zB+Vdm0daxNRi0Tsm5fDKbnIv9K3x5Xm6SMeI0kY8RpIx4jSRjxGYbAn8BeMBfQ1G9ATFNW0DwZhtP2XXMwHdXsT1xIOoCgYBlZG/pyMCrKRy I14xcmcbCBEd41czfy1dF7ZiU8lttlAwxnw6zg8/CTHQ7mAuTLZj1OUAqRH60JqzV1sbRivMCL/Xr3Z53OoMCk+Sbe2ltxSV+f9kQDi6ydJ2Bq9ytwb2Njl0OrB8aJu5xSrg5HCLadc/OaF3y2d+uyCuXuOrwq9JeV7mM/BO6DD8zhJM1dtbYJuHJXHzKfk4Ldwo++1BQ5QnqrTPcq69OwDAZbh/tn5SneAK9oWm3pDBayUh1zWhvmfL/+DQpNOjCBMBjyUm+VeA0nk5xVEKWL+f1W51OUtDtKxGcstHLgcBWLgThDSQJRVijBHp3WQVZuk1haOLiz3aLEABdrd+3kyfWWeYCYenBOrF6iV07r0668oi4tgqfpsLAJVz4g7MvZuHOff1laXAtxd3IpVAt1ALqAXUAukRP6m5fQuCq8MJMR5Cz47i1A4xfWUzVpTannuP7g28k6XtGLfeehI5A6Rm0moTGAgRdn1GuDqjgBv3z5aHw74oIIPhmDnWWgAxI3AZ9OFek5iLMg7597/TBbgXz7UjGKlrb2NpnVZuvByIGDL1HIgYMvUciBgy9OrvXaODCPEM98QcS0InkHqESCh12KbZ/QLBNXgBBk7D9+oWRXqIca1NlsTs9GcA64sgAAAI60gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}, {"type": "h2", "text": "11.2  Criterios adicionales: cobertura y profundidad"}, {"type": "p", "text": "Más allá de los cuatro criterios anteriores, conviene revisar qué tan bien la fuente cubre el tema y con qué nivel de detalle lo hace. Una fuente puede ser completamente fiable en cuanto a autoridad y actualidad, y aun así resultar poco útil si trata el tema de forma superficial o deja fuera aspectos importantes para el problema concreto que se está resolviendo. La cobertura pregunta si el tema se aborda de manera integral o solo parcial, y la profundidad, si el nivel de detalle es suficiente para el uso que se le va a dar, ya sea una introducción rápida o una implementación real.", "b": false}, {"type": "h2", "text": "11.3  Aplicación práctica de los criterios de fiabilidad"}, {"type": "p", "text": "Aplicar estos criterios de forma sistemática, y no solo cuando algo se ve sospechoso, es lo que distingue a un consumidor crítico de información de uno que acepta lo primero que aparece en una búsqueda. Un método simple consiste en clasificar cada fuente encontrada en tres categorías: confiable, parcialmente confiable o no confiable, y justificar esa clasificación con evidencia concreta en lugar de una impresión general. En un entorno donde buena parte del contenido en internet no pasa por ningún proceso de revisión, ese hábito de clasificar y justificar termina siendo la defensa más efectiva contra la información de baja calidad (Lima Garcés & Martínez Marín, 2023).", "b": false}, {"type": "concepto", "title": "CONCEPTO · Fiabilidad de una fuente", "body": "No es lo mismo que disponibilidad. Una fuente puede ser fácil de encontrar y aun así poco confiable. La fiabilidad se determina revisando autoridad, actualidad, evidencia y objetividad, no por qué tan rápido aparece en una búsqueda."}, {"type": "h2", "text": "11.4  Ejemplo completo"}, {"type": "p", "text": "Buscando cómo configurar la seguridad de una API, un estudiante encuentra tres resultados: la documentación oficial del framework, un artículo de blog de hace cuatro años, y una respuesta reciente en un foro con varios votos positivos. Aplica los criterios de este capítulo: la documentación tiene autoridad y está actualizada, pero es densa; el blog está desactualizado, así que lo descarta; la respuesta del foro es reciente y viene respaldada por comentarios de otros desarrolladores que confirmaron que funciona, así que la usa como complemento práctico de la documentación oficial, no como reemplazo.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Recopila diez sitios web con información sobre un concepto tecnológico específico y clasifícalos en confiables, parcialmente confiables y no confiables, justificando cada clasificación.\n2. Elige una fuente que hayas usado recientemente para resolver un problema técnico y evalúala aplicando los cuatro criterios fundamentales de fiabilidad.\n3. Compara dos fuentes sobre el mismo tema que lleguen a conclusiones distintas. Analiza a cuál le darías más peso y por qué, usando los criterios de este capítulo."}]}, {"id": "cap12", "titulo": "Estrategias de aprendizaje continuo", "kind": "cap", "num": 12, "unidad": "UNIDAD 3 · BÚSQUEDA DE INFORMACIÓN Y ACTUALIZACIÓN CONTINUA", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás describir las características del aprendizaje continuo, identificar los factores que lo impulsan, y aplicar estrategias concretas para sostenerlo a lo largo de tu formación y tu vida profesional."}, {"type": "h2", "text": "12.1  Características y factores que impulsan el aprendizaje continuo"}, {"type": "p", "text": "Aprender de forma continua no es algo que le pasa a uno; es algo que uno decide sostener, de manera voluntaria y durante toda la vida, mezclando lo cognitivo, lo emocional y el contexto en el que a cada quien le toca desenvolverse (Contreras D. & Gamboa B., 2020). En un campo como el desarrollo de software, donde el conocimiento se renueva todo el tiempo, eso exige curiosidad, disciplina y la iniciativa de no esperar a que alguien indique qué estudiar a continuación: identificar la propia necesidad y decidir qué recurso usar para cubrirla. También implica llevar lo aprendido a la práctica profesional en lugar de dejarlo acumulado sin usar, y mantener una revisión constante de qué se sabe, qué falta y qué método funciona mejor (Rué, 2016).", "b": false}, {"type": "p", "text": "Ese proceso se sostiene sobre varios factores. La motivación intrínseca, aprender por interés genuino más que por obligación, impulsa el compromiso a largo plazo. La autorregulación permite planificar, monitorear y evaluar el propio proceso durante meses o años, no solo durante un semestre. El acceso a recursos confiables y actualizados facilita mantenerse al día, y una cultura de aprendizaje, ya sea en una organización o en un grupo de estudio, crea el clima que hace ese esfuerzo sostenible en lugar de aislado (H. H. G. Ramírez, 2024).", "b": false}, {"type": "img", "caption": "Figura 12.1 · Factores que impulsan el aprendizaje continuo", "data": "data:image/webp;base64,UklGRqRDAABXRUJQVlA4IJhDAADweQGdASroA5YCPmEwlUgkIqIhIdIZQIAMCWlu4XXkKxdn6x3SapqqF3gR8R/0fLvfz9Mv+C9Q//idIDzSftB+wHuyf9n2Df4D1AP6f/juuc9CL9u+uyyIHx5/Y/yQ8E/77/g antenerse actualizado en tecnologías específicas (Guevara, 2020). El aprendizaje colaborativo, mediante comunidades técnicas o grupos de estudio, expone a distintos enfoques y acelera la resolución de dudas que en solitario tomarían más tiempo. La actualización profesional estructurada, a través de certificaciones o cursos formales, aporta reconocimiento externo además del aprendizaje mismo (Landriel Pedraza et al., 2023). Y ninguna de estas estrategias funciona de forma aislada sin una evaluación continua que revise periódicamente si el rumbo elegido sigue siendo el correcto y ajuste el plan cuando deja de serlo, cerrando así el ciclo completo del aprendizaje autónomo que este libro desarrolló desde su primer capítulo (Núñez & Rodríguez, 2024).", "b": false}, {"type": "concepto", "title": "CONCEPTO · Aprendizaje continuo", "body": "Un proceso activo, permanente y voluntario de actualización de conocimientos a lo largo de la vida profesional, no limitado a la etapa universitaria. No consiste en acumular cursos, sino en sostener la disciplina de identificar qué se necesita aprender y aplicarlo."}, {"type": "h2", "text": "12.4  Ejemplo completo"}, {"type": "p", "text": "Un egresado reciente nota que su primer empleo usa una tecnología de despliegue en la nube que nunca vio en la universidad. En lugar de sentirse en desventaja, aplica lo que practicó en este curso: define una meta SMART para las próximas tres semanas, combina documentación oficial con un curso corto, participa en un canal de la comunidad de esa herramienta para resolver dudas puntuales, y lleva un registro simple de qué va entendiendo. El contenido específico es nuevo; el método para aprenderlo no lo es en absoluto.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Diseña un plan de aprendizaje continuo personal para los próximos seis meses, incluyendo al menos una meta, dos estrategias y un mecanismo de evaluación periódica.\n2. Crea o actualiza un portafolio digital que reúna evidencia de tu aprendizaje durante este curso.\n3. Reflexiona por escrito sobre cómo cambiaría tu forma de estudiar si tuvieras que mantenerte actualizado en tecnología durante los próximos diez años sin la estructura de un programa universitario."}]}, {"id": "conclusiones", "titulo": "Conclusiones Generales", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "A lo largo de las tres unidades se contempló un proceso que permite a los estudiantes dirigir su propio proceso de formación: primero entendiendo qué significa el aprendizaje autónomo y cómo la metacognición y la autorregulación lo sostienen desde adentro; después fortaleciendo el pensamiento crítico y la reflexión continua como herramientas para evaluar el propio avance; y finalmente aprendiendo a buscar información confiable y a mantenerse actualizado en un campo de constante cambio.", "b": false}, {"type": "p", "text": "La planificación, la gestión de recursos, la autoevaluación y la evaluación crítica de fuentes son hábitos que se pueden fortalecer con las pautas que brinda cada unidad, lo que permite que los estudiantes al cerrar estas páginas cuenten con algo más valioso que un conjunto de definiciones: tiene una manera de enfrentar cualquier aprendizaje futuro. Ya no se trata solo de comprender qué es el aprendizaje autónomo, sino de saber qué hacer la próxima vez que necesite aprender algo que todavía no domina.", "b": false}]}, {"id": "referencias", "titulo": "Referencias Bibliográficas", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Agustín, J., Rojas, L., Valderrama, C., Ruiz, J., & Flores, K. (2022). Herramientas digitales más eficaces en el proceso enseñanza-aprendizaje. Horizontes. Revista de Investigación en Ciencias de la Educación, 6(23), 669-678. https://doi.org/10.33996/revistahorizontes.v6i23.367", "b": false}, {"type": "p", "text": "Angarita Valencia, J. (2021). El pensamiento crítico: una innovación educativa. Ciencia Latina R té de Acreditación y Currículo del Programa.", "b": false}, {"type": "grid", "rows": [["Unidad", "Criterio de evaluación", "Abstracto ampliado (4.6-5.0)", "Relacional (3.8-4.5)", "Multiestructural (3.0-3.7)", "Uniestructural (2.1-2.9)", "Prestructural (0.0-2.0)"], ["1", "Calidad y coherencia en el diseño del plan personal de aprendizaje.", "El plan está completamente adaptado, incorporando nuevas estrategias avanzadas.", "El plan de aprendizaje está bien estructurado y coherente con metas claras.", "El estudiante organiza algunas estrategias, pero no está totalmente desarrollado.", "El plan es incompleto y poco claro.", "No hay evidencia de un plan coherente."], ["1", "Identificación clara de metas y estrategias.", "Las metas están bien definidas, actualizadas y alineadas con necesidades de aprendizaje a largo plazo.", "Las metas son claras y las estrategias son coherentes con el proceso de aprendizaje.", "El estudiante identifica metas y estrategias, pero carecen de profundidad.", "Metas y estrategias básicas, poco claras o genéricas.", "No se identifican metas o estrategias."], ["1", "Capacidad para ajustar el plan de acuerdo con necesidades personales.", "El plan se ajusta dinámicamente con base en autoevaluaciones periódicas y nuevas metas.", "El estudiante realiza ajustes basados en la evaluación de su progreso.", "El estudiante realiza algunos ajustes, pero sin una estrategia clara.", "El estudiante ajusta el plan, pero de manera limitada.", "No realiza ajustes en su plan."], ["2", "Capacidad para analizar el progreso mediante autoevaluaciones.", "El análisis es profundo, reflexivo y se conecta con nuevas estrategias de mejora.", "Realiza autoevaluaciones coherentes que llevan a ajustes significativos.", "Realiza autoevaluaciones básicas, pero los ajustes son limitados.", "Realiza autoevaluaciones, pero no aplica cambios significativos.", "No realiza autoevaluaciones."], ["2", "Coherencia entre resultados del aprendizaje y estrategias de mejora aplicadas.", "Las estrategias de mejora están completamente alineadas con los resultados del aprendizaje.", "Conecta los resultados de aprendizaje con estrategias efectivas de mejora.", "Aplica algunas mejoras, pero sin mucha coherencia con los resultados.", "Las mejoras aplicadas son básicas y no están bien relacionadas con los resultados.", "No hay coherencia entre los resultados y las estrategias de mejora."], ["3", "Precisión en la identificación de fuentes confiables.", "Las fuentes son completamente confiables y utilizadas de manera crítica y creativa en nuevas situaciones.", "Selecciona y evalúa críticamente fuentes confiables y relevantes para su contexto.", "Encuentra varias fuentes relevantes, pero no evalúa completamente su aplicabilidad.", "Identifica fuentes, pero no evalúa adecuadamente su calidad.", "No identifica fuentes confiables o utiliza fuentes inapropiadas."], ["3", "Capacidad para seleccionar información actualizada y aplicable.", "Selecciona y aplica información actualizada de manera innovadora a problemas complejos.", "Selecciona información relevante y la aplica adecuadamente a situaciones específicas.", "Selecciona información actualizada pero su aplicación es limitada.", "Encuentra información, pero no la aplica correctamente.", "No selecciona ni aplica información relevante."]]}]}, {"id": "anexo-a", "titulo": "Anexo A · Plantilla de Plan Personal de Aprendizaje", "kind": "anexo", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Esta plantilla sirve de punto de partida para el Plan Personal de Aprendizaje propuesto en el Capítulo 1. Complétala y ajústala a medida que avances en el curso.", "b": false}, {"type": "h2", "text": "1. Meta general del semestre"}, {"type": "p", "text": "Describe en una frase qué quieres lograr este semestre en tu formación como desarrollador.", "b": false}, {"type": "h2", "text": "2. Metas específicas (formato SMART)"}, {"type": "p", "text": "Lista al menos tres metas específicas, medibles, alcanzables, relevantes y con plazo definido.", "b": false}, {"type": "h2", "text": "3. Recursos por meta"}, {"type": "p", "text": "Para cada meta, indica qué recursos usarás (documentación, cursos, comunidades) y en qué etapa del aprendizaje corresponde cada uno.", "b": false}, {"type": "h2", "text": "4. Cronograma semanal"}, {"type": "p", "text": "Distribuye bloques de estudio por semana, incluyendo tiempo de práctica y tiempo de repaso.", "b": false}, {"type": "h2", "text": "5. Mecanismo de revisión"}, {"type": "p", "text": "Define cada cuánto revisarás este plan (se recomienda semanal o quincenal) y qué preguntas te harás en cada revisión.", "b": false}]}, {"id": "anexo-b", "titulo": "Anexo B · Rúbrica de Autoevaluación y Mejora Continua", "kind": "anexo", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Instrumento de apoyo para el Capítulo 8. Úsalo al cerrar cada unidad del curso para valorar tu propio desempeño en una escala de 1 (inicial) a 4 (consolidado).", "b": false}, {"type": "p", "text": "Criterio 1 · Identifiqué con claridad qué necesitaba aprender antes de empezar la tarea.", "b": false}, {"type": "p", "text": "Criterio 2 · Apliqué una estrategia de planificación antes de comenzar a estudiar.", "b": false}, {"type": "p", "text": "Criterio 3 · Monitoreé mi comprensión durante el proceso, no solo al final.", "b": false}, {"type": "p", "text": "Criterio 4 · Evalué mis resultados con criterios explícitos, no solo con una impresión general.", "b": false}, {"type": "p", "text": "Criterio 5 · Ajusté mi estrategia a partir de lo que encontré en la autoevaluación.", "b": false}, {"type": "p", "text": "Para cada criterio, anota evidencia concreta (no solo una calificación) que respalde tu valoración: qué hiciste, qué notaste y qué cambiarías la próxima vez.", "b": false}]}, {"id": "anexo-c", "titulo": "Anexo C · Checklist de Evaluación de Fuentes de Información", "kind": "anexo", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Lista de verificación de a const $ = (s,c)=>(c||document).querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}

/* ══════════ almacenamiento ══════════ */
const CLAVE = 'aa_libro_v1';
let DATOS = {};
function carga(){
  try{ DATOS = JSON.parse(localStorage.getItem(CLAVE) || '{}'); }
  catch(e){ DATOS = {}; }
}
let guardarOk = true;
function guarda(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(DATOS)); return true; }
  catch(e){ guardarOk = false; return false; }
}
carga();
function get(k, def){ return DATOS[k]===undefined ? def : DATOS[k]; }
function set(k, v){ DATOS[k]=v; return guarda(); }

function avisoGuardado(cont){
  const s = el('span','guardado');
  cont._aviso = s;
  return s;
}
function marcaGuardado(cont, txt){
  const s = cont._aviso;
  if(!s) return;
  s.textContent = txt || (guardarOk ? 'Guardado en este navegador' : 'No se pudo guardar aquí: descarga tu trabajo');
  s.className = 'guardado' + (guardarOk ? ' ok' : '');
  clearTimeout(s._t);
  s._t = setTimeout(()=>{ s.textContent=''; s.className='guardado'; }, 2600);
}

/* descarga de texto */
function descarga(nombre, texto){
  const b = new Blob([texto], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ══════════ herramienta: diagnóstico ══════════ */
function toolDiagnostico(){
  const C = TOOLS.diagnostico;
  const t = el('div','tool');
  t.innerHTML = '<div class="tool-cab"><b>'+esc(C.titulo)+'</b><span>'+esc(C.intro)+'</span></div>';
  const cuerpo = el('div','tool-cuerpo');
  const lista = el('div');
  const resultado = el('div','oculto');
  let R = get('diag', {});

  C.items.forEach((it,i)=>{
    const d = el('div','item-d');
    d.appendChild(el('div','txt','<i>'+String(i+1).padStart(2,'0')+'</i><span>'+esc(it.t)+'</span>'));
    const e = el('div','escala');
    C.escala.forEach((lab,j)=>{
      const b = el('button','op-e'+(R[i]===j?' sel':''), esc(lab));
      b.onclick = ()=>{
        R[i]=j; set('diag',R);
        [...e.children].forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        pinta();
      };
      e.appendChild(b);
    });
    d.appendChild(e);
    lista.appendChild(d);
  });
  cuerpo.appendChild(lista);
  cuerpo.appendChild(resultado);
  t.appendChild(cuerpo);

  function promedios(){
    const acc = {};
    C.items.forEach((it,i)=>{
      if(R[i]===undefined) return;
      (acc[it.d] = acc[it.d] || []).push(R[i]+1);
    });
    const out = {};
    Object.keys(acc).forEach(k=> out[k] = acc[k].reduce((a,b)=>a+b,0)/acc[k].length);
    return out;
  }
  function nivel(v){ return C.niveles.find(n=>v<=n.max) || C.niveles[C.niveles.length-1]; }

  function pinta(){
    const n = Object.keys(R).length;
    if(n < C.items.length){
      resultado.className = 'oculto';
      marcaGuardado(t, 'Respondidas '+n+' de '+C.items.length);
      return;
    }
    const P = promedios();
    resultado.className = '';
    resultado.innerHTML = '<h3 style="margin-top:22px">Tu perfil por dimensión</h3>';
    const orden = Object.keys(P).sort((a,b)=>P[a]-P[b]);
    orden.forEach(k=>{
      const dim = C.dims[k], v = P[k], nv = nivel(v);
      const d = el('div','res-dim');
      d.innerHTML = '<div class="res-cab"><b>'+esc(dim.nombre)+' · '+esc(dim.desc)+'</b><span>'+esc(nv.et)+' · '+v.toFixed(1)+'/4</span></div>'+
        '<div class="barra"><i style="width:'+(v/4*100)+'%"></i></div>'+
        '<div class="res-txt">'+esc(nv.txt)+' Capítulos que trabajan esta dimensión: '+dim.caps.join(', ')+'.</div>';
      resultado.appendChild(d);
    });
    const min = P[orden[0]];
    const empatadas = orden.filter(k=>P[k]===min);
    if(empatadas.length === orden.length){
      resultado.appendChild(el('div','veredicto v-med',
        '<b>Las tres dimensiones están parejas</b>'+
        '<p>No hay una claramente más débil, así que el criterio para elegir foco no puede salir del puntaje. Revisa tus respuestas ítem por ítem: la afirmación con la puntuación más baja señala mejor por dónde empezar que el promedio de la dimensión.</p>'));
      set('diagRes', {P:P, foco:'sin foco único'});
    } else {
      const nombres = empatadas.map(k=>C.dims[k].nombre.toLowerCase());
      const foco = C.dims[empatadas[0]];
      resultado.appendChild(el('div','veredicto v-med',
        '<b>Tu foco para este semestre: dimensión '+esc(nombres.join(' y '))+'</b>'+
        '<p>'+(empatadas.length>1?'Salieron empatadas en el punto más bajo.':'Es la que salió más baja.')+
        ' Llévala como eje del Plan Personal de Aprendizaje del Anexo A: al menos una de tus metas SMART debería atacar directamente '+esc(foco.desc.toLowerCase())+'.</p>'));
      set('diagRes', {P:P, foco:nombres.join(' y ')});
    }
    marcaGuardado(t);
  }

  const pie = el('div','tool-pie');
  const bLimpiar = el('button','bt ghost','Empezar de nuevo');
  bLimpiar.onclick = ()=>{ R={}; set('diag',{}); DATOS.diagRes=null; guarda(); ve(actual); };
  pie.appendChild(bLimpiar);
  pie.appendChild(avisoGuardado(t));
  t.appendChild(pie);
  pinta();
  return t;
}

/* ══════════ herramienta: metas SMART ══════════ */
const SMART = [
  {k:'e', n:'Específica', h:'¿Qué exactamente vas a lograr? Nombra el tema y el producto concreto.', ph:'Ej.: completar el módulo de componentes de React'},
  {k:'m', n:'Medible', h:'¿Con qué evidencia sabrás que la cumpliste?', ph:'Ej.: dos ejercicios prácticos funcionando'},
  {k:'a', n:'Alcanzable', h:'¿Es realista con el tiempo y los recursos que tienes?', ph:'Ej.: dispongo de 4 horas semanales y la documentación oficial'},
  {k:'r', n:'Relevante', h:'¿Por qué importa para tu formación o tu proyecto?', ph:'Ej.: la necesito para el proyecto de fin de curso'},
  {k:'t', n:'Con plazo', h:'¿Para cuándo?', ph:'Ej.: en dos semanas, hasta el 30 de abril'}
];
function toolSmart(){
  const t = el('div','tool');
  t.innerHTML = '<div class="tool-cab"><b>Constructor de metas SMART</b>'+
    '<span>Escribe la meta por partes. Abajo verás la meta redactada y qué criterio te falta. Estas metas alimentan tu Plan Personal de Aprendizaje.</span></div>';
  const cuerpo = el('div','tool-cuerpo');
  let borrador = get('smartBorrador', {});
  let metas = get('metas', []);

  SMART.forEach(c=>{
    const l = el('label','campo');
    l.innerHTML = '<span>'+c.n+'</span><i>'+esc(c.h)+'</i>';
    const inp = el('input'); inp.type='text'; inp.value = borrador[c.k]||''; inp.placeholder = c.ph;
    inp.oninput = ()=>{ borrador[c.k]=inp.value.trim(); set('smartBorrador',borrador); pinta(); };
    l.appendChild(inp);
    cuerpo.appendChild(l);
  });
  const salida = el('div');
  cuerpo.appendChild(salida);
  const guardadas = el('div');
  cuerpo.appendChild(guardadas);
  t.appendChild(cuerpo);

  function completos(){ return SMART.filter(c=>(borrador[c.k]||'').length>2); }
  function frase(){
    return borrador.e + ' — evidencia: ' + borrador.m + '. Plazo: ' + borrador.t +
      '. Es alcanzable porque ' + borrador.a.replace(/^porque\s+/i,'') +
      ', y relevante porque ' + borrador.r.replace(/^porque\s+/i,'') + '.';
  }
  function pinta(){
    const ok = completos();
    const faltan = SMART.filter(c=>!ok.includes(c));
    if(faltan.length){
      salida.innerHTML = '<div class="veredicto v-med"><b>Faltan '+faltan.length+' de 5 criterios</b>'+
        '<p>Sin '+faltan.map(f=>f.n.toLowerCase()).join(', ')+', esta todavía es una intención, no una meta SMART.</p></div>';
    } else {
      salida.innerHTML = '<div class="veredicto v-ok"><b>Meta SMART completa</b><p>'+esc(frase())+'</p></div>';
    }
    bAdd.disabled = faltan.length>0;
    bAdd.style.opacity = faltan.length ? .45 : 1;
    lista();
  }
  function lista(){
    guardadas.innerHTML = metas.length ? '<h3>Tus metas guardadas</h3>' : '';
    metas.forEach((m,i)=>{
      const d = el('div','entrada');
      d.innerHTML = '<div class="meta">Meta '+(i+1)+'<button class="x" title="Eliminar">✕</button></div>'+
        '<dl><dd>'+esc(m.frase)+'</dd></dl>';
      $('.x',d).onclick = ()=>{ metas.splice(i,1); set('metas',metas); pinta(); };
      guardadas.appendChild(d);
    });
  }
  const pie = el('div','tool-pie');
  const bAdd = el('button','bt pri','Guardar esta meta');
  bAdd.onclick = ()=>{
    metas.push({frase: frase(), partes: Object.assign({},borrador)});
    set('metas', metas);
    borrador = {}; set('smartBorrador', {});
    [...cuerpo.querySelectorAll('input')].forEach(i=>i.value='');
    pinta(); marcaGuardado(t);
  };
  pie.appendChild(bAdd);
  pie.appendChild(avisoGuardado(t));
  t.appendChild(pie);
  pinta();
  return t;
}

/* ══════════ herramienta genérica de filas ══════════ */
function toolFilas(cfg){
  const t = el('div','tool');
  t.innerHTML = '<div class="tool-cab"><b>'+esc(cfg.titulo)+'</b><span>'+esc(cfg.intro)+'</span></div>';
  const cuerpo = el('div','tool-cuerpo');
  let filas = get(cfg.clave, []);
  const cont = el('div','filas');
  cuerpo.appendChild(cont);
  t.appendChild(cuerpo);

  function pinta(){
    cont.innerHTML='';
    if(!filas.length){
      cont.appendChild(el('div','vacio', esc(cfg.vacio)));
    }
    filas.forEach((f,i)=>{
      const d = el('div','fila');
      d.appendChild(el('div','fila-cab','<span>'+esc(cfg.etiqueta)+' '+(i+1)+'</span><button class="x" title="Eliminar">✕</button>'));
      const grid = el('div', cfg.campos.length>=4?'g2':'');
      cfg.campos.forEach(c=>{
        const w = el('label');
        w.appendChild(el('span','mini', esc(c.n)));
        let inp;
        if(c.tipo==='select'){
          inp = el('select');
          inp.appendChild(el('option',null,'—'));
          c.ops.forEach(o=>{ const op=el('option',null,esc(o)); op.value=o; inp.appendChild(op); });
        } else if(c.tipo==='area'){
          inp = el('textarea'); inp.rows=2;
        } else {
          inp = el('input'); inp.type = c.tipo || 'text';
        }
        if(c.ph) inp.placeholder = c.ph;
        inp.value = f[c.k]||'';
        inp.oninput = inp.onchange = ()=>{ f[c.k]=inp.value; set(cfg.clave,filas); marcaGuardado(t); };
        w.appendChild(inp);
        if(c.ancho==='full') w.style.gridColumn='1/-1';
        grid.appendChild(w);
      });
      d.appendChild(grid);
      $('.x',d).onclick = ()=>{ filas.splice(i,1); set(cfg.clave,filas); pinta(); };
      cont.appendChild(d);
    });
  }
  const pie = el('div','tool-pie');
  const bAdd = el('button','bt pri','+ '+cfg.etiqueta);
  bAdd.onclick = ()=>{ filas.push({}); set(cfg.clave,filas); pinta(); };
  pie.appendChild(bAdd);
  pie.appendChild(avisoGuardado(t));
  t.appendChild(pie);
  pinta();
  return t;
}

/* ══════════ herramienta: diario de reflexión ══════════ */
const DIARIO = [
  {k:'objetivo', n:'Qué me propuse en esta sesión', ph:'Objetivo concreto de hoy'},
  {k:'hecho', n:'Qué hice realmente', ph:'Descripción breve de lo trabajado'},
  {k:'dificultad', n:'Qué me costó', ph:'Sé específico: no basta con «estuvo difícil»'},
  {k:'causa', n:'Por qué creo que me costó', ph:'Análisis de causas, no descripción'},
  {k:'accion', n:'Qué haré distinto la próxima vez', ph:'Una acción concreta, no una intención general'}
];
function toolDiario(){
  const t = el('div','tool');
  t.innerHTML = '<div class="tool-cab"><b>Diario de reflexión</b>'+
    '<span>El formato del Capítulo 6: fecha, objetivo, lo realizado, dificultades, análisis de causas y plan de acción. Cinco minutos al cerrar cada sesión.</span></div>';
  const cuerpo = el('div','tool-cuerpo');
  let entradas = get('diario', []);
  const form = el('div');
  const hoy = new Date().toISOString().slice(0,10);
  const lf = el('label','campo');
  lf.innerHTML = '<span>Fecha</span>';
  const fecha = el('input'); fecha.type='date'; fecha.value = hoy;
  lf.appendChild(fecha); form.appendChild(lf);
  const campos = {};
  DIARIO.forEach(c=>{
    const l = el('label','campo');
    l.innerHTML = '<span>'+esc(c.n)+'</span>';
    const a = el('textarea'); a.rows=2; a.placeholder=c.ph;
    campos[c.k]=a; l.appendChild(a); form.appendChild(l);
  });
  cuerpo.appendChild(form);
  const lista = el('div');
  cuerpo.appendChild(lista);
  t.appendChild(cuerpo);

  function pinta(){
    lista.innerHTML = entradas.length ? '<h3>Tus entradas ('+entradas.length+')</h3>' :
      '<div class="vacio">Todavía no hay entradas. La primera puede ser la sesión de estudio de hoy.</div>';
    entradas.slice().reverse().forEach((e)=>{
      const i = entradas.indexOf(e);
      const d = el('div','entrada');
      let dl = '';
      DIARIO.forEach(c=>{ if(e[c.k]) dl += '<dt>'+esc(c.n)+'</dt><dd>'+esc(e[c.k])+'</dd>'; });
      d.innerHTML = '<div class="meta">'+esc(e.fecha||'')+'<button class="x" title="Eliminar">✕</button></div><dl>'+dl+'</dl>';
      $('.x',d).onclick = ()=>{ entradas.splice(i,1); set('diario',entradas); pinta(); };
      lista.appendChild(d);
    });
  }
  const pie = el('div','tool-pie');
  const b = el('button','bt pri','Guardar entrada');
  b.onclick = ()=>{
    const e = {fecha: fecha.value};
    let algo = false;
    DIARIO.forEach(c=>{ e[c.k]=campos[c.k].value.trim(); if(e[c.k]) algo=true; });
    if(!algo){ marcaGuardado(t,'Escribe al menos un campo'); return; }
    entradas.push(e); set('diario',entradas);
    DIARIO.forEach(c=>campos[c.k].value='');
    pinta(); marcaGuardado(t);
  };
  pie.appendChild(b);
  pie.appendChild(avisoGuardado(t));
  t.appendChild(pie);
  pinta();
  return t;
}

/* ══════════ herramienta: evaluador de fuentes ══════════ */
function toolFuentes(){
  const C = TOOLS.fuentes;
  const t = el('div','tool');
  t.innerHTML = '<div class="tool-cab"><b>'+esc(C.titulo)+'</b><span>'+esc(C.intro)+'</span></div>';
  const cuerpo = el('div','tool-cuerpo');
  let fuentes = get('fuentes', []);
  let act = {r:{}};

  const lf = el('label','campo');
  lf.innerHTML = '<span>Fuente que estás evaluando</span><i>Título, URL o referencia. Sirve para que después recuerdes cuál era.</i>';
  const nombre = el('input'); nombre.type='text'; nombre.placeholder='Ej.: documentación oficial de React · react.dev';
  lf.appendChild(nombre); cuerpo.appendChild(lf);

  const zona = el('div');
  C.criterios.forEach(cr=>{
    const d = el('div','item-d');
    d.appendChild(el('div','txt','<i>'+(cr.core?'●':'○')+'</i><span><b style="font-family:var(--sans);font-size:13.5px">'+esc(cr.n)+'</b> — '+esc(cr.p)+'</span>'));
    const e = el('div','escala');
    C.opciones.forEach((lab,j)=>{
      const b = el('button','op-e', esc(lab));
      b.onclick = ()=>{ act.r[cr.id]=j; [...e.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); pinta(); };
      e.appendChild(b);
    });
    d.appendChild(e);
    zona.appendChild(d);
  });
  cuerpo.appendChild(zona);
  const salida = el('div');
  cuerpo.appendChild(salida);
  const lj = el('label','campo');
  lj.innerHTML = '<span>Justificación</span><i>El capítulo exige justificar la clasificación con evidencia concreta, no con una impresión general.</i>';
  const just = el('textarea'); just.rows=2; just.placeholder='Ej.: la mantiene el equipo del framework y se actualizó el mes pasado, pero no compara con alternativas.';
  lj.appendChild(just); cuerpo.appendChild(lj);
  const lista = el('div');
  cuerpo.appendChild(lista);
  t.appendChild(cuerpo);

  function veredicto(){
    const core = C.criterios.filter(c=>c.core);
    const vals = core.map(c=>act.r[c.id]).filter(v=>v!==undefined);
    if(vals.length < core.length) return null;
    const prom = vals.reduce((a,b)=>a+b,0)/vals.length;
    const ceros = vals.filter(v=>v===0).length;
    if(ceros>=2 || prom<0.9) return {c:'v-no', et:'No confiable',
      txt:'Falla en criterios fundamentales. Descártala para trabajos académicos o decisiones técnicas, o úsala solo como pista para buscar una fuente mejor.'};
    if(ceros===1 || prom<1.6) return {c:'v-med', et:'Parcialmente confiable',
      txt:'Sirve como apoyo, pero no como única base. Contrástala con una fuente primaria antes de tomar una decisión con ella.'};
    return {c:'v-ok', et:'Confiable',
      txt:'Cumple los cuatro criterios fundamentales. Puedes citarla y usarla como base, sin dejar de revisar si su cobertura alcanza para tu problema concreto.'};
  }
  function pinta(){
    const v = veredicto();
    salida.innerHTML = v ? '<div class="veredicto '+v.c+'"><b>'+esc(v.et)+'</b><p>'+esc(v.txt)+'</p></div>'
      : '<div class="veredicto v-med"><b>Faltan criterios por evaluar</b><p>Responde los cuatro criterios fundamentales (marcados con ●) para obtener la clasificación.</p></div>';
    bAdd.disabled = !v; bAdd.style.opacity = v?1:.45;
    listar();
  }
  function listar(){
    lista.innerHTML = fuentes.length ? '<h3>Fuentes evaluadas ('+fuentes.length+')</h3>' : '';
    fuentes.forEach((f,i)=>{
      const d = el('div','entrada');
      d.innerHTML = '<div class="meta">'+esc(f.et)+'<button class="x" title="Eliminar">✕</button></div>'+
        '<dl><dt>Fuente</dt><dd>'+esc(f.nombre||'(sin nombre)')+'</dd>'+
        (f.just?'<dt>Justificación</dt><dd>'+esc(f.just)+'</dd>':'')+'</dl>';
      $('.x',d).onclick = ()=>{ fuentes.splice(i,1); set('fuentes',fuentes); listar(); };
      lista.appendChild(d);
    });
  }
  const pie = el('div','tool-pie');
  const bAdd = el('button','bt pri','Guardar evaluación');
  bAdd.onclick = ()=>{
    const v = veredicto(); if(!v) return;
    fuentes.push({nombre:nombre.value.trim(), et:v.et, just:just.value.trim(), r:Object.assign({},act.r)});
    set('fuentes',fuentes);
    nombre.value=''; just.value=''; act={r:{}};
    zona.querySelectorAll('.op-e').forEach(b=>b.classList.remove('sel'));
    pinta(); marcaGuardado(t);
  };
  pie.appendChild(bAdd);
  pie.appendChild(avisoGuardado(t));
  t.appendChild(pie);
  pinta();
  return t;
}

/* ══════════ herramienta: rúbrica de autoevaluación (Anexo B) ══════════ */

      b.onclick = ()=>{ R['n'+i]=j; set('rubB',R); [...e.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); pinta(); };
      e.appendChild(b);
    });
    d.appendChild(e);
    const ev = el('textarea'); ev.rows=2; ev.placeholder='Evidencia concreta que respalda esta valoración';
    ev.value = R['e'+i]||'';
    ev.style.marginTop='8px';
    ev.oninput = ()=>{ R['e'+i]=ev.value; set('rubB',R); marcaGuardado(t); };
    d.appendChild(ev);
    cuerpo.appendChild(d);
  });
  cuerpo.appendChild(salida);
  t.appendChild(cuerpo);

  function pinta(){
    const vals = C.criterios.map((_,i)=>R['n'+i]).filter(v=>v!==undefined);
    if(vals.length < C.criterios.length){ salida.innerHTML=''; return; }
    const sinEv = C.criterios.map((_,i)=>i).filter(i=>!(R['e'+i]||'').trim());
    const prom = vals.reduce((a,b)=>a+b,0)/vals.length;
    const flojo = vals.indexOf(Math.min(...vals));
    let html = '<div class="veredicto '+(prom>=2.2?'v-ok':prom>=1.2?'v-med':'v-no')+'">'+
      '<b>Criterio más débil: el '+(flojo+1)+'</b><p>'+esc(C.criterios[flojo])+' — conviértelo en la meta de mejora del próximo ciclo PDCA.</p></div>';
    if(sinEv.length) html += '<div class="veredicto v-med" style="margin-top:9px"><b>Faltan evidencias</b>'+
      '<p>Los criterios '+sinEv.map(i=>i+1).join(', ')+' no tienen evidencia anotada. Una autoevaluación sin evidencia se queda en impresión general.</p></div>';
    salida.innerHTML = html;
  }
  const pie = el('div','tool-pie');
  pie.appendChild(avisoGuardado(t));
  t.appendChild(pie);
  pinta();
  return t;
}

/* ══════════ quiz ══════════ */
/* ── barajado determinista de las opciones ────────────────────────────
   Sin esto la respuesta correcta caía casi siempre en la segunda casilla,
   y bastaba marcar la misma letra para aprobar. El orden depende del
   capítulo, del número de pregunta y del intento: es igual al recargar
   la página y cambia cuando el estudiante vuelve a intentarlo. ── */
function semillaTxt(t){ let h=2166136261; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function barajaOpts(p, clave, pos){
  let s = semillaTxt(clave) || 1;
  const rnd = ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  const n = p.opts.length;
  const destino = ((pos % n) + n) % n;          /* la correcta rota de posición pregunta a pregunta */
  const otras = p.opts.map((_,i)=>i).filter(i=>i!==p.ok);
  for(let i=otras.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=otras[i]; otras[i]=otras[j]; otras[j]=t; }
  const idx = []; let k = 0;
  for(let i=0;i<n;i++) idx.push(i===destino ? p.ok : otras[k++]);
  return { opts: idx.map(i=>p.opts[i]), ok: destino };
}

const ESTADO = get('quiz', {});
function marcaHecho(id,a,t){ const p = ESTADO[id]; if(!p || a>=p.a){ ESTADO[id]={a,t}; set('quiz',ESTADO); } dibujaNav(); }

function quiz(id, intento){
  intento = intento || 0;
  const P = QUIZ[id];
  if(!P) return null;
  const q = el('div','tool quiz');
  q.innerHTML = '<div class="tool-cab"><b>Comprueba tu comprensión</b>'+
    '<span>Responde sin volver al texto. Cada respuesta explica el porqué.</span></div>';
  const cuerpo = el('div','tool-cuerpo');
  let ac=0, n=0;
  const marcador = el('div','marcador','0 de '+P.length+' respondidas');
  P.forEach((p,i)=>{
    const d = el('div','preg');
    d.appendChild(el('div','q','<i>'+String(i+1).padStart(2,'0')+'</i><span>'+esc(p.q)+'</span>'));
    const exp = el('div','exp oculto', esc(p.exp));
    const mez = barajaOpts(p, id+'·'+i+'·'+intento, i + intento + semillaTxt(id));
    const bs = mez.opts.map((o,j)=>{
      const b = el('button','op', esc(o));
      b.onclick = ()=>{
        bs.forEach(x=>x.disabled=true);
        b.classList.add(j===mez.ok?'bien':'mal');
        if(j!==mez.ok) bs[mez.ok].classList.add('bien');
        exp.classList.remove('oculto');
        n++; if(j===mez.ok) ac++;
        marcador.textContent = ac+' de '+n+' correctas';
        if(n===P.length){
          marcador.textContent = 'Resultado: '+ac+' de '+P.length+' correctas'+
            (ac===P.length?' — impecable.':ac>=P.length-1?' — muy bien.':' — vale la pena releer el capítulo.');
          marcaHecho(id, ac, P.length);
        }
      };
      d.appendChild(b);
      return b;
    });
    d.appendChild(exp);
    cuerpo.appendChild(d);
  });
  cuerpo.appendChild(marcador);
  const reintentar = el('button','bt ghost','↺ Volver a intentar');
  reintentar.style.marginTop = '14px';
  reintentar.onclick = ()=>{ const nuevo = quiz(id, intento+1); q.replaceWith(nuevo); nuevo.scrollIntoView({block:'start'}); };
  cuerpo.appendChild(reintentar);
  q.appendChild(cuerpo);
  return q;
}

      out.push(toolFilas({
        titulo:'Registro de progreso', clave:'progreso', etiqueta:'Semana',
        intro:'Un indicador por semana, sostenido en el tiempo. El valor no está en el número aislado sino en comparar semanas y detectar el punto donde algo cambió.',
        vacio:'Sin registros. Empieza esta semana con un indicador simple: ejercicios resueltos sin consultar la solución.',
        campos:[
          {k:'semana', n:'Semana', ph:'Semana 3'},
          {k:'indicador', n:'Indicador', ph:'Ejercicios resueltos sin ayuda'},
          {k:'valor', n:'Valor', ph:'7'},
          {k:'obs', n:'Qué explica ese valor', ph:'Bajó: el tema de árboles binarios me costó más'}
        ]}));
      break;
    case 'cap8':
      out.push(toolPDCA());
      out.push(toolRubricaB());
      break;
    case 'cap11': out.push(toolFuentes()); break;
    case 'anexo-a': out.push(toolPlan()); break;
    case 'anexo-b': out.push(toolRubricaB()); break;
    case 'anexo-c': out.push(toolFuentes()); break;
  }
  return out;
}

const PDCA_C = [
  {k:'p', n:'Planear', h:'Qué meta te propones y con qué estrategia, a partir de lo que arrojó tu autoevaluación.'},
  {k:'d', n:'Hacer', h:'Qué vas a poner en práctica concretamente, y cuándo.'},
  {k:'c', n:'Verificar', h:'Con qué evidencia compararás el resultado contra la meta.'},
  {k:'a', n:'Actuar', h:'Qué ajustarás según lo que encuentres. Este ajuste alimenta la siguiente vuelta del ciclo.'}
];
function toolPDCA(){
  const t = el('div','tool');
  t.innerHTML = '<div class="tool-cab"><b>Ciclo PDCA aplicado a una meta tuya</b>'+
    '<span>Planear, hacer, verificar, actuar. Escribe las cuatro fases para una meta de aprendizaje que tengas pendiente ahora mismo.</span></div>';
  const cuerpo = el('div','tool-cuerpo');
  let P = get('pdca', {});
  PDCA_C.forEach((c,i)=>{
    const l = el('label','campo');
    l.innerHTML = '<span>'+(i+1)+'. '+c.n+'</span><i>'+esc(c.h)+'</i>';
    const a = el('textarea'); a.rows=2; a.value=P[c.k]||'';
    a.oninput=()=>{ P[c.k]=a.value; set('pdca',P); marcaGuardado(t); };
    l.appendChild(a); cuerpo.appendChild(l);
  });
  t.appendChild(cuerpo);
  const pie = el('div','tool-pie');
  pie.appendChild(avisoGuardado(t));
  t.appendChild(pie);
  return t;
}

/* ══════════ navegación ══════════ */
let actual = 0;
function dibujaNav(){
  const nav = $('#nav'); nav.innerHTML='';
  let grupo = null;
  LIBRO.forEach((c,i)=>{
    const g = c.unidad || (c.kind==='anexo' ? 'Instrumentos de apoyo' : c.kind==='cap' ? 'Capítulos' : 'Apertura y cierre');
    if(g!==grupo){ grupo=g; nav.appendChild(el('div','grupo', esc(g))); }
    const b = el('button','nav-i'+(i===actual?' on':''));
    const e = ESTADO[c.id];
    b.innerHTML = '<span class="num">'+(c.num||'')+'</span><span>'+esc(c.titulo)+'</span>'+(e?'<span class="ck">'+e.a+'/'+e.t+'</span>':'');
    b.onclick = ()=>{ ve(i); cierra(); };
    nav.appendChild(b);
  });
  const caps = LIBRO.filter(c=>c.kind==='cap');
  const hechos = caps.filter(c=>ESTADO[c.id]).length;
  $('#avanceTxt').textContent = hechos+' de '+caps.length+' capítulos';
  $('#aroFg').setAttribute('stroke-dasharray',(hechos/caps.length*100.5)+' 100.5');
}
function cierra(){ $('#rail').classList.remove('abierto'); $('#velo').classList.remove('on'); }

/* enlaza un ejercicio con la herramienta que sirve para resolverlo */
const ATAJOS = [
  {re:/plan personal de aprendizaje|plan de aprendizaje continuo/i, t:'Abrir el Plan Personal de Aprendizaje ↓', id:'anexo-a'},
  {re:/metas smart|formato de metas smart/i, t:'Abrir el constructor de metas SMART ↓', id:'cap3'},
  {re:/diario de (monitoreo|reflexi)/i, t:'Abrir el diario de reflexión ↓', id:'cap6'},
  {re:/cronograma semanal|matriz/i, t:'Abrir la matriz de planificación ↓', id:'cap3'},
  {re:/mapa de (recursos|fuentes)|eval[úu]a cada uno|ruta estratégica de recursos/i, t:'Abrir el mapa de recursos ↓', id:'cap4'},
  {re:/clasif[íi]calos en confiables|eval[úu]ala aplicando los (cuatro )?criterios|diez sitios web/i, t:'Abrir el evaluador de fuentes ↓', id:'cap11'},
  {re:/ciclo pdca/i, t:'Abrir el ciclo PDCA ↓', id:'cap8'},
  {re:/registro de rendimiento|registro semanal/i, t:'Abrir el registro de progreso ↓', id:'cap7'},
  {re:/lista de cotejo|r[úu]brica sencilla/i, t:'Abrir la rúbrica de autoevaluación ↓', id:'anexo-b'},
  {re:/diagn[óo]stico personal/i, t:'Abrir el diagnóstico ↓', id:'cap1'}
];
function atajo(txt){
  const a = ATAJOS.find(x=>x.re.test(txt));
  if(!a) return null;
  const aqui = LIBRO[actual] && LIBRO[actual].id === a.id;
  return {
    t: aqui ? a.t.replace(' ↓',' (más abajo en esta página)') : a.t.replace(' ↓',' →'),
    f: ()=>{
      if(aqui){ const el0 = $('.tool'); if(el0) el0.scrollIntoView({behavior:'smooth', block:'start'}); return; }
      const i = LIBRO.findIndex(c=>c.id===a.id);
      if(i>=0){ ve(i); setTimeout(()=>{ const el0=$('.tool'); if(el0) el0.scrollIntoView({block:'start'}); }, 60); }
    }
  };
}

function bloque(b){
  switch(b.type){
    case 'p': return el('p', null, esc(b.text));
    case 'h2': return el('h2', null, esc(b.text));
    case 'objetivos': case 'concepto': {
      const d = el('div','caja '+b.type);
      d.appendChild(el('div','t','<span>'+(b.type==='concepto'?'◈':'◎')+'</span>'+esc(b.title)));
      d.appendChild(el('p',null,esc(b.body)));
      return d;
    }
    case 'ejercicios': {
      const d = el('div','ejs');
      d.appendChild(el('h3',null,'Ponlo a prueba'));
      const items = b.body.split(/\n(?=\d+\.\s)/);
      items.forEach((t,i)=>{
        const txt = t.replace(/^\d+\.\s*/,'').trim();
        if(!txt) return;
        const e = el('div','ej');
        e.appendChild(el('div','n', String(i+1)));
        const col = el('div'); col.style.flex='1';
        col.appendChild(el('p',null,esc(txt)));
        const at = atajo(txt);
        if(at){
          const b2 = el('button','link', at.t);
          b2.onclick = at.f;
          col.appendChild(b2);
        }
        e.appendChild(col);
        d.appendChild(e);
      });
      return d;
    }
    case 'img': {
      const f = el('figure');
      const i = el('img'); i.src=b.data; i.alt=b.caption||'Figura del libro'; i.loading='lazy';
      f.appendChild(i);
      if(b.caption) f.appendChild(el('figcaption',null,esc(b.caption)));
      return f;
    }
    case 'grid': {
      const w = el('div','tabla-wrap');
      const t = el('table','datos');
      const [cab, ...fs] = b.rows;
      t.innerHTML = '<thead><tr>'+cab.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
        fs.map(f=>'<tr>'+f.map(x=>'<td>'+esc(x).replace(/\n/g,'<br>')+'</td>').join('')+'</tr>').join('')+'</tbody>';
      w.appendChild(t); return w;
    }
    default: return el('div');
  }
}

function ve(i){
  actual = Math.max(0, Math.min(LIBRO.length-1, i));
  const c = LIBRO[actual];
  const h = $('#hoja'); h.innerHTML='';
  $('#barraTit').textContent = c.titulo;
  document.title = c.titulo + ' · Aprendizaje Autónomo';

  if(c.id==='portada'){ h.appendChild(portada(c)); }
  else {
    const tapa = el('div','tapa');
    if(c.kind==='cap') tapa.appendChild(el('div','eyebrow','Capítulo '+c.num+' · '+esc((c.unidad||'').split('·')[0].trim())));
    else if(c.kind==='anexo') tapa.appendChild(el('div','eyebrow','Instrumento de apoyo'));
    tapa.appendChild(el('h1',null,esc(c.titulo)));
    h.appendChild(tapa);
    if(c.id==='rubrica'){ /* caso especial antes de la regla general de anexos */
      c.blocks.forEach(b=>{ if(b.type==='p') h.appendChild(bloque(b)); });
      const g = c.blocks.find(b=>b.type==='grid');
      if(g) h.appendChild(toolRubricaCurso(g.rows));
      const det = el('details');
      det.innerHTML = '<summary style="font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--tinta-2);cursor:pointer;margin:18px 0 10px">Ver la rúbrica completa en tabla</summary>';
      if(g) det.appendChild(bloque(g));
      h.appendChild(det);
    } else if(c.kind==='anexo'){
      /* la herramienta reemplaza la plantilla impresa: solo se conserva la nota introductoria */
      const intro = c.blocks.find(b=>b.type==='p');
      if(intro) h.appendChild(bloque(intro));
    } else {
      /* varios párrafos seguidos bajo «Objetivos específicos» son ítems paralelos: van como lista */
      let enLista = false, lista = null;
      c.blocks.forEach(b=>{
        if(b.type==='h2'){
          enLista = /objetivos\s+espec/i.test(b.text);
          lista = null;
          h.appendChild(bloque(b));
          return;
        }
        if(enLista && b.type==='p'){
          if(!lista){ lista = el('ol','lista-obj'); h.appendChild(lista); }
          lista.appendChild(el('li', null, esc(b.text)));
          return;
        }
        lista = null;
        h.appendChild(bloque(b));
      });
    }
    herramientas(c).forEach(x=>h.appendChild(x));
    if(c.kind==='cap'){ const q = quiz(c.id); if(q) h.appendChild(q); }
  }
  h.appendChild(pie());
  dibujaNav();
  if(location.hash.slice(1) !== c.id) location.hash = c.id;
  window.scrollTo({top:0,behavior:'instant'});
}

function portada(c){
  const d = el('div','portada');
  const im = c.blocks.find(b=>b.type==='img');
  const img = el('img'); img.src = im.data; img.alt='Portada del libro';
  const der = el('div');
  der.innerHTML = '<div class="eyebrow">Edición interactiva</div>'+
    '<h1>Aprendizaje Autónomo</h1>'+
    '<p class="claim">Estrategias para la autogestión y la actualización continua. Esta edición convierte los instrumentos del libro en herramientas que se llenan, se guardan y se entregan.</p>'+
    '<div class="autores">Mario Roberto Durango Luna · Pedro Rafael Guevara Salgado · Ledys Alcira Arrieta Perez<br>'+
    '<span>Aprendizaje Autónomo (FDOC-088) · Tecnología en Desarrollo de Software · Universidad de Córdoba · Montería, 2026</span></div>';
  const t = el('div','tarjetas');
  [['◎','Diagnostica tus tres dimensiones y descubre cuál conviene trabajar primero.'],
   ['◈','Construye metas SMART que se validan criterio por criterio.'],
   ['✎','Lleva el diario de reflexión y el registro de progreso dentro del propio libro.'],
   ['⚖','Evalúa la fiabilidad de una fuente y obtén su clasificación justificada.'],
   ['🗂','Reúne todo en un portafolio descargable, listo para entregar.']].forEach(([i,x])=>{
    t.appendChild(el('div','tarj','<i>'+i+'</i><span>'+x+'</span>'));
  });
  der.appendChild(t);
  const b = el('button','bt-nav sig','Empezar por el prólogo →');
  b.onclick = ()=>ve(LIBRO.findIndex(x=>x.id==='prologo'));
  der.appendChild(b);
  der.appendChild(el('div','aviso','Tu trabajo se guarda en este navegador, en este dispositivo, y no viaja a ningún servidor. Descarga el portafolio antes de cambiar de computador.'));
  d.appendChild(img); d.appendChild(der);
  return d;
}

function pie(){
  const p = el('div','pie');
  const a = el('button','bt-nav','← '+(actual>0?LIBRO[actual-1].titulo.slice(0,32):'Inicio'));
  a.onclick=()=>ve(actual-1); a.disabled = actual<=0;
  const b = el('button','bt-nav sig',(actual<LIBRO.length-1&&actual>=0?LIBRO[actual+1].titulo.slice(0,32):'Fin')+' →');
  b.onclick=()=>ve(actual+1); b.disabled = actual<0 || actual===LIBRO.length-1;
  p.appendChild(a); p.appendChild(b);
  return p;
}

$('#ham').onclick = ()=>{ $('#rail').classList.toggle('abierto'); $('#velo').classList.toggle('on'); };
$('#velo').onclick = cierra;
$('#btPort').onclick = ()=>{ vistaPortafolio(); cierra(); };
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='ArrowRight' && actual>=0) ve(actual+1);
  if(e.key==='ArrowLeft' && actual>0) ve(actual-1);
});
/* ── enlace directo: la dirección refleja la sección abierta, así el
   botón Atrás funciona y se puede compartir un capítulo concreto ── */
window.addEventListener('hashchange', ()=>{
  const id = decodeURIComponent((location.hash||'').slice(1));
  const i = LIBRO.findIndex(c=>c.id===id);
  if(i>=0 && i!==actual) ve(i);
});
ve(Math.max(0, LIBRO.findIndex(c=>c.id===decodeURIComponent((location.hash||'').slice(1)))));
</script>
