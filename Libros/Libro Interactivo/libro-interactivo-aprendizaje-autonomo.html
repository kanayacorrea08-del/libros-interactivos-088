<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprendizaje Autónomo · Edición interactiva</title>
<meta name="description" content="Edición interactiva del libro Aprendizaje Autónomo: estrategias para la autogestión y la actualización continua. Universidad de Córdoba.">
<style>
:root{
  --noche:#14263f; --noche-2:#1d3557; 
  --azul:#1d3557; --azul-cl:#e7edf5; --azul-borde:#c3d2e4;
  --oro:#8b6b2e; --oro-cl:#faf3e6; --oro-borde:#e3d3ae;
  --papel:#fbfaf7; --papel-2:#f2efe8; --linea:#ddd8cc;
  --tinta:#1b2431; --tinta-2:#5a6577;
  --ok:#2f7d51; --ok-cl:#e6f3ec; --alerta:#a8451f; --alerta-cl:#fbeee8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:"Charter","Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:288px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--serif);font-size:17.5px;line-height:1.64;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:var(--sans)}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--oro);outline-offset:2px;border-radius:2px}

/* ── rail ── */
#rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--noche);color:#dbe4ef;
  display:flex;flex-direction:column;z-index:40;transition:transform .25s ease}
.rail-top{padding:18px 20px 15px;border-bottom:1px solid rgba(255,255,255,.12)}
.marca{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.2px;color:#fff;line-height:1.2}
.marca em{font-style:normal;color:#d9b979}
.sub{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8fa5c0;margin-top:8px}
.avance{display:flex;align-items:center;gap:10px;margin-top:15px}
.aro{width:34px;height:34px;flex:0 0 34px}
.aro circle{fill:none;stroke-width:4}
.aro .bg{stroke:rgba(255,255,255,.16)}
.aro .fg{stroke:#d9b979;stroke-linecap:round;transition:stroke-dasharray .4s}
.avance b{font-family:var(--sans);font-size:12px;font-weight:600;color:#b9cade}
nav{overflow-y:auto;padding:10px 12px 30px;flex:1}
.grupo{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#7f96b3;padding:16px 10px 6px;border-top:1px solid rgba(255,255,255,.1);margin-top:8px;line-height:1.4}
.grupo:first-child{border-top:0;margin-top:0}
.nav-i{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  padding:7px 10px;border-radius:7px;color:#dbe4ef;font-size:13.5px;line-height:1.35;font-family:var(--sans)}
.nav-i:hover{background:rgba(255,255,255,.09)}
.nav-i.on{background:#d9b979;color:var(--noche);font-weight:600}
.nav-i.on .num{color:var(--noche)}
.nav-i .num{font-weight:700;font-size:11px;color:#d9b979;min-width:16px;font-variant-numeric:tabular-nums}
.nav-i .ck{margin-left:auto;font-size:11px;opacity:.9}
.rail-pie{padding:12px;border-top:1px solid rgba(255,255,255,.12)}
.bt-port{width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#fff;
  border-radius:9px;padding:10px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.bt-port:hover{background:rgba(217,185,121,.22);border-color:#d9b979}

/* ── contenido ── */
main{margin-left:var(--rail);padding:0 0 90px}
.hoja{max-width:770px;margin:0 auto;padding:0 30px}
.tapa{padding:40px 0 20px;margin-bottom:8px}
.eyebrow{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);margin-bottom:11px}
h1{font-family:var(--sans);font-weight:800;font-size:clamp(28px,4vw,38px);line-height:1.1;letter-spacing:-.022em;color:var(--noche);margin:0 0 12px}
h2{font-family:var(--sans);font-weight:700;font-size:19.5px;letter-spacing:-.01em;color:var(--noche);margin:42px 0 12px;padding-left:13px;border-left:4px solid var(--oro)}
h3{font-family:var(--sans);font-weight:650;font-size:16px;color:var(--tinta);margin:26px 0 8px}
p{margin:0 0 15px}
figure{margin:26px 0;text-align:center}
figure img{max-width:100%;border-radius:9px;border:1px solid var(--linea);background:#fff}
figcaption{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);margin-top:9px}
.refs p{font-size:15px;padding-left:26px;text-indent:-26px;margin-bottom:9px;line-height:1.5}
ol.lista-obj{margin:0 0 18px;padding-left:26px}
ol.lista-obj li{margin-bottom:10px;padding-left:4px}
ol.lista-obj li::marker{font-family:var(--sans);font-weight:700;font-size:.86em;color:var(--oro)}

/* ── cajas ── */
.caja{border-radius:11px;padding:16px 18px;margin:22px 0;font-size:16px;border:1px solid}
.caja .t{font-family:var(--sans);font-weight:700;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px;display:flex;gap:8px;align-items:center}
.caja p{margin:0}
.caja.objetivos{background:var(--azul-cl);border-color:var(--azul-borde)}
.caja.objetivos .t{color:var(--azul)}
.caja.concepto{background:var(--oro-cl);border-color:var(--oro-borde)}
.caja.concepto .t{color:var(--oro)}

/* ── ejercicios ── */
.ejs{margin:34px 0 10px}
.ej{display:flex;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:14px 16px;margin-bottom:10px;align-items:flex-start}
.ej .n{font-family:var(--sans);font-weight:800;font-size:12px;color:#fff;background:var(--noche);
  min-width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
.ej p{margin:0;font-size:16px;flex:1}
.ej .link{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--oro);background:none;border:0;padding:4px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}

/* ── herramientas ── */
.tool{background:#fff;border:1px solid var(--linea);border-radius:13px;margin:32px 0;overflow:hidden;box-shadow:0 1px 3px rgba(20,38,63,.06)}
.tool-cab{padding:15px 20px;background:var(--noche);color:#fff}
.tool-cab b{font-family:var(--sans);font-size:15.5px;display:block;letter-spacing:-.01em}
.tool-cab span{font-family:var(--sans);font-size:12.5px;color:#a9bdd4;display:block;margin-top:3px;line-height:1.45}
.tool-cuerpo{padding:18px 20px}
.tool-pie{padding:13px 20px;background:var(--papel-2);border-top:1px solid var(--linea);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.guardado{font-family:var(--sans);font-size:12px;color:var(--tinta-2);margin-left:auto}
.guardado.ok{color:var(--ok);font-weight:600}
.bt{font-family:var(--sans);font-size:13px;font-weight:600;border:1px solid var(--linea);background:#fff;
  color:var(--noche);padding:8px 15px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
.bt:hover{border-color:var(--oro);background:var(--oro-cl)}
.bt.pri{background:var(--noche);border-color:var(--noche);color:#fff}
.bt.pri:hover{background:var(--noche-2);border-color:var(--noche-2)}
.bt.ghost{background:none;border-color:transparent;color:var(--tinta-2)}
.bt.ghost:hover{background:var(--papel-2);border-color:var(--linea)}
label.campo{display:block;margin-bottom:15px}
label.campo>span{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--noche);display:block;margin-bottom:5px}
label.campo>i{font-family:var(--sans);font-size:12px;color:var(--tinta-2);font-style:normal;display:block;margin-bottom:6px;line-height:1.45}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;border:1px solid var(--linea);border-radius:8px;padding:9px 11px;font-size:14.5px;
  background:var(--papel);color:var(--tinta);outline:0;font-family:var(--sans);line-height:1.5}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{border-color:var(--noche);background:#fff}

/* escala de opciones */
.escala{display:flex;gap:6px;flex-wrap:wrap}
.op-e{flex:1 1 0;min-width:74px;font-family:var(--sans);font-size:12px;font-weight:600;border:1px solid var(--linea);
  background:var(--papel);color:var(--tinta-2);border-radius:8px;padding:8px 6px;text-align:center;line-height:1.3}
.op-e:hover{border-color:var(--oro)}
.op-e.sel{background:var(--noche);border-color:var(--noche);color:#fff}
.item-d{padding:13px 0;border-top:1px solid var(--papel-2)}
.item-d:first-child{border-top:0;padding-top:0}
.item-d .txt{font-size:15.5px;margin-bottom:9px;display:flex;gap:9px}
.item-d .txt i{font-family:var(--sans);font-style:normal;font-weight:800;font-size:11px;color:var(--oro);padding-top:4px;min-width:17px}

/* barras de resultado */
.res-dim{margin-bottom:16px}
.res-cab{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--sans);margin-bottom:5px;gap:10px}
.res-cab b{font-size:14.5px;color:var(--noche)}
.res-cab span{font-size:12.5px;font-weight:600;color:var(--oro)}
.barra{height:11px;background:var(--papel-2);border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--noche),#4a7bb0);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.res-txt{font-family:var(--sans);font-size:13px;color:var(--tinta-2);margin-top:6px;line-height:1.5}

/* filas dinámicas */
.filas{display:grid;gap:10px;margin-bottom:12px}
.fila{display:grid;gap:8px;background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:12px}
.fila-cab{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--oro);text-transform:uppercase;letter-spacing:.08em}
.fila-cab .x{margin-left:auto;background:none;border:0;color:var(--tinta-2);font-size:16px;line-height:1;padding:2px 6px;border-radius:5px}
.fila-cab .x:hover{background:var(--alerta-cl);color:var(--alerta)}
.mini{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--tinta-2);display:block;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* veredicto */
.veredicto{border-radius:10px;padding:14px 16px;font-family:var(--sans);margin-top:14px;border:1px solid}
.veredicto b{font-size:15px;display:block;margin-bottom:4px}
.veredicto p{font-size:13.5px;margin:0;color:inherit;line-height:1.5}
.v-ok{background:var(--ok-cl);border-color:#a9d3ba;color:#1e5c3a}
.v-med{background:var(--oro-cl);border-color:var(--oro-borde);color:#7a5c22}
.v-no{background:var(--alerta-cl);border-color:#e6bdac;color:#8c3a1a}

/* entradas del diario */
.entrada{background:var(--papel);border:1px solid var(--linea);border-left:4px solid var(--oro);border-radius:0 9px 9px 0;padding:12px 14px;margin-bottom:9px}
.entrada .meta{font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--oro);text-transform:uppercase;letter-spacing:.07em;display:flex;gap:8px;align-items:center}
.entrada .meta .x{margin-left:auto;background:none;border:0;color:var(--tinta-2);font-size:15px;padding:0 4px}
.entrada dl{margin:8px 0 0;font-size:14.5px}
.entrada dt{font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.05em;margin-top:7px}
.entrada dd{margin:2px 0 0}
.vacio{font-family:var(--sans);font-size:13.5px;color:var(--tinta-2);background:var(--papel-2);border-radius:9px;padding:14px;text-align:center;line-height:1.5}

/* tablas */
.tabla-wrap{overflow-x:auto;margin:22px 0}
table.datos{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13.5px}
table.datos th{background:var(--noche);color:#fff;text-align:left;padding:9px 11px;font-weight:600;font-size:12px;vertical-align:top}
table.datos td{padding:8px 11px;border-bottom:1px solid var(--linea);vertical-align:top}
table.datos tr:nth-child(even) td{background:var(--papel)}

/* rúbrica navegable */
.rub-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rub-nav button{font-family:var(--sans);font-size:12px;font-weight:600;border:1px solid var(--linea);background:var(--papel);
  color:var(--tinta-2);border-radius:7px;padding:7px 11px}
.rub-nav button.on{background:var(--noche);border-color:var(--noche);color:#fff}
.niveles{display:grid;gap:8px}
.nivel{border:1px solid var(--linea);border-radius:9px;padding:11px 14px;background:var(--papel);font-size:14.5px;display:flex;gap:12px;align-items:flex-start}
.nivel .et{font-family:var(--sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--oro);min-width:96px;flex:0 0 auto;padding-top:2px;line-height:1.35}
.nivel.sel{border-color:var(--noche);background:var(--azul-cl);box-shadow:inset 3px 0 0 var(--noche)}
.nivel:hover{border-color:var(--oro)}

/* quiz */
.quiz .enc{font-family:var(--sans);font-weight:800;font-size:17px;color:var(--noche);margin-bottom:3px}
.preg{padding:16px 0;border-top:1px solid var(--papel-2)}
.preg:first-of-type{border-top:0}
.preg .q{font-family:var(--sans);font-size:15.5px;font-weight:600;margin-bottom:11px;display:flex;gap:9px}
.preg .q i{color:var(--oro);font-style:normal;font-weight:800;font-size:12px;padding-top:3px}
.op{display:block;width:100%;text-align:left;font-size:14.5px;padding:9px 13px;margin-bottom:6px;border-radius:8px;
  border:1px solid var(--linea);background:var(--papel);color:var(--tinta);line-height:1.4}
.op:hover:not([disabled]){border-color:var(--oro);background:#fff}
.op.bien{background:var(--ok-cl);border-color:#a9d3ba;font-weight:600}
.op.mal{background:var(--alerta-cl);border-color:#e6bdac}
.op[disabled]{cursor:default}
.exp{font-family:var(--sans);font-size:13.5px;background:var(--papel-2);border-left:3px solid var(--oro);
  padding:9px 13px;border-radius:0 7px 7px 0;margin-top:8px;color:var(--tinta-2);line-height:1.5}
.marcador{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--noche);margin-top:16px;padding-top:14px;border-top:1px solid var(--papel-2)}

/* portada */
.portada{display:grid;grid-template-columns:minmax(200px,.72fr) 1.28fr;gap:40px;align-items:center;padding:44px 0 16px}
.portada img{width:100%;border-radius:11px;box-shadow:0 16px 44px rgba(20,38,63,.28)}
.portada h1{font-size:clamp(26px,3vw,34px)}
.claim{font-size:17px;color:var(--tinta-2);margin-bottom:18px}
.autores{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--noche);border-left:3px solid var(--oro);
  padding-left:12px;margin-bottom:20px;line-height:1.5}
.autores span{display:block;font-weight:400;font-size:11.5px;color:var(--tinta-2);margin-top:3px}
.tarjetas{display:grid;gap:9px;margin:18px 0 22px}
.tarj{display:flex;gap:11px;align-items:flex-start;font-family:var(--sans);font-size:14px;background:#fff;
  border:1px solid var(--linea);border-radius:10px;padding:12px 14px}
.tarj i{font-style:normal;font-size:15px;color:var(--oro)}
.aviso{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);background:var(--papel-2);border-radius:9px;padding:11px 14px;margin-top:14px;line-height:1.5}

/* portafolio */
.porta-item{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;gap:13px;align-items:flex-start}
.porta-item .est{font-size:17px;line-height:1;margin-top:2px}
.porta-item b{font-family:var(--sans);font-size:14.5px;color:var(--noche);display:block}
.porta-item span{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);display:block;margin-top:2px;line-height:1.45}
.porta-item .bt{margin-left:auto;flex:0 0 auto}

/* pie */
.pie{display:flex;gap:12px;justify-content:space-between;margin-top:50px;padding-top:20px;border-top:1px solid var(--linea);flex-wrap:wrap}
.bt-nav{font-family:var(--sans);font-size:14px;font-weight:600;border:1px solid var(--linea);background:#fff;color:var(--noche);padding:10px 16px;border-radius:9px}
.bt-nav:hover{border-color:var(--oro);background:var(--oro-cl)}
.bt-nav.sig{background:var(--noche);color:#fff;border-color:var(--noche)}
.bt-nav[disabled]{opacity:.4;cursor:not-allowed}

/* barra móvil */
#barra{display:none;position:sticky;top:0;z-index:30;background:rgba(251,250,247,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linea);padding:9px 14px;align-items:center;gap:11px}
#barra b{font-family:var(--sans);font-size:13.5px;color:var(--noche);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ham{border:1px solid var(--linea);background:#fff;border-radius:8px;width:36px;height:34px;font-size:15px;color:var(--noche)}
#velo{display:none;position:fixed;inset:0;background:rgba(20,38,63,.45);z-index:35}
.oculto{display:none}

@media(max-width:900px){
  #rail{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  #rail.abierto{transform:none}
  main{margin-left:0}
  #barra{display:flex}
  #velo.on{display:block}
  .hoja{padding:0 18px}
  .portada{grid-template-columns:1fr;gap:22px;padding-top:24px}
  .portada img{max-width:250px;margin:0 auto;display:block}
}
@media(max-width:640px){
  body{font-size:17px}
  .g2,.g3{grid-template-columns:1fr}
  .tool-cuerpo,.tool-pie{padding:15px}
  .op-e{min-width:0;flex:1 1 44%;font-size:11.5px;padding:8px 4px}
  .nivel{flex-direction:column;gap:4px}
  .nivel .et{min-width:0}
  .guardado{margin-left:0;width:100%}
  .porta-item{flex-wrap:wrap}
  .porta-item .bt{margin-left:0;width:100%;justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{#rail,#barra,.tool-pie,.pie{display:none}main{margin:0}}
</style>
</head>
<body>

<div id="velo"></div>

<aside id="rail">
  <div class="rail-top">
    <div class="marca">Aprendizaje<br><em>Autónomo</em></div>
    <div class="sub">Edición interactiva</div>
    <div class="avance">
      <svg class="aro" viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/>
        <circle class="fg" id="aroFg" cx="20" cy="20" r="16" stroke-dasharray="0 100.5" transform="rotate(-90 20 20)"/></svg>
      <b id="avanceTxt">0 de 12 capítulos</b>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="rail-pie">
    <button class="bt-port" id="btPort">🗂 Mi portafolio</button>
  </div>
</aside>

<div id="barra"><button id="ham" aria-label="Abrir el índice">☰</button><b id="barraTit"></b></div>

rama Tecnología en Desarrollo de Software", "b": false}, {"type": "grid", "rows": [["APRENDIZAJE AUTÓNOMO\nEstrategias para la Autogestión y la Actualización Continua"]]}, {"type": "grid", "rows": [["AUTORES:\nMario Roberto Durango Luna\nPedro Rafael Guevara Salgado\nLedys Alcira Arrieta Perez"]]}, {"type": "p", "text": "Montería", "b": true}, {"type": "p", "text": "2026", "b": true}, {"type": "p", "text": "Este material acompaña el curso Aprendizaje Autónomo (FDOC-088) del programa Tecnología en Desarrollo de Software, ofrecido en Montería, Lorica, Sahagún, Berástegui y Montelíbano. Recorre los fundamentos del aprendizaje autónomo, el desarrollo del pensamiento crítico y reflexivo, y la búsqueda de información y actualización continua, proponiendo que cada estudiante construya su propio plan de formación.", "b": false}, {"type": "p", "text": "Editorial: xxxxxxxxxxxxxx", "b": true}, {"type": "p", "text": "1.ª edición, publicada en 2026.", "b": false}, {"type": "p", "text": "Montería, Córdoba, Colombia.", "b": false}, {"type": "p", "text": "Autores: Mario Roberto Durango Luna· Pedro Rafael Guevara Salgado· Ledys Alcira Arrieta Perez", "b": true}, {"type": "p", "text": "Universidad de Córdoba.", "b": false}, {"type": "p", "text": "Facultad de Ingenierías, Programa Tecnología en Desarrollo de Software.", "b": false}, {"type": "p", "text": "Copyright 2026", "b": true}, {"type": "p", "text": "Esta obra está bajo una licencia Creative Commons", "b": false}, {"type": "p", "text": "\"Atribución-NoComercial-CompartirIgual 4.0 Internacional\" (CC BY-NC-SA 4.0).", "b": false}, {"type": "p", "text": "Se permite la reproducción parcial con fines educativos citando la fuente. Queda prohibida la reproducción comercial sin autorización expresa de los autores.", "b": false}, {"type": "p", "text": "ISBN: [por asignar]", "b": true}, {"type": "p", "text": "Hecho el depósito de ley.", "b": false}, {"type": "p", "text": "Impreso en Colombia / Printed in Colombia.", "b": false}, {"type": "p", "text": "A los estudiantes de Tecnología en Desarrollo de Software de la Universidad de Córdoba,", "b": false}, {"type": "p", "text": "en Montería, Lorica, Sahagún, Berástegui y Montelíbano,", "b": false}, {"type": "p", "text": "que están aprendiendo a organizar su propio proceso de formación.", "b": false}, {"type": "p", "text": "A quienes revisan de dónde viene la información antes de creerla,", "b": false}, {"type": "p", "text": "y a quienes todavía están aprendiendo a hacerlo.", "b": false}]}, {"id": "agradecimientos", "titulo": "Agradecimientos", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Este material nació de las asesorías y encuentros del curso Aprendizaje Autónomo (FDOC-088), desarrollado en el primer semestre de Tecnología en Desarrollo de Software, y le debe buena parte de su forma a las preguntas que los estudiantes de Montería, Lorica, Sahagún, Berástegui y Montelíbano fueron planteando sobre cómo organizar su propio tiempo de estudio.", "b": false}, {"type": "p", "text": "La Facultad de Ingenierías de la Universidad de Córdoba puso el marco institucional que hizo posible este libro, pensado para acompañar a estudiantes que apenas comienzan su programa y todavía están descubriendo cómo aprender por su cuenta.", "b": false}, {"type": "p", "text": "Un agradecimiento aparte merece la literatura en autorregulación del aprendizaje y metacognición que sostiene cada capítulo: los trabajos de Panadero y Alonso-Tapia, de Zimmerman, y de los investigadores colombianos y latinoamericanos citados a lo largo del texto, sin cuyos hallazgos este libro se quedaría en opiniones sueltas.", "b": false}]}, {"id": "prologo", "titulo": "Prólogo", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Aprender a programar, a diseñar sistemas o a depurar código no es, en el fondo, muy distinto de aprender cualquier otra cosa difícil: exige saber por dónde empezar, cuánto tiempo dedicarle, cuándo el método que se está usando ya no funciona y qué hacer cuando eso pasa. Este libro no enseña ninguna tecnología en particular. Enseña la disciplina que hace posible aprenderlas todas.", "b": false}, {"type": "p", "text": "El recorrido elegido responde a una lógica sencilla. La Unidad 1 empieza por el concepto mismo de aprendizaje autónomo y por dos herramientas internas que lo sostienen: la metacognición, o pensar sobre cómo se piensa, y la autorregulación, o dirigir la propia conducta de estudio pese a las distracciones. Sin esas dos piezas, cualquier técnica de planificación se queda en una lista de buenas intenciones.", "b": false}, {"type": "p", "text": "La Unidad 2 se detiene en el pensamiento crítico y en la reflexión, porque un estudiante que memoriza sin cuestionar difícilmente distingue una buena solución de una que solo parece funcionar. La Unidad 3 cierra con algo que en tecnología nunca deja de ser urgente: saber dónde buscar información confiable y cómo mantenerse al día cuando lo que se aprendió el semestre pasado ya cambió.", "b": false}, {"type": "p", "text": "Cada capítulo sigue el mismo recorrido: parte de una situación que el estudiante ya reconoce, explica el concepto con el rigor que exige la educación superior, y cierra con un ejemplo aplicado a proyectos de software y con actividades para practicarlo. La intención es que este material sirva tanto para preparar los encuentros del curso como para volver a él cuando, más adelante, la carrera exija aprender algo que todavía no existe.", "b": false}, {"type": "p", "text": "De los autores.", "b": false}, {"type": "p", "text": "Universidad de Córdoba, Montería, 2026.", "b": false}]}, {"id": "introduccion", "titulo": "Introducción", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "h2", "text": "Contextualización"}, {"type": "p", "text": "Ningún plan de estudios alcanza a cubrir todo lo que un profesional del desarrollo de software va a necesitar saber. Los lenguajes cambian, los frameworks se renuevan cada pocos años y las herramientas que hoy son estándar de la industria pueden quedar obsoletas antes de que termine la carrera. Este libro acompaña el curso Aprendizaje Autónomo (FDOC-088) precisamente para atender esa realidad: no se trata de enseñar contenidos que se vencen rápido, sino de fortalecer la capacidad de aprender cualquier contenido por cuenta propia.", "b": false}, {"type": "h2", "text": "Justificación"}, {"type": "p", "text": "La autorregulación del aprendizaje se ha convertido en una de las competencias más estudiadas en la educación superior de los últimos años, en buena parte porque distingue a los estudiantes que sostienen su formación en el tiempo de los que dependen enteramente de la estructura de un curso (Garzón-Umerenkova & Gil-Flores, 2018). En programas de tecnología esa diferencia se nota todavía más rápido: quien no aprende a planificar su estudio, a pensar críticamente sobre lo que lee y a evaluar de dónde saca su información, llega a un entorno laboral que cambia de herramientas cada dos años sin las bases para adaptarse.", "b": false}, {"type": "h2", "text": "Objetivo general"}, {"type": "p", "text": "Gestionar su propio proceso de aprendizaje de forma consciente, integrando metacognición, pensamiento crítico y estrategias de búsqueda y actualización de información, con miras a sostener esa capacidad más allá de la vida académica.", "b": false}, {"type": "h2", "text": "Objetivos específicos"}, {"type": "p", "text": "Comprender los fundamentos del aprendizaje autónomo y desarrollar metacognición y autorregulación como base para planificar el propio estudio y gestionar los recursos disponibles.", "b": false}, {"type": "p", "text": "Fortalecer el pensamiento crítico y la reflexión continua como herramientas para evaluar el propio progreso y ajustar el rumbo cuando algo no está funcionando.", "b": false}, {"type": "p", "text": "Desarrollar habilidades de búsqueda y selección de información que permitan mantenerse actualizado frente a las tendencias tecnológicas, distinguiendo fuentes confiables de las que no lo son.", "b": false}, {"type": "h2", "text": "Metodología"}, {"type": "p", "text": "Cada capítulo sigue el mismo recorrido: arranca con una situación concreta que el estudiante de tecnología ya reconoce, desarrolla el concepto con el rigor que exige la educación superior, y cierra integrando todo en un ejemplo aplicado a proyectos de software antes de proponer actividades que llevan la teoría a la práctica.", "b": false}]}, {"id": "cap1", "titulo": "Concepto de aprendizaje autónomo", "kind": "cap", "num": 1, "unidad": "UNIDAD 1 · FUNDAMENTOS DEL APRENDIZAJE AUTÓNOMO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás definir el aprendizaje autónomo con tus propias palabras, reconocer sus características y dimensiones, y explicar por qué es una competencia central en la educación superior."}, {"type": "h2", "text": "1.1  Qué es el aprendizaje autónomo y sus características principales"}, {"type": "p", "text": "El aprendizaje autónomo es la capacidad de una persona para dirigir su propio proceso de formación: fijar metas, elegir estrategias, buscar recursos y evaluar sus propios resultados sin depender por completo de que alguien más le diga qué hacer a continuación (Condori Contreras, 2023). No significa aprender en soledad ni rechazar la orientación de un docente; significa que, cuando esa orientación no está disponible, el estudiante sabe cómo seguir avanzando.", "b": false}, {"type": "p", "text": "Quien aprende de forma autónoma suele compartir algunos rasgos: toma la iniciativa en lugar de esperar instrucciones, sostiene una motivación que nace más de su propio interés que de la obligación de aprobar, busca activamente información en lugar de recibirla pasivamente, revisa con honestidad lo que va entendiendo y lo que no, y asume como propia la responsabilidad de su formación. Ninguno de estos rasgos aparece de un día para otro. Se construyen con práctica, casi siempre a fuerza de tropezar con tareas que exigían más autonomía de la que el estudiante tenía todavía.", "b": false}, {"type": "img", "caption": "Figura 1.1 · Las tres dimensiones del aprendizaje autónomo", "data": "data:image/webp;base64,UklGRlZQAABXRUJQVlA4IEpQAADQmAGdASroA8ICPmEwlkekIyKhIhSpMIAMCWlu4XaxB6V+Q8Qlb/6h+WN4ZmB2ZfTl/ffSu6QX9l6Ebdm/Xbp6vxb/W/yL8yv6F/aP7j+yX9z/7Prb+JfOP2j+v/s1+VXyDZf/Sv5z/yeh/8i+x/43+6ftt/f/3M+Hv8T/WP2a/0H7Vezvwu/tPua+QX8W/lH+B/uf7hf4b93fWo7dDSv9r/0P857Avrp9M/0/91/z3/o/zPo4f2f+F9R/rt/pfuA+wD+Zf0j/V/4b8kfah8Hb8Z/wPYB/mX9s/8P+H91/+j/9X+p/ML29fnP+Y/8v+l+Av+Yf2f/r/4jtmfvR7UglgmNsPbLymX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/l/k7pl6rp5oSyGk1VI1LjSaqkalxpNVSNS40mqpGpcaTVUjUuNJqqRqXGk1VI1LjSaqkalx1IG2YVgf0Exth7ZeUy/mX8y/mX8y/mX8v8/DMReWV1xS7RUIgeqx8tCJ2SDZeUy/mX8y/mX8y/mX8y/mX8y+rbaDdhGJ/oJjbXroNl5TL+ZfzL+ZfzL+ZfzL+ZfzL6ttiV8WLqdDSD7/Gx6j+Kevb7/FYe8sQaEQulAFvDbjGeFErmYpw/bNWmkZSISv9gIp8XIdU28r0EZU/Vuck/dapMjO7nTLpPP0J/Zgbt6+T/QTG2Htl5TL+ZfzL+ZfzL+ZfVtsVwHKldETAmqAKWW5uXRQKBoxrUCaNFIA0AnhQ8gZz6N/8URXoqa/iYHw1i65jVKAnVHaFueIasKbKLx7lz7JMVPRwAGtjF8zbovYqVODx6raoQzdhGJ/oJjbD2y8pl/Mv5l/MsxxH96aGh4xy1AvU+wF7ZYo4WFJVrI0DeX8KKlC+FomC03tdRuBtbK75hyrZ3avujCIadXzbp3fHEtfr6IwsEbi+8miq/1NqjdaG42w9svKZfzL+ZfzL+ZfzL+Zfw/r+PCfbnWFC+JAkkOgrWvBkqNYr4/jghMoNSEiPGbXT20ICKniPsTBmq/2mLr/yaMqza83dCj7igwVnoYE2Ft9ud09RsaFqwUCgmNsPbLymX8y/mX8y/mX8y/mX1bbQhiPa6GSHym6HtY1/Mv5l/Mv5l/Mv5l/Mv5l/Mv5gutmhm7CMT/QTH9DNDN2EYn+gmNsPbLymX8y/mX8y+fhlxJRCsct+wP93NlkouGpW5VESYoNQgMmV4ODFbo42kvkrwsM4VrdJE/0Exth7ZeUy/mX8y/mX8y/mYmVSdlrwp7SlO2WoLNNoDpF67t8STaEjqb4xWbKJWIfvdyNJORzL6EGs5mTLnZHItx3OO5x3OO5x3OO5x3OO5x3OO5x3OO42Lk2hjujqrw288xLoYNSznmxtbD5Q/LnZjsMdq+pSE+7UZAP/fmX8y/mX8y/mX8y/mX8y/mX8y/hMqGKezSpWx2dTsmHjqmjbD/x5+7ezaKz1LXubwiEzdhGJ/oJjbD2y8pl/Mv5l/MvoMp2w8Pr7JP/gY8XOdMA23F/fmYGT+/41i ptos que conviene distinguir. El aprendizaje autodirigido pone el énfasis en la decisión de qué aprender y con qué recursos; el aprendizaje autorregulado pone el énfasis en cómo se controla ese proceso mientras ocurre, ajustando estrategias sobre la marcha. El aprendizaje autónomo, tal como se usa en este libro, incluye ambas cosas: la decisión inicial y el control continuo que la sostiene.", "b": false}, {"type": "p", "text": "Esta competencia opera en tres dimensiones que conviene no perder de vista. La dimensión cognitiva cubre las estrategias de estudio y comprensión que el estudiante pone en juego. La dimensión afectiva cubre la motivación, la confianza en las propias capacidades y la tolerancia a la frustración cuando algo no sale a la primera (García-Martínez & Pérez-Ferra, 2018). La dimensión conductual cubre las acciones concretas y observables: cuándo se sienta a estudiar, cuánto tiempo le dedica, qué hace cuando se distrae. Un estudiante puede tener fuertes estrategias cognitivas y aun así fallar si la dimensión afectiva lo desmotiva ante el primer error, lo que confirma que las tres dimensiones se necesitan mutuamente.", "b": false}, {"type": "h2", "text": "1.3  Importancia en la educación superior y estrategias para desarrollarlo"}, {"type": "p", "text": "En la universidad, y más todavía en programas de tecnología, el aprendizaje autónomo deja de ser una virtud opcional para volverse una condición de supervivencia: los créditos exigen trabajo independiente, los proyectos rara vez llegan con instrucciones completas y el mercado laboral premia a quien puede aprender una herramienta nueva sin que nadie se la enseñe paso a paso (J. Ramírez, 2024). Quien no desarrolla esta competencia durante la carrera termina desarrollándola de todos modos en su primer empleo, casi siempre bajo más presión.", "b": false}, {"type": "p", "text": "Desarrollar el aprendizaje autónomo no depende de un solo truco, sino de un conjunto de hábitos que se refuerzan entre sí: planificar el propio tiempo de estudio, gestionar de forma deliberada los recursos disponibles, monitorear el propio avance y buscar información de forma activa en lugar de esperar a que llegue (Pérez-Sánchez & Beltrán-Llera, 2016). Los siguientes capítulos de esta unidad desarrollan cada uno de estos hábitos con más detalle, empezando por la metacognición y la autorregulación, que funcionan como su base.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Aprendizaje autónomo", "body": "La capacidad de dirigir el propio proceso de formación: fijar metas, elegir estrategias, buscar recursos y evaluar los propios resultados. No implica estudiar en soledad, sino saber cómo seguir avanzando cuando no hay una instrucción externa disponible."}, {"type": "h2", "text": "1.4  Ejemplo completo"}, {"type": "p", "text": "Un estudiante de segundo semestre recibe la tarea de construir una pequeña aplicación con una librería que nunca ha usado. El docente no explica la librería en clase; solo indica el objetivo final. Un estudiante con aprendizaje autónomo desarrollado no se queda esperando una explicación: busca la documentación oficial, prueba ejemplos pequeños antes de intentar el proyecto completo, y ajusta su plan cuando algo no funciona como esperaba. El que todavía no ha desarrollado esta competencia suele quedarse atascado en el primer error, a la espera de que alguien le diga qué hacer.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Describe una situación reciente en la que hayas tenido que aprender algo por tu cuenta, sin instrucción directa de un docente. Identifica qué dimensión (cognitiva, afectiva o conductual) te resultó más difícil de manejar.\n2. Diseña, en media página, un diagnóstico personal de tu propio aprendizaje: qué haces bien cuando estudias solo, qué te cuesta y qué estrategia piensas probar este semestre.\n3. A partir de tu diagnóstico, esboza un Plan Personal de Aprendizaje con al menos tres metas concretas para las próximas cuatro semanas."}]}, {"id": "cap2", "titulo": "Metacognición y autorregulación del aprendizaje", "kind": "cap", "num": 2, "unidad": "UNIDAD 1 · FUNDAMENTOS DEL APRENDIZAJE AUTÓNOMO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás distinguir la metacognición de la autorregulación, explicar cómo se relacionan entre sí, y aplicar estrategias concretas para desarrollarlas en el contexto del desarrollo de software."}, {"type": "h2", "text": "2.1  Qué es la metacognición y cómo se regula"}, {"type": "p", "text": "Pensar sobre cómo se piensa: así se resume mejor la metacognición que con cualquier definición larga. El término lo acuñó John Flavell en los años setenta, cuando empezó a estudiar hasta qué punto las personas son conscientes de sus propios procesos mentales y pueden intervenir en ellos a propósito (Flavell, 1979, como se cita en Campo Landines et al., 2016). En la práctica, un estudiante la ejercita cada vez que se detiene a comprobar si de verdad entendió algo que acaba de leer, en lugar de darlo por sentado solo porque ya pasó los ojos por el texto.", "b": false}, {"type": "p", "text": "Conviene distinguir dos componentes. El conocimiento metacognitivo es saber qué estrategias existen, cuáles son los propios puntos fuertes y débiles, y cuándo conviene usar cada estrategia; por ejemplo, saber que resolver ejercicios prácticos ayuda más que releer teoría antes de un examen de programación. La regulación metacognitiva es el uso activo de ese conocimiento en tres fases que se repiten en ciclo: planificar antes de empezar, monitorear mientras se avanza (¿esto que estoy haciendo realmente lo entiendo?) y evaluar al terminar, para decidir qué ajustar la próxima vez (Panadero & Alonso-Tapia, 2017a).", "b": false}, {"type": "img", "caption": "Figura 2.1 · Los cuatro componentes de la autorregulación del aprendizaje", "data": "data:image/webp;base64,UklGRsxkAABXRUJQVlA4IMBkAACwwwGdASroA3wCPmEwlEekIqIhIpPp8I QxnuLDNd0Vl/izfVjMMWXosV3Vjtc7swjl4PP6cNF4ZDewTQn0mDd/LH1877+uz9NAK1s//wO4tKzQ72HqN9X+WH8q2N9cleQk67YjjWSSr8hBdU6u9AFNdPLQt911BzB5uJmjQHy7zVvXDtmrfc9UDVVOGoZyB2r0pMvPGo8ClYai9B/9mSpMp3cTvkXTuM0m1eut/gQhSTN0i0c9EkY3j+tNs8rdtRVEAEKStzFq0B8+HwCfjg7z5xjSKrOcRUAAAAChfcg/+LctacAAYFapoD6k97UpBJ9BgAAADpXbiiK+8Q+hZ/iUfmGlrnUzwLcHPLg2l/Aha54HfwAAAAAAAAAAAAAAAAAAAAAA"}, {"type": "h2", "text": "2.2  Qué es la autorregulación y sus componentes"}, {"type": "p", "text": "Saber cómo se debería estudiar no basta; también hace falta querer hacerlo y aguantar la tentación de dejarlo para después. Ese paso extra es justamente lo que la autorregulación añade a la metacognición (Lara-Sotomayor et al., 2024; Zimmerman, 2000): el estudiante toma control consciente de sus metas, sus estrategias, su conducta y su motivación, y con eso dirige su propio proceso de formación.", "b": false}, {"type": "p", "text": "Los modelos teóricos sobre el tema suelen describir cuatro componentes interconectados: la regulación de la cognición, que cubre las estrategias para procesar y retener información; la regulación de la metacognición, que supervisa y ajusta esas estrategias; la regulación de la motivación, que sostiene la autoeficacia y la persistencia frente a tareas difíciles; y la regulación del comportamiento, que abarca la gestión del tiempo, las metas y el manejo de las distracciones. Un estudiante puede saber exactamente qué debería hacer y aun así no hacerlo si la regulación motivacional falla, lo que explica por qué tantos planes de estudio bien diseñados terminan sin cumplirse.", "b": false}, {"type": "h2", "text": "2.3  La relación entre metacognición y autorregulación, y su importancia en el desarrollo de software"}, {"type": "p", "text": "La metacognición es, en cierto sentido, un subconjunto de la autorregulación: mientras la primera se concentra en pensar sobre los procesos de aprendizaje, la segunda integra ese pensamiento con motivación, emociones y acciones concretas (Rinaudo et al., 2017). Un estudiante puede tener buenas habilidades metacognitivas (sabe planear, supervisar y evaluar) y aun así fallar en la autorregulación si le falta disciplina para sostener esas prácticas de forma regular (García & Pérez, 2018).", "b": false}, {"type": "p", "text": "En el desarrollo de software esta pareja de competencias no es un lujo académico. Los entornos de trabajo tecnológico exigen diagnosticar las propias necesidades de aprendizaje, planear cómo abordar un framework nuevo y ajustar el proceso cuando aparecen dificultades, algo que ninguna asignatura técnica enseña por sí sola. Las empresas de tecnología, además, buscan profesionales que actualicen sus competencias sin supervisión constante, porque el conocimiento en este campo queda obsoleto con rapidez. Y frente a un error de programación, la diferencia la marca quien sabe ubicar primero dónde está fallando el código, después elegir con criterio cómo corregirlo, y por último confirmar que el arreglo funciona de verdad y no fue solo el primero que pareció servir.", "b": false}, {"type": "h2", "text": "2.4  Estrategias para desarrollar metacognición y autorregulación"}, {"type": "p", "text": "Ambas competencias se entrenan con práctica deliberada, no con buenas intenciones (Herrera Barzallo, 2024). Llevar un diario de monitoreo del aprendizaje, donde el estudiante registra qué estudió, qué le costó y qué ajustó, es una de las formas más simples de volver visible un proceso que de otro modo pasa inadvertido. Otra estrategia consiste en hacerse preguntas explícitas antes, durante y después de una tarea: ¿qué sé ya sobre esto?, ¿estoy entendiendo lo que hago?, ¿qué haría distinto la próxima vez? Analizar los propios procesos cognitivos con esa regularidad, aunque parezca lento al principio, termina ahorrando tiempo porque evita repetir errores de enfoque (Valenzuela González et al., 2019).", "b": false}, {"type": "concepto", "title": "CONCEPTO · Metacognición vs. autorregulación", "body": "La metacognición es pensar sobre el propio pensamiento: saber cómo se aprende y supervisarlo. La autorregulación integra ese conocimiento con motivación y conducta para sostenerlo en el tiempo. Se puede tener una sin la otra, pero ninguna basta por sí sola."}, {"type": "h2", "text": "2.5  Ejemplo completo"}, {"type": "p", "text": "Un estudiante se propone aprender React en tres semanas. Aplica metacognición cuando, tras el primer intento, se pregunta si de verdad entendió el manejo de estados o solo copió el ejemplo del tutorial. Aplica autorregulación cuando, al notar que se está posponiendo el estudio por las tardes, cambia el horario a las mañanas y define bloques cortos de veinticinco minutos para sostener la constancia. Ninguna de las dos decisiones aparece en el tutorial de React; ambas nacen de observar y ajustar el propio proceso.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Lleva un diario de monitoreo del aprendizaje durante una semana, registrando para cada sesión de estudio qué te propusiste, qué dificultades encontraste y qué ajustarías.\n2. Elige un tema técnico que hayas estudiado recientemente y escribe un breve análisis de tus propios procesos cognitivos: qué estrategia usaste, si funcionó, y qué estrategia probarías la próxima vez.\n3. Identifica un momento reciente en el que sabías qué debías estudiar pero no lo hiciste. Analiza si el fallo fue de conocimiento metacognitivo o de regulación motivacional, y propone un ajuste concreto."}]}, {"id": "cap3", "titulo": "Estrategias de planificación del aprendizaje", "kind": "cap", "num": 3, "unidad": "UNIDAD 1 · FUNDAMENTOS DEL APRENDIZAJE AUTÓNOMO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás diseñar un plan de estudio propio, aplicar estrategias concretas de planificación en proyectos de programación, y reconocer las barreras más comunes que hacen fracasar un plan."}, {"type": "h2", "text": "3.1  Qué es la planificación del aprendizaje y por qué es importante"}, {"type": "p", "text": "Planificar el aprendizaje es organizar de forma deliberada los objetivos, los contenidos, los recursos, los tiempos y las estrategias que se van a usar para alcanzar una meta educativa. No se trata de armar una lista de tareas, sino de trazar un camino que articule acciones, recursos y criterios para saber si se está avanzando en la dirección correcta.", "b": false}, {"type": "p", "text": "Un plan de estudio bien construido se asocia con mejores niveles de desempeño, mayor persistencia y mayor autonomía (Garzón-Umerenkova & Gil-Flores, 2018). Da sentido al estudio porque convierte metas difusas en objetivos concretos, mejora la gestión del tiempo, reduce la ansiedad frente a tareas complejas y permite conectar ideas y recursos de forma coherente en lugar de estudiar de manera dispersa.", "b": false}, {"type": "img", "caption": "Figura 3.1 · Ciclo de planificación del aprendizaje", "data": "data:image/webp;base64,UklGRj5PAABXRUJQVlA4IDJPAADwxgGdASroA6gDPmEwlUgkIqIhIXDpAIAMCWlu7mB03cgFQJKf2D+h3f25mTHZ/lwc1+eb/i+vP9G+wN/cui55iv59/tvVP/3f7Le8b+//6X2AP6x/r+tr9GPy8vZ7/seTA+O/7v/a/1h8zX6Z/cv7h+xv7vevP4l86/b/7V+zv94/9P+u+OvK/6P/U/9z0K/kH2k/Bf3H9sP8X+5/3S/ef9F/jv2J/Ir2j+Sn+D+YHwC/jv8r/vH5Wf2b9xfdl/z+2Z3n/e/6X1BfX36V/oP7z/kf/R/a/TK/p/Qb7Mf8j7ffsB/ln9P/1X97/xH7E/Qf+w8G/8r/w/YC/ln9y/73+H/0/7i/TF/X/+r/Y/7r9y/bp+ef53/z/638rvsN/mf9m/5f+N/KLwc+iwHfJyCpzoaZvUxa4tVw0zepi1xarhpm9TFri1XDTN6mLXFquGmb1MWuLVcNM3qYtcWq4aZvUxa4tVw0zepi1xarhpm9TFri1XDTN6mLXFquGmb1MWuLVcNM3qYtcWq4aZvUxa4tVw0zepi1xarhpm9TFri1XDTN6mLXFquGmb1MWuLVcNM3qYtcWq4aZvUxa4tVw0zepi1xarhpm9TFri1XDTN6mLXFquGmb1MWuLVcNM3qYtcWq4aZkRavHZnRKlXzbdj9iMlmdEqVfNt2OcuP59XZLPOhpm9TFri1XDTN6mLXFquGmb1Hcy03TIiEexCPYhHsQj2IR68MX/hpuHXDMWuLVcNM3qYtcWq4aZvUxa4tQYxepi1xarhpfBrc1OdDTN6mLXFquGmb1MWuLVcNL4NblFuzY1/V64YB718kKzYmb7suGw6jYTEplQbBsI6E5+6w7eQa3NTnQ0zepi1xarhpm9TFri1XDS+DW5SIQc2IHtKEbYwB0B1RwtZuV3fFTVQ7NbGE/4Kz2sgH6a/ezdP4fLIzNvHP/lkhReoMYvUxa4tVw0zepi1xarhpm9TFri1BfN v1AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}, {"type": "h2", "text": "3.2  Componentes clave de la planificación"}, {"type": "p", "text": "Dentro del ciclo de autorregulación, planificar siempre va antes que ejecutar y evaluar, y esa secuencia es justo lo que permite corregir el rumbo según los resultados que se vayan obteniendo (Hernández & Camargo, 2017). Por eso conviene tratar el plan como un documento vivo que se ajusta a medida que el propio estudiante entiende mejor cómo aprende, no como algo que se escribe una vez y se archiva.", "b": false}, {"type": "h2", "text": "3.3  Estrategias concretas de planificación y su aplicación en proyectos de software"}, {"type": "p", "text": "Establecer metas claras es el primer paso (Valle et al., 2016). Una meta como \"dominar JavaScript\" es demasiado vaga para ser útil; una meta SMART, en cambio, se formula así: \"completar cinco módulos de un curso de JavaScript y construir tres programas funcionales pequeños en cuatro semanas\". Dividir esa meta en tareas menores, por ejemplo separar el aprendizaje de un framework como React en sintaxis básica, manejo de componentes, estados y props, e integración con una API, reduce la sensación de dificultad y permite medir el avance real.", "b": false}, {"type": "p", "text": "Otras herramientas prácticas incluyen las matrices de planificación, que organizan actividad, tiempo estimado, recursos y criterio de éxito en una sola tabla; los diarios de estudio, que documentan qué se hizo y qué dificultades aparecieron; y aplicaciones digitales como calendarios, gestores de tareas o temporizadores tipo Pomodoro (Garzón Umerenkova & Organista Díaz, 2021). En proyectos de software estas ideas se traducen de forma natural: definir un backlog personal de temas por aprender, trabajar por iteraciones cortas al estilo de un sprint, revisar código con regularidad y llevar control de versiones con Git no solo organiza el trabajo técnico, también documenta el propio proceso de aprendizaje.", "b": false}, {"type": "h2", "text": "3.4  Barreras comunes y cómo superarlas"}, {"type": "p", "text": "Todo plan de estudio choca tarde o temprano con obstáculos previsibles (Hernández & Camargo, 2017). El perfeccionismo paraliza la toma de decisiones cuando el estudiante insiste en hacer todo perfecto desde el primer intento; aceptar que el plan se ajusta sobre la marcha resuelve buena parte del problema. La procrastinación se combate mejor con metas diarias mínimas y bloques cortos de trabajo que con fuerza de voluntad. La sobrecarga de información, tan común en programación, se controla priorizando pocas fuentes confiables en lugar de intentar leerlo todo. Y la falta de motivación suele ceder cuando la meta de aprendizaje se conecta con un proyecto personal o una meta profesional concreta, en lugar de quedarse en una obligación abstracta del curso.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Meta SMART", "body": "Una meta formulada de manera específica, medible, alcanzable, relevante y con un plazo definido. \"Aprender React\" no es una meta SMART; \"completar el módulo de componentes y construir dos ejercicios prácticos en dos semanas\" sí lo es."}, {"type": "h2", "text": "3.5  Ejemplo completo"}, {"type": "p", "text": "Antes de empezar un proyecto de fin de curso, un estudiante arma una matriz con cuatro columnas: actividad, tiempo estimado, recurso a usar y criterio de éxito. En la primera fila anota \"aprender autenticación con JWT, tres días, documentación oficial más un tutorial en video, poder proteger una ruta de la API\". Repite el ejercicio para cada tema pendiente del proyecto. Dos semanas después revisa la matriz, nota que subestimó el tiempo de dos actividades y ajusta el resto del cronograma en consecuencia, sin culpa ni drama: es exactamente lo que se espera de un plan que se revisa.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Diseña un cronograma semanal de estudio usando una herramienta digital de tu elección (calendario, hoja de cálculo o gestor de tareas), distribuyendo bloques de al menos cuarenta y cinco minutos y justificando la distribución del tiempo.\n2. Reescribe tres metas de aprendizaje vagas que tengas actualmente (por ejemplo \"aprender bases de datos\") en formato de metas SMART.\n3. Identifica cuál de las cuatro barreras descritas en este capítulo (perfeccionismo, procrastinación, sobrecarga de información, falta de motivación) te afecta con más frecuencia y describe una estrategia concreta para enfrentarla el próximo mes."}]}, {"id": "cap4", "titulo": "Gestión de recursos para el aprendizaje", "kind": "cap", "num": 4, "unidad": "UNIDAD 1 · FUNDAMENTOS DEL APRENDIZAJE AUTÓNOMO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás clasificar los tipos de recursos disponibles para el aprendizaje, aplicar criterios para evaluarlos y seleccionarlos, y organizar estrategias para integrarlos de forma efectiva en tu proceso formativo."}, {"type": "h2", "text": "4.1  Qué son los recursos para el aprendizaje y sus tipos"}, {"type": "p", "text": "Gestionar recursos para el aprendizaje es identificar, evaluar, organizar y utilizar de forma estratégica las fuentes de información y las herramientas educativas disponibles para apoyar la construcción de conocimiento. Esta idea va más allá de simplemente acumular materiales: implica un enfoque crítico sobre qué tan pertinente y valioso es cada recurso frente a una meta de aprendizaje específica (González et al., 2024).", "b": false}, {"type": "p", "text": "Los recursos suelen agruparse en cinco tipos (Área Moreira, 2012). Los recursos textuales incluyen libros, artículos y documentación oficial, y sostienen la comprensión de los fundamentos teóricos. Los recursos audiovisuales, como videos y conferencias grabadas, ayudan a visualizar procesos complejos. Los recursos interactivos, entre ellos simuladores y plataformas de codificación, ofrecen experiencias de aprendizaje activo. Los recursos colaborativos, como foros y comunidades en línea, permiten construir conocimiento junto a otros. Y los recursos personales, apuntes y proyectos previos que el propio estudiante ha producido, funcionan como referencia para retos futuros.", "b": false}, {"type": "img", "caption": "Figura 4.1 · Tipos de recursos para el aprendizaje", "data": "data:image/webp;base64,UklGRmpEAABXRUJQVlA4IF5EAADwcgGdASroA5YCPmEulEgkIiIhIjE5UIAMCWlu9T/w+PEVNhApbhO7QW7vfnPH0fj/63re/uno/dHXzI/xL/e+sH6if79v0Pok9NdkS3kX+n/0T9jfMv+mf3f+2/sn+6frr+MfMf2b+xfs3/iP+1/tfia/wfCT1L/yvQz+PfZL8R/cP22/vP7e/IX+f/vH7Rflf7Q/Lj+29QX8W/lH92/tf7Xf3X90fdV2Yu3f7z/T/mZ8AXsZ9D/zv92/eT/F+n1/Zehf2b/2HuAfzz+pf67/D/kh7UHg7ebewD/Mv7N/3P7x/qPhj/pf/Z/q/9j+3/tl/P/89/6/9N8Bn8v/tf/O/v35S+Cr0fhSDU4aIW+TH1BD6gh9QQ+oIfUEPqCH1BD6gh9QQ+oIfUEPqCH1BD6gh9QQ+oIfUEPqCH1BD6gh9QQ+oIfUEPqCH1BD6gh9QQ+oIfUEPqCH1BD6gh9QQ+oIfUEPqCH1BD6gh9QQ+oIfUEPqCH1BD6gh9QQ+oIfUEPqCH1BD6gh9QQ+oA0o+iuXwzUyXQlvKUuhLeUpdCW8pRUJc9kH1BD6gh9QQ+oIfUEPqCH1BD6gh0C2B4RLYST05qStDSenNSVoOLZI5Ay6WUW59QQ+oIfUEPqCH1BD6gh9QQ+VGhKi3PqCH1BE28a4+oIfUEPqCH1BD6gh9QQ+oIfUEBSMYdHmtFY/xyM5svDjWp3CnENuY6Xn2fXoDlovRE7qj+YR9pvezAgtUuTH1BD6gh9QQ+oIfUEPqCH1BD5UZpBmPILqfdxRhOrdoCPEbxLfwic//o2C74GogrDs4zpOK1XQDw+gO7GzRPM1LnD/5xXZYonl/EPYkspUnFfUEXimizoHzXpZoj1bdeHBpYotvYHGSR8eqwHyf1YxEhZ+mnomJNs6YnOvgKR0+0IhD6gh9QQ+oIfUEPqCH1BD6gh9QQFHqouYDkYI1uuuz9YIoB0xuxnEl8zY+yN2bhbklqmazNmnfOZQvLDQYZFa8P0XMfp846xO2QHE4Ttj08vsHwYNmHX1EeIjy9+JU1fI089/EA+4tXsSehY9Thohb5MfUEPqCH1BD6gh9QQ+oCQ6VRiOMwR/kvNQ2ZHRkMbSfVrB5QzweW9ekZY5tiR7X61EhkFD13n2HNd/aUKeJJPYk/QIsoMVO7CVEw1e7gT6PB4Isw407wkYgMF36i3PqCH1BD6gh9QQ+oIfUEPqCHUDvkKOsCYUgt1IyNw4I3PqCH1BD6gh9QQ+oIfUEPqCH1ASHcLBqcNELfJkgjHqcNELfJj6gh9QQ+oIfUEPqCH1AG6qJE6dzKjOFGVGQNkpOeRZomVVkXS69IIO5c+JVMfuaZFuLKsf+Z8o7yBhW/PvC5MfUEPqCH1BD6gh9QQ+oIcxOHh54Xlvfbb3cL+R/nTzviFLDC5Ss6F9gO+8Wp2PgJJ/b9R1iCsFNvH14iYqz1tHZG9au+QTzo6gpqzAOY/iQilioFvgEXDc+oIfUEPqCH1BD6gh9QQ+oBDHOHPV/+aA//uuQfomOlsKKHnwnW3oxjMKDBgW2YKTWiZD5cZ7iZw3RAHRr0toa6Of50 a un plan de estudio (Rodríguez Rivera et al., 2024). La pertinencia mide si el recurso está directamente relacionado con la meta que se persigue: un tutorial general de programación no sirve mucho si el objetivo es entender arquitecturas de microservicios. La calidad y la credibilidad dependen de quién escribió el material y de qué tan al día está; entre un blog sin referencias y el manual que mantiene el propio equipo detrás de un lenguaje, casi siempre gana el segundo. El nivel de profundidad importa porque un recurso demasiado avanzado frustra y uno demasiado básico aburre. La usabilidad se refiere a qué tan fácil resulta integrar el recurso en la rutina de estudio, y la accesibilidad, a si está disponible libremente o exige suscripciones y licencias.", "b": false}, {"type": "h2", "text": "4.3  Estrategias para la gestión de recursos"}, {"type": "p", "text": "Una vez evaluados, los recursos necesitan organizarse para no perderse entre pestañas del navegador. Un mapa de recursos, ya sea visual o en tabla, muestra de un vistazo qué material existe para cada tema y cómo se relaciona con los demás. Un portafolio de aprendizaje reúne los recursos usados junto con notas y reflexiones propias, lo que facilita reutilizarlos más adelante. Integrar los recursos dentro de la planificación, indicando qué material corresponde a cada etapa de una tarea, evita la sensación de estar buscando información sobre la marcha. Participar en comunidades técnicas suma recursos sugeridos por otros, y herramientas de gestión digital como Notion o gestores de referencias ayudan a mantener todo ordenado (Picón, 2024).", "b": false}, {"type": "h2", "text": "4.4  Integración, monitoreo y evaluación de impacto de los recursos"}, {"type": "p", "text": "Elegir buenos recursos no basta si después no se integran de forma deliberada en el ciclo de aprendizaje. Antes de una tarea conviene decidir qué recurso servirá para cada fase: uno para introducirse en el tema, otro para profundizar, otro para practicar. Durante el estudio vale la pena monitorear cómo se están usando esos recursos, cuánto tiempo tomó cada uno y si fue necesario cambiar de fuente a mitad de camino. Y al terminar, evaluar en qué medida los recursos elegidos realmente contribuyeron a la meta ayuda a decidir mejor la próxima vez, en lugar de repetir por costumbre los mismos materiales que ya no funcionan tan bien.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Portafolio de aprendizaje", "body": "Una colección organizada de los recursos usados, junto con notas, resúmenes y reflexiones sobre cómo se aplicaron. No es un simple repositorio de enlaces guardados: incluye la evaluación crítica de cada recurso, lo que lo vuelve reutilizable en proyectos futuros."}, {"type": "h2", "text": "4.5  Ejemplo completo"}, {"type": "p", "text": "Para preparar un examen sobre bases de datos, un estudiante arma un mapa de recursos con tres columnas: teoría (la documentación oficial de PostgreSQL y un capítulo de un libro), práctica (ejercicios en una plataforma de simulación de consultas SQL) y dudas (un foro técnico donde puede preguntar cuando algo no le cierra). Antes de sentarse a estudiar decide qué columna usar según lo que necesite ese día. Al final de la semana revisa el mapa y nota que el libro casi no lo usó porque la documentación oficial resultó más clara para su nivel, así que lo retira del plan para el siguiente tema.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Toma un tema técnico que necesites estudiar este mes y busca al menos seis recursos relacionados. Evalúa cada uno según pertinencia, actualidad, credibilidad y nivel de profundidad.\n2. Diseña una ruta estratégica de recursos para un tema de tu elección, indicando qué recurso usarás en cada etapa: introducción, profundización, práctica y evaluación.\n3. Al finalizar una semana de estudio, escribe una breve evaluación de impacto: qué recursos usaste, cuáles funcionaron mejor y cuáles descartarías para la próxima vez."}]}, {"id": "cap5", "titulo": "Pensamiento crítico y su importancia en el aprendizaje autónomo", "kind": "cap", "num": 5, "unidad": "UNIDAD 2 · DESARROLLO DEL PENSAMIENTO CRÍTICO Y REFLEXIVO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás explicar qué es el pensamiento crítico, identificar sus componentes cognitivos, metacognitivos y actitudinales, y aplicar estrategias concretas para desarrollarlo."}, {"type": "h2", "text": "5.1  Qué es el pensamiento crítico"}, {"type": "p", "text": "Pensar de forma crítica significa detenerse a evaluar, razonar y contrastar la información antes de sacar una conclusión, en lugar de quedarse con la primera respuesta que aparece (Arboleda, 2015). Lo que de verdad importa es la calidad del razonamiento detrás, no cuánta información se acumula: qué tan bien se leen los argumentos ajenos, cómo se ponen a prueba las evidencias, y si se logra integrar puntos de vista distintos antes de decidir algo.", "b": false}, {"type": "p", "text": "Paul y Elder (2005) lo resumen como \"el arte de pensar sobre el propio pensamiento con el propósito de mejorarlo\": una forma de decir que el pensamiento crítico no se queda en analizar la información de afuera, sino que también revisa los procesos internos que se usan para entenderla. Estas mismas habilidades se activan tanto al leer un texto complejo como al diseñar un algoritmo, depurar código o elegir entre dos tecnologías para un proyecto.", "b": false}, {"type": "img", "caption": "Figura 5.1 · Componentes del pensamiento crítico", "data": "data:image/webp;base64,UklGRtJFAABXRUJQVlA4IMZFAADwaAGdASroA40CPmEulEgkIiIhIdLJSIAMCWlu+D9b/VA/EoGbFvQ0PKk+BMNQ28U/mPH+fp/5Prn/zPp4emr1BeaH9lvV/5wD1pPXK9Dby6er/1HPxV/ZPyH97fxH82/tH9x/YX96fW/8X+d/vX9y/Zr+7f+//X/Frlf9E/iP+r/efUv+R/ZL8f/cf20/v37x/Ef+O/vn7p/6P0h9/f91/f/3V+AL8g/lP+C/tP7cf4L9wPcR/wP773K+r/7X9nPYC9Wfov+h/v3+O/+f+B9IL++/v37j+4n6Z/c/97/f/gB/lv9M/1v+J9wv8j4Pv4z/e/s38AP8y/s//f/ prensión y la autorregulación para ajustar estrategias según los resultados. Los componentes actitudinales incluyen la curiosidad intelectual, la humildad epistémica para reconocer la propia ignorancia, el escepticismo constructivo frente a afirmaciones sin respaldo y la responsabilidad sobre la calidad del propio pensamiento.", "b": false}, {"type": "p", "text": "Estos tres grupos se necesitan mutuamente: la cognición sin metacognición suele quedarse en la superficie, la metacognición sin una actitud crítica pierde dirección, y la actitud sin habilidades cognitivas rara vez se traduce en resultados concretos.", "b": false}, {"type": "h2", "text": "5.3  Relación entre pensamiento crítico y aprendizaje autónomo"}, {"type": "p", "text": "El aprendizaje autónomo depende del pensamiento crítico más de lo que parece a primera vista. Evaluar la calidad de un recurso antes de usarlo, formular metas realistas en lugar de recibir contenidos de forma pasiva, decidir con criterio entre distintas estrategias de estudio y sostener una autoevaluación honesta del propio progreso son, todas, tareas que exigen pensar críticamente (Angarita Valencia, 2021). En disciplinas tecnológicas, donde la información circula rápido y su calidad varía enormemente, el pensamiento crítico deja de ser opcional: ante la documentación de un framework nuevo, un estudiante crítico puede distinguir qué partes son relevantes para su proyecto, qué supuestos subyacen a los ejemplos y cómo adaptarlos a su propio contexto, en lugar de copiar sin entender.", "b": false}, {"type": "h2", "text": "5.4  Estrategias para desarrollar el pensamiento crítico"}, {"type": "p", "text": "El pensamiento crítico no aparece de forma espontánea; requiere exponerse deliberadamente a prácticas que lo activan (Libreros Castro & Benavides Franco, 2025). Formular preguntas generativas como ¿qué evidencia sustenta esto?, ¿qué supuestos están implícitos? o ¿qué alternativas existen? obliga a ir más allá de la primera respuesta que viene a la mente. Analizar casos reales o simulados, por ejemplo decisiones de arquitectura de software o el manejo de un error en producción, exige integrar conocimientos y justificar decisiones. Leer con la intención de identificar tesis, evidencias y supuestos fortalece la evaluación de argumentos, igual que participar en debates estructurados donde hay que defender una posición frente a otra. Escribir de forma reflexiva sobre cómo se resolvió un problema, y comparar distintas soluciones a un mismo reto técnico, cierran el ciclo entre pensar y actuar con criterio (Zúñiga, 2025).", "b": false}, {"type": "concepto", "title": "CONCEPTO · Humildad epistémica", "body": "La disposición a reconocer los límites del propio conocimiento y a estar abierto a nueva evidencia, incluso cuando contradice lo que ya se creía cierto. Es uno de los componentes actitudinales del pensamiento crítico y, en la práctica, lo que distingue a quien aprende de quien solo defiende lo que ya sabe."}, {"type": "h2", "text": "5.5  Ejemplo completo"}, {"type": "p", "text": "Un estudiante encuentra dos artículos que recomiendan enfoques opuestos para manejar el estado de una aplicación web. En lugar de elegir el primero que lee, identifica qué supuestos hace cada autor sobre el tamaño del proyecto, compara la evidencia que cada uno presenta y prueba ambos enfoques en un ejercicio pequeño antes de decidir cuál usar en su propio proyecto. La decisión final no depende de cuál artículo sonaba más convincente, sino de cuál funcionó mejor en su caso concreto.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Elige un artículo técnico o una publicación de blog sobre una herramienta que uses. Identifica su tesis principal, la evidencia que presenta y al menos un supuesto implícito que no está declarado explícitamente.\n2. Formula cuatro preguntas generativas sobre un tema que estés estudiando actualmente, siguiendo los ejemplos de este capítulo.\n3. Describe un caso reciente en el que hayas tenido que elegir entre dos soluciones técnicas distintas. Explica qué evidencia usaste para decidir y si, en retrospectiva, considerarías cambiar esa decisión."}]}, {"id": "cap6", "titulo": "Estrategias para la reflexión continua", "kind": "cap", "num": 6, "unidad": "UNIDAD 2 · DESARROLLO DEL PENSAMIENTO CRÍTICO Y REFLEXIVO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás describir el ciclo de la reflexión continua, aplicar estrategias prácticas para sostenerla y reconocer las barreras más comunes que la interrumpen."}, {"type": "h2", "text": "6.1  El ciclo de la reflexión continua y su valor formativo"}, {"type": "p", "text": "Reflexionar de manera continua es, en el fondo, aplicar metacognición y autorregulación de forma sistemática para revisar y mejorar el propio proceso de aprendizaje. Ese ejercicio se repite en un ciclo de cuatro momentos: se empieza fijando objetivos y organizando recursos, se sigue preguntándose sin parar durante la tarea si de verdad se está entendiendo lo que se hace, se continúa revisando al final qué salió bien y qué no, y se cierra traduciendo esa revisión en un cambio concreto para la próxima vez (Suárez-Rojas et al., 2024).", "b": false}, {"type": "p", "text": "La reflexión continua tiene un valor formativo alto porque desarrolla conciencia sobre el propio proceso de aprendizaje y mejora la capacidad de adaptarse a contextos distintos. La autorregulación del aprendizaje se reconoce hoy como un eje que integra procesos cognitivos, metacognitivos y motivacionales, y es justamente a través de la reflexión continua que el estudiante logra planificar, supervisar y evaluar sus propias acciones (Hernández & Rodríguez, 2002).", "b": false}, {"type": "img", "caption": "Figura 6.1 · Ciclo de la reflexión continua", "data": "data:image/webp;base64,UklGRq5MAABXRUJQVlA4IKJMAADwwgGdASroA6gDPmEwlkgkIyKhIbJ48IAMCWlu4Xcx/e8Zi+Sku/7tbegMPzZ7T8qnmr8/+2X/U+vn9GewV/c+i35i/3P9WD/X/ JuFrXRlG0XZomUgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}, {"type": "h2", "text": "6.2  Estrategias prácticas para fomentar la reflexión continua"}, {"type": "p", "text": "Los diarios de reflexión son registros escritos donde el estudiante documenta qué hizo, qué dificultades encontró, cómo las analizó y qué conclusiones sacó; el simple hábito de escribirlo ayuda a organizar ideas que de otro modo quedarían dispersas. Las sesiones de retroalimentación entre pares permiten contrastar la propia experiencia con la de otros, lo que suele revelar puntos ciegos que uno mismo no nota. Los mapas conceptuales de aprendizaje, por su parte, ayudan a visualizar cómo se conectan los temas nuevos con lo que ya se sabía, y a detectar huecos en esa red de conocimiento que de otro modo pasarían inadvertidos.", "b": false}, {"type": "h2", "text": "6.3  Barreras comunes y cómo superarlas"}, {"type": "p", "text": "La reflexión continua se interrumpe con facilidad cuando la carga académica es alta y parece más urgente avanzar que detenerse a pensar. La falta de tiempo se enfrenta mejor reservando bloques breves y fijos, de cinco o diez minutos al final de cada sesión de estudio, que intentando encontrar una hora libre que rara vez aparece. La superficialidad, es decir, reflexionar de forma automática sin realmente cuestionar lo que se hizo, se combate con preguntas específicas en lugar de genéricas: no basta con preguntarse si algo salió bien, hay que preguntarse por qué salió bien o mal y qué se haría distinto. Y la falta de constancia, que hace que el hábito se abandone tras la primera semana, mejora cuando la reflexión se ancla a una rutina ya existente, como cerrar cada sesión de programación con tres líneas escritas sobre lo aprendido.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Reflexión continua", "body": "Un proceso permanente, no un momento aislado, mediante el cual el estudiante planifica, monitorea, evalúa y ajusta su aprendizaje. Su valor no está en pensar mucho una sola vez, sino en sostener el hábito de revisarse a sí mismo con regularidad."}, {"type": "h2", "text": "6.4  Ejemplo completo"}, {"type": "p", "text": "Al final de cada sesión de práctica de programación, un estudiante dedica cinco minutos a responder tres preguntas en un cuaderno digital: qué intenté hacer, qué me costó y qué haría distinto mañana. Después de un mes revisa sus notas y descubre un patrón que no había notado: casi siempre se atasca en la misma etapa, la de depurar errores de sintaxis, y decide dedicar una sesión completa a practicar solo eso. Sin el diario, ese patrón habría seguido invisible.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Lleva un diario de reflexión durante una semana usando el formato sugerido en este capítulo: fecha, objetivo, descripción de lo realizado, dificultades, análisis de causas y plan de acción.\n2. Organiza una sesión de retroalimentación con un compañero sobre un mismo tema de estudio y registra al menos dos ideas que surgieron de su perspectiva y que tú no habías considerado.\n3. Identifica cuál de las tres barreras descritas (falta de tiempo, superficialidad, falta de constancia) te afecta más y diseña una rutina concreta para superarla este mes."}]}, {"id": "cap7", "titulo": "Evaluación del progreso en el aprendizaje", "kind": "cap", "num": 7, "unidad": "UNIDAD 2 · DESARROLLO DEL PENSAMIENTO CRÍTICO Y REFLEXIVO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás distinguir los tipos de evaluación aplicables al seguimiento del aprendizaje, usar herramientas concretas para evaluar tu propio progreso, e integrar esa evaluación con la autorregulación."}, {"type": "h2", "text": "7.1  Tipos de evaluación aplicables al seguimiento del aprendizaje"}, {"type": "p", "text": "Medir el progreso en el aprendizaje no debería reducirse a poner una nota al final del camino. Es, más bien, un ejercicio continuo de reunir e interpretar evidencia sobre el propio desempeño con el tiempo, con la mira puesta en detectar avances y encontrar dónde hay margen de mejora (Fondo de las Naciones Unidas para la Infancia [UNICEF], 2023). Y no todos los momentos del aprendizaje piden el mismo tipo de evaluación. La evaluación diagnóstica se aplica al inicio de un tema para identificar de dónde parte el estudiante. La evaluación formativa ocurre durante el proceso, sin buscar una calificación, sino retroalimentación oportuna que permita ajustar estrategias (Bizarro et al., 2019). La evaluación sumativa se realiza al final de un período y entrega una valoración global, aunque puede integrarse con las evidencias formativas si se compara contra criterios previos (Santiago Paucar & Villafuerte Álvarez, 2024). Y la evaluación auténtica se basa en tareas reales, como desarrollar un prototipo funcional o resolver un problema con un escenario realista, lo que en desarrollo de software resulta especialmente pertinente (Mero Párraga, 2024).", "b": false}, {"type": "img", "caption": "Figura 7.1 · Tipos de evaluación del progreso en el aprendizaje", "data": "data:image/webp;base64,UklGRmBWAABXRUJQVlA4IFRWAADwkwGdASroA3wCPmEwlkekIyKhIrG5gIAMCWlu/DkX4L6HBMAYxsZnidxCpV4EfO+PL7733vS1/jvSY6RvmU8171G72LvVfkq6tl4v/oH9R/Yj9sfnV8Q/Ov65/ZP2W/w//g9cfxP5b+3/2T/Jf7P+/ezt/Tf1XzBem/xX/m/znqT/JPsN+k/s/7af4j9wvhT/Of1X91fxp9p/h7/Z/Md9gv4//JP73/a/3Q/zv7z/Xb9R2XWy/6L/x/5n2BfVz5r/mf7P/qf+//kfQZ/qf7p6j/qf9v/yH+C/Ij7AP59/R/9t/hPyS9rTwffxX+39gL+Tf27/uf47/Y/u/9L39R/6f9P+dXt0/Of8v/8f9F8Bn8v/tH/b/wna+9HYYF+VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkXCssi4VlkUEQieO4qJyAQFuVhgV/SDSsCIeQ4sVh9/SnR6lSO3Fywm9W7L25kUNliGZg1CS5mK4irtmDwScT1pwzCTtOt0oi9GIK9nCAvbtvsf+Xb/2U2mKWTqFX3j6Vpy2aiEv/liSE2RDE0Y6Z4n9OjWhxp9O5X5U3RiaAwkKX0aMFDcT010HYLiG+iE5A/Z8GMJRDpbLPH4DDOwuBLsP mnN8USiT2W4zQaV+kiHMwQjbE2eFjLJwlZrWgtiWc9IAvkWxeVSgWvBN6nmkhcefIRtCBC+KMGsG2SL2YI/siYRHzhswSp1nJsM7FHeY3Q21itVvkNF/p6jcaxCxXRvGhzXkhGw/XV3OPmYpgV8Irn1MXkJQxmM0v8t/omK0pNNHc+DBOYVQfo9WaNXjczCikbDkVe8yQaMqtG3P195UDzP5lercBFUpT+OF+ZbGtBMnJrFVL6X9/evw2xRBfC2BbvjwDi7mUOasgeoF7IzSOk3K0+QOoPkA0f1dJ5KgQ9fXZkEbinbFz4u86k/Si4173Yzf4aKh9/fhmXgbKzyqzQ6gI4EimcoHWRxte+OQeWhqpT6NhycGzP1VPfJK1XR4/OuVixvNezzEbOp737ZKdS3hEKJrcXiGxHkK31GQKU7GpjWGFQC3SNmgCoqYsDSr64JZM6TninvI5nUrPsYYKNi4ZnONfSLZe7AfNjSYXRFl/T5gxE8j+Foi1+rugIDeYH5Ib+h7I1wBjqLZAZGwtVL8EtMd4SdiT+mCcuLof+DhM10+7uRt6+RYxv6w8L+aguARfV25NKuSpJ6yn7HfJlOQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=="}, {"type": "h2", "text": "7.2  Herramientas y técnicas para evaluar el progreso"}, {"type": "p", "text": "Un portafolio junta entregables, reflexiones y autoevaluaciones de distintos momentos, y esa acumulación es justo lo que deja ver patrones de avance que una sola tarea aislada nunca mostraría (Barcia Cedeño et al., 2023). Las bitácoras y los cronogramas cumplen una función parecida pero más cuantitativa: cuántos ejercicios se resolvieron, qué tan buena fue la calidad de cada entrega, qué observaciones se recibieron. Una rúbrica, en cambio, pone en una misma tabla los criterios y los niveles de logro esperados para una tarea puntual, lo que vuelve la comparación contra un estándar mucho más objetiva. Y las autoevaluaciones guiadas, donde el estudiante juzga su propio trabajo contra criterios claros, fortalecen tanto la metacognición como la autorregulación porque obligan a justificar por qué algo se considera bien o mal hecho.", "b": false}, {"type": "h2", "text": "7.3  Indicadores de progreso y su integración con la autorregulación"}, {"type": "p", "text": "Un indicador de progreso útil hace algo más que resumir un número: ayuda a decidir qué hacer a continuación, ya sea cuántos ejercicios se resolvieron sin ayuda externa, cuánto tiempo tomó completar una tarea comparado con la semana anterior, o cuántas veces fue necesario consultar la misma documentación. Evaluar el progreso solo tiene sentido pleno cuando se conecta de vuelta con la autorregulación: si los indicadores muestran que una estrategia de estudio no está funcionando, la respuesta correcta es ajustar el plan, no ignorarlo. Esa integración cierra el ciclo entre saber cómo se está aprendiendo y hacer algo con esa información.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Evaluación formativa", "body": "La evaluación que ocurre durante el proceso de aprendizaje, no al final, con el único propósito de orientar la mejora. No busca una calificación; busca información específica y oportuna que el estudiante pueda usar de inmediato para ajustar su estrategia."}, {"type": "h2", "text": "7.4  Ejemplo completo"}, {"type": "p", "text": "Un estudiante lleva un registro semanal de cuántos ejercicios de un curso de estructuras de datos resuelve sin consultar la solución. Las primeras dos semanas el número sube con normalidad; en la tercera, cae de forma notoria. En lugar de ignorar el dato, revisa su registro junto con su diario de reflexión y descubre que la caída coincide con el tema de árboles binarios, que le está costando más de lo esperado. Ajusta su plan para dedicar una sesión extra a practicar ese tema antes de seguir avanzando.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Diseña una rúbrica sencilla, con al menos tres criterios y tres niveles de desempeño, para autoevaluar un proyecto de programación que tengas pendiente.\n2. Lleva un registro de rendimiento durante dos semanas (ejercicios resueltos, tiempo invertido, dificultades) y compara ambas semanas para identificar un patrón.\n3. A partir del registro anterior, describe un ajuste concreto en tu estrategia de estudio, coherente con lo que observaste."}]}, {"id": "cap8", "titulo": "Autoevaluación y mejora continua", "kind": "cap", "num": 8, "unidad": "UNIDAD 2 · DESARROLLO DEL PENSAMIENTO CRÍTICO Y REFLEXIVO", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás aplicar los elementos de la autoevaluación a tu propio proceso de aprendizaje y usar el ciclo de mejora continua para convertir esa evaluación en cambios concretos."}, {"type": "h2", "text": "8.1  La autoevaluación en el aprendizaje autónomo"}, {"type": "p", "text": "A diferencia de la evaluación que hace un docente desde afuera, la autoevaluación pone al propio estudiante a analizar y juzgar su desempeño frente a criterios ya definidos, en un ejercicio deliberadamente metacognitivo (Panadero & Alonso-Tapia, 2017b). El proceso tiene varios pasos: reunir evidencia de lo aprendido, compararla contra un estándar, emitir un juicio honesto sobre qué salió bien y qué no, y sacar de ahí una conclusión que oriente el siguiente paso.", "b": false}, {"type": "p", "text": "En el aprendizaje autónomo, la autoevaluación funciona como un mecanismo de retroalimentación interna: desarrolla conciencia sobre las propias capacidades y límites, ayuda a priorizar qué aprender según necesidades reales, y fortalece la autorregulación al alimentar de vuelta la planificación y el monitoreo. En programas de tecnología, donde los retos cambian constantemente, esta práctica convierte la experiencia formativa en algo activo en lugar de simplemente recibir contenidos y esperar una calificación.", "b": false}, {"type": "img", "caption": "Figura 8.1 · Ciclo de mejora continua (PDCA) aplicado al aprendizaje", "data": "data:image/webp;base64,UklGRtA6AABXRUJQVlA4IMQ6AADQlAGdASroA6gDPmEwlkgkIqKhIRKo2IAMCWlu+F6o84a/u/OGT6ZmqrZwvi0yaw/MI5o87Hp48wD+69GLzAfuX6r/+8/ar3nf2v1Cf7d/gOtU9E3y7vaB/sf/lyp3yX/e/yY8y36j/dv7Z+yv7tevf4n89/fP7L+0f9u5bvqH+D5nfyX7Z/lf73+3n97/db5A/5P+F/aHzf9aXqC/kP8y/wf5Tf4H9wfc9/s+14mu9QX2h+t/6v/G/vb/rPTW/yPQn7Pf8f++/AB/M/6b/uvuX9tvwp/WPYD/mf94/6v+g92j+6/+H+98936D/o//Z/qvgP/mf9v/6v+T7ZvpBBe4UNki9ZBQ2SL1kFDZIvWQUNki9ZBQ2SL1kFDZIvWQUNki9ZBQ2SL1kFDZIvWQUNki9ZBQ2SL1kFDZIvWQUNki9ZBQ2SL1kFDZIvWQUNki9ZBQ2SL1kFDZIvWQUNk
