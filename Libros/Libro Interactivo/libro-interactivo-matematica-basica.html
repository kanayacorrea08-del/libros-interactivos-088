/* ═══════ quiz ═══════ */
/* ── memoria del libro: el progreso sobrevive al recargar la página ──
   Mismo esquema que los demás libros de la serie. Todo queda en este
   navegador; nada se envía a ningún servidor. ── */
const CLAVE = 'mb_libro_v1';
let DATOS = {};
try{ DATOS = JSON.parse(localStorage.getItem(CLAVE) || '{}'); }catch(e){ DATOS = {}; }
function guarda(){ try{ localStorage.setItem(CLAVE, JSON.stringify(DATOS)); return true; }catch(e){ return false; } }
function get(k, def){ return DATOS[k]===undefined ? def : DATOS[k]; }
function set(k, v){ DATOS[k]=v; return guarda(); }

/* ── barajado determinista de las opciones ────────────────────────────
   Sin esto la respuesta correcta caía casi siempre en la segunda casilla,
   y bastaba marcar la misma letra para aprobar. El orden depende del
   capítulo, del número de pregunta y del intento: es igual al recargar
   la página y cambia cuando el estudiante vuelve a intentarlo. ── */
function semillaTxt(t){ let h=2166136261; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function barajaOpts(p, clave, pos){
  let s = semillaTxt(clave) || 1;
  const rnd = ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  const n = p.opts.length;
  const destino = ((pos % n) + n) % n;          /* la correcta rota de posición pregunta a pregunta */
  const otras = p.opts.map((_,i)=>i).filter(i=>i!==p.ok);
  for(let i=otras.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=otras[i]; otras[i]=otras[j]; otras[j]=t; }
  const idx = []; let k = 0;
  for(let i=0;i<n;i++) idx.push(i===destino ? p.ok : otras[k++]);
  return { opts: idx.map(i=>p.opts[i]), ok: destino };
}

const ESTADO = get('quiz', {});
function marcaHecho(id,a,t){ const p = ESTADO[id]; if(!p || a>=p.a){ ESTADO[id]={a,t}; set('quiz',ESTADO); } dibujaNav(); }
function quiz(id, intento){
  intento = intento || 0;
  const P = QUIZ[id];
  if(!P) return null;
  const q = el('div','tool');
  q.innerHTML = '<div class="tool-cab"><b>Comprueba tu comprensión</b><span>Resuelve sin volver al texto. Cada respuesta explica el procedimiento.</span></div>';
  const c = el('div','tool-cuerpo');
  let ac=0, n=0;
  const marcador = el('div','marcador','0 de '+P.length+' respondidas');
  P.forEach((p,i)=>{
    const d = el('div','preg');
    d.appendChild(el('div','q','<i>'+String(i+1).padStart(2,'0')+'</i><span>'+esc(p.q)+'</span>'));
    const exp = el('div','exp oculto', esc(p.exp));
    const mez = barajaOpts(p, id+'·'+i+'·'+intento, i + intento + semillaTxt(id));
    const bs = mez.opts.map((o,j)=>{
      const b = el('button','op', esc(o));
      b.onclick = ()=>{
        bs.forEach(x=>x.disabled=true);
        b.classList.add(j===mez.ok?'bien':'mal');
        if(j!==mez.ok) bs[mez.ok].classList.add('bien');
        exp.classList.remove('oculto');
        n++; if(j===mez.ok) ac++;
        marcador.textContent = ac+' de '+n+' correctas';
        if(n===P.length){
          marcador.textContent = 'Resultado: '+ac+' de '+P.length+' correctas'+
            (ac===P.length?' — impecable.':ac>=P.length-1?' — muy bien.':' — vale la pena releer el capítulo.');
          marcaHecho(id, ac, P.length);
        }
      };
      d.appendChild(b);
      return b;
    });
    d.appendChild(exp);
    c.appendChild(d);
  });
  c.appendChild(marcador);
  const reintentar = el('button','bt ghost','↺ Volver a intentar');
  reintentar.style.marginTop = '14px';
  reintentar.onclick = ()=>{ const nuevo = quiz(id, intento+1); q.replaceWith(nuevo); nuevo.scrollIntoView({block:'start'}); };
  c.appendChild(reintentar);
  q.appendChild(c);
  return q;
}

/* ═══════ atajos de ejercicios ═══════ */
const ATAJOS = [
  {re:/resuelve la ecuación|desigualdad|verifica el resultado/i, t:'Resolver paso a paso', id:'cap1'},
  {re:/resuelve el sistema|método de (sustitución|reducción)/i, t:'Resolver el sistema', id:'cap2'},
  {re:/determina el dominio|prueba de la línea vertical|grafica/i, t:'Graficar y ver el dominio', id:'cap3'},
  {re:/grado de la|función (exponencial|logarítmica|polinómica)/i, t:'Graficar la familia', id:'cap4'},
  {re:/traduce a lógica|son proposiciones/i, t:'Traducir la condición', id:'cap5'},
  {re:/tabla de verdad|tautología|equivalentes/i, t:'Construir la tabla de verdad', id:'cap6'},
  {re:/conjuntos? a =|calcula a ∪|diferencia de conjuntos|conjunto universal/i, t:'Calcular con conjuntos', id:'cap7'},
  {re:/diagrama de venn|al menos uno de los dos/i, t:'Dibujar el diagrama de Venn', id:'cap8'},
  {re:/complejos?|clasifica los siguientes números|i² = −1/i, t:'Operar con complejos', id:'cap9'},
  {re:/sucesión|aritmética o geométrica|octavo término/i, t:'Explorar la sucesión', id:'cap10'},
  {re:/suma de los primeros|serie geométrica infinita|converge/i, t:'Calcular la serie', id:'cap11'},
  {re:/complejidad|bucle|operaciones/i, t:'Comparar el crecimiento', id:'cap12'}
];
function atajo(txt){
  const a = ATAJOS.find(x=>x.re.test(txt));
  if(!a) return null;
  const aqui = LIBRO[actual] && LIBRO[actual].id === a.id;
  return {
    t: a.t + (aqui ? ' (más abajo en esta página)' : ' →'),
    f: ()=>{
      if(aqui){ const e=$('.tool'); if(e) e.scrollIntoView({behavior:'smooth',block:'start'}); return; }
      const i = LIBRO.findIndex(c=>c.id===a.id);
      if(i>=0){ ve(i); setTimeout(()=>{ const e=$('.tool'); if(e) e.scrollIntoView({block:'start'}); },60); }
    }
  };
}

/* ═══════ render ═══════ */
function bloque(b){
  switch(b.type){
    case 'p': return el('p', null, esc(b.text));
    case 'h2': return el('h2', null, esc(b.text));
    case 'objetivos': case 'concepto': {
      const d = el('div','caja '+b.type);
      d.appendChild(el('div','t','<span>'+(b.type==='concepto'?'◈':'◎')+'</span>'+esc(b.title)));
      d.appendChild(el('p',null,esc(b.body)));
      return d;
    }
    case 'ejercicios': {
      const d = el('div','ejs');
      d.appendChild(el('h3',null,'Ponlo a prueba'));
      b.body.split(/\n(?=\d+\.\s)/).forEach((t,i)=>{
        const txt = t.replace(/^\d+\.\s*/,'').trim();
        if(!txt) return;
        const e = el('div','ej');
        e.appendChild(el('div','n', String(i+1)));
        const col = el('div'); col.style.flex='1';
        col.appendChild(el('p',null,esc(txt)));
        const at = atajo(txt);
        if(at){ const b2 = el('button','link', at.t); b2.onclick = at.f; col.appendChild(b2); }
        e.appendChild(col);
        d.appendChild(e);
      });
      return d;
    }
    case 'img': {
      const f = el('figure');
      const i = el('img'); i.src=b.data; i.alt=b.caption||'Figura del libro'; i.loading='lazy';
      f.appendChild(i);
      if(b.caption) f.appendChild(el('figcaption',null,esc(b.caption)));
      return f;
    }
    case 'grid': {
      const w = el('div','tabla-wrap');
      const t = el('table','datos');
      const [cab, ...fs] = b.rows;
      t.innerHTML = '<thead><tr>'+cab.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
        fs.map(f=>'<tr>'+f.map(x=>'<td>'+esc(x).replace(/\n/g,'<br>')+'</td>').join('')+'</tr>').join('')+'</tbody>';
      w.appendChild(t); return w;
    }
    default: return el('div');
  }
}

let actual = 0;
function dibujaNav(){
  const nav = $('#nav'); nav.innerHTML='';
  let grupo = null;
  LIBRO.forEach((c,i)=>{
    const g = c.unidad || (c.kind==='anexo' ? 'Material de consulta' : c.kind==='cap' ? 'Capítulos' : 'Apertura y cierre');
    if(g!==grupo){ grupo=g; nav.appendChild(el('div','grupo', esc(g))); }
    const b = el('button','nav-i'+(i===actual?' on':''));
    const e = ESTADO[c.id];
    b.innerHTML = '<span class="num">'+(c.num||'')+'</span><span>'+esc(c.titulo)+'</span>'+(e?'<span class="ck">'+e.a+'/'+e.t+'</span>':'');
    b.onclick = ()=>{ ve(i); cierra(); };
    nav.appendChild(b);
  });
  const caps = LIBRO.filter(c=>c.kind==='cap');
  const hechos = caps.filter(c=>ESTADO[c.id]).length;
  $('#avanceTxt').textContent = hechos+' de '+caps.length+' capítulos';
  $('#aroFg').setAttribute('stroke-dasharray',(hechos/caps.length*100.5)+' 100.5');
}
function cierra(){ $('#rail').classList.remove('abierto'); $('#velo').classList.remove('on'); }

/* anexos como tarjetas de referencia */
function anexoFormulario(c){
  const cont = el('div');
  let blq = null;
  c.blocks.forEach((b,i)=>{
    if(b.type==='p' && i===0){ cont.appendChild(bloque(b)); return; }
    if(b.type==='h2'){
      blq = el('div','form-blq');
      blq.appendChild(el('h3',null,esc(b.text)));
      cont.appendChild(blq);
      return;
    }
    if(b.type==='p'){
      const dest = blq || (()=>{ blq = el('div','form-blq'); cont.appendChild(blq); return blq; })();
      const partes = b.text.split(/(?<=\.)\s+(?=[A-ZÁÉÍÓÚ])/);
      partes.forEach(p=>{
        const m = p.match(/^(.+?):\s*(.+)$/);
        const d = el('div','form-item');
        if(m) d.innerHTML = esc(m[2]) + '<em>' + esc(m[1]) + '</em>';
        else if(p.includes('→')){
          const [a,bb] = p.split('→');
          d.innerHTML = '<b>'+esc(a.trim())+'</b><em>'+esc(bb.trim())+'</em>';
        }
        else d.innerHTML = esc(p);
        dest.appendChild(d);
      });
      return;
    }
    cont.appendChild(bloque(b));
  });
  return cont;
}

function ve(i){
  actual = Math.max(0, Math.min(LIBRO.length-1, i));
  const c = LIBRO[actual];
  const h = $('#hoja'); h.innerHTML='';
  $('#barraTit').textContent = c.titulo;
  document.title = c.titulo + ' · Matemática Básica';

  if(c.id==='portada'){ h.appendChild(portada(c)); }
  else {
    const tapa = el('div','tapa');
    if(c.kind==='cap') tapa.appendChild(el('div','eyebrow','Capítulo '+c.num+' · '+esc((c.unidad||'').split('·')[0].trim())));
    else if(c.kind==='anexo') tapa.appendChild(el('div','eyebrow','Material de consulta'));
    tapa.appendChild(el('h1',null,esc(c.titulo)));
    h.appendChild(tapa);
    if(c.kind==='anexo' && c.id!=='rubrica') h.appendChild(anexoFormulario(c));
    else {
      const w = el('div', c.id==='referencias' ? 'refs' : '');
      c.blocks.forEach(b=> w.appendChild(bloque(b)));
      h.appendChild(w);
    }
    herramientas(c).forEach(x=>h.appendChild(x));
    if(c.kind==='cap'){ const q = quiz(c.id); if(q) h.appendChild(q); }
  }
  h.appendChild(pie());
  dibujaNav();
  if(location.hash.slice(1) !== c.id) location.hash = c.id;
  window.scrollTo({top:0,behavior:'instant'});
}

function portada(c){
  const d = el('div','portada');
  const im = c.blocks.find(b=>b.type==='img');
  const img = el('img'); img.src = im.data; img.alt='Portada del libro';
  const der = el('div');
  der.innerHTML = '<div class="eyebrow">Edición interactiva</div>'+
    '<h1>Matemática Básica</h1>'+
    '<p class="claim">El libro completo con las matemáticas funcionando: resuelve, grafica, construye tablas de verdad y comprueba cada resultado sin salir de la página.</p>'+
    '<div class="autores">Jesús Arrieta Madrid · Wilmer Vergara Ruiz · Greizy Karr Sáez Galvis<br>'+
    '<span>Matemática Básica (FDOC-088) · Técnico Profesional en Programación Web · Universidad de Córdoba · Montería, 2026</span></div>';
  const t = el('div','tarjetas');
  [['=','Resuelve ecuaciones y sistemas con el despeje paso a paso, no solo el resultado.'],
   ['ƒ','Grafica cualquier función y comprueba su dominio en el plano cartesiano.'],
   ['∧','Genera tablas de verdad completas y verifica las leyes de De Morgan.'],
   ['∪','Opera con conjuntos y sombrea regiones en un diagrama de Venn.'],
   ['∑','Explora sucesiones y series, y comprueba cuándo convergen.']].forEach(([i,x])=>{
    t.appendChild(el('div','tarj','<i>'+i+'</i><span>'+x+'</span>'));
  });
  der.appendChild(t);
  const b = el('button','bt-nav sig','Empezar por el prólogo →');
  b.onclick = ()=>ve(LIBRO.findIndex(x=>x.id==='prologo'));
  der.appendChild(b);
  der.appendChild(el('div','aviso','Todo se calcula dentro de tu navegador: funciona sin conexión y sin instalar nada. Los ejemplos precargados en cada calculadora son los mismos del libro.'));
  d.appendChild(img); d.appendChild(der);
  return d;
}
function pie(){
  const p = el('div','pie');
  const a = el('button','bt-nav','← '+(actual>0?LIBRO[actual-1].titulo.slice(0,32):'Inicio'));
  a.onclick=()=>ve(actual-1); a.disabled = actual<=0;
  const b = el('button','bt-nav sig',(actual<LIBRO.length-1&&actual>=0?LIBRO[actual+1].titulo.slice(0,32):'Fin')+' →');
  b.onclick=()=>ve(actual+1); b.disabled = actual<0 || actual===LIBRO.length-1;
  p.appendChild(a); p.appendChild(b);
  return p;
}

$('#ham').onclick = ()=>{ $('#rail').classList.toggle('abierto'); $('#velo').classList.toggle('on'); };
$('#velo').onclick = cierra;
$('#btTools').onclick = ()=>{ vistaCatalogo(); cierra(); };
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='ArrowRight' && actual>=0) ve(actual+1);
  if(e.key==='ArrowLeft' && actual>0) ve(actual-1);
});
/* ── enlace directo: la dirección refleja la sección abierta, así el
   botón Atrás funciona y se puede compartir un capítulo concreto ── */
window.addEventListener('hashchange', ()=>{
  const id = decodeURIComponent((location.hash||'').slice(1));
  const i = LIBRO.findIndex(c=>c.id===id);
  if(i>=0 && i!==actual) ve(i);
});
ve(Math.max(0, LIBRO.findIndex(c=>c.id===decodeURIComponent((location.hash||'').slice(1)))));
</script>
