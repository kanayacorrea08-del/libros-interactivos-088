<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matemática Básica · Edición interactiva</title>
<meta name="description" content="Edición interactiva del libro Matemática Básica para Programación Web. Universidad de Córdoba.">
<style>
:root{
  --pizarra:#122b2b; --pizarra-2:#1a3d3b; --teal:#0f6d63; --teal-cl:#e4f2ef; --teal-borde:#b6d9d2;
  --grafito:#1c2427; --coral:#c05a2e; --coral-cl:#fcefe7; --coral-borde:#efcbb4;
  --papel:#fcfbf8; --papel-2:#f1efe9; --linea:#dcd8cd;
  --tinta:#182124; --tinta-2:#576368;
  --ok:#1f7a55; --ok-cl:#e3f3ec; --no:#a63a24; --no-cl:#fbeae5;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:"Charter","Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mate:"Latin Modern Math","Cambria Math","STIX Two Math",Cambria,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:286px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--serif);font-size:17.5px;line-height:1.64;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:var(--sans)}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:2px}

/* rail */
#rail{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--pizarra);color:#d5e5e2;display:flex;flex-direction:column;z-index:40;transition:transform .25s ease}
.rail-top{padding:18px 20px 15px;border-bottom:1px solid rgba(255,255,255,.12)}
.marca{font-family:var(--sans);font-weight:800;font-size:15.5px;color:#fff;line-height:1.2;letter-spacing:-.2px}
.marca em{font-style:normal;color:#7fd4c4}
.sub{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7fa39c;margin-top:8px}
.avance{display:flex;align-items:center;gap:10px;margin-top:15px}
.aro{width:34px;height:34px;flex:0 0 34px}
.aro circle{fill:none;stroke-width:4}
.aro .bg{stroke:rgba(255,255,255,.16)}
.aro .fg{stroke:#7fd4c4;stroke-linecap:round;transition:stroke-dasharray .4s}
.avance b{font-family:var(--sans);font-size:12px;font-weight:600;color:#a9c7c1}
nav{overflow-y:auto;padding:10px 12px 30px;flex:1}
.grupo{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6f948c;padding:16px 10px 6px;border-top:1px solid rgba(255,255,255,.1);margin-top:8px;line-height:1.4}
.grupo:first-child{border-top:0;margin-top:0}
.nav-i{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;color:#d5e5e2;font-size:13.5px;line-height:1.35;font-family:var(--sans)}
.nav-i:hover{background:rgba(255,255,255,.09)}
.nav-i.on{background:#7fd4c4;color:var(--pizarra);font-weight:600}
.nav-i.on .num{color:var(--pizarra)}
.nav-i .num{font-weight:700;font-size:11px;color:#7fd4c4;min-width:16px;font-variant-numeric:tabular-nums}
.nav-i .ck{margin-left:auto;font-size:11px;opacity:.9}
.rail-pie{padding:12px;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:7px}
.bt-rail{width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;display:flex;gap:7px;align-items:center;justify-content:center}
.bt-rail:hover{background:rgba(127,212,196,.22);border-color:#7fd4c4}

main{margin-left:var(--rail);padding:0 0 90px}
.hoja{max-width:770px;margin:0 auto;padding:0 30px}
.tapa{padding:40px 0 18px}
.eyebrow{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:11px}
h1{font-family:var(--sans);font-weight:800;font-size:clamp(28px,4vw,38px);line-height:1.1;letter-spacing:-.022em;color:var(--pizarra);margin:0 0 12px}
h2{font-family:var(--sans);font-weight:700;font-size:19.5px;letter-spacing:-.01em;color:var(--pizarra);margin:42px 0 12px;padding-left:13px;border-left:4px solid var(--teal)}
h3{font-family:var(--sans);font-weight:650;font-size:16px;color:var(--tinta);margin:26px 0 8px}
p{margin:0 0 15px}
figure{margin:26px 0;text-align:center}
figure img{max-width:100%;border-radius:9px;border:1px solid var(--linea);background:#fff}
figcaption{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);margin-top:9px}
.refs p{font-size:15px;padding-left:26px;text-indent:-26px;margin-bottom:9px;line-height:1.5}
.mate{font-family:var(--mate);font-size:1.03em}

.caja{border-radius:11px;padding:16px 18px;margin:22px 0;font-size:16px;border:1px solid}
.caja .t{font-family:var(--sans);font-weight:700;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px;display:flex;gap:8px;align-items:center}
.caja p{margin:0}
.caja.objetivos{background:var(--teal-cl);border-color:var(--teal-borde)}
.caja.objetivos .t{color:var(--teal)}
.caja.concepto{background:var(--coral-cl);border-color:var(--coral-borde)}
.caja.concepto .t{color:var(--coral)}

.ejs{margin:34px 0 10px}
.ej{display:flex;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:14px 16px;margin-bottom:10px;align-items:flex-start}
.ej .n{font-family:var(--sans);font-weight:800;font-size:12px;color:#fff;background:var(--pizarra);min-width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
.ej p{margin:0;font-size:16px}
.ej .link{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--teal);background:none;border:0;padding:4px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}

/* herramientas */
.tool{background:#fff;border:1px solid var(--linea);border-radius:13px;margin:30px 0;overflow:hidden;box-shadow:0 1px 3px rgba(18,43,43,.07)}
.tool-cab{padding:15px 20px;background:var(--pizarra);color:#fff}
.tool-cab b{font-family:var(--sans);font-size:15.5px;display:block;letter-spacing:-.01em}
.tool-cab span{font-family:var(--sans);font-size:12.5px;color:#a3c2bc;display:block;margin-top:3px;line-height:1.45}
.tool-cuerpo{padding:18px 20px}
.tool-pie{padding:12px 20px;background:var(--papel-2);border-top:1px solid var(--linea);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.bt{font-family:var(--sans);font-size:13px;font-weight:600;border:1px solid var(--linea);background:#fff;color:var(--pizarra);padding:8px 15px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
.bt:hover{border-color:var(--teal);background:var(--teal-cl)}
.bt.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.bt.pri:hover{background:#0d5d55;border-color:#0d5d55}
.bt.ghost{background:none;border-color:transparent;color:var(--tinta-2)}
.bt.ghost:hover{background:#fff;border-color:var(--linea)}
.bt.chip{font-size:12px;padding:5px 11px;border-radius:20px;background:var(--papel-2);color:var(--tinta-2)}
.bt.chip:hover{background:var(--teal-cl);color:var(--teal);border-color:var(--teal-borde)}
label.campo{display:block;margin-bottom:14px}
label.campo>span{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--pizarra);display:block;margin-bottom:5px}
label.campo>i{font-family:var(--sans);font-size:12px;color:var(--tinta-2);font-style:normal;display:block;margin-bottom:6px;line-height:1.45}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--linea);border-radius:8px;padding:10px 12px;font-size:15px;background:var(--papel);color:var(--tinta);outline:0;line-height:1.5}
input.formula{font-family:var(--mate);font-size:17px;letter-spacing:.01em}
input:focus,textarea:focus,select:focus{border-color:var(--teal);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fila-in{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.fila-in label.campo{flex:1 1 150px;margin-bottom:0}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.simbolos{display:flex;gap:5px;flex-wrap:wrap;margin:-6px 0 13px}
.simbolos button{font-family:var(--mate);font-size:15px;border:1px solid var(--linea);background:var(--papel);color:var(--pizarra);width:36px;height:32px;border-radius:7px;padding:0}
.simbolos button:hover{background:var(--teal-cl);border-color:var(--teal)}

/* pasos */
.pasos{counter-reset:paso;margin:4px 0 0}
.paso{display:flex;gap:13px;padding:12px 0;border-top:1px solid var(--papel-2)}
.paso:first-child{border-top:0}
.paso .b{counter-increment:paso;font-family:var(--sans);font-weight:800;font-size:11.5px;color:#fff;background:var(--teal);min-width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;margin-top:3px}
.paso .b::before{content:counter(paso)}
.paso .t{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--tinta-2);margin-bottom:3px}
.paso .e{font-family:var(--mate);font-size:19px;color:var(--pizarra);line-height:1.4}
.paso .nota{font-family:var(--sans);font-size:12.5px;color:var(--coral);background:var(--coral-cl);border-radius:7px;padding:7px 10px;margin-top:7px;line-height:1.45}
.paso .nota.neutra{color:var(--tinta-2);background:var(--papel-2)}

.result{border-radius:10px;padding:14px 16px;font-family:var(--sans);margin-top:14px;border:1px solid;font-size:14px;line-height:1.5}
.result b{font-size:15px;display:block;margin-bottom:4px}
.result .big{font-family:var(--mate);font-size:23px;display:block;margin:6px 0 2px}
.r-ok{background:var(--ok-cl);border-color:#a8d3c0;color:#155c3d}
.r-med{background:var(--coral-cl);border-color:var(--coral-borde);color:#8a3f1c}
.r-no{background:var(--no-cl);border-color:#e5bcae;color:#8a2f1c}
.r-info{background:var(--teal-cl);border-color:var(--teal-borde);color:#0b544c}

/* tablas */
.tabla-wrap{overflow-x:auto;margin:18px 0}
table.datos{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:13.5px}
table.datos th{background:var(--pizarra);color:#fff;text-align:left;padding:9px 11px;font-weight:600;font-size:12px;vertical-align:top}
table.datos td{padding:8px 11px;border-bottom:1px solid var(--linea);vertical-align:top}
table.datos tr:nth-child(even) td{background:var(--papel)}
table.tv{border-collapse:collapse;font-family:var(--mate);font-size:15px;width:100%;min-width:min-content}
table.tv th{background:var(--pizarra);color:#fff;padding:8px 12px;font-family:var(--sans);font-size:12px;font-weight:600;white-space:nowrap;text-align:center}
table.tv th.res{background:var(--teal)}
table.tv td{padding:6px 12px;text-align:center;border-bottom:1px solid var(--linea);white-space:nowrap;font-weight:600}
table.tv td.V{color:var(--ok)}
table.tv td.F{color:var(--no)}
table.tv td.res{background:var(--teal-cl)}
table.tv tr:hover td{background:var(--papel-2)}
table.tv tr:hover td.res{background:#cfe7e1}
table.tv td.dif{background:var(--no-cl)!important}

svg.lienzo{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--linea);border-radius:10px}
.eje{stroke:var(--tinta-2);stroke-width:1.2}
.malla{stroke:#eceae3;stroke-width:1}
.malla-0{stroke:#d8d5cb;stroke-width:1}
.curva{fill:none;stroke:var(--teal);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.curva-2{stroke:var(--coral)}
.marca-svg{font-family:var(--sans);font-size:9px;fill:var(--tinta-2)}
.pt{fill:var(--coral);stroke:#fff;stroke-width:1.6}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);margin-top:10px}
.leyenda i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* venn */
.venn-op{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.venn-op button{font-family:var(--mate);font-size:14px;border:1px solid var(--linea);background:var(--papel);color:var(--pizarra);padding:7px 13px;border-radius:8px}
.venn-op button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.venn-op button:hover:not(.on){border-color:var(--teal)}
.region{fill:var(--teal);opacity:0;transition:opacity .3s}
.region.on{opacity:.42}
.circ{fill:none;stroke:var(--pizarra);stroke-width:2}
.venn-lab{font-family:var(--sans);font-size:15px;font-weight:700;fill:var(--pizarra)}
.venn-num{font-family:var(--sans);font-size:14px;font-weight:600;fill:var(--tinta)}

/* quiz */
.preg{padding:16px 0;border-top:1px solid var(--papel-2)}
.preg:first-of-type{border-top:0}
.preg .q{font-family:var(--sans);font-size:15.5px;font-weight:600;margin-bottom:11px;display:flex;gap:9px}
.preg .q i{color:var(--teal);font-style:normal;font-weight:800;font-size:12px;padding-top:3px}
.op{display:block;width:100%;text-align:left;font-size:14.5px;padding:9px 13px;margin-bottom:6px;border-radius:8px;border:1px solid var(--linea);background:var(--papel);color:var(--tinta);line-height:1.4}
.op:hover:not([disabled]){border-color:var(--teal);background:#fff}
.op.bien{background:var(--ok-cl);border-color:#a8d3c0;font-weight:600}
.op.mal{background:var(--no-cl);border-color:#e5bcae}
.op[disabled]{cursor:default}
.exp{font-family:var(--sans);font-size:13.5px;background:var(--papel-2);border-left:3px solid var(--teal);padding:9px 13px;border-radius:0 7px 7px 0;margin-top:8px;color:var(--tinta-2);line-height:1.5}
.marcador{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--pizarra);margin-top:16px;padding-top:14px;border-top:1px solid var(--papel-2)}

/* portada */
.portada{display:grid;grid-template-columns:minmax(200px,.72fr) 1.28fr;gap:40px;align-items:center;padding:44px 0 16px}
.portada img{width:100%;border-radius:11px;box-shadow:0 16px 44px rgba(18,43,43,.26)}
.portada h1{font-size:clamp(26px,3vw,34px)}
.claim{font-size:17px;color:var(--tinta-2);margin-bottom:18px}
.autores{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--pizarra);border-left:3px solid var(--teal);padding-left:12px;margin-bottom:20px;line-height:1.5}
.autores span{display:block;font-weight:400;font-size:11.5px;color:var(--tinta-2);margin-top:3px}
.tarjetas{display:grid;gap:9px;margin:18px 0 22px}
.tarj{display:flex;gap:11px;align-items:flex-start;font-family:var(--sans);font-size:14px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:12px 14px}
.tarj i{font-style:normal;font-size:15px;color:var(--teal);font-family:var(--mate)}
.aviso{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);background:var(--papel-2);border-radius:9px;padding:11px 14px;margin-top:14px;line-height:1.5}

/* formulario / índice de herramientas */
.tarj-lista{display:grid;gap:9px;margin:18px 0}
.tarj-h{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:13px 16px}
.tarj-h b{font-family:var(--sans);font-size:14.5px;color:var(--pizarra);display:block}
.tarj-h span{font-family:var(--sans);font-size:12.5px;color:var(--tinta-2);display:block;margin-top:2px;line-height:1.45}
.tarj-h .bt{margin-left:auto;flex:0 0 auto}
.form-blq{background:#fff;border:1px solid var(--linea);border-radius:11px;padding:14px 18px;margin-bottom:11px}
.form-blq h3{margin:0 0 8px;color:var(--teal)}
.form-item{padding:7px 0;border-top:1px solid var(--papel-2);font-family:var(--mate);font-size:17px}
.form-item:first-of-type{border-top:0}
.form-item em{font-family:var(--sans);font-size:12.5px;font-style:normal;color:var(--tinta-2);display:block;margin-top:2px}

.pie{display:flex;gap:12px;justify-content:space-between;margin-top:50px;padding-top:20px;border-top:1px solid var(--linea);flex-wrap:wrap}
.bt-nav{font-family:var(--sans);font-size:14px;font-weight:600;border:1px solid var(--linea);background:#fff;color:var(--pizarra);padding:10px 16px;border-radius:9px}
.bt-nav:hover{border-color:var(--teal);background:var(--teal-cl)}
.bt-nav.sig{background:var(--pizarra);color:#fff;border-color:var(--pizarra)}
.bt-nav[disabled]{opacity:.4;cursor:not-allowed}

#barra{display:none;position:sticky;top:0;z-index:30;background:rgba(252,251,248,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea);padding:9px 14px;align-items:center;gap:11px}
#barra b{font-family:var(--sans);font-size:13.5px;color:var(--pizarra);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ham{border:1px solid var(--linea);background:#fff;border-radius:8px;width:36px;height:34px;font-size:15px;color:var(--pizarra)}
#velo{display:none;position:fixed;inset:0;background:rgba(18,43,43,.45);z-index:35}
.oculto{display:none}

@media(max-width:900px){
  #rail{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  #rail.abierto{transform:none}
  main{margin-left:0}
  #barra{display:flex}
  #velo.on{display:block}
  .hoja{padding:0 18px}
  .portada{grid-template-columns:1fr;gap:22px;padding-top:24px}
  .portada img{max-width:250px;margin:0 auto;display:block}
}
@media(max-width:640px){
  body{font-size:17px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .tool-cuerpo,.tool-pie{padding:15px}
  .paso .e{font-size:17px}
  .tarj-h{flex-wrap:wrap}
  .tarj-h .bt{margin-left:0;width:100%;justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{#rail,#barra,.tool-pie,.pie{display:none}main{margin:0}}
</style>
</head>
<body>

<div id="velo"></div>

<aside id="rail">
  <div class="rail-top">
    <div class="marca">Matemática<br><em>Básica</em></div>
    <div class="sub">Edición interactiva</div>
    <div class="avance">
      <svg class="aro" viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/>
        <circle class="fg" id="aroFg" cx="20" cy="20" r="16" stroke-dasharray="0 100.5" transform="rotate(-90 20 20)"/></svg>
      <b id="avanceTxt">0 de 12 capítulos</b>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="rail-pie">
    <button class="bt-rail" id="btTools">∑ Todas las calculadoras</button>
  </div>
</aside>

<div id="barra"><button id="ham" aria-label="Abrir el índice">☰</button><b id="barraTit"></b></div>

<main><div class="hoja" id="hoja"></div></main>

<script>
/* ═══════════════════════════════════════════════════════════
   MOTORES MATEMÁTICOS
   Sin dependencias externas. Todo se evalúa en el navegador.
   ═══════════════════════════════════════════════════════════ */

/* ── normalización de entrada: acepta lo que el estudiante escribe ── */
function normaliza(s){
  return String(s)
    .replace(/[−–—]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/')
    .replace(/,/g,'.').replace(/\s+/g,'');
}

/* ═══════ 1 · Expresiones aritméticas y funciones (shunting-yard) ═══════ */
const FUNCS = {
  sen:Math.sin, sin:Math.sin, cos:Math.cos, tan:Math.tan,
  raiz:Math.sqrt, sqrt:Math.sqrt, abs:Math.abs,
  ln:Math.log, log:x=>Math.log10(x), log10:x=>Math.log10(x), log2:Math.log2,
  exp:Math.exp, redondear:Math.round
};
const CONSTS = {pi:Math.PI, e:Math.E, π:Math.PI};

function tokeniza(src){
  const s = normaliza(src).replace(/√/g,'raiz').replace(/\^/g,'^');
  const tk = [];
  let i = 0;
  while(i < s.length){
    const c = s[i];
    if(/[0-9.]/.test(c)){
      let j = i; while(j<s.length && /[0-9.]/.test(s[j])) j++;
      tk.push({t:'num', v:parseFloat(s.slice(i,j))}); i = j;
    } else if(/[a-zA-Zπ]/.test(c)){
      let j = i; while(j<s.length && /[a-zA-Z0-9π]/.test(s[j])) j++;
      const w = s.slice(i,j).toLowerCase();
      if(FUNCS[w]) tk.push({t:'fn', v:w});
      else if(CONSTS[w]!==undefined) tk.push({t:'num', v:CONSTS[w]});
      else if(w.length===1) tk.push({t:'var', v:w});
      else throw new Error('No reconozco «'+w+'». Usa x como variable, o funciones como raiz(), ln(), sen().');
      i = j;
    } else if('+-*/^'.includes(c)){ tk.push({t:'op', v:c}); i++; }
    else if(c==='('||c===')'){ tk.push({t:c}); i++; }
    else throw new Error('El carácter «'+c+'» no es válido en una expresión.');
  }
  /* multiplicación implícita: 2x, 3(x+1), x(x-1), )( */
  const out = [];
  for(let k=0;k<tk.length;k++){
    out.push(tk[k]);
    const a = tk[k], b = tk[k+1];
    if(!b) continue;
    const aFin = a.t==='num'||a.t==='var'||a.t===')';
    const bIni = b.t==='num'||b.t==='var'||b.t==='('||b.t==='fn';
    if(aFin && bIni && !(a.t==='num'&&b.t==='num')) out.push({t:'op', v:'*'});
  }
  return out;
}
const PREC = {'+':1,'-':1,'*':2,'/':2,'^':3};
function aRPN(tk){
  const out=[], ops=[];
  tk.forEach((t,i)=>{
    if(t.t==='num'||t.t==='var') out.push(t);
    else if(t.t==='fn') ops.push(t);
    else if(t.t==='op'){
      // unario
      const prev = tk[i-1];
      if(t.v==='-' && (!prev || prev.t==='op' || prev.t==='(')){ out.push({t:'num',v:0}); }
      while(ops.length){
        const top = ops[ops.length-1];
        if(top.t==='fn' || (top.t==='op' && (PREC[top.v]>PREC[t.v] || (PREC[top.v]===PREC[t.v] && t.v!=='^')))) out.push(ops.pop());
        else break;
      }
      ops.push(t);
    }
    else if(t.t==='(') ops.push(t);
    else if(t.t===')'){
      while(ops.length && ops[ops.length-1].t!=='(') out.push(ops.pop());
      if(!ops.length) throw new Error('Falta un paréntesis de apertura.');
      ops.pop();
      if(ops.length && ops[ops.length-1].t==='fn') out.push(ops.pop());
    }
  });
  while(ops.length){
    const o = ops.pop();
    if(o.t==='(') throw new Error('Falta cerrar un paréntesis.');
    out.push(o);
  }
  return out;
}
function esHojaMat(t){ return t.t==='num' || t.t==='var'; }
function aridadMat(t){ return t.t==='fn' ? 1 : 2; }
function compila(src){
  const rpn = aRPN(tokeniza(src));
  validaRPN(rpn, esHojaMat, aridadMat, 'matemática');
  return function(x){
    const st = [];
    for(const t of rpn){
      if(t.t==='num') st.push(t.v);
      else if(t.t==='var') st.push(x);
      else if(t.t==='fn') st.push(FUNCS[t.v](st.pop()));
      else {
        const b = st.pop(), a = st.pop();
        st.push(t.v==='+'?a+b : t.v==='-'?a-b : t.v==='*'?a*b : t.v==='/'?a/b : Math.pow(a,b));
      }
    }
    return st.pop();
  };
}

/* ═══════ 2 · Ecuaciones y desigualdades lineales ═══════ */
/* Reduce un lado a la forma {a, b} representando a·x + b */
function lineal(src){
  const rpn = aRPN(tokeniza(src));
  validaRPN(rpn, esHojaMat, aridadMat, 'matemática');
  const st = [];
  const num = v => ({a:0,b:v});
  const esNum = t => t.a===0;
  for(const t of rpn){
    if(t.t==='num') st.push(num(t.v));
    else if(t.t==='var') st.push({a:1,b:0});
    else if(t.t==='fn') throw new Error('Esta herramienta resuelve solo ecuaciones lineales: no admite funciones como '+t.v+'().');
    else {
      const q = st.pop(), p = st.pop();
      if(t.v==='+') st.push({a:p.a+q.a, b:p.b+q.b});
      else if(t.v==='-') st.push({a:p.a-q.a, b:p.b-q.b});
      else if(t.v==='*'){
        if(!esNum(p) && !esNum(q)) throw new Error('Aparece x·x: eso es una ecuación cuadrática, no lineal.');
        const k = esNum(p)?p.b:q.b, o = esNum(p)?q:p;
        st.push({a:o.a*k, b:o.b*k});
      }
      else if(t.v==='/'){
        if(!esNum(q)) throw new Error('No se puede dividir entre una expresión con x en una ecuación lineal.');
        if(q.b===0) throw new Error('División entre cero.');
        st.push({a:p.a/q.b, b:p.b/q.b});
      }
      else throw new Error('La potencia hace que la ecuación deje de ser lineal.');
    }
  }
  return st.pop();
}
function fmtNum(v){
  if(!isFinite(v)) return v>0?'∞':'−∞';
  const r = Math.round(v*1e6)/1e6;
  if(Number.isInteger(r)) return String(r).replace('-','−');
  /* fracción bonita si el denominador es pequeño */
  for(let d=2; d<=24; d++){
    const n = r*d;
    if(Math.abs(n-Math.round(n))<1e-9) return (r<0?'−':'') + Math.abs(Math.round(n)) + '/' + d;
  }
  return String(r).replace('-','−');
}
function termino(a, v, primero){
  const sg = a<0 ? '−' : (primero ? '' : '+');
  const m = Math.abs(a);
  const cuerpo = v ? (m===1 ? v : fmtNum(m)+v) : fmtNum(m);
  return (primero ? sg : ' '+sg+' ') + cuerpo;
}
function lado(L){
  if(L.a===0) return fmtNum(L.b);
  let s = termino(L.a,'x',true);
  if(L.b!==0) s += termino(L.b,'',false);
  return s;
}
function resuelveLineal(txt, rel){
  const p = txt.split(rel);
  if(p.length!==2) throw new Error('Escribe una expresión a cada lado de «'+rel+'».');
  const I = lineal(p[0]), D = lineal(p[1]);
  const pasos = [];
  pasos.push({t:'Ecuación original', e: lado(I)+' '+rel+' '+lado(D)});
  /* pasar x a la izquierda y números a la derecha */
  let a = I.a - D.a, b = D.b - I.b;
  if(D.a !== 0) pasos.push({t: (D.a<0?'Suma':'Resta')+' '+lado({a:Math.abs(D.a),b:0})+' en ambos lados',
                            e: lado({a:a,b:I.b})+' '+rel+' '+fmtNum(D.b), nota:'Los términos con x se agrupan a la izquierda.', alerta:false});
  if(I.b !== 0) pasos.push({t: (I.b<0?'Suma':'Resta')+' '+fmtNum(Math.abs(I.b))+' en ambos lados',
                            e: lado({a:a,b:0})+' '+rel+' '+fmtNum(b), nota:'Los números quedan a la derecha.', alerta:false});
  if(a === 0){
    const cierto = rel==='=' ? b===0 : (rel==='>'? 0>b : rel==='<'? 0<b : rel==='>='? 0>=b : 0<=b);
    return {pasos, sol:null, tipo: cierto?'infinitas':'ninguna',
      texto: cierto ? 'La x desaparece y queda una afirmación siempre verdadera: cualquier valor de x cumple. Solución: todos los números reales.'
                    : 'La x desaparece y queda una afirmación falsa: ningún valor de x cumple. No hay solución.'};
  }
  const x = b/a;
  let relFinal = rel, nota = null;
  if(rel !== '=' && a < 0){
    relFinal = {'>':'<','<':'>','>=':'<=','<=':'>='}[rel];
    nota = 'Al dividir entre un número negativo ('+fmtNum(a)+'), el sentido de la desigualdad se invierte. Este es el error más frecuente del capítulo.';
  }
  pasos.push({t:'Divide ambos lados entre '+fmtNum(a), e:'x '+simb(relFinal)+' '+fmtNum(x), nota:nota, alerta:!!nota});
  return {pasos, sol:x, rel:relFinal, tipo: rel==='='?'unica':'rango',
    texto: rel==='=' ? 'La ecuación tiene una única solución: x = '+fmtNum(x)+'.'
                     : 'La desigualdad describe un rango completo de valores: x '+simb(relFinal)+' '+fmtNum(x)+'.'};
}
function simb(r){ return {'=':'=','>':'>','<':'<','>=':'≥','<=':'≤'}[r] || r; }
function detectaRel(txt){
  const t = normaliza(txt).replace('≥','>=').replace('≤','<=');
  for(const r of ['>=','<=','=','>','<']) if(t.includes(r)) return {rel:r, txt:t};
  return null;
}

/* ═══════ 3 · Sistemas 2×2 ═══════ */
/* detecta las dos incógnitas usadas en el sistema, en orden alfabético */
function incognitas(s1, s2){
  const V = [];
  (normaliza(s1)+normaliza(s2)).replace(/[a-zA-Z]/g, c=>{
    const l = c.toLowerCase();
    if(!V.includes(l)) V.push(l);
    return c;
  });
  if(V.length === 0) throw new Error('No encontré incógnitas. Escribe ecuaciones como 2x + y = 11.');
  if(V.length === 1) V.push(V[0]==='y' ? 'x' : 'y');
  if(V.length > 2) throw new Error('Esta herramienta resuelve sistemas de dos incógnitas; encontré '+V.length+': '+V.join(', ')+'.');
  return V.sort();
}
function parseEc2(src, V){
  const t = normaliza(src);
  const p = t.split('=');
  if(p.length!==2) throw new Error('Cada ecuación necesita un signo =.');
  const co = lado2(p[0], V), de = lado2(p[1], V);
  return {a: co.x-de.x, b: co.y-de.y, c: de.k-co.k};   // a·V0 + b·V1 = c
}
function lado2(src, V){
  const rpn = aRPN(tokeniza(src));
  validaRPN(rpn, esHojaMat, aridadMat, 'matemática');
  const st = [];
  const N = v=>({x:0,y:0,k:v});
  const esN = t=>t.x===0&&t.y===0;
  for(const t of rpn){
    if(t.t==='num') st.push(N(t.v));
    else if(t.t==='var'){
      if(t.v===V[0]) st.push({x:1,y:0,k:0});
      else if(t.v===V[1]) st.push({x:0,y:1,k:0});
      else throw new Error('La letra «'+t.v+'» no es una de las incógnitas del sistema ('+V.join(', ')+').');
    }
    else if(t.t==='fn') throw new Error('Un sistema lineal no admite funciones.');
    else {
      const q=st.pop(), p=st.pop();
      if(t.v==='+') st.push({x:p.x+q.x,y:p.y+q.y,k:p.k+q.k});
      else if(t.v==='-') st.push({x:p.x-q.x,y:p.y-q.y,k:p.k-q.k});
      else if(t.v==='*'){
        if(!esN(p)&&!esN(q)) throw new Error('El sistema debe ser lineal: no puede haber productos entre incógnitas.');
        const c = esN(p)?p.k:q.k, o = esN(p)?q:p;
        st.push({x:o.x*c,y:o.y*c,k:o.k*c});
      }
      else if(t.v==='/'){
        if(!esN(q)) throw new Error('No se puede dividir entre una expresión con incógnitas.');
        st.push({x:p.x/q.k,y:p.y/q.k,k:p.k/q.k});
      }
      else throw new Error('Las potencias hacen que el sistema deje de ser lineal.');
    }
  }
  return st.pop();
}
function ecTxt(E, V){
  V = V || ['x','y'];
  let s='';
  if(E.a!==0) s += termino(E.a,V[0],true);
  if(E.b!==0) s += (s? termino(E.b,V[1],false) : termino(E.b,V[1],true));
  if(!s) s='0';
  return s+' = '+fmtNum(E.c);
}
function resuelveSistema(s1, s2){
  const V = incognitas(s1, s2);
  const E1 = parseEc2(s1, V), E2 = parseEc2(s2, V);
  const det = E1.a*E2.b - E2.a*E1.b;
  const base = [{t:'El sistema, ordenado', e: ecTxt(E1,V)+'   ·   '+ecTxt(E2,V)}];
  if(Math.abs(det) < 1e-12){
    const prop = Math.abs(E1.a*E2.c - E2.a*E1.c) < 1e-9 && Math.abs(E1.b*E2.c - E2.b*E1.c) < 1e-9;
    return {E1, E2, V, tipo: prop?'indeterminado':'incompatible', pasos: base,
      texto: prop ? 'Las dos ecuaciones representan la misma recta: el sistema es compatible indeterminado y tiene infinitas soluciones.'
                  : 'Las dos rectas son paralelas y nunca se cortan: el sistema es incompatible y no tiene solución.'};
  }
  const x = (E1.c*E2.b - E2.c*E1.b)/det;
  const y = (E1.a*E2.c - E2.a*E1.c)/det;
  return {E1, E2, V, x, y, tipo:'determinado', pasos: base,
    texto:'Las rectas se cortan en un único punto: el sistema es compatible determinado, con '+V[0]+' = '+fmtNum(x)+
          ', '+V[1]+' = '+fmtNum(y)+'.'};
}
/* pasos por sustitución */
/* escribe (c + m·v)/d evitando el «/1» y los espacios dobles */
function cociente(c, m, v, d){
  let num = (c!==0 || m===0) ? fmtNum(c) : '';
  if(m!==0) num += num ? termino(m, v, false) : termino(m, v, true);
  if(Math.abs(d-1) < 1e-12) return num;
  return '(' + num + ') / ' + fmtNum(d);
}
function pasosSustitucion(E1, E2, x, y, V){
  V = V || ['x','y'];
  const [vx, vy] = V;
  const P = [];
  let A = E1, B = E2;
  if(Math.abs(A.b) < 1e-12){ A = E2; B = E1; }
  if(Math.abs(A.b) > 1e-12){
    P.push({t:'Despeja '+vy+' en una de las ecuaciones', e: vy+' = '+cociente(A.c, -A.a, vx, A.b),
            nota:'Conviene despejar la incógnita cuyo coeficiente sea más sencillo.', alerta:false});
    P.push({t:'Sustituye esa expresión en la otra ecuación',
            e:'la ecuación queda solo en términos de '+vx,
            nota:'Al reemplazar '+vy+', desaparece una incógnita y queda una ecuación lineal simple.', alerta:false});
    P.push({t:'Resuelve la ecuación resultante', e: vx+' = '+fmtNum(x)});
    P.push({t:'Reemplaza en la expresión despejada', e: vy+' = '+fmtNum(y)});
  } else {
    P.push({t:'Despeja '+vx+' en una de las ecuaciones', e: vx+' = '+cociente(A.c, -A.b, vy, A.a)});
    P.push({t:'Sustituye en la otra', e:'la ecuación queda solo en términos de '+vy});
    P.push({t:'Resuelve', e: vy+' = '+fmtNum(y)});
    P.push({t:'Reemplaza para hallar '+vx, e: vx+' = '+fmtNum(x)});
  }
  return P;
}
function pasosReduccion(E1, E2, x, y, V){
  V = V || ['x','y'];
  const [vx, vy] = V;
  const P = [];
  const m1 = E2.a, m2 = -E1.a;
  P.push({t:'Multiplica cada ecuación para igualar los coeficientes de '+vx,
          e:'('+fmtNum(m1)+')·['+ecTxt(E1,V)+']   ·   ('+fmtNum(m2)+')·['+ecTxt(E2,V)+']',
          nota:'Se busca que los coeficientes de '+vx+' queden opuestos, para que se cancelen al sumar.', alerta:false});
  const b = E1.b*m1 + E2.b*m2, c = E1.c*m1 + E2.c*m2;
  P.push({t:'Suma las dos ecuaciones', e: fmtNum(b)+vy+' = '+fmtNum(c), nota:'La incógnita '+vx+' se elimina.', alerta:false});
  P.push({t:'Despeja '+vy, e: vy+' = '+fmtNum(y)});
  P.push({t:'Reemplaza '+vy+' en cualquiera de las ecuaciones originales', e: vx+' = '+fmtNum(x)});
  return P;
}

/* ═══════ 4 · Lógica proposicional ═══════ */
const LOG_SIM = [
  [/<->|<=>|↔|≡/g,'↔'], [/->|=>|→/g,'→'],
  [/\bnot\b|~|!|¬/gi,'¬'], [/\band\b|&&|&|\^|∧/gi,'∧'], [/\bor\b|\|\||\||∨/gi,'∨']
];
function normLog(s){
  let t = ' '+s+' ';
  LOG_SIM.forEach(([re,r])=> t = t.replace(re,r));
  return t.replace(/\s+/g,'');
}
function tokLog(src){
  const s = normLog(src), tk=[];
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(/[a-zA-Z]/.test(c)) tk.push({t:'v', v:c.toLowerCase()});
    else if('¬∧∨→↔'.includes(c)) tk.push({t:'o', v:c});
    else if(c==='('||c===')') tk.push({t:c});
    else throw new Error('El símbolo «'+c+'» no es un operador lógico válido. Usa ¬ ∧ ∨ → ↔ (o not, and, or, ->, <->).');
  }
  return tk;
}
const LPREC = {'¬':4,'∧':3,'∨':2,'→':1,'↔':0};
function parseLog(src){
  const tk = tokLog(src), out=[], ops=[];
  tk.forEach(t=>{
    if(t.t==='v') out.push(t);
    else if(t.t==='o'){
      while(ops.length){
        const top = ops[ops.length-1];
        if(top.t==='o' && (LPREC[top.v] > LPREC[t.v] || (LPREC[top.v]===LPREC[t.v] && t.v!=='¬'))) out.push(ops.pop());
        else break;
      }
      ops.push(t);
    }
    else if(t.t==='(') ops.push(t);
    else {
      while(ops.length && ops[ops.length-1].t!=='(') out.push(ops.pop());
      if(!ops.length) throw new Error('Falta un paréntesis de apertura.');
      ops.pop();
    }
  });
  while(ops.length){ const o=ops.pop(); if(o.t==='(') throw new Error('Falta cerrar un paréntesis.'); out.push(o); }
  if(!out.length) throw new Error('Escribe una expresión lógica.');
  validaRPN(out, t=>t.t==='v', t=>t.v==='¬'?1:2, 'lógica');
  return out;
}
/* comprueba que la expresión esté completa: cada operador con sus operandos */
function validaRPN(rpn, esHoja, aridad, clase){
  let n = 0;
  for(const t of rpn){
    if(esHoja(t)) n++;
    else {
      const a = aridad(t);
      if(n < a) throw new Error('La expresión '+clase+' está incompleta: al operador «'+(t.v||'')+'» le faltan operandos.');
      n = n - a + 1;
    }
  }
  if(n !== 1) throw new Error('La expresión '+clase+' está incompleta o le sobran términos.');
}
function varsDe(rpn){
  const v = [];
  rpn.forEach(t=>{ if(t.t==='v' && !v.includes(t.v)) v.push(t.v); });
  return v.sort();
}
/* evalúa y devuelve además las subexpresiones intermedias, en orden */
function evalLog(rpn, asig){
  const st = [];
  const cols = [];
  for(const t of rpn){
    if(t.t==='v') st.push({s:t.v, v:asig[t.v]});
    else if(t.v==='¬'){
      const a = st.pop();
      const s = '¬'+(a.s.length>1?'('+a.s+')':a.s);
      const r = {s:s, v:!a.v};
      st.push(r); cols.push(r);
    } else {
      const b = st.pop(), a = st.pop();
      let v;
      if(t.v==='∧') v = a.v && b.v;
      else if(t.v==='∨') v = a.v || b.v;
      else if(t.v==='→') v = !a.v || b.v;
      else v = a.v === b.v;
      const r = {s:'('+a.s+' '+t.v+' '+b.s+')', v:v};
      st.push(r); cols.push(r);
    }
  }
  return {res: st.pop(), cols};
}
function tablaVerdad(src){
  const rpn = parseLog(src);
  const V = varsDe(rpn);
  if(V.length > 4) throw new Error('Máximo 4 proposiciones distintas: '+Math.pow(2,V.length)+' filas serían demasiadas para leer.');
  const n = Math.pow(2, V.length);
  const filas = [];
  let cols = null;
  for(let i=0;i<n;i++){
    const asig = {};
    V.forEach((v,j)=>{ asig[v] = !((i >> (V.length-1-j)) & 1); });
    const r = evalLog(rpn, asig);
    if(!cols) cols = r.cols.map(c=>c.s);
    filas.push({asig, inter: r.cols.map(c=>c.v), res: r.res.v});
  }
  const t = filas.every(f=>f.res), c = filas.every(f=>!f.res);
  return {vars:V, cols: cols||[], filas, expr: limpia(rpn),
    tipo: t?'tautologia' : c?'contradiccion' : 'contingencia'};
}
function limpia(rpn){
  const st=[];
  for(const t of rpn){
    if(t.t==='v') st.push({s:t.v, p:9});
    else if(t.v==='¬'){ const a=st.pop(); st.push({s:'¬'+(a.p<9?'('+a.s+')':a.s), p:8}); }
    else { const b=st.pop(), a=st.pop(); const p=LPREC[t.v];
      st.push({s:(a.p<p?'('+a.s+')':a.s)+' '+t.v+' '+(b.p<=p?'('+b.s+')':b.s), p:p}); }
  }
  return st.pop().s;
}
function equivalentes(e1, e2){
  const A = tablaVerdad(e1), B = tablaVerdad(e2);
  const V = [...new Set([...A.vars, ...B.vars])].sort();
  const n = Math.pow(2, V.length);
  const r1 = parseLog(e1), r2 = parseLog(e2);
  const filas = [];
  let iguales = true;
  for(let i=0;i<n;i++){
    const asig = {};
    V.forEach((v,j)=>{ asig[v] = !((i >> (V.length-1-j)) & 1); });
    const a = evalLog(r1, asig).res.v, b = evalLog(r2, asig).res.v;
    if(a!==b) iguales = false;
    filas.push({asig, a, b});
  }
  return {vars:V, filas, iguales, e1:limpia(r1), e2:limpia(r2)};
}

/* ═══════ 5 · Conjuntos ═══════ */
function parseConj(src){
  const s = String(src).replace(/[{}]/g,'').trim();
  if(!s) return [];
  const out = [];
  s.split(/[,;\s]+/).forEach(x=>{
    const t = x.trim();
    if(t && !out.includes(t)) out.push(t);
  });
  return out;
}
function ordena(A){
  return A.slice().sort((a,b)=>{
    const na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na-nb;
    return String(a).localeCompare(String(b),'es');
  });
}
function union(A,B){ return ordena([...new Set([...A,...B])]); }
function inter(A,B){ return ordena(A.filter(x=>B.includes(x))); }
function dife(A,B){ return ordena(A.filter(x=>!B.includes(x))); }
function compl(A,U){ return ordena(U.filter(x=>!A.includes(x))); }
function simetrica(A,B){ return ordena([...dife(A,B), ...dife(B,A)]); }
function conjTxt(A){ return '{' + A.join(', ') + '}'; }

/* ═══════ 6 · Complejos ═══════ */
function parseComplejo(src){
  let t = normaliza(src).replace(/I/g,'i');
  if(!t) throw new Error('Escribe un número complejo, por ejemplo 3+2i.');
  if(!/^[+-]?[0-9i.+-]*$/.test(t)) throw new Error('No pude leer «'+src+'». Usa la forma a+bi, por ejemplo 3-4i.');
  if(!/^[+-]/.test(t)) t = '+' + t;
  const partes = t.match(/[+-][^+-]*/g);
  if(!partes) throw new Error('No pude leer «'+src+'». Usa la forma a+bi, por ejemplo 3-4i.');
  let a = 0, b = 0;
  for(const p of partes){
    const sg = p[0]==='-' ? -1 : 1;
    let cuerpo = p.slice(1);
    const imag = cuerpo.endsWith('i');
    if(imag) cuerpo = cuerpo.slice(0,-1);
    let v;
    if(cuerpo === '') v = imag ? 1 : 0;
    else {
      v = parseFloat(cuerpo);
      if(isNaN(v)) throw new Error('No pude leer la parte «'+p+'». Usa la forma a+bi.');
    }
    if(imag) b += sg*v; else a += sg*v;
  }
  return {a, b};
}
function cTxt(z){
  const a = Math.round(z.a*1e6)/1e6, b = Math.round(z.b*1e6)/1e6;
  if(b===0) return fmtNum(a);
  if(a===0) return b===1 ? 'i' : b===-1 ? '−i' : (b<0?'−':'')+coefI(Math.abs(b));
  const sg = b<0 ? ' − ' : ' + ';
  return fmtNum(a) + sg + coefI(Math.abs(b));
}
/* un coeficiente fraccionario junto a i necesita paréntesis: (5/2)i, no 5/2i */
function coefI(m){
  if(m===1) return 'i';
  const f = fmtNum(m);
  return (f.includes('/') ? '('+f+')' : f) + 'i';
}
function cSuma(z,w){ return {a:z.a+w.a, b:z.b+w.b}; }
function cResta(z,w){ return {a:z.a-w.a, b:z.b-w.b}; }
function cMult(z,w){ return {a:z.a*w.a - z.b*w.b, b:z.a*w.b + z.b*w.a}; }
function cDiv(z,w){
  const d = w.a*w.a + w.b*w.b;
  if(d===0) throw new Error('No se puede dividir entre cero.');
  return {a:(z.a*w.a + z.b*w.b)/d, b:(z.b*w.a - z.a*w.b)/d};
}

/* ═══════ 7 · Sucesiones y series ═══════ */
function sucesion(a1, p, tipo, n){
  const t = [];
  for(let k=1;k<=n;k++) t.push(tipo==='ar' ? a1 + (k-1)*p : a1*Math.pow(p,k-1));
  return t;
}
function sumaSerie(a1, p, tipo, n){
  if(tipo==='ar'){ const an = a1 + (n-1)*p; return n*(a1+an)/2; }
  if(Math.abs(p-1) < 1e-12) return a1*n;
  return a1*(1-Math.pow(p,n))/(1-p);
}
function convergeInf(a1, r){
  if(Math.abs(r) < 1) return {converge:true, S: Math.round(a1/(1-r)*1e9)/1e9};
  return {converge:false};
}

rcial con fines educativos citando la fuente. Queda prohibida la reproducción comercial sin autorización expresa de los autores.", "b": false}, {"type": "p", "text": "ISBN: [por asignar]", "b": true}, {"type": "p", "text": "Hecho el depósito de ley.", "b": false}, {"type": "p", "text": "Impreso en Colombia / Printed in Colombia.", "b": false}, {"type": "p", "text": "A los estudiantes de Programación Web de la Universidad de Córdoba,", "b": false}, {"type": "p", "text": "en Montería, Lorica, Sahagún, Berástegui y Montelíbano,", "b": false}, {"type": "p", "text": "que descubren que detrás de cada línea de código hay una ecuación esperando a que la resuelvan.", "b": false}, {"type": "p", "text": "A quienes ya distinguen un patrón de una coincidencia,", "b": false}, {"type": "p", "text": "y a quienes apenas están aprendiendo a mirar así.", "b": false}]}, {"id": "agradecimientos", "titulo": "Agradecimientos", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Este material nació de las clases de Matemática Básica dictadas en el primer semestre de Técnico Profesional en Programación Web, y le debe buena parte de su forma a una observación repetida en el aula: los conceptos matemáticos se entienden mejor cuando se conectan con el problema de programación que resuelven, no cuando se presentan como un ejercicio abstracto sin destino.", "b": false}, {"type": "p", "text": "La Facultad de Ingenierías de la Universidad de Córdoba puso el marco institucional que hizo posible este libro, un material que hoy circula por igual entre las sedes de Montería, Lorica, Sahagún, Berástegui y Montelíbano.", "b": false}, {"type": "p", "text": "Un agradecimiento aparte merece la tradición de los libros de precálculo y matemáticas discretas que sostiene cada capítulo, particularmente los textos de Stewart, Larson y Kaufmann que ya forman parte de la bibliografía del curso, además de la literatura sobre matemáticas discretas citada a lo largo de la Unidad 2, sin la cual este libro se quedaría en fórmulas sueltas sin el rigor que la disciplina exige.", "b": false}]}, {"id": "prologo", "titulo": "Prólogo", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "p", "text": "Hay una pregunta que casi todo estudiante de programación se hace en algún momento: ¿para qué sirven las matemáticas si lo que yo quiero es escribir código? Este libro responde esa pregunta capítulo a capítulo, no con un discurso, sino con ejemplos concretos: una función matemática que valida un formulario, una tabla de verdad que simplifica una condición en un programa, una serie que estima cuánto va a crecer el uso de un servidor.", "b": false}, {"type": "p", "text": "El recorrido sigue tres momentos. La Unidad 1 trabaja el álgebra y las funciones, el lenguaje con el que se modelan relaciones entre cantidades, algo que aparece constantemente en el desarrollo web: desde calcular un precio con descuento hasta ajustar el tamaño de una imagen. La Unidad 2 trabaja la lógica proposicional y la teoría de conjuntos, la base formal detrás de cada condicional, cada filtro de base de datos y cada operación entre colecciones de datos. La Unidad 3 cierra con números y series, herramientas que aparecen al analizar el rendimiento de un algoritmo o al proyectar el crecimiento de un sistema.", "b": false}, {"type": "p", "text": "Cada capítulo parte de una situación que un estudiante de programación puede reconocer, baja al desarrollo matemático con el rigor que la disciplina exige, y cierra con un ejemplo resuelto paso a paso antes de proponer ejercicios de práctica. Memorizar la fórmula sirve poco si no se entiende por qué funciona; ese entendimiento es lo que permite usarla frente a un problema que este libro nunca anticipó.", "b": false}, {"type": "p", "text": "De los autores.", "b": false}, {"type": "p", "text": "Universidad de Córdoba, Montería, 2026.", "b": false}]}, {"id": "introduccion", "titulo": "Introducción", "kind": "front", "num": null, "unidad": null, "blocks": [{"type": "h2", "text": "Contextualización"}, {"type": "p", "text": "El curso Matemática Básica es, en cualquier programa de formación técnica, uno de los pilares menos visibles y más determinantes. Provee los cimientos que sostienen el desarrollo de habilidades analíticas y de resolución de problemas, algo que el desarrollo de software exige todos los días, aunque no siempre bajo el nombre de matemáticas: depurar un algoritmo, optimizar una consulta o decidir cuándo un sistema deja de escalar son, en el fondo, ejercicios de pensamiento matemático.", "b": false}, {"type": "h2", "text": "Justificación"}, {"type": "p", "text": "Álgebra, funciones, lógica, teoría de conjuntos, números y series no son temas aislados entre sí. Son, más bien, distintas caras de una misma mentalidad lógica y estructurada que un desarrollador necesita para abordar problemas técnicos y científicos con solidez, ya sea que se trate de modelar una situación de negocio con una ecuación, filtrar datos con operaciones de conjuntos, o estimar cómo va a crecer una estructura de datos.", "b": false}, {"type": "h2", "text": "Objetivo general"}, {"type": "p", "text": "Que el estudiante llegue a manejar, con soltura, las herramientas y los conceptos fundamentales del álgebra, las funciones, la lógica, la teoría de conjuntos, los números y las series, de modo que pueda resolver problemas matemáticos de manera eficaz y aplicarlos en situaciones técnicas propias del desarrollo de software.", "b": false}, {"type": "h2", "text": "Objetivos específicos"}, {"type": "p", "text": "Este recorrido persigue tres metas concretas, una por unidad. En la primera, que el estudiante resuelva problemas algebraicos utilizando ecuaciones y funciones para modelar situaciones de desarrollo de software. En la segunda, que utilice la lógica proposicional y la teoría de conjuntos para modelar y analizar problemas en sistemas computacionales. Y en la tercera, que analice y resuelva problemas utilizando series y sucesiones en contextos relacionados con la informática.", "b": false}, {"type": "h2", "text": "Metodología"}, {"type": "p", "text": "Cada capítulo sigue el mismo recorrido: arranca con una situación concreta que el estudiante de programación ya puede imaginar, desarrolla el concepto matemático con el rigor que exige la educación superior, y cierra con un ejemplo resuelto paso a paso antes de proponer ejercicios de dificultad creciente.", "b": false}]}, {"id": "cap1", "titulo": "Ecuaciones y desigualdades lineales", "kind": "cap", "num": 1, "unidad": "UNIDAD 1 · ÁLGEBRA Y FUNCIONES MATEMÁTICAS", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás resolver ecuaciones y desigualdades lineales con una incógnita, y reconocer situaciones de programación donde estas herramientas se aplican directamente."}, {"type": "h2", "text": "1.1  Qué es una ecuación lineal"}, {"type": "p", "text": "Una ecuación lineal con una incógnita es una igualdad en la que la variable aparece elevada únicamente a la primera potencia, sin multiplicarse por sí misma ni aparecer dentro de una raíz o un denominador que la contenga. Su forma general es ax + b = 0, donde a y b son números conocidos y a es distinto de cero. Resolverla significa encontrar el valor de x que hace verdadera la igualdad (Kaufmann & Schwitters, 2018).", "b": false}, {"type": "p", "text": "Este tipo de ecuación aparece con más frecuencia de la que parece en el desarrollo de software: calcular cuántos productos hay que vender para cubrir un costo fijo, convertir una medida de un sistema a otro, o determinar a qué hora terminará un proceso programado. Los tres son problemas que se resuelven planteando y despejando una ecuación lineal.", "b": false}, {"type": "img", "caption": "Figura 1.1 · El proceso para resolver una ecuación lineal", "data": "data:image/webp;base64,UklGRrhEAABXRUJQVlA4IKxEAACQeAGdASroA5MCPmEwlUgkIqIhIVNJgIAMCWdu8p97/QtRMi6MtG/N/1nY7ff/3z0bePe0Tf7za+A/bP  resta 7 en ambos lados, obteniendo 3x = 15, y después se divide entre 3, llegando a x = 5. Verificar la solución sustituyéndola de vuelta en la ecuación original, 3(5) + 7 = 22, confirma que el resultado es correcto: siempre vale la pena hacer esa comprobación antes de dar el problema por resuelto.", "b": false}, {"type": "h2", "text": "1.3  Desigualdades lineales y su solución"}, {"type": "p", "text": "Una desigualdad lineal se resuelve con las mismas técnicas que una ecuación, con una diferencia crucial: al multiplicar o dividir ambos lados por un número negativo, el sentido de la desigualdad se invierte. Por ejemplo, al resolver -2x > 8, dividir entre -2 exige cambiar el signo mayor por menor, obteniendo x < -4, no x > -4.", "b": false}, {"type": "p", "text": "A diferencia de una ecuación, que suele tener una única solución, una desigualdad describe un rango completo de valores válidos. En programación, este tipo de razonamiento aparece constantemente al establecer condiciones: validar que una edad esté dentro de un rango permitido, que un archivo no supere un tamaño máximo, o que un índice se mantenga dentro de los límites de un arreglo, son todas desigualdades lineales aplicadas.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Ecuación lineal", "body": "Una igualdad donde la incógnita aparece elevada solo a la primera potencia, de la forma ax + b = 0. Se resuelve aislando la variable mediante operaciones equivalentes en ambos lados de la igualdad."}, {"type": "h2", "text": "1.4  Ejemplo completo"}, {"type": "p", "text": "Un servicio de hosting cobra una tarifa fija de 20 000 pesos al mes más 500 pesos por cada gigabyte de almacenamiento usado. Para saber cuántos gigabytes puede usar un cliente con un presupuesto de 35 000 pesos, se plantea la ecuación 20000 + 500x = 35000. Restando 20000 en ambos lados se obtiene 500x = 15000, y dividiendo entre 500 se llega a x = 30. El cliente puede usar hasta 30 gigabytes sin exceder su presupuesto.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Resuelve la ecuación 5x − 12 = 3x + 8 y verifica el resultado sustituyéndolo en la ecuación original.\n2. Resuelve la desigualdad −3x + 9 ≤ 0 y expresa el conjunto solución.\n3. Un programa cobra 2 500 pesos por cada 1 000 solicitudes procesadas, más una tarifa base de 10 000 pesos. Plantea y resuelve la ecuación que determina cuántas solicitudes se pueden procesar con un presupuesto de 40 000 pesos."}]}, {"id": "cap2", "titulo": "Sistemas de ecuaciones lineales", "kind": "cap", "num": 2, "unidad": "UNIDAD 1 · ÁLGEBRA Y FUNCIONES MATEMÁTICAS", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás resolver sistemas de dos ecuaciones lineales con dos incógnitas usando los métodos de sustitución y reducción, y aplicarlos a problemas de asignación de recursos."}, {"type": "h2", "text": "2.1  Qué es un sistema de ecuaciones lineales"}, {"type": "p", "text": "Un sistema de ecuaciones lineales es un conjunto de dos o más ecuaciones que comparten las mismas incógnitas, y resolverlo significa encontrar los valores que satisfacen todas las ecuaciones al mismo tiempo. Un sistema de dos ecuaciones con dos incógnitas, x e y, puede tener exactamente una solución, ninguna solución, o infinitas soluciones, según cómo se relacionen las rectas que cada ecuación representa (Larson et al., 2018).", "b": false}, {"type": "p", "text": "En el desarrollo de software, los sistemas de ecuaciones aparecen al repartir un recurso limitado entre dos procesos con reglas distintas, al calcular el punto de equilibrio entre dos estrategias de precios, o al ajustar dos parámetros de un modelo para que cumplan ciertas condiciones simultáneamente.", "b": false}, {"type": "img", "caption": "Figura 2.1 · Métodos para resolver un sistema de dos ecuaciones", "data": "data:image/webp;base64,UklGRpBsAABXRUJQVlA4IIRsAAAQIwKdASroA44DPmEwlEgkIqIhojR4+IAMCWdu/mx1Ivd3ADkGjQOm/MeFakChdPqO/6r/CeIDG/u EH/TE3sMOm0tp/BjHQbsKYUmKRf3G50mtoiReA4+qfLBN0ifcoNjAlU9bRnDBTeGj3Ib3oQuhRYGod43VUabFUjXeBfz83BEgtxe+JQKBwM62ofIeIzFTvlq8U6aZNuvmG7YYJ5k/q4S1FM1aPouXMBDFjM8v46ohAdqe+LEPHXZDzxFkLFp8EUtQDaxnF29f0MDRPIAZ+BNHxc7b7o64P1QsXjqKflKwjrfAoEQdGcI72+IxvgFMKmzFxcoR3l6VLPiwwUwsdpXAcFIHt/G1s6I/9Zralqb2AEZf4EvMTwuvdV9PbJVclRKqK5dDywZgUAI4EFwZmOKyw+RUlcBb6T7S/s/voaXXhnJ8/Xfv2ObaY8o99F/LFcX3JBRQrKfhkcekNwPUXzA8onK2Q9Dqj0Qik4AtKI7RUrOw0O3thvKmaVZfC7OybILV4IP5NHIZQ3ivOj2vjdEHultTjb5phKFNvNuvnV0WIWD/yEKkUHTxg1Ywnv3NgEVrlnpnvaXWc+xjPoAXrT2Wg1D6IlZwKPaqABRzYSOX2B03guFszK55HLQh2EwM7mCd4T86r/IVYi3Vbsdy9uU9ejqtjFF2h4uIAn02vkwFS8rBR2aa9vUp7d+X24TYnaGsSn/bfy9pD3AEJ3MDp0jMU5r7tlEsb1MKtJtPDLI0+k7vowAe4uoJ510nGe2fSHefTLOiBOEXe79v3LZlKb9kWMlKabDarGYtjD2O+FKwy7plTQvzzRvI1vdeMDzifUcRG6vkiAAACqwf+XkclW65387JB3pvRtVbO2MvFpNfSjKoafnv7D/vCnP7mPT2WiYX3ro/wAAAAAAAjRAnrSmT7EPKAm99PRK92DSFVj71fyRnNioh8kxJTDxRGLVi9KIaDOTgiBif8BCWRQzJ2rRLUF+OZQ+XNHaIU/dc2eY7ZXJWTinuKCJ5rOUeAAAAAAAAAAAAAAAAAAA="}, {"type": "h2", "text": "2.2  Método de sustitución"}, {"type": "p", "text": "El método de sustitución despeja una de las incógnitas en una de las ecuaciones y reemplaza esa expresión en la otra ecuación, reduciendo el sistema a una sola ecuación con una incógnita. Por ejemplo, en el sistema x + y = 10 y 2x − y = 5, se despeja y de la primera ecuación: y = 10 − x. Sustituyendo en la segunda: 2x − (10 − x) = 5, que se simplifica a 3x − 10 = 5, y despejando x se obtiene x = 5. Sustituyendo de vuelta, y = 10 − 5 = 5.", "b": false}, {"type": "p", "text": "Este método funciona especialmente bien cuando una de las ecuaciones ya tiene una incógnita con coeficiente 1, porque el despeje inicial resulta directo.", "b": false}, {"type": "h2", "text": "2.3  Método de reducción (eliminación)"}, {"type": "p", "text": "El método de reducción, también llamado de eliminación, consiste en multiplicar una o ambas ecuaciones por números adecuados para que, al sumarlas o restarlas, una de las incógnitas se cancele. Tomando el mismo sistema, x + y = 10 y 2x − y = 5, basta con sumar ambas ecuaciones directamente: (x + y) + (2x − y) = 10 + 5, lo que da 3x = 15, y por lo tanto x = 5. Sustituyendo en cualquiera de las ecuaciones originales se obtiene y = 5, coincidiendo con el resultado del método anterior.", "b": false}, {"type": "p", "text": "Ningún método es superior al otro en términos absolutos; la elección suele depender de qué tan cómodos resulten los coeficientes de cada ecuación para despejar o para cancelar.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Sistema compatible determinado", "body": "Un sistema de ecuaciones que tiene exactamente una solución, representada geométricamente por el punto donde se cruzan las rectas de cada ecuación. Existen también sistemas sin solución (rectas paralelas) y con infinitas soluciones (la misma recta escrita de dos formas)."}, {"type": "h2", "text": "2.4  Ejemplo completo"}, {"type": "p", "text": "Un equipo de desarrollo debe repartir 40 horas semanales entre dos módulos de un proyecto. El módulo A necesita el doble de horas que el módulo B más 4 horas adicionales. Llamando x a las horas del módulo A y y a las del módulo B, el sistema queda: x + y = 40 y x = 2y + 4. Sustituyendo la segunda ecuación en la primera: (2y + 4) + y = 40, que se simplifica a 3y + 4 = 40, y despejando y se obtiene y = 12. Entonces x = 2(12) + 4 = 28. El módulo A recibe 28 horas y el módulo B, 12.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Resuelve el sistema 2x + y = 11 y x − y = 1 usando el método de sustitución.\n2. Resuelve el mismo sistema del ejercicio anterior usando el método de reducción y confirma que obtienes el mismo resultado.\n3. Un servidor reparte 100 solicitudes por minuto entre dos procesos. El proceso A recibe 15 solicitudes más que el triple del proceso B. Plantea y resuelve el sistema de ecuaciones correspondiente."}]}, {"id": "cap3", "titulo": "Funciones: concepto, dominio y gráficas", "kind": "cap", "num": 3, "unidad": "UNIDAD 1 · ÁLGEBRA Y FUNCIONES MATEMÁTICAS", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás identificar si una relación es una función, determinar su dominio y su rango, y reconocer su representación gráfica."}, {"type": "h2", "text": "3.1  Qué es una función"}, {"type": "p", "text": "Una función es una relación entre dos conjuntos que asigna a cada elemento del primer conjunto, llamado dominio, exactamente un elemento del segundo conjunto, llamado codominio. Esa palabra, exactamente, es la que distingue a una función de una relación cualquiera: si un mismo valor de entrada pudiera producir dos salidas distintas, no se trataría de una función (Sullivan, 2014).", "b": false}, {"type": "p", "text": "En programación, una función matemática se parece mucho a una función de código bien diseñada: dada la misma entrada, siempre produce la misma salida, sin depender de un estado externo que cambie el resultado. Esa analogía no es casual: el concepto de función en programación se inspira directamente en el concepto matemático.", "b": false}, {"type": "img", "caption": "Figura 3.1 · Los elementos de una función", "data": "data:image/webp;base64,UklGRlJUAABXRUJQVlA4IEZUAADQrgGdASroA8kCPmEwlEgkIqIjolPosIAMCWdu/mMcgLMCYV9Q+MwvqIAdCQ2entL/hf3rxQv6ep/uP5L++3xv2be4vvXrofrfC/rjy9POP1//1/4H2yf5v/w/4v3F/pb/x/n/9AP8Z/pX5U+2r+1/uT/vn/c9QP9l/z/7U+7l/tf239y39h/4XsB/z//T////ee297Cv7jf/D3CP1t/9Ps//9n92P/H8pH9k/5n7f/Ap+1H///3nuAf/32w/4B//+tf6mf4z/A/tF4Pf4X8t/Qf8Y+ifxH9//av1+ss/aFqffI/t5+k/xH7n/4j5pfwP+p/Lv+8+jfy1/2fUF/MP6F/k/za/uPq2/43bdXG/6XqEe1v1b/f/5f8pPSC/x/8/6lfbb/t+4D/Pv6j/0vLY8K72P2BP5n/kP/P/q/dk/sP/R/rPzi9xP6H/p//V/rPgN/n/9t/7/+U9u/2cekMHqXEuJcS4lxLiXEuJcS4lxLiXEuJcS4lxLiXEuJcS1SmRnAboHQOgdA6B0DoHQOgdA6B0DoHQOYLUQOgcs5YGm5wLBSIWbnyidQYj+74/rNwOzKOLUQQfMmygh4k57m7ayTAjJyNkbELS55pSE2b0lZdTjSQ7g7DLiPkTCx4P6LhOyaTgp5xSDef+ZpFzzwq3/nGlNioXZWtufQSnmddpQH1NLnfF/1XJPsTsSyiiZp98sGISiYMou8SCy616io4r7RnWMHO1TJ8OV75GIXbRJugFJgHk AAAAAAAAAAAAA"}, {"type": "h2", "text": "3.2  Dominio y rango"}, {"type": "p", "text": "El dominio de una función es el conjunto de todos los valores de entrada para los cuales la función está definida; el rango es el conjunto de todos los valores de salida que efectivamente produce. Determinar el dominio exige identificar qué valores de entrada generarían una operación no permitida, como dividir entre cero o calcular la raíz cuadrada de un número negativo dentro de los números reales.", "b": false}, {"type": "p", "text": "Por ejemplo, la función f(x) = 1/(x − 3) está definida para todo número real excepto x = 3, porque ese valor haría que el denominador fuera cero. El dominio se expresa entonces como todos los reales distintos de 3.", "b": false}, {"type": "h2", "text": "3.3  Representación gráfica de funciones"}, {"type": "p", "text": "Toda función con dominio y rango numéricos puede representarse en un plano cartesiano, donde el eje horizontal muestra los valores de entrada y el eje vertical, los valores de salida correspondientes. Esta representación permite visualizar de un vistazo propiedades como si la función es creciente, decreciente, o si tiene puntos donde cambia de dirección.", "b": false}, {"type": "p", "text": "Una forma rápida de verificar si una gráfica corresponde realmente a una función es la prueba de la línea vertical: si cualquier línea vertical trazada sobre la gráfica la corta en más de un punto, esa gráfica no representa una función, porque significaría que un mismo valor de entrada produce más de una salida.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Dominio de una función", "body": "El conjunto de todos los valores de entrada para los cuales una función está definida, es decir, para los cuales existe un valor de salida calculable sin operaciones no permitidas como dividir entre cero."}, {"type": "h2", "text": "3.4  Ejemplo completo"}, {"type": "p", "text": "Un sistema de paginación calcula cuántas páginas se necesitan para mostrar n elementos, mostrando 10 elementos por página, con la función f(n) = n/10 redondeada hacia arriba. Esta función solo tiene sentido para valores de n que sean números enteros no negativos, porque no existe una cantidad negativa o fraccionaria de elementos que mostrar. El dominio de esta función, en el contexto del problema, se restringe entonces a los números enteros mayores o iguales a cero, aunque la expresión matemática por sí sola permitiría cualquier número real.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Determina el dominio de la función f(x) = √(x − 4).\n2. Determina el dominio de la función g(x) = 1/(x² − 9).\n3. Describe, con tus propias palabras, por qué una función que valida contraseñas (que recibe un texto y devuelve verdadero o falso) cumple la definición matemática de función."}]}, {"id": "cap4", "titulo": "Funciones polinómicas, exponenciales y logarítmicas", "kind": "cap", "num": 4, "unidad": "UNIDAD 1 · ÁLGEBRA Y FUNCIONES MATEMÁTICAS", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás reconocer las funciones polinómicas, exponenciales y logarítmicas, y aplicar la función exponencial y su inversa, la logarítmica, a problemas de crecimiento y complejidad algorítmica."}, {"type": "h2", "text": "4.1  Funciones polinómicas"}, {"type": "p", "text": "Una función polinómica es una suma de términos, cada uno formado por una constante multiplicada por la variable elevada a una potencia entera no negativa, como f(x) = 3x² − 2x + 5. El mayor exponente que aparece se llama grado del polinomio, y determina buena parte del comportamiento de su gráfica: un polinomio de grado 1 traza una recta, uno de grado 2 traza una parábola, y así sucesivamente (Kaufmann & Schwitters, 2018).", "b": false}, {"type": "p", "text": "Las funciones polinómicas de grado 2, conocidas como funciones cuadráticas, aparecen con frecuencia al modelar problemas de optimización: encontrar el punto donde una cantidad se maximiza o se minimiza, como el costo mínimo de un proceso o el punto óptimo de un parámetro, suele reducirse a analizar una función cuadrática.", "b": false}, {"type": "img", "caption": "Figura 4.1 · Tres familias de funciones y su forma característica", "data": "data:image/webp;base64,UklGRrxVAABXRUJQVlA4ILBVAADwtQGdASroA8wCPmEwlEgkIqIhodN5UIAMCWdu7vtQEkAsELUvmeL6YzGGn1K/+XuzXO/4j/C/jb8Adn/xf9u9gP9z4m++/7nzDfNP0L/i/1X+6/vR84v976sv1L/v/7Z+//0Afsz55vqo/dj1Efsd+0PvTeiH+g/5b8sfkD/mX91/+XYT+gT/svPZ/cP/r/Lb/cv+X+3ntSf+f2AP/xwQPkv+//kr5k/0P+8f1r/G/6r+1eof4n8+/df7P/h/9j/ePbl/nPFb1l/yfRH+N/a38l/f/2w/uf74fIn/R/KDzZ+QX9z/jPYF/Hv5h/k/7x+3X+F/eD1xe2ZtN/wP7f7AvvB9F/1X+I/dj/K/ud9KXuf+2/xnqH9iP+h/h/xO+wH+h/z7/N/4T96f3/+0P9H4UH3f/e+wF/Jv7J/3/8t+Yv03/1P/p/zv+3/aX3SfnX+Z/8P+r/en/PfYb/M/7J/xf79+83+i/////8nvo6/uwJp3jbUUqjNtRSqM21FKozbUUqjNtRSqM21FKozbUUqjNtRSqM21FKozbUUqjNtRSqM21FKozbUUqjNtRSmh/b2yvoRNjE10ITZf9vEooQMhVcM7dTJbL59WekDYw3A/algBHc8eBhzyEYhZwvkSAb93w8LzTAzGF8JPK08G/8CLQHo7Ps+70eE0pnzwclhhuir5dp7MBudD3xGR7OSUFizWvvq3tQ7d40eclT1Gi7s8A2ONWPiuLU1hPty/dFl0+04R610I0vPJ+mtUe9NidADUMUBco9h0NNrmZK9cJfq4/ZgdFgo8ye+vUBs1FSpjBoNYoYj3daU7oebprUsghSdadDkGSPuyhQ3z9Rld+LcrTqunRkWxoKE8Sb5lBsMscGwLbZRJiSOJOuNpwCl6CNzZA8jkDurn8CBC8uXyQIF/GUFqI8hX3zKjVu53XmYmtmrqpyDABxe1Hg7Ut1P6xLHHdz/0NcYHfWQMSGaIPOoVyddvYm3RK3jbk3EZlBE/CjdQKZGj21lLXSHGDJDdJEzed/tF4dkApVPp10fJ95jLB4fm94Y0nr1hKOn6kan4H5/JpsHc0TZvzIABn1/fUF+d+f+hrjA7seDaxW9PCQdVIA3ruTaTapUtiMygicK6AOOcjFoez9ob7y7M9d/kPXmRWyy+gbxEpfAPVadCSpptWGFAt8sRM8sQWJl2XZuCAoQUcumJGv1mSQkhK9sI6dS5KHhpBI5tvVQWOFB2aaFglVQErJs+8QI5TonVkEVQdUN5OFmqnD1NqrXVlwxJNSR4UYVZ9a3sTboYKjRd7n+jLm2nylTB3rjSewrl+hgynPo8py1MMWRXvTrKG4LFgd0LoVGbEh7gzCqS0rHq4XBTFBVgqOCnjwXcZAUBpy/+yrOwPtwEt8kWTEaLbMKnt2Xh39lrTrt7E26JW8bcm4jMoKf5hux8cGIvCpsQHXdQ6KrngkqnaMq2G0Knn3fvsTsLL0sDD1DjJnk8Q0EdtfbPfQVniXbrUAhdu2BglEdJiwJmpOUlnGQO5R+4dgEFt8XPpgg7ZhLlhZ5nh/sGtOO5V1Nx+QkslBEc5WHUU/9/YEIrDFkFeuWNCjEk1JHZ3jqxfvmmAv9HExg0GsUMR7utH4PqY4g5ZD019tbI8HNbvSSm1Su4LSE1J1qU6A to cada vez más pronunciado que se asocia popularmente con lo exponencial.", "b": false}, {"type": "p", "text": "En sistemas informáticos, el crecimiento exponencial aparece al proyectar el uso de un recurso que se duplica en intervalos regulares, como el tráfico de un servidor que crece un porcentaje fijo cada mes, o al analizar algoritmos cuyo tiempo de ejecución se duplica con cada elemento adicional que procesan, un comportamiento que en general conviene evitar por lo costoso que resulta a medida que crecen los datos.", "b": false}, {"type": "h2", "text": "4.3  Funciones logarítmicas"}, {"type": "p", "text": "La función logarítmica es la inversa de la función exponencial: si bˣ = y, entonces el logaritmo en base b de y es x, escrito log_b(y) = x. Esta relación inversa significa que, mientras la exponencial responde a la pregunta \"¿a qué resultado llego si elevo la base a esta potencia?\", el logaritmo responde a la pregunta contraria: \"¿a qué potencia debo elevar la base para llegar a este resultado?\".", "b": false}, {"type": "p", "text": "El logaritmo aparece de forma muy concreta en el análisis de algoritmos: la búsqueda binaria, uno de los algoritmos más citados en programación, tiene una complejidad de tiempo proporcional a log₂(n), donde n es el tamaño de los datos, precisamente porque cada paso del algoritmo descarta la mitad de las opciones restantes. Entender por qué esa complejidad se describe con un logaritmo, y no con otra función, exige entender la relación inversa entre exponencial y logaritmo descrita en este capítulo.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Relación inversa entre exponencial y logaritmo", "body": "Si bˣ = y, entonces log_b(y) = x. La función logarítmica \"deshace\" lo que hace la función exponencial: una eleva una base a una potencia, la otra encuentra qué potencia produjo un resultado dado."}, {"type": "h2", "text": "4.4  Ejemplo completo"}, {"type": "p", "text": "Un algoritmo de búsqueda binaria revisa una lista ordenada de 1 024 elementos. En cada paso descarta la mitad de la lista restante, así que el número de pasos necesarios para reducir la lista a un solo elemento es log₂(1024). Como 2¹⁰ = 1024, se tiene que log₂(1024) = 10: el algoritmo necesita, en el peor caso, apenas 10 comparaciones para encontrar el elemento buscado entre 1 024 posibilidades, en lugar de las 1 024 comparaciones que exigiría revisar la lista una por una.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Determina el grado de la función polinómica f(x) = 4x³ − 2x² + x − 7, y describe si su gráfica se parece más a una recta o a una curva.\n2. Calcula log₂(256) y explica el razonamiento sin usar calculadora, apoyándote en potencias de 2.\n3. Un servidor recibe 200 solicitudes por hora y ese número se duplica cada mes. Escribe la función exponencial que modela las solicitudes por hora después de t meses, y calcula cuántas solicitudes por hora habrá después de 4 meses."}]}, {"id": "cap5", "titulo": "Principios de lógica proposicional", "kind": "cap", "num": 5, "unidad": "UNIDAD 2 · LÓGICA Y TEORÍA DE CONJUNTOS", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás identificar proposiciones, aplicar los conectores lógicos básicos, y traducir condiciones de programación al lenguaje de la lógica proposicional."}, {"type": "h2", "text": "5.1  Qué es una proposición"}, {"type": "p", "text": "Una proposición es un enunciado que puede calificarse, sin ambigüedad, como verdadero o falso, pero no ambas cosas a la vez. \"Montería está en Colombia\" es una proposición verdadera; \"2 + 2 = 5\" es una proposición falsa. En cambio, una pregunta o una orden, como \"¿qué hora es?\" o \"cierra la puerta\", no son proposiciones, porque no tiene sentido preguntarse si son verdaderas o falsas (Rosen, 2019).", "b": false}, {"type": "p", "text": "La lógica proposicional estudia cómo se combinan proposiciones simples para formar proposiciones compuestas, y cómo determinar la verdad o falsedad de esas combinaciones a partir de la verdad o falsedad de sus partes. Esta disciplina es, en un sentido muy literal, el fundamento matemático de cómo funciona un programa: cada condicional, cada bucle con una condición de parada, y cada validación de datos es una aplicación directa de la lógica proposicional.", "b": false}, {"type": "img", "caption": "Figura 5.1 · Los cinco conectores lógicos básicos", "data": "data:image/webp;base64,UklGRrg2AABXRUJQVlA4IKw2AAAQSgGdASroA4ICPmEwlUgkIqIhITX5UIAMCWdu/EIf25JcUtKvr3L5QjkQVJ/Lf1X+378XuH+i/sH5H++FXH8P/S/tf95nhVE77SfP/tR/sX++/wXuO/Nv/r/u/wAf1X+0+b96kv7V/wvUB/Uf9D6sH+w/bj3I/0//Gf+n/Jf6r5Bf61/ov/d7VP/e9jL/Mf+D2Fv2p///rwfu////lH/s3/f/dn4F/28////L7e3ph+mf93/sP6qe8P4r+e/1/+y/tD5x/ivz/+F/un9+/4vr6Y7+uXUX+L/Yn8R/X/3O/w3u1/tv7R4y/J3yl+AX8c/nP+P/Nrgbd2/3P+89QL2w+if8P/Kflp7hvr3+z9BfzX/D/873AP5L/Vf976y/7Hwi/uH+2/an4Bv55/ff/b/rvdn/qf/f/qv9n6ffzn/Rf+b/YfAd/PP7Z/3v8j23vRmEMzX6sh4xAPPGK9C9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXuC9wXhOL+qqyp+sZAi6+gye8HjG/EXEnSp+sYo/pqWAunZNTiCNBJkLySeJW5epXSCTIXkvTiCKqbGG6tOMFdnsRcSdKn6n8CURL88eoMCRI/XInv0EKqBF3EnSpsjUzfdcWeBV4V/WtHRXw0EmQvJenDhkKqhxJgTZZZgZJR6FVmnEEaCTIXkjlgdMNDeJUjR5XHEJyBaqyp+sZAi65f+/BnMA2J6lU+VWU6xIu4k6VP1jEvtu1/fjew0osgpivQqFP3nDu5BYw8YaX1dVuUgd1MixEl2J8NdqE8Yhu2po6A5Dn/x4un9/BYw5a5fNfqiXk6TGrudTIpFGCeRR/9WIkuyTSOGRYiRPO3vB4xDFVEEWIkcb9WQO+rqvQo1x4w2KWR1vRjFeHyJ46Rlxh++M5GdDGK8IeU8b8/JpXQvaQ8p4caDiUL2h93IK4UYWfcFXW8i7lAu/8QxSXVkPGGl9XVzzXVo2+NZ7PzaS1y3ugAAVWXfebIgd9XVehMezQEtlSMoaamWes5U+lvM36nXjswBn46ziAxSsAPqWR1tFxowCjF7ekAqrn2is92gazxzp4tDr3xv4yZeWy999ZUmqqME8bWjO+oE1LQss0Y0j738w6Wp0yFWajHD6mYTlbrF2faXBonlI8bJsE5zUcdDa6ul6/13VX1Kp8roD91wD9S4vQfUzCcq3nbe4eN2eU8b8/JpUIKW5fEG45eXB1OSFW1BDFVD/hw6UK6U3iQqzibtaf/tS2gcYxryNHoKVr4neeVH3fXgVwNBX5CFyANK6GoZ9NWAwIRu73WFyIcUPYVmQ8PEdFEYtf/ymyIN2iyhkzP rdaderas o ambas falsas.", "b": false}, {"type": "p", "text": "Estos cinco conectores tienen una correspondencia casi directa con operadores que cualquier lenguaje de programación implementa: la negación con el operador NOT, la conjunción con AND, la disyunción con OR, y el condicional con la estructura if-then, aunque en programación el condicional no siempre se evalúa exactamente igual que en lógica formal.", "b": false}, {"type": "h2", "text": "5.3  Traducir condiciones de programación a lógica proposicional"}, {"type": "p", "text": "Una condición de código como if (edad >= 18 && tieneDocumento) se traduce directamente a lógica proposicional definiendo p como \"la edad es mayor o igual a 18\" y q como \"la persona tiene documento\", y expresando la condición completa como p ∧ q. Esa traducción no es un ejercicio decorativo: permite razonar formalmente sobre condiciones complejas, detectar cuándo dos condiciones aparentemente distintas son en realidad equivalentes, y simplificar código que se volvió difícil de leer por acumular demasiadas condiciones anidadas.", "b": false}, {"type": "p", "text": "Cuando una condición de programación involucra varios conectores combinados, conviene identificar primero cada proposición simple por separado, asignarle una letra, y reconstruir la expresión completa con esos símbolos antes de intentar analizarla o simplificarla.", "b": false}, {"type": "concepto", "title": "CONCEPTO · Proposición", "body": "Un enunciado que puede calificarse sin ambigüedad como verdadero o falso, pero no ambas cosas a la vez. Es la unidad básica sobre la que se construye toda la lógica proposicional, y el fundamento matemático de cada condicional en un programa."}, {"type": "h2", "text": "5.4  Ejemplo completo"}, {"type": "p", "text": "Un sistema de autenticación permite el acceso si el usuario ingresó la contraseña correcta o si tiene una sesión activa reciente. Definiendo p como \"la contraseña es correcta\" y q como \"la sesión está activa\", la condición de acceso se traduce como p ∨ q: el acceso se concede si al menos una de las dos proposiciones es verdadera. Si además el sistema exige que la cuenta no esté bloqueada, definiendo r como \"la cuenta está bloqueada\", la condición completa de acceso queda como (p ∨ q) ∧ ¬r.", "b": false}, {"type": "ejercicios", "title": "EJERCICIOS", "body": "1. Determina cuáles de los siguientes enunciados son proposiciones y cuáles no: \"El servidor está caído\", \"¿Está caído el servidor?\", \"Reinicia el servidor\".\n2. Traduce a lógica proposicional la condición: \"el formulario se envía si el campo de correo no está vacío y el campo de contraseña tiene al menos ocho caracteres\".\n3. Escribe con tus propias palabras la diferencia entre la conjunción y la disyunción, dando un ejemplo de código donde cada una sería la elección correcta."}]}, {"id": "cap6", "titulo": "Tablas de verdad", "kind": "cap", "num": 6, "unidad": "UNIDAD 2 · LÓGICA Y TEORÍA DE CONJUNTOS", "blocks": [{"type": "objetivos", "title": "AL TERMINAR ESTE CAPÍTULO", "body": "Al terminar este capítulo podrás construir tablas de verdad para proposiciones compuestas, y usarlas para identificar tautologías, contradicciones y expresiones lógicamente equivalentes."}, {"type": "h2", "text": "6.1  Qué es una tabla de verdad"}, {"type": "p", "text": "Una tabla de verdad organiza, de forma sistemática, todos los posibles valores de verdad de las proposiciones simples que componen una expresión, junto con el valor de verdad resultante de la expresión completa para cada combinación. Si una expresión depende de n proposiciones simples, la tabla necesita 2ⁿ filas para cubrir todas las combinaciones posibles, porque cada proposición puede ser verdadera o falsa de forma independiente (Rosen, 2019).", "b": false}, {"type": "p", "text": "Construir una tabla de verdad es, en esencia, una forma exhaustiva de probar una expresión lógica: en lugar de razonar sobre casos particulares, se examinan absolutamente todos los casos posibles, lo que la convierte en una herramienta confiable para verificar si dos expresiones son equivalentes o si una condición de programación se comporta como se espera en cada escenario.", "b": false}, {"type": "img", "caption": "Figura 6.1 · Construcción de una tabla de verdad", "data": "data:image/webp;base64,UklGRiIXAABXRUJQVlA4IBYXAACQCgGdASq0A9YCPmEuk0ikIiQiIFCpGIAMCWlu4XaUImClNIz/d8kbdfnPzZ9lfmv2r+lD9KewJ/fOiF5kvNW/6fq//snqAf0/zr/Z39CvpiP7zk3Piz+0fkb4C/2vuHfQv1P8hfNV8fry31W/A/1f9wfzQ+Wf6r+JPnT6pPxy/DP7Avxz+Sf6H8nuF1AB9Pf9L+VX9u9HD+j9CPsB7AH8U/mP+o8qDwi/DfYA/i39h/8v+H91n+R/5n+m/Lj20fnX+Q/8/+R+A7+Vf1r/qf33hMgu2h94dY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jrHWOsdY6x1jmhzzbtlHoU1mEhjENhD6c7gaq54/H5NqPvcUehTWYSGMQ2EPpzuBqrnj8fk2o/MIxiGwh9OdwNVlrtQo9ClSuhRtNLNflxLhCzqH3h1jq22UWi0yMtofev9nW0PvDrF1PbQEC6Wa/INtLaFI5Decphy4a4rpoCAS6ztj135cpVGrEVSs8dYzjQXMCyr2DRXmHASAkBICMttLaFCNLV622B0ZsHkby4fLFu+WzM2BjqxSYwBY9eXoMVQhMIqNY67/Z1AfBZI69OTjpUy6YK3ByIV4rTKoOCxJRZCY7L68F6jEBbXMgzvebhXmHASAkBICMttLaFBcJXUfAD2e3RL68cEJkXRAKZMd/AlvQGbVR03NpYXFpcSrYSqn8GSOigOIhgIWbbgO/R96DZZEZY0PvDrHWLqcOJcX6kA89/poCBlZLJcpVGsnK8kobQA2/2/LiXEuI9DVt701mEhjENhD6c7garLXaCjP2s8Q6wkMYhsIfTncDVZa7UKPNkynapXejYLKPQprMJDGIbCH053A1Vu8zEl+WofeHWOrEPcR/15OdwNVlrtQo9CmswkMWYV4qSlkjQprMJDGIbCH053A1WWuDC+yIBNzl3xSbgQ9d+Wqsoi3Uj7w6x1jrMRAgXSzX5cvY6x1jrHWYiBAulmvy0Y5ah94dY6zEQICsYgBZ6DGZ/pofe7EZUDtjktMeqF1H4lzVmRdUgwmTGcB+lUEuJBtpbQ+8OsdgwTdIxAyABRXcojMUelm1Yw6sEDIAFFdv1sm3RkZ5NAQqBllH63V0tAcxqFguaWa/LiXFZdGWnl9N+1QLpdG+8LaiH/tUC6XdYCPx35cYUUah64wTdLNflxMYhMjLaH3h6oyMtofeHYME3SzX5cSDbS2h94dY7Bgm6Wa/LiYeMOsdY6x2DBN0s1+XEg20tofeHWObBO84KFYQ+nO4Gqy12oUehTWYSGBLte115EstdqFHoU1mEhjENhD6c7aZcjIswS1XY6LMEnqY3SzX5cS5qzIy2h94c6gvy4lxLiWjHLUPvDrHVomIOJcS4lxWXRlKGahAZpZrW6B2vafdxEnqkvECwQQmRdW9W6eHVomIOJcS4lxWXRlpiDkxKoeLJN7E0Pu6JiDiP5g1YhtG7UPXGCbpIWA0b9oVPVPlwhZ1D7w6x1j3c0syZJ35wcS4Qs6h9nr0F/U
